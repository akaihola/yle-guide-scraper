      - title: 'Marko Gustafsson: Käännekohdissa Susanna Kuparinen'
        start_time: '2026-12-03T10:00:00+02:00'
        end_time: '2026-12-03T10:53:00+02:00'
        description: |
          Ohjaaja, käsikirjoittaja  Susanna Kuparinen tutkii pieniä ja suuria maailman epäkohtia ja tekee niiden pohjalta dokumenttiteatteria, jossa aiheet ja usein vuorosanatkin ovat suoria lainauksia. Hän kertoo tekevänsä näitä asioita, jotta tietäisi tarkemmin mitä pitää tai kannattaa pelätä. Kuparinen halusi ymmärtää mistä kaikki johtuu seurattuaan Ukrainan sekä Gazan tilanteita.
