      - title: 'Kulttuuriykkönen: Vakoilu, pelko ja valta – Venäjän tiedustelun historia'
        start_time: '2026-12-03T15:00:00+02:00'
        end_time: '2026-12-03T15:58:00+02:00'
        description: |
          Venäjän tiedustelupalveluilla on ollut monta nimeä: Ohrana, Tšeka, GPU, OGPU, NKVD, Smerš, KGB, GRU, SVR, FSB.

          Mikko Porvali käy kirjassaan Kremlin näkymätön sota läpi Venäjän tiedusteluelinten toiminnan pitkän kaaren historiassa. Jo varjagiruhtinaat käyttivät salaisia agentteja valtansa pönkittämiseen. Venäjällä turvallisuuspalvelujen tehtävänä ei ole ollut suojata kansaa ulkoisilta uhkilta, vaan kohdistaa terroria vallanpitäjiä tai heidän etujaan uhkaaviin tahoihin. Kirja kuvaa myös, miten tiedusteluelinten valta on kasvanut valtion sisällä niin, että nykyään vanhat tiedustelumiehet miehittävät Venäjän vaikutusvaltaisimpia asemia presidentinpalatsia myöten.

          Yksi kirjan käsittelemistä operaatioista on KGB:n menestyksekkäimpiä: brittiläisen Kim Philbyn toiminta kaksoisagenttina, josta kertoo myös Yle Areenassa nähtävä sarja Vakooja keskuudessamme. 

          Haastateltavina ovat Mikko Porvali sekä toinen vakoilun maailmaaan perehtynyt tietokirjailija Hannu Pesonen.

          Ohjelman juontaa Nicklas Wancke.
