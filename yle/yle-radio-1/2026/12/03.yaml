      - title: 'Maailma tarinoina: Piin elämä - kolme uskontoa ja vaihtoehtoiset totuudet'
        start_time: '2026-12-03T12:05:00+02:00'
        end_time: '2026-12-03T13:00:00+02:00'
        description: |-
          Yann Martelin menestysromaani vuodelta 2001 asettuu osaksi selviytymistarinoiden ja merikertomusten jatkumoa – kääntäen niiden logiikan ympäri. Romaani päätyi vuonna 2012 Ang Leen ohjaamana sovituksena valkokankaalle visuaaliseksi ilotulitukseksi. Tarina johdattelee Piin hahmon kautta moniuskontoiseen Intiaan ja tulee avanneeksi erityisesti hindulaisuuden ja kristinuskon ydintä. Sen kautta päästään filosofisiin pohdintoihin ihmisen ja eläimen suhteesta, teodikean ongelmaan sekä tarinan lumoihin ja vaaroihin. 
          Marja Vehkasen vieraina elokuvan keskeistä asetelmaa, ihmisen ja tiikerin selviytymiskamppailua ja keskinäistä suhdetta, peilaavat kirjalliseen ja teologiseen perinteeseen yleisen kirjallisuustieteen dosentti Teemu Ikonen ja uskonnontutkija, dogmatiikan dosentti Jyri Komulainen.
