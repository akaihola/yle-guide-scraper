      - title: 'Ina Mikkola & portinvartijat: “Kyllä siellä haaveita myös murskataan” '
        start_time: '2026-12-31T15:00:00+02:00'
        end_time: '2026-12-31T15:58:00+02:00'
        description: |
          Teatterinjohtajat Kari Arffman ja Jussi Sorjanen raottavat oven kulisseihin, näyttämötaiteen näkymättömiin rakenteisiin. Miten ohjelmisto ja näyttelijät valikoituvat? Näyttelijäntaiteen professori Elina Knihtilä kertoo, millaista on kantaa vastuuta nuorten aikuisten unelmien portinvartijana Teatterikorkeakoulun pääsykokeissa. Näyttelijät Jasir Osman ja Alina Tomnikov analysoivat, miksi juuri he onnistuivat avaamaan koulun ovet ja tiensä valokeilaan. Ilkka Villi pohtii ulkonäön merkitystä roolituksessa.
