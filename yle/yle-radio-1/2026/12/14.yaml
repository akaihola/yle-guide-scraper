        description: |
          Veljen maalliset jäänteet saapuvat vihdoin elokuussa Suomeen. Melkein kolme kuukautta sen jälkeen kun perhe sai tietää nuoren miehen kuolemasta. Pian tämän jälkeen järjestetään hautajaiset. Raskaana oleva sisko keskittyy vauvan odotukseen, mutta mieleen tulvii monenlaisia muistoja veljen ja  lapsuudenperheen elämästä.  
