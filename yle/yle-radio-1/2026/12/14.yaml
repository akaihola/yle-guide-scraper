        end_time: '2026-12-14T18:35:00+02:00'
        description: |-
          Muistammeko vielä, että blues on alkuperältään kansanmusiikkia? Keinuvan talon jakso on omistettu akustiselle bluesille ja kaikelle muulle siniselle, joka pysyttelee lähellä juuriaan. Uudempaa ja vanhempaa, amerikkalaista ja suomalaista – gospelia, kantria ja old time -meininkiä unohtamatta. Toimittajana Mika Kauhanen.
