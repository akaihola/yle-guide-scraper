          Kuula: Chanson sans paroles (Seeli Toivio, sello ja Lily-Marlene Puusepp, harppu).

          Madetoja: Arkihuolesi kaikki heitä (Tapiolan Kamarikuoro/Hannu Norjanen). 

          Guilmant - Händel: Riemuitse tytär Siionin (Markku Hietaharju, urut).

          Maasalo (sov. Kiiski): Joulun kellot (Sinfonia Lahti/Osmo Vänskä).

          Kansansäv. (sov. Trispann - Matre): Eit barn er födt i Betlehem (Lapsi on syntynyt Betlehemissä) (Gjermund Larsen, viulu, Rolf Lislevand, luuttu, ja Björn Kjellemyr, kontrabasso, sekä Norjalainen solistikuoro/Grete Pedersen).

          Hela: Lumihiutaleitten laulu (Hannu Jurmu, tenori, ja Lohjan kaupunginork./Juha Nikkola).
