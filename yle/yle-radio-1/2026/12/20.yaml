          Dohnanyi: Pastorale (Martin Roscoe, piano).

          Puccini: Astro del cielo (Placido Domingo, tenori, Tshekinmaan kansallisen sinfoniaorkesterin kuoro ja Tshekinmaan kansallinen SO/Eugene Kohn).


          Viitala: Fantasia sävelmästä Enkeli taivaan lausui näin (Aale Lindgren, oboe, ja Kari Jussila, urut).

