      - title: 'Aitiovieras: Kirjailija Jani Kiiskilä: Nuorten elämän kuvaaja asettuu nyt jalkapallokentälle'
        start_time: '2026-12-02T13:35:00+02:00'
        end_time: '2026-12-02T14:00:00+02:00'
        description: |
          Jani Kiiskilä sijoittaa tuoreimman romaaninsa suomalaisen juniorijalkapalloilun maailmaan. Mitä siihen liittyy, kun nuoren urheiluharrastuksesta tulee tavoitteellista? Mitä valintoja nuori joutuu tekemään? Kirjailija, opettaja Jani Kiiskilä on Jarmo Laitanevan haastattelussa.
