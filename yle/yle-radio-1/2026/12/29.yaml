      - title: 'Ina Mikkola & portinvartijat: “Eihän kukaan katso 1,5 h takkatulta lauantai-iltana”'
        start_time: '2026-12-29T15:00:00+02:00'
        end_time: '2026-12-29T15:58:00+02:00'
        description: |+
          Miksi televisiossa on “aina samat naamat”? Ylen tilaaja Emma Taulo ja Nelonen Median kotimaisen viihteen päällikkö Mirko Baas avaavat mediatalojen suljetut ovet. Jaksossa selviää, miten sadoista tv-ohjelmaideoista valikoituu vain kourallinen jatkoon ja miten data vaikuttaa päätöksentekoon. Onko valta mediapomoilla vai yleisöllä? Mukana myös somen kautta television portit murtanut komediaryhmä Justimus, Helsinki-filmin draamapäällikkö Mia Ylönen sekä näyttelijät Jasir Osman ja Ilkka Villi.

