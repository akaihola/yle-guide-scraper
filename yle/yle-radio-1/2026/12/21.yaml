      - title: 'Tosi tarina: Ystäväni Jurek eli kuinka musapojasta tuli tuottajasuuruus'
        start_time: '2026-12-21T21:31:00+02:00'
        end_time: '2026-12-21T22:11:30+02:00'
        description: |-
          Jurek Reunamäki on tunnettu musiikkituottaja, joka kertoo kaiken tulleen hänelle vähän vahingossa, ikään kuin kompastumalla. Kuopiossa syntynyt ja nuoruutensa viettänyt Reunamäki oli lukioaikoinaan kitaralaukku selässään kaikkialle kulkeva haaveilija, jolla oli aina monta rautaa tulessa eri bändien ja projektien kanssa. 

          Suureen tunnettuuteen ja esimerkiksi Idols-tuomariksi hän päätyi kaiketi tapojensa mukaan sattumalta: hän tutustui Antti Tuiskuun, teki hänen kanssaan musiikkia ja sai aikaan jotain uutta ja odottamatonta. Vuosien ajan Reunamäki tuotti ja teki musiikkia muille tunnetuille artisteille ja oli jossain vaiheessa päätyä valokeilaan itsekin. Näitä tarinoita on luettu ja kuultu medioissa pitkin Reunamäen uraa, mutta nyt häntä katsotaan vanhan ystävän silmin. 

          Ystävän, joka tietää ja muistaa hänestä kaikenlaista hauskaa. 


          Käsikirjoitus ja ohjaus: Anni Saastamoinen
          Äänisuunnittelu ja musiikki: Anders Wiksten
          Tuottaja: Sami Hahtala


          Vastaava tuottaja: Hertta Päivärinta
          Päätoimittaja: Petri Jauhiainen, Yle Asia
          Vastaava päätoimittaja: Johanna Törn-Mangs
          Yle Kulttuuri ja Asia 2026
