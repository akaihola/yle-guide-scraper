        end_time: '2026-12-21T19:00:00+02:00'
        description: |-
          "Mordokai suree"
          Näyttelijä Krista Kosonen lukee Esterin kirjasta Raamattu 2028-käännöksen mukaan. Tässä hartaudessa kuullaan Esterin kirjan luvusta 3:11-5:14.

          Loppusyksyn raamatunluennassa kuullaan uusia Vanhan Testamentin käännöksiä Joonan, Ruutin ja Esterin kirjoista. 
