      - title: 'Narrin aamulaulu - Jaakko Ryhänen ja kansakoulunopettajan odottamaton elämä: ”Yksi kierros riittää.”'
        start_time: '2026-12-04T11:00:00+02:00'
        end_time: '2026-12-04T11:55:00+02:00'
        description: |
          80 vuotta joulukuun 2. päivä täyttävää Jaakko Ryhästä on siunattu poikkeuksellisen kauniilla bassoäänellä. Komea kansainvälinen ura on tietysti edellyttänyt paljon muutakin, etenkin sitkeää työntekoa. Välillä tie on ollut kivinen. Taiteilija toteaa edelleen ihmettelevänsä, millaisen elämän on saanut. Kun hän kyyditsi lapsenlastaan urheiluharrastukseen ja kertoi jatkavansa siitä edelleen keikalle Hämeenlinnaan, 10-vuotias nassikka puolestaan ihmetteli: ”Eikö lähempää Hämeenlinnaa löydy tontasoista bassoa?”
          Toimittajana Outi Paananen. 
