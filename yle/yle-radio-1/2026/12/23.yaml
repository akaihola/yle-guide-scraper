        start_time: '2026-12-23T22:01:30+02:00'
        end_time: '2026-12-23T22:50:00+02:00'
        description: |-
          Miksi annamme toisillemme lahjoja? Ja mikä tekee eleestä niin tärkeän, että annamme ja vastaanotamme asioita, joita emme edes tarvitse?

          Haastateltavana sosiologian professori Olli Pyyhtinen Tampereen yliopistosta. Toimittajana Jaro Asikainen. Äänisuunnittelu: Jaro Asikainen ja Juha Sarkkinen.
