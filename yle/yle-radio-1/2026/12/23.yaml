      - title: '12 diktaattoria: Ugandan kauhu Milton Obote'
        start_time: '2026-12-23T12:05:00+02:00'
        end_time: '2026-12-23T12:50:00+02:00'
        description: |-
          Milton Obote oli Ugandan pääministeri vuosina 1962-1966 ja sittemmin presidentti vuosina 1966-1971 ja 1980-1985. 
          Idi Aminin aikana terrori oli Ugandassa järjestelmällistä, mutta Milton Oboten aikana uhriksi saattoi joutua kuka tahansa kadunmies. Toimittaja-tietokirjailija Hannu Pesonen on toimittaja Raimo Tyykiluodon vieraana. (v. 2021)
