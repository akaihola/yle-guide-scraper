      - title: Klassisen musiikin iltakonsertti
        start_time: '2026-12-30T19:02:00+02:00'
        end_time: '2026-12-30T20:10:00+02:00'
        description: |
          Avi Avitalin ja Ksenija Sidorovan konsertissa kaksi aivan erilaista soitinta – mandoliini ja harmonikka – muodostavat lyömättömän musiikillisen parin. 

          Oman soittimensa taiturit Avital ja Sidorova esittävät sovituksia tutuista klassisista kappaleista. Konsertin ohjelma ulottuu Mozartin sonaatista Montin Csárdásiin. 

          Kesäkuussa 2026 Saarin kansainvälisellä musiikkifestivaalilla Saksassa äänitetyn konsertin toimittaa Ainomaija Pennanen. 
