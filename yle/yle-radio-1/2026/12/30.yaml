      - title: '12 diktaattoria: Kameleontti Mathieu Kerekou'
        start_time: '2026-12-30T12:05:00+02:00'
        end_time: '2026-12-30T12:50:00+02:00'
        description: |-
          Laskuvarjomajuri Mathieu Kerekou hallitsi Beniniä presidenttinä vuosina 1972-1991 ja 1996-2006. Meillä alue tunnetaan ehkä paremmin Afrikan tähti -pelistä orjarannikkona. Uutispäällikkö Mikko Metsämäki on toimittaja Raimo Tyykiluodon vieraana. (v.2021)
