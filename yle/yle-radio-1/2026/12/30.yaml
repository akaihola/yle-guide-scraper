      - title: 'Ina Mikkola ja portinvartijat: “Pelon ilmapiirillä me ei uskalleta kehittää meidän alaa”'
        start_time: '2026-12-30T15:00:00+02:00'
        end_time: '2026-12-30T15:58:00+02:00'
        description: |
          Miksi vain kourallinen ihmisiä päättää siitä, millaisia kotimaisia elokuvia me pääsemme katsomaan? Haastattelussa Suomen Elokuvasäätiön portinvartijat Lasse Saarinen ja Ilkka Mertsola. Solar Filmsin tuottaja Markus Selin ja Helsinki-filmin draamapäällikkö Mia Ylönen kertovat, kuinka haastavaa on saada rahoitus elokuvalle. Mitä sanottavaa elokuvaohjaaja Selma Vilhusella, Suvi Westillä ja Tuukka Temosella on alan valtarakenteista ja siitä, miten menestys saavutetaan? Entä onko pelialalla rikastunut Mikko Kodisoja se, joka mullistaa kotimaisen elokuva-alan?
