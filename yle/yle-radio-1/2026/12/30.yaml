        end_time: '2026-12-30T16:59:00+02:00'
        description: |-
          Holst: Finaali (The Dargason) teoks. St. Paul's Suite (Saint Paulin kamariork./Christopher Hogwood). 

          Ruots. kansansävelmä (sov. Ek): Rolig Pers polska (Tukholman FO/Martin Fröst, klarinetti).

          Gabrieli: Canzona n:o 5 (Berliinin filharmonisen orkesterin vaskiyhtye).

          Bartling: Metsien joulu (Ruamjai).

          Goossens: By the tarn (Metsälammen rannalla) (Northern Sinfonian jouset/Richard Hickox).

          G. Boije: Valse interrompue (Keskeytynyt valssi) (Maria Suokas, piano).

          Melartin: Perhosvalssi (HKO/Leif Segerstam). 

          Ponchielli: Enzon aaria oopp. La Gioconda (Luciano Pavarotti, tenori, ja Lontoon Philharmonia-ork./Leone Magiera).

          Niemann: Ilta Sevillassa (Stephen Hough, piano).

          Corelli: Adagio - Allegro - Adagio teoks. Concerto grosso n:o 8 g-molli (Joulukonsertto) (Keski-Pohjanmaan kamariork./Juha Kangas).

          Nin: Villancico Asturiano (Asturialainen joululaulu) (Marilyn Horne, mezzosopraano, ja Martin Katz, piano).

          Anonyymi: Noël nouvelet (Chanticleer ja Matthew Oltman, tenori).

          Elgar (sov.): The holly and the ivy (Birminghamin sinfoniaorkesterin kuoro ja Birminghamin SO/Sakari Oramo)

          Konsertin on laatinut Ainomaija Pennanen.
