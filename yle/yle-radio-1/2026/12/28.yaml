      - title: 'Ina Mikkola & portinvartijat: “Mä oon se kala, joka ui vastavirtaan”'
        start_time: '2026-12-28T15:00:00+02:00'
        end_time: '2026-12-28T15:58:00+02:00'
        description: |-
          Miten artisti nousee soittolistoille? Nelonen Median musiikkisisältöjen johtaja Jussi Mäntysaari, Ruisrockin promoottori Mikko Niemelä ja UMK-vaikuttaja Tapio Hakanen kertovat, miten radiot, televisio ja festivaalit kuratoivat suomalaisten musiikkimakua. Warner Music Finlandin toimitusjohtaja Ramona Forsström, Head of A&R Jukka Immonen ja markkinointijohtaja Isadora Kamotskin paljastavat, millä perustein artisti saa levytyssopimuksen. Indie-artisti Neea River kertoo, miksi kieltäytyi levy-yhtiön huippudiilistä. Alan vaikuttaja Maiju Talvisto paljastaa, keitä alalla syrjitään
      - title: Yle Uutiset ja sää
