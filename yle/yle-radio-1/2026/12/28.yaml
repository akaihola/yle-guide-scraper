      - title: Faunin iltapäivä
        start_time: '2026-12-28T16:07:00+02:00'
        end_time: '2026-12-28T16:59:00+02:00'
        description: |
          Bozza: Allegro vivo sonatiinista vaskikvintetille (Münchenin vaskikvintetti).

          Pitsch: Pastoraalipreludi (Hans Leenders, urut). 

          Anonyymi 1600-luvulta (sov. Fuchs): Schlaf, mein Kindelein (Dresdenin kamarikuoro/Hans-Christoph Rademann).

          Tuntematon (1500-l.) (sov. Breiner): Good king Wenceslas (Tshekkoslovakian valtion FO/Peter Breiner). 

          Miolin (sov.): Fantasia kahdesta joululaulusta (Anders Miolin, 13-kielinen kitara).

          Janacek: Presto sellolle ja pianolle (David Geringas ja Ian Fountain). 

          R. Strauss: Pienten suklaakonvehtien tanssi ja Paukkukaramellien tanssi balettisarj. Schlagobers (Kuohukermaa) (Detroitin SO/Neeme Järvi).

          Sveinsson: Mariukvaedi (EMO Ensemble/Pasi Hyökki).

          Willis: It came upon the midnight clear (Arturo Delmoni ja Alexander Romanul, viulu, Katherine Murdock, alttoviulu, ja Nathaniel Rosen, sello).

          Le Beau: Poco adagio kons. pianolle ja orkesterille d-molli (Katja Tshemberdzhi ja Kammersymphonie Berlin/Jürgen Bruns).

          V. Hannikainen: On maassa hanget puhtahat (Matti Salminen, basso, ja Avanti!/Atso Almila).

          Nordqvist: Jul, jul, strålande jul (Erik Westberg -kuoro/Erik Westberg).

          Sonninen: Jouluhymni (Sinfonia Lahti/Osmo Vänskä).

          Konsertin on laatinut Ainomaija Pennanen.
