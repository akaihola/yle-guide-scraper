      - title: 'Keinuva talo - Mika Kauhanen: Koti on tunne'
        start_time: '2026-12-28T17:35:00+02:00'
        end_time: '2026-12-28T18:35:00+02:00'
        description: |-
          Koti saattaa olla ihmisen tärkein paikka. Siellä tulisi olla turvallinen olo ja viihtyisää, lupa levätä ja rentoutua, tulla hyväksytyksi. Kansanmusiikissa koti ja kotiseutu on keskeinen aihe, siinä ollaan juurilla. Kuulemme kappaleita arktisesta paratiisista, lakeudesta, lähiöstä ja kodista tien päällä, sekä puhetta siitä miten kotia on määritelty ja mitä se ihmisille tutkitun tiedon mukaan merkitsee. Toimittajana Mika Kauhanen. Uusinta helmikuulta 2026.
      - title: Hengellisen musiikin toivekonsertti
