      - title: 'Havaintoja muutoksesta: Luova kirjoittaminen'
        start_time: '2026-12-09T10:00:00+02:00'
        end_time: '2026-12-09T10:50:00+02:00'
        description: |
          Luova kirjoittaminen vaatii aikaa, rauhaa ja kurinalaisuutta. Eletty elämä ja kirjoituskurssit voivat tarjota inspiraatiota kirjoittamiseen. 
          Miten kirjoittaminen muuttaa arkea ja elämää? Millaista on kirjoituskurssien yhteisöllisyys? Mitä tapahtuu silloin, kun näyttää ettei tapahdu mitään?
          Toimittaja Satu Kivelä etsii vastauksia kysymyksiin yhdessä kirjoittajien Päivikki Välttilän ja Seppo Suihkon kanssa. 
