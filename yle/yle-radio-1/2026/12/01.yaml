      - title: 'Kulttuuriykkönen: Mitä tapahtuu maakuntien kulttuuritarjonnalle tulevina vuosina?'
        start_time: '2026-12-01T15:00:00+02:00'
        end_time: '2026-12-01T15:58:00+02:00'
        description: |
          Suomen kulttuurilaitokset ovat suuren muutoksen edessä. Kuntien talous kiristyy, väestö ikääntyy ja keskittyy kasvukeskuksiin. Lisäksi kulttuuritalojen ylläpito vie yhä enemmän rahaa. Miten kulttuuripalvelut voidaan turvata tulevaisuudessa myös maakunnissa?
          Mutta mitä tämä tarkoittaa maakuntateattereille? Voiko yhteistyö, kiertävä toiminta ja uudenlaiset toimintamallit pelastaa alueellisen teatteritarjonnan? Vai uhkaako uudistaminen viedä maakunnista omat kulttuuritalot, työpaikat ja paikallisen kulttuuri-identiteetin?
          Näistä kysymyksistä keskustelevat Kuntaliiton erityisasiantuntija Johanna Selkee, Suomen Teatterit ry:n toimitusjohtaja Kaisa Paavolainen, Porin teatterin toimitusjohtaja Anttivesa Knuuttila ja useita maakuntateattereita johtanut Helka-Maria Kinnunen. Lähetyksen toimittaa Miia Gustafsson.
