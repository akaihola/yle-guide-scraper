      - title: 'Aristoteleen kantapää: Herhiläisiä, Hurrikaaneja, Intiaaniheimoja – lentokonetyyppien nimet ovat angloamerikkalainen perinne '
        start_time: '2026-12-01T12:35:00+02:00'
        end_time: '2026-12-01T13:00:00+02:00'
        description: |
          Pasi Heikura liitelee lentokonetyyppien nimien värikkääseen maailmaan oppaanaan Suomen ilmavoimamuseon amanuenssi Mikko Kylmälä. Ohjelmassa jännitetään myös, kuinka käy, kun keiton kauhoo keoksi, kysytään, voiko susi olla siipirikko, ja lopuksi vielä: kun kalat loppuvat, tehdäänkö liemi silloin kalastajista? 
          Ohjelman ovat toimittaneet Pasi Heikura ja Tina Cavén.
