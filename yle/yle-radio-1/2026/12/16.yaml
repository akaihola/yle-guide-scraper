      - title: 'Havaintoja muutoksesta: Leikin vapauttava voima'
        start_time: '2026-12-16T10:00:00+02:00'
        end_time: '2026-12-16T10:50:00+02:00'
        description: |
          Ihmiset ja muunlajiset oppivat toisiltaan leikkimällä. Leikki auttaa myös rentoutumaan ja ruokkii luovuutta. 
          Millainen yhteys leikillä on oppimiseen? Millainen merkitys leikkimisellä on meille?
          Toimittaja Satu Kivelä keskustelee aiheesta lelu- ja leikintutkija Katriina Heljakan ja tutkija Anna Rainion kanssa. 
