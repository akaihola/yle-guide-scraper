      - title: 'Tiedeykkönen: Hirviömäinen El Niño väläyttää ilmastoa 2030-luvulla – miten se vaikuttaa Suomen talveen?'
        start_time: '2026-11-20T12:05:00+02:00'
        end_time: '2026-11-20T12:55:00+02:00'
        description: |-
          Ennätyksellisen voimakas El Niño näkyy äärisäinä. Ilmiö itsessään on luonnollinen. Mutta mitä tapahtuu, kun se syntyy samaan aikaan nopeasti etenevän ilmastonmuutoksen kanssa? Haastateltavana Ilmatieteen laitoksen tutkija Mika Rantanen. Toimittajana on Jaro Asikainen.
