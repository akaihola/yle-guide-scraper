      - title: 'Aitiovieras: Marco Bjurström ohjaa, opettaa ja innostaa - uusimpana Kaija Koon tarina'
        start_time: '2026-11-20T21:31:00+02:00'
        end_time: '2026-11-20T21:56:00+02:00'
        description: |2-
           Marco Bjurström on ollut uransa aikana mukana lukuisissa Suomen suosituimmissa tv-ohjelmissa, ohjannut useita suurmusikaaleja, toiminut vuosia viestintä- ja vuorovaikutuskouluttajana ja opettaa tanssiopiskelijoita perustamassaan StepUp -tanssikoulussa. Viiimeisin Bjurströmin ohjaustyö on Kaija Koon elämästä kertova Tinakenkätyttö, jota esitetään Vaasan kaupunginteatterissa. Miia Lahti haastattelee.
      - title: 'Sari Valto: Ruokaa nyt ja tulevaisuudessa!'
        start_time: '2026-11-20T21:57:00+02:00'
        end_time: '2026-11-20T22:52:00+02:00'
        description: |-
          Maatalous on edelleen merkittävä päästöjen aiheuttaja ja myös vesistöjen saastuttaja. Millaista maatalouspolitiikkaa Suomen pitäisi tehdä, että päästöjä saataisiin rivakammin laskemaan?Tähän vastaavat maa-ja metsätalousministeri Sari Essayah sekä Suomen ympäristökeskuksen tutkimusprofessori Minna Kaljonen.
      - title: Tuuli Saksalan keidas
