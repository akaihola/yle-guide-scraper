      - title: 'Kulttuuriykkönen: Kulttuurin uudet palatsit'
        start_time: '2026-11-25T15:00:00+02:00'
        end_time: '2026-11-25T15:58:00+02:00'
        description: |2

          Millaisia kulttuuritiloja arkkitehdit suunnittelevat juuri nyt? Mitä uudet talot kertovat kulttuurin tulevaisuudesta? Keskustelemassa ovat Turun uuden Musiikkitalo Fuugan pääsuunnittelija Tuomas Silvennoinen, Kansallismuseon lisärakennuksesta ja uudesta Arkkitehtuuri- ja designmuseosta vastaava arkkitehti Samuli Miettinen sekä Tampereen taidemuseon korjauksen ja lisärakennuksen suunnittelun vetävä Erkko Aarti. Uusia isoja kulttuurihankkeita ei näy horisontissa. Mikä merkitys kulttuurirakennusten suunnittelulla ja niihin liittyvillä arkkitehtuurikilpailuilla on suomalaisen arkkitehtuurin elinvoimaisuuden kannalta? Toimittajana Minna Joenniemi. 
