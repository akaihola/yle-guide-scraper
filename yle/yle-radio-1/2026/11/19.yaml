      - title: 'Aitiovieras: Satu Silvo - vilpittömyyden voima'
        start_time: '2026-11-19T13:35:00+02:00'
        end_time: '2026-11-19T14:00:00+02:00'
        description: |-
          Satu Silvo on näyttelijä, jolle vilpitön heittäytyminen on ammatin ydin. Silvo on toiminut freelancer-näyttelijänä jo pitkään ja tottunut uimaan uuteen työryhmään nopeasti. Parhaillaan Silvo esiintyy Hämeenlinnan teatterissa komediassa Suurenmoista! sekä Tampereen komediateatterin Yllätysvieraassa. Satu Silvo on Kati Turtolan haastattelussa. 
      - title: 'Musiikkiaitio: Desafinado'
        start_time: '2026-11-19T14:00:00+02:00'
        end_time: '2026-11-19T15:00:00+02:00'
        description: |+
          Juontajana Miia Lahti. Lähde mukaan musiikin maailmankiertueelle. Tanssija, koreografi Sofia Ruija kertoo merkityksellisimmistä kulttuurikokemuksistaan ja 
          siitä mitä tanssi ja musiikki hänelle merkitsee. 
          Toimittaja Marko Gustafsson. Ensilähetys oli 10.7.2026.


          Adooni, Weissenfeldt: Mam pe'ela su'ure (Florence Adooni).

          Ballesteros: Mechita (Silvia Perez Cruz).

          John McGregor: Joki.

          Binker Golding: ... And I like your feathers.

          Jobim, Mendonca: Desafinado (Bebel Gilberto).

          Elena Mîndru: Jocul tambalelor.

          Hernandez: Ven, devorame otra vez (Lalo Rodríguez).

