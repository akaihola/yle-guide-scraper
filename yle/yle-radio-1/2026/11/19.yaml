      - title: 'Marko Gustafsson: Käännekohdissa Iiro Rantala'
        start_time: '2026-11-19T10:00:00+02:00'
        end_time: '2026-11-19T10:53:00+02:00'
        description: |
          Iiro Rantala kertoo menevänsä sinne, missä hänen musiikkiaan tarvitaan. Käytännönläheisyys tulee kotoa. Suvussamme ei ole yhtään taiteilijaa ja ajatus, että minä elätän itseni musiikilla oli isälle alkuun hankala. Rantalan isä oli sodat käynyt mies, joka elätti perheensä polkupyöriä myymällä. Iiro Rantala kokee palvelevansa ihmisiä musiikillaan, kuten pyöräkauppias asiakkaitaan. Hänelle on vähemmän tärkeää se, mitä hän itse haluaa. 
