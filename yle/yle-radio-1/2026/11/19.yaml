      - title: Kirjallisuuden Finlandia-ehdokkaat käsittelyssä
        start_time: '2026-11-19T15:00:00+02:00'
        end_time: '2026-11-19T15:58:00+02:00'
        description: |-
          Kirjallisuuden Finlandia-voittajat selviävät torstaina 26 marraskuuta. Kulttuuriykkösessä käsittelemme kaikki ehdokkaat eri kategorioista. Samalla selviää millaisia aihepiirejä on tarjolla lapsille ja nuorille, miten tietokirjallisuudella menee sekä miten moninaista on kaunokirjallisuus. Ohjelman vieraina ovat Finlandia-palkinnon esiraatien jäsenet Jonna Tapanainen ja Mikael Nyroos sekä lasten- ja nuortenkirjallisuuden tutkija Päivi Heikkilä-Halttunen. Lähetyksen toimittaa Miia Gustafsson.
