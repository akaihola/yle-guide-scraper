      - title: 'Elävä historia: Norjalaistaminen kuritti kveenejä vielä 1900-luvulla – omasta kielestä tuli "paskasuomea"'
        start_time: '2026-11-29T12:05:00+02:00'
        end_time: '2026-11-29T12:50:00+02:00'
        description: |
          Kveenit ovat Suomesta 1700-1800-luvuilla Pohjois-Norjaan muuttaneiden siirtolaisten jälkeläisiä. Sodat ja katovuodet koettelivat suomalaisia, jolloin tuhannet ihmiset aloittivat uuden elämän Jäämeren rannikolla kalastaen ja maata viljellen. 1800-luvun puolivälissä alkanut kansallishenkinen norjalaistamispolitiikka oli kuitenkin tuhota heidän kielensä ja identiteettinsä. Monet kveenit oppivat häpeämään omaa kieltään. Nyt kieltä yritetään elvyttää, mutta onko jo liian myöhäistä? 

          Toimittaja: Anna-Kaisa Brenner

          Haastateltavat: 
          Teemu Ryymin, historian professori Bergenin yliopisto
          Eira Söderholm, kielitieteilijä, apulaisprofessori (eläkkeellä), Tromssan yliopisto 
