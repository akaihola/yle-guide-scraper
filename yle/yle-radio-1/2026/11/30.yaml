      - title: 'Tiedeykkönen: Yhteiskuntaluokka ja maku ovat aina kulkeneet käsi kädessä. Muuttavatko algoritmit tämän?'
        start_time: '2026-11-30T21:30:30+02:00'
        end_time: '2026-11-30T22:20:00+02:00'
        description: |-
          Sosiologit ovat pitkään tienneet, että maun ja yhteiskuntaluokan välillä vallitsee yhteys. Perinteisesti korkeamman yhteiskunnallisen statuksen ihmisryhmät ovat määritelleet hyvää makua ja alempien yhteiskuntaluokkien mieltymykset on mielletty matala- tai roskakulttuuriksi. 

          Perinteisesti hyvän maun portinvartijoina on pidetty esimerkiksi opettajia, kirjastonhoitajia ja kriitikoita. Nyt näiden portinvartijoiden rinnalle ovat tulleet alustojen suosittelualgoritmit, joiden pyrkimyksenä on palvella digijättien liiketoimintamallia. Muuttaako tämä jollain tapaa sosiologian klassikkoteorioita yhteiskuntaluokan ja maun välisestä yhteydestä?

          Tiedeykkösen haastateltavana on lukemista ja suomalaisten makua tutkinut sosiologian dosentti Riie Heikkilä. Viime aikoina Heikkilä on tutkinut kirjastojen algoritmipohjaista kokoelmanhallintaa, sekä alustajättien vaikutusta käyttäjien maun muotoutumiseen.

          Jaksoa varten toimittaja Juuso Pekkinen lähestyi myös Spotifyita, Youtubea ja Netflixiä.

          Toimittaja: Juuso Pekkinen
          Haastateltava: Riie Heikkilä (Tampereen yliopisto)
          Äänisuunnittelija: Jukka Herva
