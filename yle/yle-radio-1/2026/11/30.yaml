      - title: 'Kulttuuriykkönen: Linnan juhlat - etiketti ja muoti punaisella matolla'
        start_time: '2026-11-30T15:00:00+02:00'
        end_time: '2026-11-30T15:58:00+02:00'
        description: |-
          Maailma muuttuu, pysyykö Linnan juhlien etiketti samana? Miesten muodissa on nähty uudistuksia viime vuosina. Mistä tämä kertoo? Onko Linnan juhlat edelleen suomalaisen muodin aitiopaikka? Millaisia vintage juhlapukuja tulemme näkemään tänä vuonna? Kuka suomalainen muotisuunnittelija on nyt kaikkein työllistetyin? Ohjelmassa kuullaan myös vinkkejä tämän hetken trendikkäimistä talven juhlapuvuista. Maailmalla kritisoidaan parhaillaan spektaakkelimaista metodipukeutumista, jossa Hollywoodin näyttelijät markkinoivat uutta elokuvaa ylitsepursuavissa, elokuvan teemaan sopivissa asuissa.

          Ohjelman vieraina ovat muotisuunnittelija Teemu Muurimäki, muotiasiantuntija ja suunnittelija Carolina Forss, pukuhistorian tutkija Jaakko Mäkinen ja diplomigemmologi Niina-Jasmin Korpi.

          Ohjelman juontaa Pia-Maria Lehtola.

          Rentoa puhetta, kiinnostavimmat vieraat ja kulttuurin ajankohtaisaiheet debatoitavina. Suorana maanantaista perjantaihin.
