        description: |
          Suomalaisten suhde suteen muuttui 1800-luvun kuluessa. Mistä susipelko oikein juontaa juurensa? Miksi susia vastaan julistettiin "pyhä sota"? Entä mikä oli koko kansan satusedän, Zacharias Topeliuksen, rooli tässä kaikessa.

