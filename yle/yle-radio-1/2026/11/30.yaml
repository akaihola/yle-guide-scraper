          Näyttelijä Krista Kosonen lukee Ruutin kirjasta Raamattu 2028-käännöksen mukaan. Tässä hartaudessa kuullaan Ruutin kirjan luku 4.

          Loppusyksyn raamatunluennassa kuullaan uusia Vanhan Testamentin käännöksiä Joonan, Ruutin ja Esterin kirjoista. 
