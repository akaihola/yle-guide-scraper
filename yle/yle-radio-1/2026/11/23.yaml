        description: |-
          Ennätyksellisen voimakas El Niño näkyy äärisäinä. Ilmiö itsessään on luonnollinen. Mutta mitä tapahtuu, kun se syntyy samaan aikaan nopeasti etenevän ilmastonmuutoksen kanssa? Haastateltavana Ilmatieteen laitoksen tutkija Mika Rantanen. Toimittajana on Jaro Asikainen.
      - title: 'Maailmanpolitiikan arkipäivää: Välivaalitappion kolhima Trump hakee voittoja ulkopolitiikasta'
        start_time: '2026-11-23T22:21:00+02:00'
        end_time: '2026-11-23T22:44:00+02:00'
        description: |
          Maailmalla seurataan nyt tarkasti, millaista ulkopolitiikkaa Yhdysvaltain presidentti Donald Trump toteuttaa virkakautensa kaksi viimeistä vuotta. Perinteisesti välivaalitappion jälkeen Yhdysvaltain presidentit ovat kääntäneet huomion ulkosuhteisiin poliittisen menestyksen toivossa.

          Tällä viikolla pidetty Aasian ja Tyynenmeren maiden  APEC-kokous oheistapaamisineen tarjosi Trumpille näyttämön osoittaa ulkopoliittista toimijuutta. Kiinan APEC-kokouksen yhteydessä järjestettiin myös historian ensimmäinen Kiinan, Venäjän ja Yhdysvaltain johtajien yhteiskokous.

          Ohjelmassa yhdysvaltalaisasiantuntija arvioi kolmikantatapaamisen merkitystä.

          Ylen Aasian kirjeenvaihtaja raportoi APEC-kokouksesta ja avaa, millaisesta uudesta turvallisuuspoliittisesta yhteistyöstä Trump sopi kolmen Aasian maan kanssa juuri kokouksen alla.

          Euroopassa Trumpin likeinen suhde Venäjän presidentti Vladimir Putiniin on herättänyt huolta. Trumpin hallinto näyttää olevan myös vähentämässä Yhdysvaltain Eurooppaan sijoitettuja joukkoja. 

          Ohjelmassa pitkän uran Pentagonissa tehnyt asiantuntija arvioi suunnitelmia. Lisäksi kuullaan tavallisten yhdysvaltalaisten ajatuksia presidentin harjoittamasta ulkopolitiikasta ja Nato-liittolaisten kohtelusta.

          Maailmanpolitiikan arkipäivää -ohjelman ovat toimittaneet Olli-Pekka Sulasma ja Paula Vilén. 

          Äänitarkkailijana on Matias Puumala. Tunnusmusiikki: Petri Alanko, kuva: Tuuli Laukkanen/Yle.
