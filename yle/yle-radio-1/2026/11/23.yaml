      - title: 'Kulttuuriykkönen: GTA 6 – miksi rikollisuuden virtuaalimaailma on valloittanut maailman?'
        start_time: '2026-11-23T15:00:00+02:00'
        end_time: '2026-11-23T15:58:00+02:00'
        description: |
          Pelimaailman kenties kaikkien aikojen odotetuin uutuus, Grand Theft Auto 6, tuli kauppoihin viime torstaina. Miljardiluokan kehityshankkeeksi arvioidun pelin ennakkomyynti rikkoi ennätyksiä, ja sen hurja kysyntä on tyhjentänyt myös pelikonsolien varastoja.
          Vuonna 1997 alkunsa saanut GTA-sarja on mullistanut videopelien maailmaa. Sen avoimissa, amerikkalaista yhteiskuntaa jäljittelevissä virtuaalikaupungeissa pelaaja voi liikkua ja toimia poikkeuksellisen vapaasti – ennen kaikkea rikollisen roolissa. Samalla pelisarja on herättänyt jatkuvaa moraalista keskustelua väkivallan, rikollisuuden ja yhteiskunnallisten tabujen käsittelystä.
          Mihin GTA:n valtava suosio perustuu? Onko kyse ennen kaikkea kielletyn tekemisen viehätyksestä, rajattoman vapauden kokemuksesta vai terävästä yhteiskuntasatiirista? Ja mitä GTA:n maailma kertoo meistä itsestämme – siitä, millaisia haluamme olla, kun todellisen maailman säännöt eivät enää sido?
          Aiheesta keskustelemassa Pelit-lehden päätoimittaja Tuukka Grönholm, pelitoimittaja Johannes Valkola sekä Yle Uutisten toimittaja Elise Aaltonen. Ville Talola toimittaa.
