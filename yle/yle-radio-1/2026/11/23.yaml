        description: |-
          Elokuvat, jotka halusimme nähdä. Ylen satavuotisjuhlan kunniaksi Yle Teema ja Yle Areena esittävät sata kotimaista elokuvaa sadan vuoden ajalta. Elokuvat on koottu yleisön toiveiden perusteella. Ne julkaistaan Areenassa ja esitetään televisiossa Yle Teemalla. Kerran kuukaudessa Yle Radio 1:n Aitiovieraassa keskustellaan valituista elokuvista ja ilmiöistä niiden ympäriltä.Suomen elokuvasäätiön kulttuuriviennin suunnittelija Otto Suuronen keskustelee Jarmo Laitanevan kanssa kolmesta yleisön toive-elokuvasta, Pedon merkki, Vaaratettu kuolema sekä Talvisota.
