      - title: Maailmanpolitiikan arkipäivää
        start_time: '2026-11-28T10:00:00+02:00'
        end_time: '2026-11-28T10:25:00+02:00'
        description: |-
          Euroopan unioni pyrkii patoamaan luvattomia rajanylityksiä Välimereltä. 

          Maailmanpolitiikan arkipäivää -ohjelmassa tavataan EU:n rajanviraston Frontexin operaatioon osallistuvia suomalaisia Välimerellä Sardinian saarella, jonne on viime aikoina saapunut aiempaa enemmän Eurooppaan pyrkiviä ihmisiä. 

          Saapumiset Välimeren kautta ovat ylipäätään vähentyneet, kun EU on tehnyt Pohjois-Afrikan maiden kanssa sopimuksia meren yli pyrkivien siirtolaisten ja turvapaikanhakijoiden pysäyttämisestä. Sopimuksissa on riskinä, että EU altistaa itsensä itsevaltaisten hallintojen kiristykselle.

          Toisaalta Eurooppaan pyrkiviä ihmisiä on viime aikoina suunnannut Välimertakin vaarallisemmalle reitille Länsi-Afrikasta Espanjan Kanariansaarille. Marraskuussa saarille on tullut yli 16 000 ihmistä. 

          Ohjelmassa myös pohditaan, millaisia odottamattomia seurauksia Euroopan tiukkenevalla rajapolitiikalla voi olla.

          Ohjelman ovat toimittaneet Jenna Vehviläinen ja Heikki Heiskanen. Äänitarkkailijana on Pasi Ilkka.

          Tunnusmusiikki: Petri Alanko, kuva: Tuuli Laukkanen/Yle.
      - title: 'Uusiutuva tiede: Paleontologia 2/2 – Megalosauruksesta nanotyrannukseen'
        start_time: '2026-11-28T10:25:00+02:00'
        end_time: '2026-11-28T10:55:00+02:00'
        description: |-
          Fossiilit ovat olleet luultavasti pohjana useille myyteille ja mytologioille ihmiskunnan historiassa. Dinosauruksia alettiin ymmärtää vasta alle 200 vuotta sitten. Sen jälkeenkin matkalle on mahtunut virhetulkintoja ja jopa nk. luusodat. Miten paleontologia lähti liikkeelle? Millaisia hirmuliskoja aluksi löydettiin?

          Missä ovat parhaat fossiiliesiintymät, miksei Suomesta löydy dinosauruksia? Uusia lajeja tunnistetaan lähes viikoittain, mutta miten paleontologit voivat tietää fossiilista, mistä muinaisesta eläimestä on kyse?

          Kumpi oli suurempi peto, tyrannosaurus rex vai spinosaurus?

          Jos massiivinen asteroidi ei olisi osunut maapalloon, olisiko jokin dinosaurus voinut kehittyä älykkääksi “dinosauroidiksi”, joka olisi luonut yhtä edistyneen korkeakulttuurin kuin ihminen?

          Haastateltavana paleontologi Mikko Haaramo Helsingin yliopistosta. Toimittajana Samppa Korhonen.
