      - title: 'Maailma tarinoina: Perfect days - modernin yhteiskunnan kritiikkiä zeniläisessä hengessä?'
        start_time: '2026-11-28T12:05:00+02:00'
        end_time: '2026-11-28T13:00:00+02:00'
        description: |-
          Maailma tarinoina -ohjelmassa käsitellään Wim Wendersin elokuvaa Perfect Days. Elokuva seuraa Hirayamaa, miestä, joka siivoaa Tokion julkisia vessoja ja elää tyytyväisenä yksinkertaista, toistuvaa arkea. 

          Elokuva ei avaa päähenkilönsä Hirayaman taustaa, mutta syntyy vaikutelma siitä, että hän on jättänyt toisen hyvin erilaisen elämän taakseen, elääkseen nykyistä seesteistä elämäänsä. Tämän kautta päästään japanilaiseen filosofiaan; minän muodostumisen kysymykseen ja tyhjän minän käsitteeseen.

          Marja Vehkanen lähestyy elokuvan maailmaa yhdessä hiljattain väitelleen filosofi Anttoni Kuuselan kanssa, joka on perehtynyt japanilaiseen filosofiaan.
