      - title: 'Uusiutuva tiede: Paleontologia 2/2 – Megalosauruksesta nanotyrannukseen'
        start_time: '2026-11-24T12:05:00+02:00'
        end_time: '2026-11-24T12:35:00+02:00'
        description: |-
          Fossiilit ovat olleet luultavasti pohjana useille myyteille ja mytologioille ihmiskunnan historiassa. Dinosauruksia alettiin ymmärtää vasta alle 200 vuotta sitten. Sen jälkeenkin matkalle on mahtunut virhetulkintoja ja jopa nk. luusodat. Miten paleontologia lähti liikkeelle? Millaisia hirmuliskoja aluksi löydettiin?

          Missä ovat parhaat fossiiliesiintymät, miksei Suomesta löydy dinosauruksia? Uusia lajeja tunnistetaan lähes viikoittain, mutta miten paleontologit voivat tietää fossiilista, mistä muinaisesta eläimestä on kyse?

          Kumpi oli suurempi peto, tyrannosaurus rex vai spinosaurus?

          Jos massiivinen asteroidi ei olisi osunut maapalloon, olisiko jokin dinosaurus voinut kehittyä älykkääksi “dinosauroidiksi”, joka olisi luonut yhtä edistyneen korkeakulttuurin kuin ihminen?

          Haastateltavana paleontologi Mikko Haaramo Helsingin yliopistosta. Toimittajana Samppa Korhonen.
      - title: 'Aristoteleen kantapää: Populaarikulttuuri inspiroi usein verkon käyttäjänimien luomisessa'
