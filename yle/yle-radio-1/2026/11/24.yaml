      - title: 'Aitiovieras:  Fuuga valmistui - pääsuunnittelija Tuomas Silvennoinen kertoo tunnelmista avajaisten jälkeen'
        start_time: '2026-11-24T13:35:00+02:00'
        end_time: '2026-11-24T14:00:00+02:00'
        description: |-
          Turun uusi musiikkitalo Fuuga valmistui lokakuun lopulla. Rakennus on kiinnostanut yleisöä, sillä pelkästään avajaisviikolla sitä kävi katsomassa yli 21 000 kävijää. Uuden musiikkitalon suunnittelu on vaativa hanke, jossa on otettava huomioon niin sen vaikutukset kaupunkikuvaan, kuin toimivuus erilaisten tapahtumien kotipesänä. Kaikkea raamittavat kustannukset. Miltä rakennuksen pääsuunnittelijasta, arkkitehti Tuomas Silvennoisesta tuntuu nyt, kun avajaiskonsertista on kulunut pari viikkoa? Mihin Silvennoinen on tuliterässä talossa erityisen tyytyväinen? Miia Lahti haastattelee.
