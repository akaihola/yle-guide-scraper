      - title: 'Sari Valto: Miltä tuntuu tietää ennalta päivä, jolloin puoliso aikoo kuolla?'
        start_time: '2026-11-24T10:00:00+02:00'
        end_time: '2026-11-24T10:55:00+02:00'
        description: |
          Anumari Siltapuron puoliso ei enää halunnut elää pitkäaikaisen ja yhä kivuliaammaksi kehittyvän sairautensa takia. Hän ilmoitti päätöksestään luopua elämästä etukäteen läheisilleen. Jos aktiivinen kuolinapu olisi Suomessa laillinen, miehen kuolema olisi todennäköisesti ollut hänen puolisolleen Anumarille hieman vähemmän traumaattinen.
