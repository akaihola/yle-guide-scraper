      - title: 'Klasariparatiisi: Bachin Magnificat tuo kirkkautta pimeään aikaan'
        start_time: '2026-11-24T11:00:00+02:00'
        end_time: '2026-11-24T11:57:00+02:00'
        description: |-
          Riemukas, koskettava ja täynnä erilaisia tunnelmia. Sellainen on Johann Sebastian Bachin juhlava Magnificat.
          Mistä teos koostuu, ja miten Bach värittää sanoja musiikin keinoin?
          Magnificatin jälkeen soi lempeä kaiku kaukaa renessanssin ajoilta.

          Eva Tigerstedt avaa polkuja musiikkiin.
