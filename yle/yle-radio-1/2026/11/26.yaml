          Oopperalaulaja Helena Juntunen tunnustautuu kirjallisuuden suurkuluttajaksi, mutta silti oman kirjan kirjoittaminen syvensi hänen suhdettaan kirjoihin. Hän huomasi oman kirjoitusprosessin myötä  ajattelevansa vielä syvemmin kaikkia lukemiaansa tekstejä ja samalla myös elämää ylipäätään.
