      - title: 'Kulttuuriykkönen:  Ahlströmit ja Serlachiukset, miten yritysmaailman johtajat loivat tilaa taiteelle ja museoille'
        start_time: '2026-11-26T15:00:00+02:00'
        end_time: '2026-11-26T15:58:00+02:00'
        description: |-
          Nyt on ilmestynyt kaksi tietokirjaa teollisuushistoriastamme. Gösta Serlachius – Puheita ja kirjoituksia ja Sakari Siltalan teos: Laulu Ahlströmin perheestä — Suku & yhtiö 1931-1981.

          Ilman suomalaista metsää ja paperiteollisuutta ei olisi niin vahvaa taiteen ja muotoilun menestystarinaa Suomesta. Mikä sai Ahlströmin suvun panostamaan muotoiluun? Miksi Serlachiuksen suku halusi vaalia kuvataidetta Mäntässä? Millä tavalla yhdistämällä liikemaailmaa ja taidetta luodaan menestystä? Mitkä heidän opeistaan olisivat tänä päivänä hyödyllisiä kun Suomea yritetään viedä ulkomaille? 

          Gösta Serlachiuksen filosofia oli että kukaan itsenäisesti ajatteleva ja toimiva ei voi olla kaikille mieliksi ja saa sen vuoksi vihamiehiä. Sellainen, jolla on ainoastaan ystäviä, on yleensä pelkuri. Vihollisten hankkimista on kuitenkin vältettävä. 

          Ohjelman vieraina ovat Taidesäätiön hallituksen varapuheenjohtaja Susanna Serlachius  ja kirjailija Sakari Siltala.

          Ohjelman juontaa Pia-Maria Lehtola.



          Rentoa puhetta, kiinnostavimmat vieraat ja kulttuurin ajankohtaisaiheet debatoitavina. Suorana maanantaista perjantaihin.
