      - title: 'Ina Mikkola & portinvartijat: “Oon unelmien mahdollistaja tai estäjä”'
        start_time: '2027-01-01T15:00:00+02:00'
        end_time: '2027-01-01T15:58:00+02:00'
        description: |
          Koreografi Reija Wäre on yksi Suomen tanssikentän kokeneimmista ja vaikutusvaltaisimmista ihmisistä. Millä perustein hän valitsee tanssijat televisio-ohjelmiin, festareille, Kansallisbaletin tai teatterien lavoille? Mitä hän vastaa, kun häneltä kysytään suoraan hänen vaikutusvallastaan?
          Legendaarinen Jorma Uotinen on koko kansan tuntema tanssija, koreografi ja mediapersoona. Sofia Ruija on puolestaan nuoremman sukupolven menestynyt tekijä. Miten he raivasivat tiensä estradeille? Entä miten rahan puute voi estää ammattitanssijaksi tulemisen tai ammatin harjoittamisen?
