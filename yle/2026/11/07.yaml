      - title: 'Uusiutuva tiede: Neandertal antoi nikotiinikoukun'
        start_time: '2026-11-07T10:25:00+02:00'
        end_time: '2026-11-07T10:55:00+02:00'
        description: |-
          Vasta vuonna 2010 varmistui, että nykyihminen on risteytynyt mm. neandertalinihmisen kanssa. Mitä hyviä ja huonoja ominaisuuksia saimme serkuiltamme? Miksi neandertal ja kaikki muutkin ihmislajit katosivat?

          Miten homo sapiens on ylipäätään kehittynyt? Kuinka ihmisen kehityshistoriaa tutkitaan?

          Haastateltavana arkeologi ja apulaisprofessori Miikka Tallavaara Helsingin yliopistosta.

          Toimittajana Samppa Korhonen.
