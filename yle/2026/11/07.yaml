      - title: 'Maailma tarinoina: Kummisedän vaikutus - miten Hollywood ja Cosa Nostra kirjoittivat toistensa tarinaa? '
        start_time: '2026-11-07T12:05:00+02:00'
        end_time: '2026-11-07T13:00:00+02:00'
        description: |
          Francis Ford Coppolan Kummisetä-trilogia avaa omanlaisensa, romantisoidunkin ikkunan sisilialaiseen ja amerikanitalialaiseen mafiaan, Cosa Nostraan. Mafiaperheen mahti hierarkioineen ulottuu pyhään, biologiseen perheeseen, jossa lojaaliuden ja suojelun rinnalla myös kosto elää. Perinteet siirtyvät siirtolaisperheen mukana Yhdysvaltoihin, mukaan lukien katolisuus, joka polvi polvelta menettää merkitystään. Trilogian päätösosassa roomalaiskatolinen kirkko ja Vatikaani kuvataan kaksinaamaisena, korruptoituneena valtakoneistona, jolla on kytköksensä mafiaan. Mitä on tämän päivän Cosa Nostra, miten mafia on muuttunut ja miksi ilmiö elää edelleen?

          Kummisedän kautta mafian maailmaa tonkivat Marja Vehkasen vieraina tietokirjailija Anton Monti sekä toimittaja-kirjailija Mira Selander.
