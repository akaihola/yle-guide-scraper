          Häräntappoaseesta hän ei jaksaisi puhua enää sanaakaan, mutta kaikesta muusta Anna-Leena Härkönen puhuu mielellään ja suoraan. Hän kysyy tapaamiltaan ihmisiltä suoraan isoja kysymyksiä kuten, mikä on nöyryttävin muistosi. Vastaukset saattavat päätyä hänen tuleviin kirjoihinsa. Ohjelma on uusinta ajalta 23.4.2026.
