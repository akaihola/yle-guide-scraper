      - title: 'Uusiutuva tiede: Neandertal antoi nikotiinikoukun'
        start_time: '2026-11-07T10:25:00+02:00'
        end_time: '2026-11-07T10:55:00+02:00'
        description: |-
          Vasta vuonna 2010 selvisi ja varmistui, että nykyihminen on risteytynyt mm. neandertalinihmisen kanssa, eli meillä on ollut geenienvaihtoa. Mitä hyviä ja huonoja ominaisuuksia saimme serkuiltamme? Miksi toisaalta neandertal ja kaikki muutkin ihmislajit katosivat?

          Miten homo sapiens on ylipäätään kehittynyt? Kuinka ihmisen kehityshistoriaa tutkitaan?

          Haastateltavana arkeologi ja apulaisprofessori Miikka Tallavaara Helsingin yliopistosta.

          Toimittajana Samppa Korhonen.
      - title: 'Virtasen taloushistoria: Hyvä, paha valtionvelka'
        start_time: '2026-11-07T11:00:00+02:00'
        end_time: '2026-11-07T11:55:00+02:00'
        description: |+
          Suomen valtio on ottanut  velkaa moniin investointeihin kuten rautateiden rakentamiseen. Välillä on kuitenkin jouduttu kustantamaan kulutustakin lainarahalla. Sotien jälkeen ensimmäinen kahvilasti rahoitettiin Brasiliasta otetulla lainalla. Suomella on ollut hyvä maine velkojen maksajana, ja hyvä maine on taannut kohtuullisen korkotason. Juha Virtasen kanssa keskustelevat taloushistorian professori emeritus Sakari Heikkinen ja valtiotieteiden tohtori Mika Arola. Ohjelma on uusinta lokakuulta 2025.

