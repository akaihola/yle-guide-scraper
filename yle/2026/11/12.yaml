        description: |-
          Sullivan: Three little maids from school are we (Dorothy Atkinson, Shirley Henderson ja Cathy Sara, laulu, sekä ork./Carl Davies).

          Händel: Ombra mai fu (Largo) oopp. Serse (Seeli Toivio, sello, ja Lily-Marlene Puusepp, harppu).

          Rimski-Korsakov: Ruhtinaiden kulkue oopperabal. Mlada (Empire Brass, sekä Richard Jensen ja Arthur Press, lyömäsoittimet).

          Bach: Bourrée ja Gigue partitasta sooloviululle nro 3 sekä Ojalan Friitin polkka (Kreeta-Maria Kentala, viulu). 

          Desportes: Preludi Ranskalaisesta sarjasta (Thurston-klarinettikvartetti).

          Verdi: Herttuan resit. ja aaria "Parmi veder le lagrime" oopp. Rigoletto (Benjamin Bernheim, tenori, ja Prahan kamarifilharmonia/Emmanuel Villaume).

          J. Ikonen: Verso (Sami Junnonen, huilu, ja Elisa Kerola, kantele). 

          Bax: Water music (Eric Parkin, piano). 

          Wranitzky: Alkusoitto oper. Das Fest der Lazzaroni (Pardubicen valtiollinen kamariork./Marek Stilec).

          Netzel: Cantabile ma non troppo lento sonaatista sellolle ja pianolle e-molli (Ola Karlsson ja Lucia Negro).

          Sibelius: Humoreski n:o 3 g-molli (Tapiola Sinfonietta/Pekka Kuusisto, viulu).

          Ohjelman on toimittanut Laura Korhonen.
