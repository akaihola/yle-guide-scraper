        start_time: '2026-11-12T13:35:00+02:00'
        end_time: '2026-11-12T14:00:00+02:00'
        description: |-
          Yle TV 1:ssä maanantaista torstaihin nähtävä Puoli seitsemän -ohjelma on ollut ruudussa jo yli 2500 kertaa. Venla-palkitun ohjelman toinen juontaja on toimittaja Ella Kanninen, joka asuu kahdessa maassa Suomessa ja Italiassa. Puoli seitsemän -ohjelman lisäksi hän on tehnyt useita ohjelmia italialaisesta kulttuurista. Miia Lahti haastattelee.
