        start_time: '2026-11-19T13:35:00+02:00'
        end_time: '2026-11-19T14:00:00+02:00'
        description: |-
          Satu Silvo on näyttelijä, jolle vilpitön heittäytyminen on ammatin ydin. Silvo on toiminut freelancer-näyttelijänä jo pitkään ja tottunut uimaan uuteen työryhmään nopeasti. Parhaillaan Silvo esiintyy Hämeenlinnan teatterissa komediassa Suurenmoista! sekä Tampereen komediateatterin Yllätysvieraassa. Satu Silvo on Kati Turtolan haastattelussa. 
