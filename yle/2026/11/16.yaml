      - title: 'Keinuva talo - Mika Kauhanen: Lenkille etnon tahtiin!'
        start_time: '2026-11-16T17:35:00+02:00'
        end_time: '2026-11-16T18:35:00+02:00'
        description: |-
          Kaikenlainen treenimusiikki on nykyään suosittu soittolistojen aihe suoratoistopalveluissa. Millainen musiikki saa ihmisen liikkeelle, ja millainen pitää yllä liikunnan iloa? Tempon valinta riippuu juoksijan temposta. Hölkätäänkö hissukseen tasaista peruskestävyyttä vai juostaanko maksimivauhdilla intervalleja? Varmaa on, että vauhtileikittelyn pontimeksi sopii leikittelevä kappale. Kansanmusiikin ja maailmanmusiikin ystävät ansaitsevat oman lenkkilistansa. Tässä Keinuvan talon ehdotus sellaiseksi! Toimittajana Mika Kauhanen.
