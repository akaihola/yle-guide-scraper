      - title: 'Elävä historia: Satumaista rikkautta ja mittaamatonta kärsimystä - brittien harjoittaman orjuuden jäljet Karibialla'
        start_time: '2026-11-16T12:05:00+02:00'
        end_time: '2026-11-16T12:57:00+02:00'
        description: |
          James Drax perusti vuonna 1627 Barbadoksen saarelle plantaasin, missä hän ensimmäisten joukossa kokeili sokeriruo'on viljelyä ja orjatyövoiman hyödyntämistä. Plantaasi on yhä Drax-suvun omistuksessa, ja se on tuottanut suuren omaisuuden. Parin sadan vuoden ajan Drax Hall -sokeriplantaasilla työskentelivät Afrikasta tuodut orjuutetut ihmiset. 
          Millaiset jäljet brittien harjoittama orjuus ylipäätään jätti Karibialle?
          Haastateltavat: Latinalaisen Amerikan tutkimuksen dosentti Pekka Valtonen ja historian yliopistonlehtori Markku Hokkanen Oulun yliopistosta.
          Toimittaja: Harri Alanne.
          Äänisuunnittelija: Laura Koso.
