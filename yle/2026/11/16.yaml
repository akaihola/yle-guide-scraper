      - title: 'Suuri juomapodi J6: Kohtuus kaikessa ja pullo päivässä'
        start_time: '2026-11-16T20:10:00+02:00'
        end_time: '2026-11-16T20:41:00+02:00'
        description: |
          Alkoholi erottaa arjen juhlasta ja koristelee elämän taitekohtia. Kihlasormusten vaihtamisen kunniaksi nostetaan kuohuviinilasi ja raskaan työviikon jälkeen on ansaittu pari huurteista. Mutta miksi alkoholittomassa juomassa ei tunnu olevan samanlaista voimaa?

          Kun toimittaja ja tietokirjailija Ani Kellomäki alkoi puhua julkisesti alkoholin varjopuolista, juhlakutsut loppuivat. Jani pääsee reflektoimaan omaa alkoholisuhdettaan ja tutkimaan oman siemailunsa sokeita pisteitä.
