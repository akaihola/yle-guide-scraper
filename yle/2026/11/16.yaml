        description: |-
          Teknologiayhtiö Nvidian toimitusjohtaja Jensen Huang joutui eromaan, kun paljastui, että hänellä oli avioliiton ulkopuolisia suhteita – yksi Kiinan vakoojaksi epäillyn naisen kanssa.  Nvidia on tekoälykehityksen kannalta erittäin keskeinen yhtiö. Millainen vaikutus ex-johtajan kompuroinnilla on yhtiölle? Leonard Wilhelmuksen haastaltavana on Ylen teknologiatoimittaja Teemu Hallamaa.
