      - title: 'Väkivallan markkinat K3J6: Valkoista ylivaltaa, ufoja ja lannoitetta'
        start_time: '2026-11-26T21:31:00+02:00'
        end_time: '2026-11-26T22:20:00+02:00'
        description: |
          Miten pommi-iskun tekijä päätyy viimein sytyttämään sytytyslangan? Timothy McVeighin radikalisoitumisen takana oli laajempi väkivaltaisen äärioikeistolaisen ajattelun verkosto, joka muistuttaa nykyisiä keskustelualustoja. Miksi salaliittoteoreetikosta on tullut väkivallan ihailijoiden parissa legenda ja esikuva?

          Jakson haastateltavat: Leena Malkki, Helsingin yliopiston terrorismin tutkija, Onni Sarvela, Diakonissalaitoksen Exit-toiminnan hanketyöntekijä, Tommi Kotonen, äärioikeiston tutkija, Jyväskylän yliopisto.

          Lähteitä:
          Homegrown, Jeffrey Toobin, One of ours – Timothy McVeigh and the Oklahoma City bombing, Richard A. Serrano.
      - title: Epäilyttävän uutta - Aki Yli-Salomäki
        start_time: '2026-11-26T23:01:00+02:00'
        end_time: '2026-11-26T23:57:00+02:00'
        description: |-
          Digitaaliseen musiikkiavaruuteen virtaa jatkuvasti uutta kuunneltavaa. Aki Yli-Salomäki poimii virrasta musiikkia, joka heijastelee tätä aikaa ja ympäristöä, on helposti lähestyttävää, mutta silti kunnianhimoista ja uteliasta.
