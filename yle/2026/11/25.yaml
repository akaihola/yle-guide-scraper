      - title: Euroradion konsertti-ilta
        start_time: '2026-11-25T19:02:00+02:00'
        end_time: '2026-11-25T20:36:00+02:00'
        description: |
          Loppusyksyn rostrum-illassa kuullaan teoksia, jotka omalla tavallaan tarttuvat meidän aikamme ilmiöihin. 
          Niistä välittyy Z-sukupolven kokema toivottomuus sekä kritiikki digitaalista maailmaa kohtaan. 
          Esille nousee myös naisiin kohdistuva väkivalta – miten sen voikaan toteuttaa musiikin keinoin? –  mutta myös sen hyväksyminen, että tässä ajassa sävelletty musiikki on aina osa suurta historiallista jatkumoa. 
          Lisäksi ohjelmassa on tilaa marraskuiselle melankolialle sekä sointivärikokeiluille. 

          Toimittaja Ainomaija Pennanen esittelee kuusi teosta, jotka nousivat suositeltujen teosten listalle Kansainvälisessä säveltäjärostrumissa keväällä -26. 
