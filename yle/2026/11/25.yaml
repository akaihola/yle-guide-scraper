      - title: 'Havaintoja muutoksesta: Rakentavan vuorovaikutuksen poluilla'
        start_time: '2026-11-25T10:00:00+02:00'
        end_time: '2026-11-25T10:50:00+02:00'
        description: |
          Tunneäly ja tunnetaidot edistävät rakentavaa vuorovaikutusta. Voiko kuka tahansa oppia rakentavaa vuorovaikutusta? Millainen merkitys vuorovaikutuksen laadulla on? 
          Toimittaja Satu Kivelä etsii vastauksia yhdessä kasvatustieteen tohtori Jouni Veijalaisen ja NVC-valmentaja Hanna Savannan kanssa.
