      - title: '12 diktaattoria: Prikaatikenraali Siad Barre'
        start_time: '2026-11-25T12:05:00+02:00'
        end_time: '2026-11-25T12:30:00+02:00'
        description: |-
          Somalian sotilasdiktaattori Siad Barren valtakausi kesti yli kaksikymmentä piinaavaa vuotta vuosina 1969-1991. Barre räätälöi maalle uuden ideologian, jonka taustalla oli Koraanin opit, Marxin ajatukset ja Stalinin ajan henkinen ilmapiiri.
          Toimittaja Raimo Tyykiluodon kanssa Barren tarinaa kertaa uutispäällikkö Mikko Metsämäki.
          (Ohjelma on vuodelta 2021 ja se on kuunneltavissa 12 diktaattoria -sarjassa Yle Areenassa.)
