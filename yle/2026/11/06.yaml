      - title: Euroradion konsertti-ilta
        start_time: '2026-11-06T19:02:00+02:00'
        end_time: '2026-11-06T20:32:00+02:00'
        description: |
          Maailmassa on jo vuosikymmenien ajan toiminut ammattimaisia jousikvartetteja, mutta jousisekstettejä ei juurikaan. Miksi siis edes säveltää tälle kokoonpanolle? 

          Onneksemme Johannes Brahms, Erich Wolfgang Korngold ja Richard Strauss eivät tällaista pohtineet vaan sävelsivät tälle kahden viulun, kahden alttoviulun ja kahden sellon kokoonpanolle teokset, jotka puhuttelevat edelleen. 

          Euroradiokonsertissa Brahmsin, Korngoldin ja Straussin sekstetot tulkitsee Berliner Solisten -sekstetti, jonka jäsenet ovat oman kansainvälisen muusikkouransa rinnalla toimineet myös professoreina Berliinin taideyliopistossa. 

          Würzburgin Mozart-festivaalilla 31.5.2026 äänitetyn konsertin toimittaa Ainomaija Pennanen. 
