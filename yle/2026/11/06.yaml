      - title: 'Narrin aamulaulu - Pokelat kulkevat omia latujaan '
        start_time: '2026-11-06T11:00:00+02:00'
        end_time: '2026-11-06T11:55:00+02:00'
        description: |
          1960-luvun lopussa Pokelat päättävät duonsa toiminnan. Martin vallannut "kantelevouhotus" vaikutti ratkaisevasti kanteleen renessanssiin ja siivitti kansanmusiikin osaksi Sibelius-Akatemian opetusta. Eveliinalle sävellettyjen laulujen myötä Marjatta löysi itsestään lastenlaulujen ja satuoopperoiden tekijän. Martti palkittiin ansioistaan professorin arvonimellä, Marjatta lastenkulttuurin valtionpalkinnolla. Sosiaalimuusikoksi itseään kutsuvalta Eeva-Leena Pokelalta – hänkin professori ansioistaan – luontuu melkein mikä vain.
          Suomen suosituimpien Pokeloiden musiikillista matkaa selvittelee Outi Paananen.
          Osa 2/2.  
