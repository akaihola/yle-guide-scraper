      - title: 'Havaintoja muutoksesta: Valosaaste vaikuttaa kaikkiin'
        start_time: '2026-11-04T10:00:00+02:00'
        end_time: '2026-11-04T10:50:00+02:00'
        description: |
          Pimeys on yhä harvinaisempaa Keinovaloa on jopa avaruudessa ja meressä. Valosaaste aiheuttaa haittoja niin ympäristöön, ihmiselle kuin muunlajisillekin. 
          Miten valosaasteelta voi suojautua? Millainen merkitys pimeydellä on? Miksi kiiltomadot tarvitsevat pimeyttä?
          Toimittaja Satu Kivelä keskustelee aiheesta ympäristökeskusken johtavan tutkijan Jari Lyytimäen ja kiiltomatotutkija Linnea Kivelän kanssa. 
