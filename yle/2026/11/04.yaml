      - title: 'Kulttuuriykkönen: Uusi Jane Austenin klassikkoteoksen elokuvaversio Sense and Sensibility tuo romantiikan nykyaikaan'
        start_time: '2026-11-04T15:00:00+02:00'
        end_time: '2026-11-04T15:58:00+02:00'
        description: |-
          Tarvitsemmeko historiallisen draaman tuomaan rakkauden arvon nykyaikaamme? Hitaasti etenevä ja seksitön elokuva avaa päähenkilöiden sisäistä ristiriitaista tunnemaailmaa. Aikana, jolloin avioliittoja järjestettiin ja tunteet olivat vähemmän arvoisia, syntyi myös onnettomia kohtaloita. Vuoden 2026 elokuvaversio Jane Austenin romaanista Järki ja tunteet (Sense and Sensibility) on ohjannut Georgia Oakley. Millä tavalla Diana Reidin käsikirjoittama historiallinen draamaelokuva eroaa aikaisemmista filmatisoinneista? Reid on kirjoittanut bestseller-romaanit Love & Virtue, Seeing Other People ja Signs of Damage.

          Millaisia miljöitä ja puvustuksia elokuva tarjoaa? Onko tämän elokuvaversion teema muutakin kuin romanttinen rakkaus? Millä tavalla kahden erilaisen temperamentin omaavien sisarusten suhdetta kuvaillaan? Ohjelmassa keskustellaan myös puvustuksesta ja tuosta aikakaudesta. Miten elokuvissa noudatetaan historiaa puvustuksessa, modernisoidaanko liikaa ja onko se myös tyylikeino?

          Ohjelman vieraina ovat elokuvatoimittajat Silja Sahlgren-Fodstad ja Anna Möttölä sekä tutkija, pukusuunnittelija Joanna Weckman.

          Ohjelman juontaa Pia-Maria Lehtola.
