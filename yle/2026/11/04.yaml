      - title: 'Aitiovieras: Ystävyys kameran edessä: Ilari Kellokoski dokumentoi JP Ahosen kamppailun ja Belzebubsin synnyn'
        start_time: '2026-11-04T13:35:00+02:00'
        end_time: '2026-11-04T14:00:00+02:00'
        description: |-
          Dokumentaristi Ilari Kellokoski on ohjannut nelisosaisen dokumentin sarjakuvataiteilija JP Ahosesta. Dokumenttisarjan keskiössä piti alun perin olla Ahosen Belzebubs-projekti, mutta korona muuttikin kuviot. Kellokosken dokumentissa kuvataan Ahosen henkilökohtaista kamppailua samalla, kun suuri animaatiotuotanto etenee. Kellokoski ja Ahonen ovat keskenään ystäviä. Millaista on tehdä dokumenttielokuvaa ystävästä ja hänen työstään? Jarmo Laitaneva haastattelee.
