      - title: 'Narrin aamulaulu - Pokelat kulkevat omia latujaan '
        start_time: '2026-11-08T08:05:28+02:00'
        end_time: '2026-11-08T08:59:48+02:00'
        description: |
          1960-luvun lopussa Pokelat päättävät duonsa toiminnan. Martin vallannut "kantelevouhotus" vaikutti ratkaisevasti kanteleen renessanssiin ja siivitti kansanmusiikin osaksi Sibelius-Akatemian opetusta. Eveliinalle sävellettyjen laulujen myötä Marjatta löysi itsestään lastenlaulujen ja musiikkisatujen tekijän. Martti palkittiin ansioistaan professorin arvonimellä, Marjatta lastenkulttuurin valtionpalkinnolla. Sosiaalimuusikoksi itseään kutsuvalta Eeva-Leena Pokelalta – hänkin professori ansioistaan – luontuu melkein mikä vain.
          Suomen suosituimpien Pokeloiden musiikillista matkaa selvittelee Outi Paananen.
          Osa 2/2.  
