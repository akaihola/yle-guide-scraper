        description: |+
          O. Merikanto: Scherzo C-duuri (Vaasan kaupunginork./Jorma Panula).

          A. Merikanto: Sydämeni laulu (Kampin Laulu/Timo Lehtovaara).

          J.S. Bach: Schlendrianin aaria "Hat man nicht mit seinen Kindern" Kahvikantaatista (Klaus Mertens, basso, ja Amsterdamin barokkiork./Ton Koopman).

          C.P.E. Bach: La Böhmer (Dejan Lazic, piano).

          L. Mozart: Sinfonia A-duuri jousille (Toronton kamariork./Kevin Mallon).

          W.A. Mozart: Alla turca (Turkkilainen marssi) (John Williams ja Carlos Bonell, kitara, Brian Gascoigne ja Morris Pert, marimba ja vibrafoni, sekä Keith Marjoram, kontrabasso).

          R. Wagner: Feuerzauber (Taikatuli) (Risto-Matti Marin, piano). 

          S. Wagner: Välisoitto oopp. Bärenhäuter (Kölnin radio-ork./Werner Andreas Albert). 

          I. Kuusisto: Hiljainen ilta (Tampereen Filharmoninen kuoro/Heikki Liimola).

          J. Kuusisto: Yölintu (Aulikki Eerola, sopraano, ja Johanneksen Kamariork./Pertti Eerola).

          J. Strauss, vanh.: Cachucha-Galopp (Boskovsky-Ensemble/Willi Boskovsky).

          J. Strauss, nuor.: Laguunivalssi "Ach wie so herrlich zu schaun" oper. Eine Nacht in Venedig (Yö Venetsiassa) (Jonas Kaufmann, tenori, ja Wienin filharmonikot/Adam Fischer).

          Konsertin on toimittanut Riikka Holopainen. 

