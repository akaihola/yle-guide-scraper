      - title: 'Aitiovieras: Maija Kylkilahti: Miten hallinto ja musiikki kohtaavat orkesterin intendentinarjessa?'
        start_time: '2026-11-08T21:23:47+02:00'
        end_time: '2026-11-08T21:47:57+02:00'
        description: |-
          Maija Kylkilahti aloitti juuri Radion sinfoniaorkesterin intendenttinä. Kylkilahti on haastatteluissa kuvaillut uutta tehtäväänsa kunniatehtäväksi, johon hän tarttuu suurella innolla. Kylkilahdella on laaja kokemus suomalaisen orkesterikentän johtamistyöstä. Hän on toiminut mm. Sinfonia Lahden intendenttinä ja muun muassa Tampere Filharmonian apulaisintendenttinä sekä Tapiola Sinfoniettan ja Avanti!-kamariorkesterin tuottajana. Intendentti on orkesterin hallinnollinen johtaja, joka huolehtii mm.taloudesta ja henkilöstöstä. Miten musikaalista intendentin työ oikein on? Jalmari Laine haastattelee
