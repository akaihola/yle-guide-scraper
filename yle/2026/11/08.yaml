      - title: 'Uusiutuva tiede: Neandertal antoi nikotiinikoukun'
        start_time: '2026-11-08T22:48:00+02:00'
        end_time: '2026-11-08T23:19:00+02:00'
        description: |-
          Vasta vuonna 2010 selvisi ja varmistui, että nykyihminen on risteytynyt mm. neandertalinihmisen kanssa, eli meillä on ollut geenienvaihtoa. Mitä hyviä ja huonoja ominaisuuksia saimme serkuiltamme? Miksi toisaalta neandertal ja kaikki muutkin ihmislajit katosivat?

          Miten homo sapiens on ylipäätään kehittynyt? Kuinka ihmisen kehityshistoriaa tutkitaan?

          Haastateltavana arkeologi ja apulaisprofessori Miikka Tallavaara Helsingin yliopistosta.

          Toimittajana Samppa Korhonen.
      - title: 'Romano mirits: Dimitri Keiski “Elän nyt sitä unelmaa, josta lapsena haaveilin”'
        start_time: '2026-11-08T23:26:00+02:00'
        end_time: '2026-11-08T23:39:30+02:00'
        description: |-
          Tämänkertaisessa Romano Mirits -ohjelmassa vieraana on laulaja, muusikko ja artisti Dimitri Keiski, joka toimii ENO-orkesteri (Entisten Nuorten Orkesteri) solistina. Ruotsissa varttunut Dimitri muutti Suomeen vuonna 2015, ja musiikki on ollut hänen elämässään tärkeässä roolissa jo lapsuudesta lähtien.
          Haastattelussa Dimitri kertoo musiikkiurastaan, unelmiensa toteutumisesta sekä elämästään tanssilavojen suosioon nousseen ENO-orkesterin mukana. Orkesteri on kiertänyt ahkerasti ympäri Suomea, ja keikkoja on kertynyt yli 200 vuodessa. Keskustelussa kuullaan myös hänen ajatuksiaan romanitaustasta, esiintymisestä ja musiikista, jota hän on rakastanut jo nuoresta asti.
          Luvassa on lämmin ja inspiroiva keskustelu artistista, joka saa tehdä työkseen sitä, mistä on haaveillut lapsuudestaan lähtien. Toimittajana Dimitri Grönfors.
