      - title: 'Kulttuuriykkönen: Sävelten voima ja sitkeys – musiikki politiikan pelikentällä'
        start_time: '2026-11-17T15:00:00+02:00'
        end_time: '2026-11-17T15:58:00+02:00'
        description: |
          Voiko kitaransoitto olla kannanotto ja laulu vallankäytön väline? Tällä kertaa Kulttuuriykkösessä sukelletaan musiikin ja politiikan kiehtovaan suhteeseen uuden monitieteisen kokoomateoksen "Sävelten voima ja sitkeys" innoittamana.

          Miten rocktähdestä tulee maailmanpolitiikan pelinappula tai -pelaaja? Keskustelussa käsitellään muun muassa Pink Floydin perustajajäsenen Roger Watersin kohuttua poliittista toimintaa Ukrainan sodan aikana sekä nuoren venäläisrokkarin muodonmuutosta Putinin hallinnon suosikiksi. Entä mitä Kraftwerkin konemainen, muokattu lauluääni kertoo saksalaisesta valvontayhteiskunnasta ja teknologisen murroksen ajasta?

          Keskustelemassa dosentti Pertti Grönholm Turun yliopistosta, vieraileva tutkija Antti Okko Jyväskylän yliopistosta ja lehtori Kimi Kärki Sibelius-Akatemiasta.

          Ohjelman juontaa Nicklas Wancke.
