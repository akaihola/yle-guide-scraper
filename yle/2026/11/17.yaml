      - title: 'Aitiovieras: Marco Bjurström ohjaa, opettaa ja innostaa - uusimpana Kaija Koon tarina'
        start_time: '2026-11-17T13:35:00+02:00'
        end_time: '2026-11-17T14:00:00+02:00'
        description: |2-
           Marco Bjurström on ollut uransa aikana mukana lukuisissa Suomen suosituimmissa tv-ohjelmissa, ohjannut useita suurmusikaaleja, toiminut vuosia viestintä- ja vuorovaikutuskouluttajana ja opettaa tanssiopiskelijoita perustamassaan StepUp -tanssikoulussa. Viiimeisin Bjurströmin ohjaustyö on Kaija Koon elämästä kertova Tinakenkätyttö, jota esitetään Vaasan kaupunginteatterissa. Miia Lahti haastattelee.
