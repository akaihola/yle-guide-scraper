      - title: 'Uusiutuva tiede: Paleontogia 1/2 – Oliko tyrannosaurus rexillä pusuhuulet ja höyhenpuku?'
        start_time: '2026-11-17T12:05:00+02:00'
        end_time: '2026-11-17T12:35:00+02:00'
        description: |-
          Dinosaurustutkimus elää parhaillaan kukoistuskautta. Uusia lajeja löydetään lähes viikoittain. Viime vuosien havainnot ovat muuttaneet käsityksiämme näiden muinaisten eläinten biologiasta ja ulkonäöstä, esimerkiksi höyhenpeitteistä. Fossiileista on löytynyt myös muun muassa biomolekyylejä. Uunituoreessa tutkimuksessa tutkijat vahvistivat löytäneensä jäänteitä 115 miljoonaa vuotta vanhasta dinosauruksen verestä.

          Miten merkittäviä ovat uudet havainnot? Kuinka yleisesti hirmuliskot olivat höyhenpeitteisiä? Millaista mullistavaa tietoa on saatu esimerkiksi tyrannosaurus rexistä?

          Dinosaurusten 160 miljoonan vuoden valtakaudesta ja sen päättäneestä joukkotuhosta sekä uusista tutkimustuloksista kertoo paleontologi Mikko Haaramo Helsingin yliopistosta.

          Toimittajana Samppa Korhonen.
      - title: 'Aristoteleen kantapää: Matematiikka on oma kielensä, jonka merkit, numerot, saapuivat Eurooppaan vasta keskiajalla'
        start_time: '2026-11-17T12:35:00+02:00'
        end_time: '2026-11-17T13:00:00+02:00'
        description: |
          Pasi Heikura syventyy numeroiden historiaan matematiikan historiaan oppaanaan matematiikan yliopisto-opettaja Jussi Kangas. Ohjelmassa selvitetään myös miltä tuntuu, kun naudanposti vie kielen mennessään, ja mitä pitää ajatella siitä, jos jotain asiaa tiedetä tiedonpuutteen vuoksi. Ohjelman ovat toimittaneet Pasi Heikura ja Tina Cavén.
