      - title: '12 diktaattoria: Jumalallinen kostaja Oliver Cromwell'
        start_time: '2026-11-18T12:05:00+02:00'
        end_time: '2026-11-18T12:52:00+02:00'
        description: |-
          Oliver Cromwellin valtakausi vuosina 1649-1658 oli lyhyt, mutta vakuuttava. Oliver Cromwell loi Englannista tasavallan vuonna 1649 vain yhdellä hyvin tähdätyllä ja vähäeleisellä iskulla, kun kuningas Kaarle I menetti päänsä mestauslavalla. Mutta kuinka kävi Englannin tasavallalle? Ei kovinkaan hyvin. Oliver Cromwellin englantilainen tasavalta oli yhden miehen show, toteaa toimittaja-tietokirjailija Hannu Pesonen. Toimittajana Raimo Tyykiluoto. (Ohjelma on vuodelta 2021 ja se on kuunneltavissa 12 diktaattoria -sarjassa Yle Areenassa.)
