      - title: 'Kulttuuriykkönen: Jean Sibeliuksen tyttäret ja Minna Krohnin lapset ja heidän omat tiensä kulttuurikodista maailmalle'
        start_time: '2026-11-18T15:00:00+02:00'
        end_time: '2026-11-18T15:58:00+02:00'
        description: |-
          Taidehistorioitsija Johanna Lindforsin naishistoriaa käsittelevä Sibeliusten tyttäret -teos kertoo Sibeliusten kulttuurikodin tytärten elämäntarinat ja kuvaa, millaista oli kasvaa kulttuuriperheestä itsenäisyyteen vuosisadalla, jona naisten asema muuttui ratkaisevasti. Millaisen kulttuuriperinnön he veivät eteenpäin? Millaisia erilaisia vahvuuksia ja lahjakkuuksia Sibeliuksen perheen sisällä oli?

          Naisten historiaan sekä kirjoittamisen kulttuurihistoriaan erikoistunut yliopistonlehtori, dosentti Maarit Leskelä-Kärjen uutuuskirja kertoo historian unohtaman Krohnin tarinan. ”Pääskysen laulu ja hiljaiset surut” on kirja äideistä ja tyttäristä ja muistoista ja muistamisesta yli sadan vuoden ajalta.

          Minna Krohn (1841–1917) oli opettaja ja Helsingin ensimmäisen suomalaisen tyttökoulun johtaja, Julius Krohnin puoliso sekä kolmen lapsen äitipuoli ja kahden, Aino Kallaksen ja Aune Krohnin, äiti. 
          Pääskysen laulu ja hiljaiset surut avaa Krohnin elämää sekä äitien ja tytärten välisten suhteiden kulttuurihistoriaa. Millaisena kirjailijatyttäret näkivät äitinsä? Millaisia elämänohjeita hän antoi lapsilleen? 

          Toisen elämästä kirjoittaminen on aina myös oman elämän reflektointia, Leskelä-Kärki on todennut. Millä tavalla tietokirjailijat ovat tuoneet näihin uusiin kirjoihin myös oman äänensä? 

          Ohjelman vieraina ovat taidehistorioitsija Johanna Lindfors ja kirjallisuustieteilijä Maarit Leskelä-Kärki.

          Ohjelman juontaa Pia-Maria Lehtola. Rentoa puhetta, kiinnostavimmat vieraat ja kulttuurin ajankohtaisaiheet debatoitavina. Suorana maanantaista perjantaihin.
