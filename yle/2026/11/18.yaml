      - title: 'Aitiovieras: Katu- ja muraalitaiteilja Maikki Rantala ja katutaiteen värikäs vaikutus'
        start_time: '2026-11-18T13:35:00+02:00'
        end_time: '2026-11-18T14:00:00+02:00'
        description: |-
          Muraalit ja katutaide ovat yleistyneet suomalaisissa kaupungeissa – tänä syksynä uusista teoksista on uutisoitu Vaasassa, Espoossa ja Imatralla. Katu- ja muraalitaiteilija Maikki Rantala keskustelee Jarmo Laitanevan haastattelussa siitä, miten julkinen taide voi ehkäistä segregaatiota, vahvistaa alueen imagoa ja lisätä kaupunkilaisten viihtyvyyttä.
