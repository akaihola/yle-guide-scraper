        end_time: '2026-11-18T10:50:00+02:00'
        description: |
          Maskuliinisuuden ja miehuuden mallit yhdessä yhteiskunnallisten ja kulttuuristen muutosten kanssa voivat vaikuttaa eri tilanteissa kasvaviin poikiin monin eri tavoin.  
          Millaisia odotuksia ja normeja erilaisiin maskuliinisuuksiin liittyy? 
          Toimittaja Satu Kivelä etsii vastauksia yhdessä tutkija Harry Lunabban ja Helsingin Poikien Talon perustoiminnan vastaavan ohjaajan Kimmo Saastamoisen kanssa.  
