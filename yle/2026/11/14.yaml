        start_time: '2026-11-14T16:07:00+02:00'
        end_time: '2026-11-14T16:59:59+02:00'
        description: |-
          Salieri: Alkusoitto oopp. L'Angiolina, ossia il matrimonio per sussurro (Mannheimin Mozart-ork./Thomas Fey). 

          Tubin: Vana valss (Vanha valssi) teoks. Süit eesti tantsuviisidest (Sarja virolaisista kansantansseista) (Arvo Leibur, viulu, ja Vardo Rumessen, piano).

          Sibelius: Under strandens granar (Alla rannan kuusien) (Anne Sofie von Otter, mezzosopraano, ja RSO/Hannu Lintu).

          R. Wieniawski: Tango (Vilde Frang, viulu, ja Jose Gallardo, piano).

          Brahms: Intermezzo Es-duuri (Leipzigin Gewandhaus-ork./Riccardo Chailly). 

          Bonis: Pastorale teoks. Suite en trio (Trio Empreinte).

          Rossini: Don Basilion juoruaaria "La calunnia è un venticello" oopp. Il barbiere di Siviglia (Sevillan parturi) (Kim Borg, basso, ja Münchenin filharmonikot/Arthur Rother).

          Carreño: Pieni valssi (Alexandra Oehler, piano).

          Rani: La luce (Mari Samuelsen, viulu, Dobrawa Czocher, sello, Hania Rani, piano, ja Scoring Berlin/Jonathan Stockhammer).

          Kansansäv.: The Skye Boat Song (Apollo5).

          Clyne: Masquerade (Naamiaiset) (BBC:n SO/Marin Alsop).

          Konsertin on toimittanut Annina Aho.
