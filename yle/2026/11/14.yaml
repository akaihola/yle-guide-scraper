      - title: 'Uusiutuva tiede: Ilmailun historiaa. Miksi lentokone lentää?'
        start_time: '2026-11-14T10:25:00+02:00'
        end_time: '2026-11-14T10:55:00+02:00'
        description: |-
          Ihmiset ovat haaveilleet lentämisestä aina, ja ovat sitä myös yrittäneet mitä erikoisimmin keinoin. Eivätkä Wrightin veljekset olleet ensimmäisiä, jotka pääsivät ilmaan. Minkälaisia lentoyrityksiä ja millaista ilmailua historiassa on harrastettu? Onko Leonardo Da Vincin 1400-luvulla kehittelemillä lentolaitteilla aeronauttista arvoa? Kuinka hurja kehitys lentokoneissa koettiin 1900-luvun ensimmäisinä vuosikymmeninä?

          Onko pitkäaikainen koulukuntien sota jo ratkennut siitä, miten ja miksi lentokone kykenee lentämään?

          Ilmailun ensimetreistä kertoo tekniikan historian tutkija Panu Nykänen. Toimittajana Samppa Korhonen.
