      - title: 'Maailma tarinoina: Rikhard III - miten shakespearilainen tutkielma vallasta osuu aikaamme?'
        start_time: '2026-11-14T12:05:00+02:00'
        end_time: '2026-11-14T13:00:00+02:00'
        description: |-
          Shakespeare ei ole puolueellinen hahmojensa suhteen, ja siksi ne kestävät aikaa ja uusia lähestymistapoja. Rikhard III on hahmona karismaattinen manipulaattori, joka viettelee lukija-katsojaa liittolaisekseen. Nimihenkilön raaoin ottein saavutettu valta eristää hänet muusta maailmasta, ja entiset liittolaiset muuttuvat uhreiksi, kun he eivät enää palvele hänen tarkoitusperiään. Millaisia yhteyksiä häikäilemättömällä Rikhard III:lla on aikamme hahmoihin vallan kahvassa ja millaisia yhteyksiä nimihenkilön puheenvuorot luovat nykypäivän  populistiseen retoriikkaan?

          Näyttelijä-ohjaaja Jussi Nikkilä ja Shakespeare-tutkija Nely Keinänen avaavat monisäikeisesti näytelmän maailmaa ja sen ajattomuutta Marja Vehkasen vieraina.

          Ohjelma on uusinta elokuulta 2026.
