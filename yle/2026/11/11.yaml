        description: |-
          Kenraali Moussa Traoren valtakausi Malissa kesti 23 vuotta. Hän otti paikkansa historiankirjoissa sotilasvallankaappauksella vuonna 1968. Traoren johtama ”Vapautuksen sotilaskomitea” heitti edellisen presidentin marxilaiset visiot romukoppaan ja nousi siten lännen suosioon. Toimittaja Raimo Tyykiluodon kanssa keskustelemassa kirjailija ja filosofi Leif Sundström.
          (Ohjelma on vuodelta 2021 ja se on kuunneltavissa 12 diktaattoria -sarjassa Yle Areenassa.)
