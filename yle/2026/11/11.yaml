      - title: 'Konsertteja: Unohdetut säveltäjänaiset esiin!'
        start_time: '2026-11-11T19:02:00+02:00'
        end_time: '2026-11-11T21:00:00+02:00'
        description: |
          Yhtä heistä kiusattiin soittamalla kotiin häirikköpuheluita. Toinen vetäytyi etsimään rajatiedosta turvaa ja tilaa olla oma itsensä. Kolmas muutti pois Suomesta henkisesti väljempään Keski-Eurooppaan, ja neljäs sävelsi kasapäin teoksia, joista ei koskaan saanut mitään maksua. He olivat kaikki lahjakkaita säveltäjiä, joita syrjittiin ja jotka siivottiin historiankirjoituksessa näkymättömiin.

          Ylen järjestämässä konsertissa unohdetut suomalaiset säveltäjänaiset pääsevät esiin. Somnium Ensemble ja Akademiska Damkören Lyran esittävät arkistoista pengottua kuoromusiikkia, jota ei ole kuultu vuosikymmeniin. Kuorot äänittävät konsertin teokset syksyn aikana myös Ylen kantanauhoille kaikkien kuultavaksi. Äänitys on suunniteltu yhteistyössä Sävelten tyttäret -tutkimushankkeen kanssa.

          Haastateltavina ovat Sävelten tyttäret -hankkeessa säveltäjänaisia esiin tuoneet professori Susanna Välimäki ja dosentti Nuppu Koivisto-Kaasik sekä kuoromusiikin historiankirjoitusta tutkinut musiikin tohtori Sakari Ylivuori. Suoran lähetyksen Helsingin Paavalinkirkosta toimittaa toimittaa Noora Hirn.  
