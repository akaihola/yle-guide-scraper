      - title: 'Aitiovieras: Valotaiteilija Immanuel Pax: "Pidän siitä, miten pimeydessä mielikuvitus lähtee juoksemaan"'
        start_time: '2026-11-11T13:35:00+02:00'
        end_time: '2026-11-11T14:00:00+02:00'
        description: |2-
           Pimeä vuodenaika luo hyvät puitteet valotaiteelle, ja Suomessa järjestettävät valotaidetapahtumat ovat yhä suositumpia. Ne ovat usein maksuttomia ja matalan kynnyksen yhteisiä elämyksiä. Valotaiteilija Immanuel Pax, Suomen valotaiteen seuran puheenjohtaja, pyrkii taiteellaan herättämään ajatuksia ja kritisoi kaupunkien haja- ja roskavaloa toivoen harkitumpaa valon käyttöä. Pax uskoo valotaiteen suosion johtuvan ikiaikaisesta tarpeestamme kokea elämyksiä yhdessä. Kati Turtola vieraili valotaiteilijan työhuoneella.
