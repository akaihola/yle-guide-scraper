          Debussy: Clair de lune (John Williams ja Julian Bream, kitara).

          Poulenc: Allegro con fuoco sonaatista klarinetille ja pianolle (Martin Fröst ja Roland Pöntinen).

          Dvorák: Legenda n:o 3 g-molli (Pohjoismainen kamariork./Christian Lindberg).

          Mysliveček: Argenen aaria "Che non mi disse un di!" oopp. L'Olimpiade (Olympian kisat) (Magdalena Kozená, mezzosopraano, ja Prahan kamarifilharmonia/Michel Swierczewski).

          Sarasate: Jota aragonesa op.27 (Julia Fischer, viulu, ja Milana Tshernjavskaja, piano).

          Warlock: Pavane teoks. Capriol suite (Guildhall String Ensemble/Robert Salter).

          Schubert: Du bist die Ruh (Dietrich Fischer-Dieskau, baritoni, ja Gerald Moore, piano). 


          Konsertin on laatinut Ainomaija Pennanen.
