          Mozart: Papagenon aaria oopp. Taikahuilu (Simon Keenlyside, baritoni, ja Münchenin radio-ork./Ulf Schirmer).

          Tailleferre: Fandango kahdelle pianolle (Mark Clinton ja Nicole Narboni). 

