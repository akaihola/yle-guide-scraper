      - title: 'Kulttuuriykkönen: Kerro Kaikille-elokuva tuo Seilin saaren vankimielisairaalan naiset nykyaikaan'
        start_time: '2026-11-11T15:00:00+02:00'
        end_time: '2026-11-11T15:58:00+02:00'
        description: |-
          Kerro Kaikille on draamaelokuva jonka Alli Haapasalo on ohjannut Katja Kallion käsikirjoituksen pohjalta. Kallio kirjoitti vuonna 2017 romaanin Yön kantaja, jonka keskiössä on Seilin saaren vankilamielisairaalaan joutunut Amanda Aaltonen. Tämän elokuvan myötä Seilin naisten historia on tavoittanut uusia yleisöjä. 

          Jutta Ahlbeck aloitti Seilin mielisairaalaan suljettujen naisten tutkimisen 1990-luvun lopulla. Pro gradu -tutkielma valmistui vuonna 1998, ja tutkimustyö huipentui vuonna 2006 julkaistuun sosiologian väitöskirjaan Diagnostisering och disciplinering: Medicinsk diskurs och kvinnligt vansinne på Själö hospital 1889–1944. Jutta Ahlbeck tutki siinä muun muassa Amanda Aaltosen elämäntarinaa. 

          Millaiset olivat naispotilaiden olosuhteet saarella? Miten naisten ja miesten mielenterveyttä tutkittiin tuolloin? Millaisia erilaisia hoitokeinoja käytettiin? 

          Amanda Aaltosen kohtalo vapautta etsivänä persoonana on nyt nostettu valokeilaan. Mikä hänen kohtalossaan herätti Katja Kallion mielenkiinnon? Mistä elokuvan suosio kertoo? Kerro kaikille-elokuvan sanoma on tuo tuska ja kärsimys ulos itsestäsi. Kerro kaikille omasta kokemuksestasi ja näin uudet sukupolvet saavat voimaa omaan elämäänsä. 

          Ohjelman vieraina ovat Kerro kaikille-elokuvan käsikirjoittaja Katja Kallio, Iso-Greetaa, Seilin saaren vankilamielisairaalan johtajahoitajaa näyttelevä Krista Kosonen ja Seilin naisten historiaa tutkinut Jutta Ahlbeck.  

          Ohjelman juontaa Pia-Maria Lehtola.


          Rentoa puhetta, kiinnostavimmat vieraat ja kulttuurin ajankohtaisaiheet debatoitavina. Suorana maanantaista perjantaihin.
