        description: |-
          Roger Talermo toi freestylehiihdon Suomeen. Amer Sportsin toimitusjohtajuuden lisäksi hän toimi Olympiakomitean puheenjohtajana. Haastateltavana on tietokirjailija ja toimittaja Jouko Vuolle, joka on kirjoittanut Talermon elämäkerran.
