      - title: Sininen Tonava, osa1/2
        start_time: '2026-11-21T15:00:00+02:00'
        end_time: '2026-11-21T15:25:00+02:00'
        description: |-
          Osa 1/2. Sodanjälkeiseen Wieniin sijoittuvassa jännityskuunnelmassa päivystävä konstaapeli löytää miehen ruumiin korjauksen alla olevalta sillalta.

          Kirjoittanut Rai Silvennoinen. 
          Ohjaus: Eero Leväluoma.
          Päärooleissa:
          Kemisti Binck - Esko Mannermaa. 
          Professori Denckmann - Reino Valkama. 
          Poliisipäällikkö Grindell - Matti Aulos. 
          Partioiva poliisi - Pentti Irjala. 
          Rikosoikeuden professori, dosentti Deier - Keijo Komppa. 
          Taskuvaras Schleicher - Kauko Kokkonen. 
          Teos vuodelta 1956.
