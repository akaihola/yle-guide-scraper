      - title: 'Maailma tarinoina: Rikkaat ruudulla – Succession ja eriarvoisuuden aikakausi'
        start_time: '2026-11-21T12:05:00+02:00'
        end_time: '2026-11-21T13:00:00+02:00'
        description: |-
          Nykytelevisio vilisee äveriäitä, hävyttömiä ja onnettomia hahmoja. HBO:n Succession-perintödraaman keskiössä on Royn perhe, joka omistaa maailmanlaajuisen media- ja viihdekonserni Waystar Roycon. Royn perheen valtapeli heijastelee häiritsevän tarkasti Trumpin Amerikkaa. Miksi eliitin kuvaus kiinnostaa keskellä kärjistyvää taloudellista ja sosiaalista eriarvoisuutta? Millaisia vaikutuksia sarjan taiteellisella monitulkintaisuudella ja rikkaiden kuvaamisella hävyttöminä voi olla? 

          Marja Vehkasen kanssa aiheen äärelle asettuvat sosiologian apulaisprofessori Hanna Kuusela ja kertomuksentutkija, dosentti Elise Kraatila.
