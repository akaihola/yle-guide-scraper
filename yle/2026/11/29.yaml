        start_time: '2026-11-29T10:00:00+02:00'
        end_time: '2026-11-29T10:59:20+02:00'
        description: |-
          Jumalanpalvelus Kärkölän kirkosta Hollolasta.

          Liturgina ja saarnaajana kappalainen Heikki Maakorpi. Avustavana pappina Lillimari Lehmioja. Kanttorina Kirsi Skantz-Viljakainen, urkureina Kirsi Skanz-Viljakainen ja Olivia Viljakainen (kuoron säestykset). Tekstinlukijoina Mirja Rautanen ja Juhani Jokinen. 

          Kuorot: Kärkölän kirkkokuoro, lapsikuoro ja Ainolan laulajat (joht. Kirsi Skantz-Viljakainen).

          Muut muusikot: Svante Arvedson, sinkki, Arja Sillervo, triangeli
