        end_time: '2026-11-03T13:00:00+02:00'
        description: |
          Pasi Heikura selvittää mitä muinaisilta arjalaisilta periytyviä lainasanoja suomen kielessä on. Ohjelmassa selviää myös, voiko sairastuminen päättää kaiken kuin veitsellä leikaten seinään, sekä millaista on kun eletään kuin siat säkissä?
          Ohjelman ovat toimittaneet Pasi Heikura ja Tina Cavén.
