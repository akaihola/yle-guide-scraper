          Ohjelman ovat toimittaneet Pasi Heikura ja Tina Cavén.
      - title: 'Politiikkaradio: Mikä ratkaisee USA:n välivaalit?'
        start_time: '2026-11-03T13:00:00+02:00'
        end_time: '2026-11-03T13:30:00+02:00'
        description: |-
          Demokraatit kulkevat kohti voittoa ja republikaanit kohti historiallista tappiota, jos kyselyt pitävät kutinsa. 
          Missä ja mihin Yhdysvaltain välivaalit ratkeavat? Tuleeko Donald Trumpin itsevaltaisille otteille loppu?
          Aiheesta keskustelevat Pohjois-Amerikan tutkimuksen professori Benita Heiskanen ja Yhdysvaltain tutkimuksen professori Mikko Saikku. Toimittajana on Antti Pilke. Suora lähetys.
