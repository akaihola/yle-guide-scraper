      - title: 'Aitiovieras: Harmonikkavirtuoosi Viivi Maria Saarenkylä yhdistää musiikissaan Etelä-Amerikan rytmit ja pohjoisen melankolian'
        start_time: '2026-11-03T13:35:00+02:00'
        end_time: '2026-11-03T14:00:00+02:00'
        description: |2-
           Viivi Maria Saarenkylä on palkittu harmonikkataiteilija, säveltäjä ja esiintyjä, jonka ura lähti hurjaan nousuun Kultainen Harmonikka -kilpailun voiton myötä. Viime vuodet Saaarenkylä on kiertänyt  maailmaa konsertoiden tunnusteltuilla kansanmusiikin ja maailmanmusiikin festivaaleilla, konserttisaleissa, ja mediassa. Hänen musiikkiaan ja esiintymistään kuvataan virtuoosimaiseksi ja häntä pidetään yhtenä nykyajan harmonikkamusiikin uudistajana. Miia Lahti haastattelee.
      - title: 'Musiikkiaitio: Trois petits points'
        start_time: '2026-11-03T14:00:00+02:00'
        end_time: '2026-11-03T15:00:00+02:00'
        description: |+
          Miia Lahti juontajana. Lähde mukaan musiikin maailmankiertueelle. Näyttelijä Esko Roine paljastaa toimittaja Sari Valtolle mieleensä erityisesti jääneitä kulttuurikokemuksia.


