        description: |2-
           Viivi Maria Saarenkylä on palkittu harmonikkataiteilija, säveltäjä ja esiintyjä, jonka ura lähti hurjaan nousuun Kultainen Harmonikka -kilpailun voiton myötä. Viime vuodet Saaarenkylä on kiertänyt  maailmaa konsertoiden tunnusteltuilla kansanmusiikin ja maailmanmusiikin festivaaleilla, konserttisaleissa, ja mediassa. Hänen musiikkiaan ja esiintymistään kuvataan virtuoosimaiseksi ja häntä pidetään yhtenä nykyajan harmonikkamusiikin uudistajana. Miia Lahti haastattelee.
