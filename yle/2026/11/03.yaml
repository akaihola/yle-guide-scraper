      - title: 'Kulttuuriykkönen: Romantasia yhdistää rakkauden, seikkailun ja taikuuden'
        start_time: '2026-11-03T15:00:00+02:00'
        end_time: '2026-11-03T15:58:00+02:00'
        description: |
          Romantasia on kirjamaailman kuumin ilmiö tällä hetkellä. Se yhdistää fantasiamaailmat, myyttiset olennot ja suuret seikkailut romanttiseen rakkaustarinaan. Usein kirjat kertovat intohimoisista tunteista, vaarallisista valinnoista ja ihmeellisistä taikamaailmoista. Tarinoita höystetään usein seksillä.
          Romantasian suosiota ovat vauhdittaneet erityisesti sosiaalisen median yhteisöt.  Millaista on romantasiakirjallisuus meillä ja maailmalla? Ketkä lukevat romantasiaa ja miksi? 
          Näistä kysymyksistä keskustelevat kirjailijat Siri Kolu ja S.K. Rostedt, Tammen kustannuspäällikkö Laura Kurki ja booktokkaaja Iida Kalanti. Lähetyksen toimittaa Miia Gustafsson.
