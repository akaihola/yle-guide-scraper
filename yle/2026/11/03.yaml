      - title: 'Uusiutuva tiede: Neandertal antoi nikotiinikoukun'
        start_time: '2026-11-03T12:05:00+02:00'
        end_time: '2026-11-03T12:35:00+02:00'
        description: |-
          Vasta vuonna 2010 selvisi ja varmistui, että nykyihminen on risteytynyt mm. neandertalinihmisen kanssa, eli meillä on ollut geenienvaihtoa. Mitä hyviä ja huonoja ominaisuuksia saimme serkuiltamme? Miksi toisaalta neandertal ja kaikki muutkin ihmislajit katosivat?

          Miten homo sapiens on ylipäätään kehittynyt? Kuinka ihmisen kehityshistoriaa tutkitaan?

          Haastateltavana arkeologi ja apulaisprofessori Miikka Tallavaara Helsingin yliopistosta.

          Toimittajana Samppa Korhonen.
