      - title: 'Konsertti: Auringon korkea nousu – suomalaista kuoromusiikkia'
        start_time: '2026-11-20T19:02:00+02:00'
        end_time: '2026-11-20T21:00:00+02:00'
        description: |-
          Sibelius-Akatemian Kuopion yksikön kamarikuoron konsertissa kuullaan laaja kattaus suomalaista kuoromusiikkia tunnetuista klassikoista nykymusiikkiin.

          Konsertissa kuullaan muun muassa Jean Sibeliuksen ja Toivo Kuulan rakastettuja klassikkosävelmiä, harvemmin kuultua kansallisromanttista ohjelmistoa Greta Dahlströmin ja Armas Maasalon kynästä sekä uudempaa kuoromusiikkia, jota edustavat muun muassa Einojuhani Rautavaaran Halavan himmeän alla, joka on vaikuttava kolmiosainen sarja Aleksis Kiven runoihin, sekä Anna-Mari Kähärän Mika Waltarin runoon säveltämä Aurinkolaulu. Konsertin johtaa kuoronjohdon lehtori Saara Aittakumpu.

          17.11.2026 Kuopion Musiikkikeskuksessa tallennetun konsertin toimittaa Ainomaija Pennanen.

          Kuva: Katariina Ylimäki
