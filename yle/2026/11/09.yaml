      - title: 'Väkivallan markkinat K3J4: Innovaationa itsemurhaisku'
        start_time: '2026-11-09T19:02:00+02:00'
        end_time: '2026-11-09T19:50:00+02:00'
        description: |
          Osama bin Laden johtaa Al-Qaidaa kuin suuryritystä: laajentaa, innovoi, tekee ahkeraa brändäystä ja terroristista tuotekehittelyä. Pienestä fundamentalistiporukasta muodostuu maailmanlaajuinen franchising-verkosto, jonka viholliseksi valikoituu ahne ja paheellinen Yhdysvallat. Terrorismi on äärimmäistä ja tarkkuutta vaativaa viestintää ja mediahuomion kalastusta, mutta miten huomiota hallitaan? Entä kuka keksi itsemurhaiskut?

          Jakson haastateltavat: Leena Malkki, Helsingin yliopiston terrorismin tutkija, Olli Ruohomäki, Ulkopoliittisen instituutin vieraileva johtava asiantuntija, Marko Juntunen, Lähi-idän ja islamin tutkimuksen dosentti Helsingin yliopistosta.

          Lähteitä:
          Osama bin Ladenin nousu ja tuho, Peter Bergen, Perheenisä Osama bin Laden: vaimon ja pojan silmin, Jean Sasson, Omar bin Laden, Najwa bin Laden, Terror in the mind of God – The global rise of religious terrorism, Mark Juergensmeyer.
      - title: 'Suuri juomapodi J5: Viini – mestarillisesti brändätty maataloustuote'
        start_time: '2026-11-09T20:10:00+02:00'
        end_time: '2026-11-09T20:55:00+02:00'
        description: |
          Viiniä ei Suomessa vain osteta kaupasta, sillä ennen hyllylle pääsyä pullon on läpäistävä poikkeuksellinen valintaprosessi. Viinien maahantuonnin parissa työskentelevä Henriikka Ström kertoo, miten viini pääsee Alkoon.

          Tietokirjailija ja viiniharrastaja Saku Tuominen pohtii, kuinka paljon viinistä pitää ymmärtää voidakseen nauttia siitä. Lisäksi sokkotestataan, erottaako samppanjan kuohuviinistä tai crémantista, ja selvitetään, onko kahdeksanprosenttinen viini enää oikeastaan viiniä. Miksi viinien yhteydessä ei puhuta markkinoinnista vaan rinteistä ja maaperästä, vaikka viinien joukosta löytyy kenties maailman onnistunein brändäys?
