      - title: 'Elävä historia: Tähtitaivaan kaksi tarinaa – kuinka tähtitiede ja ennustukset kulkivat historiassa käsi kädessä'
        start_time: '2026-11-15T12:05:00+02:00'
        end_time: '2026-11-15T12:55:00+02:00'
        description: |-
          Tähtitiede eli astronomia ja tähtitaivaan liikkeistä kohtaloita ennustanut astrologia kulkivat vuosituhansia käsi kädessä. Tieteellinen maailmankuva alkoi 1500-luvulta alkaen vähitellen saada yliotteen tähtien ennusmerkeistä, mutta astronomia ja astrologia elivät pitkään rinnakkain. Jopa modernin tähtitieteen suuret uranuurtajat harjoittivat astrologiaa.

          Elävän historian asiantuntijoina ovat tietokirjailija Markus Hotakainen ja tieteenhistorioitsija Johan Stén. 
          Toimittaja: Ville Talola. 
          Äänisuunnittelu: Juha Sarkkinen.
