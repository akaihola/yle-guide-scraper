      - title: 'Aitiovieras: Ohjaaja Paavo Westerberg: Tarinoiden kautta ihmisen ytimeen'
        start_time: '2026-11-02T13:35:00+02:00'
        end_time: '2026-11-02T14:00:00+02:00'
        description: |2-
           Käsikirjoittaja, näytelmäkirjailija, ohjaaja ja näyttelijä Paavo Westerberg on tuottelias taiteilija, jonka ura alkoi jo 7-vuotiaana. Hän vannoo tarinoiden voimaan. Mikä on muuttunut Westerbergin ajatusmaailmassa kymmenien käsikirjoitusten ja ohjausten myötä? Miksi Westerbergiä kiinnostaa yhä uudelleen perheen dynamiikka? Mitä Westerberg ajattelee taiteen ja kulttuurin asemasta Suomessa juuri nyt? Vasta ilmestyneessä omaelämäkerrassaan Westerberg läpi elämäänsä lapsitähteydestä taiteilijaksi. Jarmo Laitaneva haastattelee.
