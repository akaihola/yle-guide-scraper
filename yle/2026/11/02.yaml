      - title: 'Virtasen taloushistoria: Hyvä, paha valtionvelka'
        start_time: '2026-11-02T10:00:00+02:00'
        end_time: '2026-11-02T10:55:00+02:00'
        description: |+
          Suomen valtio on ottanut  velkaa moniin investointeihin kuten rautateiden rakentamiseen. Välillä on kuitenkin jouduttu kustantamaan kulutustakin lainarahalla. Sotien jälkeen ensimmäinen kahvilasti rahoitettiin Brasiliasta otetulla lainalla. Suomella on ollut hyvä maine velkojen maksajana, ja hyvä maine on taannut kohtuullisen korkotason. Juha Virtasen kanssa keskustelevat taloushistorian professori emeritus Sakari Heikkinen ja valtiotieteiden tohtori Mika Arola. Ohjelma on uusinta lokakuulta 2025.

