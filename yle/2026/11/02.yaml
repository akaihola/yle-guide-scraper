      - title: 'Kulttuuriykkönen: Minä ja Riikka Purra-dokumentti kysyy, miksi poliittista vastustajaa on niin vaikea ymmärtää?'
        start_time: '2026-11-02T15:00:00+02:00'
        end_time: '2026-11-02T15:58:00+02:00'
        description: |
          Toimittaja Liisa Akimof seurasi valtiovarainministeri Riikka Purraa ja perussuomalaisten toimintaa puolen vuoden ajan. Tuloksena syntyi 30. lokakuuta ensi-iltansa saanut dokumenttielokuva Minä ja Riikka Purra. Akimof kertoi lähteneensä tekemään elokuvaa uteliaisuudesta: hän halusi ymmärtää ihmisiä, joiden poliittinen ajattelu oli hänelle vierasta, ja vähentää yhteiskunnallista vastakkainasettelua.
          Miksi poliittinen keskustelu Suomessa kärjistyy niin helposti henkilökohtaiseksi? Miksi asioista riitelemisen sijaan riidellään ihmisistä? Mistä syntyy taipumus tulkita toisten sanomisia pahimman kautta, ja onko poliittista vastustajaa mahdollista oppia ymmärtämään ilman, että hänen kanssaan tarvitsee olla samaa mieltä?
          Keskustelemassa olivat Liisa Akimof, politiikan tutkija Johanna Vuorelma sekä politiikan toimittaja ja tietokirjailija Lauri Nurmi.
          Toimittajana on Ville Talola.
