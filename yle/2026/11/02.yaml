      - title: 'Väkivallan markkinat K3J3: Palkka-armeijan johtaja asiakkaita vailla'
        start_time: '2026-11-02T19:02:00+02:00'
        end_time: '2026-11-02T19:50:00+02:00'
        description: |
          Osama bin Ladenista tuli terrorismin kansikuvapoika, mutta ennen sitä hän oli liiketalouden opiskelija, rakennusalan yrittäjä ja palkka-armeijan perustaja. Al-Qaidan ensimmäinen versio syntyi Afganistanin vuoristossa, mutta miten ja mistä radikaali-islamistinen terrorismi ylipäätään alkoi? Miksi vaikutusvaltaisen ja ökyrikkaan suvun vesa innostui suoltamaan miljoonansa väkivaltaisen jihadin toteuttamiseen? 

          Jakson haastateltavat: Leena Malkki, Helsingin yliopiston terrorismin tutkija, Olli Ruohomäki, Ulkopoliittisen instituutin vieraileva johtava asiantuntija, Marko Juntunen, Lähi-idän ja islamin tutkimuksen dosentti Helsingin yliopistosta.

          Lähteitä:
          Osama bin Ladenin nousu ja tuho, Peter Bergen, Perheenisä Osama bin Laden: vaimon ja pojan silmin, Jean Sasson, Omar bin Laden, Najwa bin Laden, Terror in the mind of God – The global rise of religious terrorism, Mark Juergensmeyer, Martyrdom and Terrorism: Pre-Modern to Contemporary Perspectives, Alex Houen, Dominic Janes.
      - title: 'Suuri juomapodi J4: Vesi, eli kuinka yksinkertaisesta tehtiin monimutkaista'
        start_time: '2026-11-02T20:10:00+02:00'
        end_time: '2026-11-02T20:55:00+02:00'
        description: |
          Veden pitäisi olla maailman yksinkertaisin juoma, mutta kaupan hyllyllä siitäkin on tehty jotakin enemmän. On vitamiinivettä, hyvinvointivettä, luksuslähdevettä ja vettä, jonka luvataan auttavan rauhoittumaan. 

          Hartwallin alkoholittomien juomien kategorin markkinointijohtaja Tiia Seppälä kertoo, miten vedestä rakennetaan tuote ja brändi. Vesisommelier Mariia Gustafsson opettaa maistamaan vettä kuin ammattilainen ja Janne Saarikivi opettaa ymmärtämään vettä kuin kielitieteilijä.
