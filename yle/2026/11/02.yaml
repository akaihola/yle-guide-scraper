        end_time: '2026-11-02T12:55:00+02:00'
        description: |-
          Kaikki kallot eivät olleetkaan sitä, mitä kuviteltiin! Viimeisessä jaksossa Suomeen palautetuista kalloista saadaan mullistavia uutisia ja kuullaan, mitä geenitestit kertovat muumioituneen "Huolestuneen Rouvan" elämästä ja perheestä.
