        start_time: '2026-11-02T17:35:00+02:00'
        end_time: '2026-11-02T18:35:00+02:00'
        description: |-
          Millaisia hienoja uutuuslevyjä on ilmestynyt viime aikoina Pohjolasta? Ei ainoastaan Pohjoismaista, vaan myös Pohjanmeren rannoilta Britanniasta, Irlannista, Belgiasta ja Alankomaista sekä pakkasukon läntisemmästä kotimaasta Kanadasta. Entä missä pikkukaupungissa sijaitsee Pohjolan musiikillinen Persia? Toimittajana Mika Kauhanen.
