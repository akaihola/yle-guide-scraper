      - title: 'Romano mirits: Teresa Koivisto-Bolström – rohkeasti kohti omia unelmia'
        start_time: '2026-11-01T23:24:38+02:00'
        end_time: '2026-11-01T23:39:06+02:00'
        description: |-
          Tämänkertaisessa Romano Mirits -ohjelmassa vieraana on 34-vuotias nuoriso- ja vapaa-ajanohjaaja Teresa Koivisto-Bollström. Haastattelussa Teresa kertoo elämästään, työstään ja siitä, kuinka tärkeää on uskoa omiin kykyihinsä myös vastoinkäymisten keskellä.
          Pohjanmaalla varttunut Teresa on kohdannut matkansa varrella ennakkoluuloja, mutta periksi antamisen sijaan hän päätti näyttää, että kovalla työllä ja määrätietoisuudella voi saavuttaa tavoitteensa. Nykyisin hän toimii aktiivisesti Nurmijärvellä paikallisen
          romanityön parissa ja puheenjohtajana yhdistyksessä, joka tukee alueen romaneita, nuoria ja perheitä. Luvassa on lämmin ja inspiroiva keskustelu sitkeydestä, yhteisöllisyydestä ja uskosta
          tulevaisuuteen. Toimittajana Dimitri Grönfors
