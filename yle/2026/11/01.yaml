      - title: 'Aitiovieras:  Näyttelijä Karim Rapatti - porukan hauskuuttajasta tuli totisten miesten esittäjä'
        start_time: '2026-11-01T21:22:22+02:00'
        end_time: '2026-11-01T21:46:36+02:00'
        description: |2-
           Näyttelijä Karim Rapatin kasvot ovat tulleet tutuiksi varsinkin tv-sarjojen katsojille, vaikka on vasta tuore näyttelijä. Monesti Rapatin roolit ovat olleet karskien miesten rooleja. Rapatti on kertonut olleensa pienenä poikana porukan hauskuuttaja ja haluaisi tehdä myös komediaa.  Minkälaisia hahmoja nuori näyttelijä haluaisi tehdä? Tänä syksynä Karim Rapatti on osallistunut myös Erikoisjoukot- tositv-ohjelmaan, johon osallistujat joutuvat kovaan fyysiseen henkiseen rääkkiin, joka jäljittelee armeijan erikoisjoukkojen koulutusta. Kokeeko Rapatti olevansa erityisen lahjakas heittäytyjä? Entä minkälaisena tiimipelaajana hän näkee itsensä? Joni Timonen haastattelee.
