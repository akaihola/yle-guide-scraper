      - title: 'Kuunnelman tiet 6/13: Näkymätön näyttelijä'
        start_time: '2026-11-01T15:00:00+02:00'
        end_time: '2026-11-01T15:35:00+02:00'
        description: |
          Näkymätön  näyttelijä. 
          Pekka Kyrö kertoo radiokuunnelman kehitysvaiheista ja käännekohdista. Tekninen toteutus Ari Mursula. 
          Tässä osassa kerrotaan legendaarisista suomalaista radion näyttelijä-äänistä.
          Ohjelma on vuodelta 2009.
