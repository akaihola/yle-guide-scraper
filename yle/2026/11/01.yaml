      - title: Faunin iltapäivä
        start_time: '2026-11-01T16:07:00+02:00'
        end_time: '2026-11-01T16:59:59+02:00'
        description: |-
          Wirén: Preludium teoks. Serenadi op.11 (Tukholman Sinfonietta-ork./Esa-Pekka Salonen).

          Palmgren: November (Marraskuu, alastomia puita) (Izumi Tateno, piano). 

          Hahn: À Chloris (Chlorisille) (Susan Graham, mezzosopraano, ja Roger Vignoles, piano).

          Beethoven): Adagio serenadista D-duuri (Alexa Still, huilu, Robert Alemany, klarinetti, ja JoAnn Falletta, kitara).

          Kuula: Intermezzo op.16 (Keski-Pohjanmaan Kamariork./Juha Kangas).  

          Bizet: Nadirin ja Zurgan duetto "Au fond du temple saint" oopp. Les pêcheurs de perles (Helmenkalastajat) (Roberto Alagna, tenori, ja Bryn Terfel, bassobaritoni, sekä Metropolitan-oopperan ork./James Levine).

          Bruch: Romanssi alttoviululle ja orkesterille F-duuri (Gérard Caussé ja Lyonin oopperan ork./Kent Nagano).

          Melartin: Entrée avec pantomime bal. Sininen helmi (RSO/Hannu Lintu).

          Stanford: The blue bird (Sinilintu) (The Cambridge Singers/John Rutter).

          Godzinsky: Sininen valssi (Radion viihdeork./George de Godzinsky).

          Konsertin on laatinut Inari Tilli. 
