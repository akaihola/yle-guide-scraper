      - title: 'Elävä historia tutkii: Pälkäneen kallot 4/5 - Maantierosvo Anders Keinumäen erikoinen kohtalo'
        start_time: '2026-11-01T12:05:00+02:00'
        end_time: '2026-11-01T12:55:00+02:00'
        description: |
          Yksi sekoiluntäyteinen yö voi tuhota koko elämän - näin kävi maantierosvo Anders Keinumäelle. Muutamien Ruotsista palautettujen kallojen omistajien nimet tiedetään. He kuolivat aikanaan Viaporin rangaistusvankilassa. Toimittaja Kaisa Pulakka. Äänisuunnittelu: Jootanan Kotila.
