          Kansanlaulu (sov. Kodály): Esti dal (Iltalaulu) (Kamarikuoro Stemma/Rita Varonen).

          Palmgren: Menuetti kansantyyliin teoks. Kuvia Suomesta (Turun KO/Jacques Mercier).

          Rossini: La pastorella (Paimentyttö) (Cecilia Bartoli, mezzosopraano, ja Charles Spencer, piano).

          Haapalainen: Kaipaus sarj. Suomalaisia kansanlauluja (Keski-Pohjanmaan Kamariork./Juha Kangas).

          Reger: Albumblatt (Albuminlehti) Es-duuri (Eduard Brunner, klarinetti, ja Gerhard Oppitz, piano).

          W.A. Mozart: Leporellon luetteloaaria "Madamina, il catalogo è questo" oopp. Don Giovanni (Antti Suhonen, bassobaritoni, ja RSO/Alberto Hold-Garrido).

          Beethoven: Für Elise (The Canadian Brass).

          Rameau: Entrée de Polymnie oopp. Les Boréades (Boreadit) (Musiciens du Louvre/Marc Minkowski).

          Dvorak: Valssi jousikvartetille n:o 1 A-duuri (Lindsay-kvartetti). 

          Netzel: Danse hongroise (Unkarilainen tanssi) (Raphaela Gromes, sello, ja Julian Riem, piano).

          Konsertin on toimittanut Riikka Holopainen.
