      - title: 'Suuri juomapodi J8: Pyhä, valkoinen superjuoma'
        start_time: '2026-11-30T20:10:00+02:00'
        end_time: '2026-11-30T20:55:00+02:00'
        description: |
          Suomalainen juo maitoa tavalla, joka kummastuttaa suurta osaa maailmasta: kylmänä lasista ruoan kanssa – ja vieläpä aikuisena. Miten maidosta tehtiin kokonaisen kansakunnan ruokajuoma ja terveen elämän symboli?

          Tietokirjailija Tiina Sarja avaa suomalaisten intohimoista maitosuhdetta ja sen historiaa. Vaikka maidon haitoista on puhuttu jo vuosikymmeniä, miksi sen asema ei ole murentunut? Markkinoinnin asiantuntija Kari Tervonen avaa maidonkulutuksen muutoksia. Lopuksi tapahtuu jotain poikkeuksellista: Jani juo elämänsä ensimmäisen lasillisen maitoa.
