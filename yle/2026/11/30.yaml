      - title: Iltahartaus
        start_time: '2026-11-30T18:50:00+02:00'
        end_time: '2026-11-30T19:00:00+02:00'
        description: |-
          "Boas neuvottelee pellon lunastuksesta"
          Näyttelijä Krista Kosonen lukee Ruutin kirjasta VT2028-käännöksen mukaan. Tässä hartaudessa kuullaan Ruutin kirjan luku 4.

          Loppusyksyn raamatunluennassa kuullaan uusia Vanhan Testamentin käännöksiä Joonan, Ruutin ja Esterin kirjoista. 
      - title: Yle Uutiset ja sää
