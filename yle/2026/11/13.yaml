        description: |
          Perjantaistudiossa puidaan veropäivää, tieteen luotettavuutta ja kirjailijan oikeutta käyttää muiden tutkimuksia. Raatilaisilta kystään myös saavatko suomenruotsalaiset hahmot puhua elokuvissa suomea ja onko opettajilta kadonnut auktoriteetti. 
          Kulttuuriykkösen Perjantaistudio kokoaa vakioraatilaiset kirjailijan Virpi Hämeen-Anttilan sekä tietokirjailijat Katleena Kortesuon ja Ville Hännisen  ajankohtaisten kulttuurin ja median ilmiöiden ja arvokysymyksien äärelle. Lähetyksen juontaa Miia Gustafsson.
