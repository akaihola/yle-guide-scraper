        start_time: '2026-11-13T11:00:00+02:00'
        end_time: '2026-11-13T11:55:00+02:00'
        description: |
          Onneksi Carlo Bergonzista ei tullut isänsä tavoin juustontekijää. Vielä suurempi onni oli, että Bergonzi selvisi parin vuoden raastavasta sotavankeudesta hengissä. Ja onneksi laulaja ymmärsi vaihtaa baritonista tenoriksi. 
          Outi Paananen penkoo levyhyllyjä ja tutkailee taiteilijaelämää. (Ohjelma on vuodelta 2024.)
