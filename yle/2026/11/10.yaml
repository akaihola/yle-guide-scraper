      - title: 'Aitiovieras: Miksi romantasia kiehtoo lukijoita? S.K. Rostedt vieraana'
        start_time: '2026-11-10T13:35:00+02:00'
        end_time: '2026-11-10T14:00:00+02:00'
        description: |2-
           Ylen lukumaraton palaa ensi viikonvaihteessa uudella teoksella, kun ääneen luetaan S. K. Rostedtin romantasiateos Kahden veren tytär. S. K. eli Saara Rostedtin luoma Moorna-sarja on noussut ilmiöksi ja Kahden veren tytär on sarjan ensimmäinen teos. Mitä romantasialla tarkoitetaan? Miksi romantasia on nyt niin suosittua? Minkälainen on S.K. Rostedtin tie kirjailijaksi? Luenta alkaa perjantaina 13.11. ja jatkuu lauantaina 14.11., ja yhteensä suoraa lähetystä kertyy noin 15 tuntia. Tarinan päähenkilö Moorna etsii hyväksyntää ja joutuu salaliittojen ja omien voimiensa pyörteisiin, ja teos sijoittuu romantasian erotiikka-asteikolla maltilliseen päähän. Miia Lahti haastattelee.
