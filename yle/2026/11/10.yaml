          Chatman: Everyday I have the blues (Pepe Ahlqvist, laulu ja kitara sekä UMO/Matti Lappalainen).

          Hansen: Don litna biegga (Annasuolo).

          Stenbäck: Sügis Stockholmis (Freeta). 

          Carnavalesco, Fritz: Voltei amor (Trio Mocoto).

          Porter: What is this thing called love (Rebecca Ferguson).

          Legrand: Cinema, Le (Natalie Dessay).

