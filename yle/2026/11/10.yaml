        description: |-
          Wrubel: Zip-a-dee-doo-dah (Johnny Mercer ja The Pied Pipers sekä Paul Westonin orkesteri).
          Bergman (sov. Melakoski): Muisto (Hector).
          Huesca: Nochecita (Eydie Gormé).
          Farres: Sua vailla (Lasse Huurre).
          Olrog: Filosofisk dixieland (Alice Babs).
          Pintucci: I giorni dell'arcobaleno (Nicola Di Bari).
          Mayfield: Rainbow (Gene Chandler).
          Jaques: Annoin sulle sydämein (Eila Pellinen).
          Aznavour/Garvarentz: Le cabotin (Charles Aznavour).
          Lake/Jenney: Man with a horn (Anita O'Day).
          Spector/Greenwich/Powers: (Today I met) the boy I'm gonna marry (Darlene Love).
          Anderson/Ulvaeus/Andersson: Vai niin, vai niin, vai niin, vai niin, vai niin (Lea Laven).
          Fox: I got a name (Jim Croce).
          Menescal/Boscoli: Barquinho (Maysa).
          Waard: Tee kaikki tuo uudelleen (Pirkko Mannola).
          Taupin: Donner pour donner (Elton John ja France Gall).

          Konsertin on toimittanut Riikka Holopainen.
