        description: |2-
           Lahden Malva-museon Kellarigalleriassa on esillä näyttely "Komisario Palmun erehdys ja muita kotimaisia elokuvajulisteita". Näyttely esittelee alkuperäisiä elokuvajulisteita Malvan kokoelmasta, jotka kuvastavat eri vuosikymmenten visuaalisia tyylisuuntia, yleisön odotuksia ja tuotantoyhtiöiden linjauksia, ja julisteiden yhteyteen on liitetty katsojien lähettämiä elokuvatoiveiden sitaatteja. Näyttely liittyy Ylen 100-vuotisjuhlintaan ja se on yhteistyö Yle Teeman kanssa. Elokuvajulisteita ja julistetaiteen tilasta muutenkin keskustelemassa Malva-museon kokolema-amanuessi Hanna Suihko. Jarmo Laitaneva haastattelee.
