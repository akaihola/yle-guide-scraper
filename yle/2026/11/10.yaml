      - title: 'Aitiovieras: Miksi romantasia kiehtoo lukijoita? - kirjailija S.K. Rostedt vieraana'
        start_time: '2026-11-10T13:35:00+02:00'
        end_time: '2026-11-10T14:00:00+02:00'
        description: |-
          Mitä romantasialla tarkoitetaan? Miksi romantasia on nyt niin suosittua?  Ylen kolmannessa lukumaratonissa luetaan S. K. Rostedtin romantasiateos Kahden veren tytär. S. K. eli Saara Rostedtin luoma Moorna-sarja on noussut ilmiöksi ja Kahden veren tytär on sarjan ensimmäinen teos.Minkälainen on S.K. Rostedtin tie kirjailijaksi?Tarinan päähenkilö Moorna etsii hyväksyntää ja joutuu salaliittojen ja omien voimiensa pyörteisiin, ja teos sijoittuu romantasian erotiikka-asteikolla maltilliseen päähän. Tatu Tamminen haastattelee.
