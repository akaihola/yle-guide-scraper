      - title: 'Kulttuuriykkönen: Elisa-viihteen uutuussarja nostaa esiin hengellisen väkivallan teemoja'
        start_time: '2026-11-10T15:00:00+02:00'
        end_time: '2026-11-10T15:58:00+02:00'
        description: |
          Elisa Viihteen uutuussarja Taivaan kansalaiset kertoo pienen uskonnollisen lahkon vallankäytöstä ja nostaa esiin kysymyksen hengellisestä väkivallasta ja uskonnolla manipuloimisesta.
          Samalla sarja avaa laajemman kysymyksen: mikä tekee uskonnollisesta vakaumuksesta niin voimakkaan ihmisen toimintaa ohjaavan tekijän? Miksi uskonnollinen auktoriteetti voi saada ihmisestä niin vahvan otteen, että tämä luopuu jopa omasta itsemääräämisoikeudestaan? Uskonnollisen hyväksikäytön uhriksi voi joutua koulutuksesta ja yhteiskunnallisesta asemasta riippumatta. Kuinka yleisestä ilmiöstä on kyse, miten hengellisen väkivallan voi tunnistaa ja kuinka sitä voidaan torjua?
          Aiheesta keskustelevat Taivaan kansalaiset -sarjan vastaava tuottaja Jemina Jokisalo, kirjailija Tuire Malmstedt, Uskontojen uhrien tuki ry toiminnanjohtaja Joni Valkila sekä Kirkkohallituksen tutkimuskoordinaattori Jussi Sohlberg.
          Ohjelman toimittaa Ville Talola.
