        end_time: '2026-11-22T16:59:59+02:00'
        description: |-
          J.C. Bach: Alkusoitto n:o 3 D-duuri oopp. Artaserse (The Academy of Ancient Music/Christopher Hogwood).

          Benedict: The gypsy and the bird (Sumi Jo, sopraano, Elizabeth Mann, huilu, ja St. Luken ork./Richard Bonynge). 

          Graupner: Sarabande sarj. F-duuri (Petra Aminoff, traverso, Tindaro Capuano ja Asko Heiskanen, chalumeau, Krzysztof Stencel, barokkikäyrätorvi, sekä Suomalainen barokkiork./Sirkka-Liisa Kaakinen-Pilch, viola d'amore).

          Beach: A hermit thrush at eve (Erakkorastas illalla) (Hiroko Ishimoto, piano).

          Kuhlau: Menuetti näyt. Elverhöj (Keijukaiskumpu)  (Etelä-Jyllannin SO/Frans Rasmussen).

          L. Nielsen: Romanssi viululle ja orkesterille h-molli (Christina Åstrand ja Turun FO/Jukka Iisakkila).

          Söderman: Trollsjön (Lumottu järvi) (Peter Lindroos, tenori, ja Pertti Eerola, piano). 

          Kapsberger: Kapsberger kok. Libro quarto d'intavolatura di chitarrone (Matthew Wadsworth, teorbi).

          Peterson-Berger: Orientalisk dans (Itämainen tanssi) (Norrköpingin SO/Mihail Jurovski).

          Konsertin on laatinut Heikki Puskala.
