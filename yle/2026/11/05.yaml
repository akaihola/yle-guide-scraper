      - title: 'Aitiovieras: "Maija Kylkilahti: Miten hallinto ja musiikki kohtaavat orkesterin intendentinarjessa?"'
        start_time: '2026-11-05T13:35:00+02:00'
        end_time: '2026-11-05T14:00:00+02:00'
        description: |2-
           Maija Kylkilahti aloitti juuri Radion sinfoniaorkesterin intendenttinä. Kylkilahti on haastatteluissa kuvaillut uutta tehtäväänsa kunniatehtäväksi, johon hän tarttuu suurella innolla. Kylkilahdella on laaja kokemus suomalaisen orkesterikentän johtamistyöstä. Hän on toiminut mm. Sinfonia Lahden intendenttinä ja muun muassa Tampere Filharmonian apulaisintendenttinä sekä Tapiola Sinfoniettan ja Avanti!-kamariorkesterin tuottajana. Intendentti on orkesterin hallinnollinen johtaja, joka huolehtii mm.taloudesta ja henkilöstöstä. Miten musikaalista intendentin työ oikein on? Miia Lahti haastattelee
      - title: 'Musiikkiaitio: Musta kissa'
        start_time: '2026-11-05T14:00:00+02:00'
        end_time: '2026-11-05T15:00:00+02:00'
        description: |+
          Juontajana Miia Lahti. Lähde mukaan musiikin maailmankiertueelle. 
          Club For Fiven vuoden lopussa jättävä Tuukka Haapaniemi on kokenut jos jonkinlaisia kulttuurielämyksiä mutta yhden hän nostaa ylitse muiden; tapahtuman jossa yhteisöllisyys helisytti ikkunoita. Marko Miettinen toimittaa.


          Aieta: Palomita blanca (Nuevo Quinteto Otra Vez).

          Eskola: E and two M’s (Timo Lassy, saksofoni, Jukka Eskola, trumpetti, sekä yhtye). 

          Belize: A la luz.

          Hast: Yö Rovaniemellä (Jaakko Laitinen & Väärä Raha).

          Pöyhönen: Musta kissa (Dalindeo).

          Kähärä: Credo (Maria Ylipää, laulu, ja yhtye).

          Terry Callier: Midnight mile.

          Sivuca: Dino pintando o sete (Epoca de Ouro ja Sivuca).

          Kurki-Suonio & Hammarberg: Kulkija (The walking song) (SANS).

          Roach: Street dance (Max Roach ja M'Boom).

          Porter: Tout le jour, toute la nuit (Laura Fygi).

