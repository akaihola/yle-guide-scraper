      - title: 'Kulttuuriykkönen: Miksi Trump ja republikaanit toimivat niin kuin toimivat'
        start_time: '2026-11-05T15:00:00+02:00'
        end_time: '2026-11-05T15:58:00+02:00'
        description: |
          Yhdysvallat näyttäytyy monelle suomalaiselle yhä suurempana arvoituksena. Ei ole välttämättä selvää mikä ajaa kansan äänestämiskäyttäytymistä saatikka syventynyttä kahtiajakautuneisuutta. Esimerkiksi, mikä saa lännen seksityöläiset ja etelän kristilliskonservatiivit tukemaan samoja poliitikkoja? Miten pitkälle kristillinen äärioikeisto on onnistunut tunkeutumaan Yhdysvaltain politiikan keskiöön? Kuinka paljon Yhdysvaltojen historia ja kulttuuri antaa arvoitukseen avaimia?

          Yhdysvaltain 3.11. välivaalien tulos määrittää, miten valta jakautuu republikaanien ja demokraattien kesken maan kongressissa ja osavaltioissa. Miten se vaikuttaa MAGAan ja Trumpiin?

          Haastatteluun osallistuu emeritusprofessori Atte Korhola joka on kirjoittanut kirjan Kristillinen äärioikeisto ja Trump, Jukka Valtasaari, joka on kaksinkertainen Washingtonin suurlähettiläs ja kansainvälisen politiikan asiantuntija sekä Marko Maunula, joka on suomalais-amerikkalainen historiantutkija, joka toimii Yhdysvaltojen historian professorina Claytonin osavaltionyliopistossa Yhdysvaltojen Atlantassa.

          Ohjelman juontaa Nicklas Wancke.
