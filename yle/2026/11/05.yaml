        description: |-
          Godard: Maalaishäät (I Salonisti).

          Rossini: Andante - Allegretto kvintetosta F-duuri (Mozzafiato).

          L. Fuchs: Jota (Elmar Oliveira, viulu, ja Robert McDonald, piano).

          Mozart: Tituksen aaria "Se all'impero, amici Dei!" oopp. Tituksen lempeys (Juan Diego Florez, tenori, ja Orchestra La Scintilla/Riccardo Minasi).  

          C. Schumann: Liebeszauber (Barbara Bonney, sopraano, ja Vladimir Ashkenazy, piano).

          Bright: Intermezzo - Andante espressivo kons. pianolle ja orkesterille n:o 1 a-molli (Samantha Ward ja Liverpoolin kuninkaallinen FO/Charles Peebles).

          J.S. Bach: Gavotte en Rondeau luuttusarjasta E-duuri (Ismo Eskelinen, kitara).

          Mouret: Rondeau -osa sinfonisesta sarjasta n:o 1 (Richard Morris ja The Atlanta Brass Ensemble/Jere Flint).  

          Chabrier: Metsässä teoksesta Pastoraalisarja (Wienin filharmonikot/John Eliot Gardiner).

          Troil: Skogsrået dansar (Metsänhaltija tanssii) (Jenna Ristilä, piano).

          Giordano: Loris Ipanovin aaria "Amor ti vieta" oopp. Fedora (Mario Del Monaco, tenori, ja Lontoon uusi sinfoniaork., joht. Alberto Erede).

          R. Schumann: Einfach, innig teoks. Romansseja op.94 (Martin Fröst, klarinetti, ja Roland Pöntinen, piano).

          v. Weber: Alkusoitto näytelmämus. Turandot, Kiinan prinsessa op. 37 (Tapiola Sinfonietta/Jean-Jacques Kantorow).


          Konsertin on laatinut Ainomaija Pennanen. 
