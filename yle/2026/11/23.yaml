      - title: 'Väkivallan markkinat K3J6: Valkoista ylivaltaa, ufoja ja lannoitetta'
        start_time: '2026-11-23T19:02:00+02:00'
        end_time: '2026-11-23T19:50:00+02:00'
        description: |
          Miten pommi-iskun tekijä päätyy viimein sytyttämään sytytyslangan? Timothy McVeighin radikalisoitumisen takana oli laajempi väkivaltaisen äärioikeistolaisen ajattelun verkosto, joka muistuttaa nykyisiä keskustelualustoja. Miksi salaliittoteoreetikosta on tullut väkivallan ihailijoiden parissa legenda ja esikuva?

          Jakson haastateltavat: Leena Malkki, Helsingin yliopiston terrorismin tutkija, Onni Sarvela, Diakonissalaitoksen Exit-toiminnan hanketyöntekijä, Tommi Kotonen, äärioikeiston tutkija, Jyväskylän yliopisto.

          Lähteitä:
          Homegrown, Jeffrey Toobin, One of ours – Timothy McVeigh and the Oklahoma City bombing, Richard A. Serrano.
      - title: 'Suuri juomapodi J7: Väkevää viinaa väkevälle väelle'
        start_time: '2026-11-23T20:10:00+02:00'
        end_time: '2026-11-23T20:55:00+02:00'
        description: |
          Viinaa on poltettu Suomessa laillisesti, laittomasti ja välillä melkein kansallisena velvollisuutena. Mutta mitä pullossa oikeastaan tapahtuu, kun viljasta, perunasta tai jostain aivan muusta tehdään kirkasta viinaa? 

          Sommelier Samuil Angelov opettaa meitä maistamaan tisleitä ja ajaudumme neljän viinan sokkotestiin. Mikä erottaa ruskeat viinat toisistaan? Tislaajamestari Kai Kilpinen raottaa viinojen välisiä raja-aitoja ja paljastaa, miksi Suomesta on tullut yhtäkkiä ginimaa. Kielitieteilijä Janne Saarikivi kertoo, miksi rakkaalla päihteellä on niin monta nimeä.
