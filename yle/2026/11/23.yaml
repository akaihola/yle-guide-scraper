      - title: Faunin iltapäivä
        start_time: '2026-11-23T16:07:00+02:00'
        end_time: '2026-11-23T16:59:00+02:00'
        description: |
          Falla: Tulitanssi bal. Noiduttu rakkaus (Empire Brass sekä Steve Wilkes, lyömäsoittimet).

          Gluck: Autuaitten sielujen karkelo oopp. Orfeus ja Eurydike (Yuja Wang, piano).

          R. Strauss: Ruhe, meine Seele (Soile Isokoski, sopraano, ja Berliinin radion sinfoniaork./Marek Janowski).

          Andriessen: Un beau baiser (Suloinen suudelma) (Ars Nova Copenhagen/Paul Hillier).

          Dvorák: Allegro appassionato teoks. Romanttisia kappaleita (Gil Shaham, viulu, ja Orli Shaham, piano).

          Mahler: Rheinlegendchen (Reiniläislegenda) kok. Des Knaben Wunderhorn (Magdalena Kozena, mezzosopraano, ja Clevelandin ork./Pierre Boulez).

          Palmgren: Valse mignonne (Risto Lauriala, piano).

          Mascagni: Fritzin aaria oopp. Fritz-ystävä (Luciano Pavarotti, tenori, ja Covent Garden -oopperan ork./Gianandrea Gavazzeni).

          Fauré: Nell (Gregory Hustis, käyrätorvi, ja Steven Harlos, piano).

          Bartok: Ilta kylässä (Unkarin kansallinen FO/Zoltan Kocsis).

          J.S. Bach - Stradal: Adagio sonaatista uruille n:o 4 e-molli (Víkingur Ólafsson, piano).

          Händel: Alton ja basson duetto "Let rolling streams their gladness show" oodista Kuningatar Annan syntymäpäiville (Andreas Scholl, kontratenori, Andreas Wolf, basso, Vocalconsort Berlin -vokaaliyhtye, sekä Akademie fuer alte Musik Berlin -kamariorkesteri/Marcus Creed).

          Sibelius: Tanssi-intermezzo op.45/2 (RSO/Jukka-Pekka Saraste).

          Grieg: Jeg elsker dig (Rakastan sinua) (Miah Persson, sopraano, ja Roger Vignoles, piano).


          Konsertin on laatinut Ainomaija Pennanen.
