          Näyttelijä Krista Kosonen lukee Ruutin kirjasta Ramattu 2028-käännöksen mukaan. Tässä hartaudessa kuullaan Ruutin kirjan luvut 2-3.

          Loppusyksyn raamatunluennassa kuullaan uusia Vanhan Testamentin käännöksiä Joonan, Ruutin ja Esterin kirjoista. 
