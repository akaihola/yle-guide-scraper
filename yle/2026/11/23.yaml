        description: |-
          "Ruut lähtee etsimään työtä"
          Näyttelijä Krista Kosonen lukee Ruutin kirjasta VT2028-käännöksen mukaan. Tässä hartaudessa kuullaan Ruutin kirjan luvut 2-3.

          Loppusyksyn raamatunluennassa kuullaan uusia Vanhan Testamentin käännöksiä Joonan, Ruutin ja Esterin kirjoista. 
      - title: Yle Uutiset ja sää
