      - title: 'Elävä historia: Revennyt virtsarakko ja muita kuninkaallisia kuolemia - monarkit oikeuslääkärin ruumiinavauspöydällä'
        start_time: '2026-10-04T12:05:00+03:00'
        end_time: '2026-10-04T12:55:00+03:00'
        description: |
          Kuoliko Englannin viimeinen anglosaksinen kuningas Harald Godwininpoika silmään osuneeseen nuoleen vuonna 1066? Räjähtikö Vilhelm Valloittajan mädäntynyt ja paisunut ruumis hauta-arkussa? Kuoliko 1400-luvun suuri soturikuningas Henrik V punataudin sijaan peräaukon fisteliin?
          Elävä historia tuo Englannin menneet monarkit nykypäivän oikeuslääkärin ruumiinavauspöydälle.
          Haastateltavat: oikeuslääkäri Ursula Vala ja keskiajantutkija Jaakko Tahkokallio.
          Toimittaja: Harri Alanne
          Äänisuunnittelu: Katja Kostiainen
