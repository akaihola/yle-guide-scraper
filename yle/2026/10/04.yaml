        description: |+
          Dvorák: Song to the moon (Joshua Bell, viulu, ja St. Luken ork./Michael Stern).

          Tshaikovski: Lokakuu sarj. Vuodenajat (Yefim Bronfman, piano).

          Kuula: Purjein kuutamolla (Marjukka Tepponen, sopraano, ja Ilmari Räikkönen, piano). 

          Sasaki: Tsuki no sabaku (Kuutamoinen erämaa) (Jouko Harjanne, trumpetti, ja Kari Hänninen, piano). 

          Hansen: Oktober (Lokakuu) (Jerker Johansson, vibrafoni).

          Debussy: Clair de lune (Kuutamo) (Petri Alanko, huilu, ja Juhani Lagerspetz, piano).

          Piazzolla: Canto de Octubre (Lokakuun laulu) (Total Cello Ensemble).

          Vinter: Hunter's moon (Lokakuun kuu) (Alec Frank-Gemmill, käyrätorvi, ja Alasdair Beatson, piano). 

          Huuskonen: Pisaroita ja kuutamoa sarj. Yö merellä (Radion viihdeork./George de Godzinsky).

          Konsertin on laatinut Inari Tilli. 

