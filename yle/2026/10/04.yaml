      - title: Etnokonsertti Dugan poljentoa Ruotsista
        start_time: '2026-10-04T17:06:00+03:00'
        end_time: '2026-10-04T18:00:00+03:00'
        description: |
          Duga -yhtyeen konsertti Rudolstadtin Shiller-teatterissa 5.7.2026. Musiikissa kuuluu Hedningarnan vaikutteet - raskas poljento ja kiihtyvät riffit. Trion muodostavat Olof Kennemarkin resonoiva viola d´amore, Albin Brobergin mora-oud, efektit ja sämplet, sekä ahvenanmaalaisen Anton Johanssonin lyömäsoittimet. Sävellykset ovat omia sekä sovituksia polskista, sottiiseista ja valsseista. Ohjelmassa aluksi Albin Brobergin haastattelu. Toimittajana on Miika Lauriala. 
