        start_time: '2026-10-04T17:06:00+03:00'
        end_time: '2026-10-04T18:00:00+03:00'
        description: |
          Duga -yhtyeen konsertti Rudolstadtin Schiller-teatterissa 5.7.2026. Dugan musiikissa soi raskas viulupoljento, sampleri ja lyömäsoittimet. Länsi-Göötanmaalta kotoisin olevat Olof Kennemark (s. 1994) ja Albin Broberg (s. 1993) ovat musisoineet yhdessä teini-iästä lähtien. Kennemark soittaa resonoivaa viola d´amorea ja Broberg mora-oudia ja sämpleriä. Ahvenanmaalta kotoisin oleva Anton Johansson soittaa lyömäsoittimia ja elektroniikkaa. Ohjelmassa alussa kuullaan Albin Brobergin haastattelu. Toimittajana on Miika Lauriala. 
