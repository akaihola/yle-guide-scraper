      - title: 'Uusiutuva tiede: Psykiatria – demoneista ja kahleista avohoitoon'
        start_time: '2026-10-04T22:48:00+03:00'
        end_time: '2026-10-04T23:19:00+03:00'
        description: |-
          Psyykkisiin sairauksiin suhtauduttiin julman taikauskoisesti vuosisatojen ajan. Niiden ajateltiin johtuvan esimerkiksi demonien riivauksista. Potilaita hoidettiin mm. manauksella, kahleilla ja polttamalla roviolla. Vielä 1900-luvullakin mielenterveyspotilailta revittiin hampaita, heitä vaivutettiin koomaan ja sidottiin pitkiksi ajoiksi ammeisiin kylmään tai kuumaan veteen. Lobotomioita tehtiin Suomessa aina 1970-luvulle asti. Millaisia vaiheita ja ajatuksia on liittynyt mielenterveyshäiriöihin? Mitkä ovat puolestaan olleet tärkeimpiä edistysaskeleita niiden hoidossa? Haastateltavana Tiina Paunio, joka on psykiatrian professori Helsingin yliopistosta ja Husin psykiatrian ylilääkäri. Toimittajana Samppa Korhonen.
