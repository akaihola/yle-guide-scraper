      - title: Narrin aamulaulu - Suomen suosituimmat Pokelat
        start_time: '2026-10-30T11:00:00+02:00'
        end_time: '2026-10-30T11:55:00+02:00'
        description: |
          "Yksi haamu oli Marjaanan ovella" tai "Laula kukko" - 1950- ja -60-luvuilla kaikki tiesivät näiden laulujen esittäjät, Marjatta ja Martti Pokelan. Duo voittikin vuonna 1952 radion yleisöäänestyksessä suosituimman esiintyjän palkinnon. Kun vanhempien seuraan liittyi tytär, taiteilijanimeltään Eveliina, muodostui Pokeloista myös merkittävä osa tv-historiaa. 
          Elämästä ja musiikin tekemisestä koko kansan Pokeloina kertoo Eeva-Leena Pokela. Outi Paanasen haastateltavana on lisäksi musiikintutkija Hannu Saha.
          Osa 1/2. 
