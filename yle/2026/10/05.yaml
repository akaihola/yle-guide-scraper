      - title: 'Tosi tarina: Lallukka - ja mitä se taiteilijaelämä on?'
        start_time: '2026-10-05T19:02:00+03:00'
        end_time: '2026-10-05T19:50:00+03:00'
        description: |-
          Helsingin Töölössä sijaitsee Lallukan taiteilijakoti. Sen syntysanat lausuivat ja talon toiminnan rahoittivat karjalalaiset Juho ja Maria Lallukka. Ensimmäiset asukkaat taloon muuttivat vuonna 1933. Tässä dokumentissa ollaan kylässä Lallukassa, kuullaan sen asukkaita ja kuulostellaan talon henkeä. Aikana jolloin poliittinen toiminta pitkälti köyhdyttää kulttuurielämää, Lallukka on kuin keidas erämaassa. Mutta minkälaista se taiteiijaelämä tässä talossa sitten on? Käsikirjoitus, ohjaus ja äänisuunnittelu: Hanna-Helena Kinnunen.
      - title: 'Hyviä aikeita 5: Koiran elämää  '
        start_time: '2026-10-05T20:10:00+03:00'
        end_time: '2026-10-05T20:50:00+03:00'
        description: |
          Kodittomalle koiralle adoptio Suomeen on lottovoitto. Aina kaikki ei kuitenkaan mene odotusten mukaan, vaan sopeutuminen voi olla yllättävän vaikeaa. Sarjan lopussa virolaisen koirien suojakodin edustaja vastaa puhelimeen. 
