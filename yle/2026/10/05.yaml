      - title: 'Tiedeykkönen: Onko tekoäly taikasauva, joka tekee julkisista palveluista vähemmän byrokraattisia?'
        start_time: '2026-10-05T21:30:30+03:00'
        end_time: '2026-10-05T22:20:00+03:00'
        description: |
          Helsingin yliopiston sosiologian dosentti Aaro Tupasela kertoo jaksossa kunnianhimoisesta Aurora AI -projektista, jossa konseptoitiin tekoälypalvelua kansalaisille. Hankkeen etiikkaryhmässä tutkijan roolissa mukana ollut Tupasela joutui pohtimaan mm. sitä, voiko julkisen puolen tekoäly kertoa kansalaiselle, miten elää hyvää elämää.

          Kansalaisten digitaalisissa palveluissa on parantamisen varaa. Tampereen yliopiston filosofian dosentti Jaana Parviainen tutkii palveluiden yhteydessä ilmenevää epäoikeudenmukaisuutta. Parviainen on verrannut miljardööri Elon Muskin johtamaa kohuttua DOGE-digireformia siihen, miten monissa maissa digitalisaatio on tapahtunut vuosikymmenten saatossa “hiljaisena vallankumouksena”.

          Aaro Tupaselaa ja Jaana Parviaista haastattelee Juuso Pekkinen.

          Jakson äänisuunnittelija on Panu Willman.
