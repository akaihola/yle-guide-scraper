      - title: 'Elävä historia tutkii: Pälkäneen kallot 1/5 - Keiden kalloja rotututkimuksiin vietiin?'
        start_time: '2026-10-05T12:05:00+03:00'
        end_time: '2026-10-05T12:40:00+03:00'
        description: |
          Kymmenittäin suomalaisten pääkalloja vietiin rotututkimuksiin Ruotsiin vuonna 1873. Viisiosainen Elävä historia tutkii -sarja seuraa näiden kallojen kohtaloita. Tarina alkaa vuodesta 2024, kun mystiset kallolaatikot palautetaan Pälkäneen kirkon pihaan. Toimittaja Kaisa Pulakka alkaa selvittää, mistä tässä on kyse. Keiden kallot päätyivät Ruotsiin suomalaista rotua edustamaan? Toimittaja: Kaisa Pulakka. Äänisuunnittelu: Joonatan Kotila. Tuottaja: Pertti Ylikojola.
