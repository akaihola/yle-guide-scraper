      - title: 'Aitiovieras: Kuvataiteilija Kari Puikkonen teki sarjakuvakirjan mykkkäelokuvasta'
        start_time: '2026-10-05T13:35:00+03:00'
        end_time: '2026-10-05T14:00:00+03:00'
        description: |2-
           Kari Puikkonen on monipuolinen kuvataiteilija, joka on uransa aikana tehnnyt niin veistoksia, grafiikkaa kuin akvarellejakin. Puikkosesta sanotaan, että hän on tinkimätön perfektionisti. Nyt Puikkonen on erityisen innostunut sarjakuvasta. Tänä syksynä Kari Puikkoselta on ilmestynyt sarjakuvakirja Karu, joka kertoo mykkäelokuvan ajoista Suomessa. Sarjakuvan pääosassa on ohjaaja ja elokuvamoguli Erkki Karu ja tarina elokuvan Nummisuutarit kuvauksista. Jarmo Laitaneva haastattelee.
