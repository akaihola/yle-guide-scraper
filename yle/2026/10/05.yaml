          Richardson: The Groove merchant (The Oiling Boiling Rhythm'n Blues Band).

          Kansanlaulu, Irlanti: Brid og ni mhaille (The Corrs ja BBC:n konserttiorkesteri).

          Hyväluoma: Triolipolska (Tsuumi Sound System).

          Kähärä: En mä tullut niinkuin ennen (How Many Sisters ja Tapiola Sinfonietta/Kirmo Lintinen).

          Porter: What is this thing called love (Willie Nelson).

