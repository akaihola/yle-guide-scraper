        start_time: '2026-10-20T13:35:00+03:00'
        end_time: '2026-10-20T14:00:00+03:00'
        description: |-
          Oopperalaulaja Helena Juntunen on sanonut, että hyvän kirjan vetovoima kestää läpi elämän. Helena Juntusen matkalaukussa on läpi syksyn kulkenut painava kirjalasti. Kansainvälisesti tunnustettu sopraano valitsee tänä vuonna kaunokirjallisuuden Finlandian. Matkoja on riittänyt tänäkin vuonna, mm. hänen syyskuunsa kului laulaen Kööpenhaminassa. Siellä hän esiintyi Kaija Saariahon Innocencessa. Miia Lahti haastattelee.
