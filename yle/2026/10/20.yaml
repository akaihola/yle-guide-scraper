      - title: 'Kulttuuriykkönen: Siviili sotilastiedustelijana – Toivo Salokorven tarina '
        start_time: '2026-10-20T15:00:00+03:00'
        end_time: '2026-10-20T15:58:00+03:00'
        description: |
          Suomalainen sotilastiedustelu aloitettiin käytännössä jo ensimmäisen maailmansodan melskeissä. Toivo Salokorpi oli ekonomi, josta tuli sotien välisen ajan kokenein sotilastiedustelija. Hän johti agenttitiedustelua Karjalankannaksella 1930-luvulla ennen talvisodan puhkeamista ja osallistui sotien lopussa erinäisiin salahankkeisiin. Sodan jälkeen poliittinen ilmapiiri muuttui ja Salokorpi löysi itsensä Valpon sellistä. 

          Haastateltavina ovat Siviili sotilastiedustelijana – kirjan kirjoittaneet sotatieteiden tohtori ja Maanpuolustuskorkeakoulun sotilastiedustelun historian dosentti Toni Mononen ja Toivo Salokorven lapsenlapsi, toimittaja Jouko Salokorpi. Vieraana on myös emeritusprofessori Kimmo Rentola.

          Ohjelman juontaa Nicklas Wancke.
