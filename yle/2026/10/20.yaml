      - title: 'Uusiutuva tiede: Lääketiede 2/2 – Kallonporausta ja muita toimivia hoitoja'
        start_time: '2026-10-20T12:05:00+03:00'
        end_time: '2026-10-20T12:35:00+03:00'
        description: |-
          Lääketieteen historiaan mahtuu kamalia harhapolkuja, mutta myös loistavia läpimurtoja ja voittokulkuja. Onnistuneita kallonporauksia tehtiin tuhansia vuosia sitten ja silmäleikkauksiakin jo keskiajalla. Parantamisesta oli ymmärrystä, vaikka esimerkiksi taudinaiheuttajat olivat tuntemattomia. Lääketieteen kehityksestä ja edistyaskeleista kertoo Suomen Lääketieteen Historian Seuran puheenjohtaja Elina Maaniitty. Toimittajana Samppa Korhonen.
      - title: 'Aristoteleen kantapää: Etymologia on kiehtovaa, mutta voi johdattaa väärinkäsitysten äärelle'
        start_time: '2026-10-20T12:35:00+03:00'
        end_time: '2026-10-20T13:00:00+03:00'
        description: |-
          Pasi Heikura syventyy etymologiaan aiheesta kirjan kirjoittaneen Kansalliskirjaston tietoasiantuntija Tuomas Palosen kanssa. Ohjelmassa opetetaan myös korvia katsomaan, muistellaan kuinka Mona Lisa otti ritolat ja lopuksi kylvetään oraita. Ohjelman ovat toimittaneet Pasi Heikura ja Tina Cavén.

          Ohjelma on uusinta viime vuoden marraskuulta (11.11.2025).
