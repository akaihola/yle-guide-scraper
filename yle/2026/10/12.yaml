      - title: 'Kulttuuriykkönen: Tom Cruisen uusi elokuva Digger ja pitkä ura'
        start_time: '2026-10-12T15:00:00+03:00'
        end_time: '2026-10-12T15:58:00+03:00'
        description: |
          Tom Cruise liikkuu kauas Mission Impossible -elokuvien ja Top Gunin tutusta toimintasankarista Alejandro G. Iñárritun ohjaamassa Digger-elokuvassa. Mustassa ja absurdissa satiirissa Cruise pääsee revittelemään roolissa, jonka on povattu nostavan hänet jälleen myös Oscar-keskusteluun. Elokuvasta on povattu syksyn puhutuinta tapausta, mutta ensimmäiset arviot eivät kautta linjan olleet mairittelevia.
          Kuinka suuri irtiotto Digger lopulta on? Tom Cruise tunnetaan ennen kaikkea yhtenä Hollywoodin viimeisistä todellisista megatähdistä ja fyysisesti hurjapäisenä toimintaelokuvien sankarina, mutta hänen yli neljä vuosikymmentä kestäneelle uralleen mahtuu myös paljon muuta: komediaa, draamaa, synkkiä sivuhenkilöitä ja kunnianhimoisia yhteistyökuvioita aikansa merkittävimpien ohjaajien kanssa.
          Samalla Cruisen julkisuuskuva on ollut poikkeuksellinen. Yksi maailman tunnetuimmista näyttelijöistä on vuosien mittaan näyttäytynyt vuoroin Hollywoodin täydellisenä tähtenä, puolikahelina eksentrikkona ja vaikeasti lähestyttävänä hahmona.
          Millainen elokuva Digger on, mitä se paljastaa Tom Cruisesta näyttelijänä ja miksi hänen uransa on kestänyt Hollywoodin huipulla jo yli 40 vuotta?
          Diggeriä ja Tom Cruisen uraa pohtivat elokuvatutkija Anna Möttölä, elokuvatutkija Jari Sedergren ja kulttuuritoimittaja Pekka Torvinen. Toimittajana on Ville Talola.
