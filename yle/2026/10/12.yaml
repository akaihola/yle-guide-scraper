      - title: 'Keinuva talo - Mika Kauhanen: Korkeimmat tarjoukset musiikin huutokaupassa'
        start_time: '2026-10-12T17:35:00+03:00'
        end_time: '2026-10-12T18:35:00+03:00'
        description: |-
          Leikitään hetki ajatuksella: mitä jos tiettyä levyä olisi maailmassa olemassa vain yksi kappale, kuten maalauksia? Tai hankittavissa hyvin rajallinen määrä, kuten grafiikkavedoksia; millainen arvo musiikilla olisi keräilijän näkökulmasta? 

          Ja mikä tärkeintä, millaisia sosiaalisia seurauksia musiikin yksityisomistuksella olisi? Mitä tapahtuisi fanikulttuurille, jakamisen ilolle, yhteisille muistoille? Yhteisiä aarteita pelastamassa toimittaja Mika Kauhanen.
