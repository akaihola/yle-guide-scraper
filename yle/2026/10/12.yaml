      - title: 'Suuri juomapodi J1: (Oispa) kaljaa '
        start_time: '2026-10-12T20:10:00+03:00'
        end_time: '2026-10-12T20:55:00+03:00'
        description: |
          Tuoppiemme sisällössä näkyvät edelleen kieltolaki, 1960-luvun alkoholipolitiikka ja naisten asema maatalossa. Peruskaljasta on tultu raparperi-soureihin ja alkoholittomiin ipoihin, mutta eniten suomalaisten suihin livahtaa yhä vaaleaa lageria. Miksi? Ja kun halpa kalja on niin halpaa, miten sitä edes kannattaa tehdä? 

          Oluen tietä suomalaisen kuluttajan käteen avaa toimittaja ja olutasiantuntija Anikó Lehtinen. Kielitieteilijä Janne Saarikivi selittää, mistä oluen monet nimet tulevat, ja markkinoinnin asiantuntija Kari Tervonen kertoo, millaisia oluenostajia suomalaiset ovat.
