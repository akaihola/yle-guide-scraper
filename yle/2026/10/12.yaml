      - title: 'Aitiovieras: Ismo Eskelinen - kitaran monipuolinen mestari'
        start_time: '2026-10-12T13:35:00+03:00'
        end_time: '2026-10-12T14:00:00+03:00'
        description: |-
          Ismo Eskelinen on kansainvälisesti arvostettu klassinen kitaristi, joka on esiintynyt solistina maailman huikeimmissa konserttisaleissa ja soittanut nimekkäiden orkestereiden kanssa. Useat säveltäjät ovat tehneet teoksia erityisesti Eskeliselle. Palkittu Eskelinen toimii taiteellisena johtajana Sonkajärvi Soi -musiikkijuhlilla ja opettaa kitaransoittoa Sibelius-Akatemiassa. Mikä sytyttää monipuolisuudestaan tunnetun taiteilijan? Mitä hän painottaa opettaessaan tulevaisuuden kitaristitähtiä?  Ismo Eskelinen on Joni Timosen haastattelussa.
