      - title: 'Aitiovieras: Liisa Akimofin vilkas syksy: uusi musiikki, elokuva ja Soihdunkantaja-palkinto'
        start_time: '2026-10-28T13:35:00+02:00'
        end_time: '2026-10-28T14:00:00+02:00'
        description: |2-
           Liisa Akimofilla on menossa vilkas syksy. Pitkään erityisesti tv-tuottajan töihin keskittynyt Akimof teki pari vuotta sitten 27 vuoden tauon jälkeen uuden levyn ja on julkaissut uutta musiikkia myös tänä vuonna. Syksyn keikkailun lomassa hän on ehtinyt myös viimeistellä elokuvan Minä ja Riikka Purra. Se on ensi-illassa perjantaina 30.10. Lisäksi Avate Audiovisuaalisen alan tekijät jakoi nyt syksyllä Soihdunkantaja-palkinnon Akimofille av-teosten immateriaalioikeuksien puolustamisesta. Jarmo Laitaneva haastattelee.
      - title: 'Musiikkiaitio: Usko aina unelmiin'
        start_time: '2026-10-28T14:00:00+02:00'
        end_time: '2026-10-28T15:00:00+02:00'
        description: |+
          Lähde mukaan musiikin maailmankiertueelle. Juontajana Jarmo Laitaneva. Lähetyksessä kirjailija ja dokumenttielokuvien ohjaaja Elina Hirvonen kertoo elokuvafestivaalien merkityksestä itselleen. Toimittaja Satu Kivelä. Ensilähetys oli 27.8.26.


          Van Heusen: Se tapahtuu (Timo Kiiskinen).

          Vainio: Vanhojapoikia viiksekkäitä (Trio Töykeät ja Jaakko Kuusisto).

          Powell, de Moraes: Canto de Ossanha (Paula Morelenbaum).

          Lars-Ante Kuhmunen: Gabna duottar.

          Juha Kujanpää: Matroskin.

          Kansansäv.: The Foxhunter (Celtic Woman).

          Saari: Usko aina unelmiin (Sami Saari ja Jazzpojat).

          Rosinha, Silva: Grandes ilusiones (Salvador Sobral).

          Moisio: Kysymykset 6 ja 7 (Ne Lintuizet). 

          Chopin: Preludi n:o 4 e-molli (Gerry Mulligan Sextet).

          Matada: Hiona mbilo (Chico Matada).

      - title: 'Kulttuuriykkönen: Lapin sota-elokuva ja historia'
        start_time: '2026-10-28T15:00:00+02:00'
        end_time: '2026-10-28T15:58:00+02:00'
        description: |-
          Lapin sotaa (1944–1945) on kutsuttu Suomen unohdetuksi sodaksi. Talvi- ja jatkosodan varjoon jääneessä konfliktissa nuoret suomalaiset sotilaat taistelivat entisiä saksalaisia aseveljiään vastaan. Kymmenet tuhannet siviilit joutuivat evakkoon, osa menetti kotinsa lopullisesti, ja sodan päättyessä suuri osa Lapista oli raunioina.

          Aku Louhimiehen uusi suurelokuva Lapin sota kertoo sodan inhimillisestä todellisuudesta. Mutta miten elokuva onnistuu kuvaamaan poikkeuksellisen sodan kokemuksia ja ristiriitoja? Entä kuinka uskollisesti se tuo historialliset tapahtumat valkokankaalle?

          Aiheesta keskustelevat historioitsija Oula Silvennoinen, kirjailija Pekka Jaatinen ja elokuvahistorioitsija Jari Sedergren. Toimittajana Ville Talola.
