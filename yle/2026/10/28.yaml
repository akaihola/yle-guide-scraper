        description: |
          Guido: Syksyn paluun juhlintaa ja Metsästys teoks. Sopusointuisia leikkejä Neljästä vuodenajasta (L'Arte dell'arco/Federico Guglielmo, viulu).

          Grandjany: Automne (Syksy) (Lily Laskine, harppu).

          Rössler: Rondo huilukonsertosta G-duuri (Mikael Helasvuo ja Keski-Pohjanmaan Kamariork./Juha Kangas).

          Chaminade: Syksy Des-duuri (Stephen Hough, piano).

          Madetoja: Syksy (Camilla Nylund, sopraano, ja Münchenin RO/Ulf Schirmer).

          Prokofjev: Osenneje (Syksyisiä luonnoksia) (Sinfonia Lahti/Dima Slobodeniouk). 

          A. Merikanto: Hämärän laulu (Seppo Salovius, piano).

          Brahms: Im Herbst (Syksyllä) kokoelmasta Fünf Gesänge op.104 
          (Arnold Schoenberg Chor/Erwin Ortner).

          Debussy: Nuit d'etoiles (Tähtikirkas yö) (Sandrine Piau, sopraano, ja Susan Manoff, piano).

          Ma Sicong: Syksyinen sadonkorjuutanssi (Hsiao-mei Ku, viulu, ja Ning Lu, piano). 

          Melartin (sov. Funtek): Lemmenkuja pianosarjasta Surullinen puutarha (RSO/Juha Nikkola).

          Konsertin kokosi Eva Tigerstedt
