      - title: Faunin iltapäivä
        start_time: '2026-10-28T16:07:00+02:00'
        end_time: '2026-10-28T16:59:00+02:00'
        description: |-
          Guido: Syksyn paluun juhlintaa ja Metsästys teoks. Sopusointuisia leikkejä Neljästä vuodenajasta (L'Arte dell'Arco/Federico Guglielmo, viulu).

          Grandjany: Automne (Syksy) (Lily Laskine, harppu).

          Rössler: Rondo kons. huilulle ja orkesterille G-duuri (Mikael Helasvuo ja Keski-Pohjanmaan Kamariork./Juha Kangas).

          Chaminade: Automne (Syksy) Des-duuri (Stephen Hough, piano).

          Madetoja: Syksy (Camilla Nylund, sopraano, ja Münchenin RO/Ulf Schirmer).

          Prokofjev: Osenneje (Syksyisiä luonnoksia) (Sinfonia Lahti/Dima Slobodeniouk). 

          A. Merikanto: Hämärän laulu (Seppo Salovius, piano).

          Brahms: Im Herbst (Syksyllä) kok. Fünf Gesänge (Arnold Schoenberg Chor/Erwin Ortner).

          Debussy: Nuit d'etoiles (Tähtikirkas yö) (Sandrine Piau, sopraano, ja Susan Manoff, piano).

          Ma Sicong: Dance of autumn harvest (Syksyinen sadonkorjuutanssi) (Hsiao-mei Ku, viulu, ja Ning Lu, piano). 

          Melartin: Liebesallee (Lemmenkuja) sarj. Der Traurige Garten (Surullinen puutarha) (RSO/Juha Nikkola).

          Konsertin on koonnut Eva Tigerstedt.
