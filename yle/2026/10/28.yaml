      - title: 'Havaintoja muutoksesta: Koiran ja ihmisen välinen tunneyhteys ja vuorovaikutus'
        start_time: '2026-10-28T10:00:00+02:00'
        end_time: '2026-10-28T10:50:00+02:00'
        description: |+
          Koirat kiintyvät ihmisiin ja monelle ihmiselle koira on perheenjäsen. Koiran ja ihmisen välinen tunneyhteys näkyy käyttäytymisen lisäksi myös autonomisen hermoston toiminnassa.
          Millainen biologinen perusta koiran ja ihmisen välisessä suhteessa on? 
          Toimittaja Satu Kivelä keskustelee aiheesta tutkija Aija Koskelan ja kirjailija Tiina Raevaaran kanssa.

