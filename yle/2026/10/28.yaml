      - title: 'Kulttuuriykkönen: Lapin sota-elokuva ja historia'
        start_time: '2026-10-28T15:00:00+02:00'
        end_time: '2026-10-28T15:58:00+02:00'
        description: |-
          Lapin sotaa (1944–1945) on kutsuttu Suomen unohdetuksi sodaksi. Talvi- ja jatkosodan varjoon jääneessä konfliktissa nuoret suomalaiset sotilaat taistelivat entisiä saksalaisia aseveljiään vastaan. Kymmenet tuhannet siviilit joutuivat evakkoon, osa menetti kotinsa lopullisesti, ja sodan päättyessä suuri osa Lapista oli raunioina.

          Aku Louhimiehen uusi suurelokuva Lapin sota kertoo sodan inhimillisestä todellisuudesta. Mutta miten elokuva onnistuu kuvaamaan poikkeuksellisen sodan kokemuksia ja ristiriitoja? Entä kuinka uskollisesti se tuo historialliset tapahtumat valkokankaalle?

          Aiheesta keskustelevat historioitsija Oula Silvennoinen, kirjailija Pekka Jaatinen ja elokuvahistorioitsija Jari Sedergren. Toimittajana Ville Talola.
