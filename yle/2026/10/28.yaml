      - title: 'Politiikkaradio: Ovatko republikaanit matkalla kohti välivaalien katastrofia?'
        start_time: '2026-10-28T13:00:00+02:00'
        end_time: '2026-10-28T13:30:00+02:00'
        description: |
          Yhdysvalloissa valmistaudutaan välivaaleihin keskellä kovaa poliittista kahtiajakoa. Tuoreet kannatusmittaukset ennustavat presidentti Donald Trumpin republikaaneille romahdusta. New York Timesin mittauksen perusteella osavaltioista jopa Kansas, jossa ei ole nähty demokraattijohtoa lähes sataan vuoteen, saattaisi kääntyä välivaaleissa demokraateille. Mikä selittää Yhdysvaltain politiikan heilahtelua puolelta toiselle? Onko poliittisesti, taloudellisesti, etnisesti ja kulttuurillisesti ristiriitainen Yhdysvallat suuri tuntematon? Yhdysvaltojen edessä olevia välivaaleja arvioi amerikansuomalainen professori Marko Maunula Claytonin osavaltionyliopistosta. Toimittajana on Tapio Pajunen.
