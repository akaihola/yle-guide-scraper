      - title: 'Uutispodcast: Israelin vaalit johtivat pattitilanteeseen – Netanjahu on silti vahvoilla'
        start_time: '2026-10-31T21:00:30+02:00'
        end_time: '2026-10-31T21:23:49+02:00'
        description: |
          Israel äänesti parlamenttivaaleissa ensi kertaa sitten Hamasin kolmen vuoden takaisen hyökkäyksen. 
          Istuvan pääministerin Benjamin Netanjahun puolue on saamassa suurimman puolueen aseman. Tämä ei kuitenkaan välttämättä vie hallitukseen. Entä mitä vaalitulos merkitsee Lähi-idän jännitteille ja Israelin kansainväliselle asemalle? 
          Israelin vaalien tulosta arvioimassa on Ylen ulkomaan toimittaja Vilma Romsi. Atte Uusinoka haastattelee. 
      - title: 'Aitiovieras: Liisa Akimofin vilkas syksy: uusi musiikki, elokuva ja Soihdunkantaja-palkinto'
        start_time: '2026-10-31T21:24:38+02:00'
        end_time: '2026-10-31T21:49:23+02:00'
        description: |2-
           Liisa Akimofilla on menossa vilkas syksy. Pitkään erityisesti tv-tuottajan töihin keskittynyt Akimof teki pari vuotta sitten 27 vuoden tauon jälkeen uuden levyn ja on julkaissut uutta musiikkia myös tänä vuonna. Syksyn keikkailun lomassa hän on ehtinyt myös viimeistellä elokuvan Minä ja Riikka Purra. Se on ensi-illassa perjantaina 30.10. Lisäksi Avate Audiovisuaalisen alan tekijät jakoi nyt syksyllä Soihdunkantaja-palkinnon Akimofille av-teosten immateriaalioikeuksien puolustamisesta. Jarmo Laitaneva haastattelee.
      - title: 'Kuunnelman tiet 5/13: Radio Days - kansainvälisiä suunnnannäyttäjiä'
        start_time: '2026-10-31T21:50:23+02:00'
        end_time: '2026-10-31T22:27:01+02:00'
        description: |
          Radio Days - kansainvälisiä suuunnannäyttäjiä. 
          Pekka Kyrö kertoo radiokuunnelman kehitysvaiheista ja käännekohdista. 
          Tekninen toteutus Ari Mursula. 
          Tässä osassa kerrotaan mm. Orson Wellesin kuunnelmaohjauksista ja faktan ja fiktion sekoittumisesta. 
          Ohjelma on vuodelta 2009.
      - title: Kulttuurikokemus
        start_time: '2026-10-31T22:35:00+02:00'
        end_time: '2026-10-31T22:41:12+02:00'
        description: |-
          Kirjailija Laura Honkasalo on lapsesta asti lumoutunut lukemisesta ja kirjoista. Kulttuurikokemus-sarjassamme hän nostaa juuri lapsuudestaan esille kirjan, jota hän lukee edelleen aika ajoin uudestaan. Toimittajana on Sari Valto. (Ensilähetys 16.9.26.)
      - title: 'Keinuva talo - Mika Kauhanen: Mitä kaikkea voikaan haluta?'
        start_time: '2026-10-31T22:41:12+02:00'
        end_time: '2026-10-31T23:39:30+02:00'
        description: |-
          Tervetuloa mukaan etsimään ja löytämään lauluja tahdonilmaisuista! Vasuun kertyy sekä helposti samastuttavia että täysin odottamattomia toiveita ja unelmia kansanmusiikin ja maailmanmusiikin tekijöiltä. Voiko kaikkea saada? Mitä tarkoittaa vaihtoehtoiskustannus? Entä jos haluaa, muttei osaa? Mukana sekä hupsuja että painavia tahdon suuntia. Toimittajana Mika Kauhanen. Uusinta tammikuulta 2026.
