      - title: 'Maailma tarinoina: Yön lapsi - vanhemmuuden pimeästä puolesta kauhun keinoin'
        start_time: '2026-10-31T11:00:00+02:00'
        end_time: '2026-10-31T11:55:00+02:00'
        description: |
          Hanna Bergholmin ohjaama ja yhdessä Ilja Rautsin kanssa käsikirjoittama Yön lapsi voidaan nähdä osana 2010-luvulta alkanutta kauhun uutta aaltoa, jossa psykologinen syvyys, yhteiskunnallisten näkökulmien laajentuminen ja naisohjaajien esiinnousu korostuvat. Elokuvassa tuodaan yhteen vanhemmuuteen liittyvät tabut,  suomalainen mytologia sekä ajattomat kauhun teemat, kuten kuolema, identiteetin menetys, vampyyrit ja hirviölapsi. Miksi kauhu on otollinen genre käsittelemään mielensisäisiä asioita? Mitä kaikkea elokuvan luontokuvauksesta voi lukea?

          Uutuuselokuvan kimppuun käyvät Marja Vehkasen johdattelemana elokuvatutkija Antti Alanen ja alue- ja kulttuuritutkimuksen ja mediatutkimuksen dosentti Outi Hakola.
