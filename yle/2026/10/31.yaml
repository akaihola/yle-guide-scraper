          Pyhäinpäivän jumalanpalvelus Kiimingin kirkosta Oulusta.

          Liturgina ja saarnaajana Pauli Niemelä. Avustajana ja esirukouksen johtajana diakoni Katri Tuomiharju. Tekstinlukijoina Maija-Liisa Huttula ja Petra Richardt. Kanttorina Jarkko Metsänheimo ja urkureina Sari Wallin ja Risto Ainali.

