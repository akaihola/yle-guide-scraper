          Vesa Vierikon elämänfilosofian mukaan ihmiset ovat traagisuudessaan koomisia ja  hauskoja. Hän nauraa ihmisille ja itselleen. Hänestä ne ihmiset, jotka ottavat itsensä liian vakavasti, ovat hankalia ja jopa vaarallisia. Näyttelijäntyöstä puhuttaessa Vesa vakavoituu. Hän sanoo, että näyttelijän on oltava roolihenkilönsä, ajatuksia myöten. Muuten hahmo ei ole uskottava. Ohjelma on uusinta ajalta 21.5.2026.
