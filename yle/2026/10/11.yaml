      - title: 'Narrin aamulaulu elokuvissa - Kathleen Parlow ja kadonneen viulukonserton mysteeri '
        start_time: '2026-10-11T08:05:28+03:00'
        end_time: '2026-10-11T08:59:48+03:00'
        description: |-
          Mäntässä lokakuussa järjestettävien Taidekaupungin elokuvajuhlien ohjelmistoon kuuluu kanadalaisohjaaja Sofia Bohdanowiczin elokuva "Measures for a Funeral" (2024). Elokuvassa ohjaajan fiktiivinen alter ego Audrey matkaa viulisti Kathleen Parlow'n (1890–1963) jäljissä Kanadassa, Norjassa ja Englannissa. Parlow’n kohtalon rinnalla Audrey haluaa selvittää säveltäjä Johan Halvorsenin 18-vuotiaalle Parlow'lle omistaman konserton tarinan. 
          Elokuvan herättämiä ajatuksia vaihtavat muusikko Riitta Poutanen ja Outi Paananen.   
           
