        start_time: '2026-10-11T10:00:00+03:00'
        end_time: '2026-10-11T10:59:20+03:00'
        description: |-
          Levollinen luontoteemainen Godfulness-messu kutsuu hiljentymään ja lepäämään hetkeksi Jumalan läsnäolossa. Liturgina kirkkoherra Sari Lehti. Saarnan tilalla Godfulness-pohdiskelu, jonka ohjaa ympäristöasiantuntija Hannele Siltala. Kanttorina muusikko Jenni Kankaro. Yhteislaulut: Godfulness-messun laulut Turvakallio, Kivi kengässä, On niin paljon kiittämistä, Itämislepo, Rukouspuu, Taittunut korsi, Kannatteleva vesi, Rakastettu hiekanjyvä, Lohdutuksen Jumala ja Näkymätön tuuli.
