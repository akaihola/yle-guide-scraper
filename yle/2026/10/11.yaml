      - title: 'Romano mirits: Kun elämä antaa uuden mahdollisuuden – Mertsi Hagert'
        start_time: '2026-10-11T23:24:50+03:00'
        end_time: '2026-10-11T23:39:24+03:00'
        description: |-
          Kun elämä antaa uuden mahdollisuuden – Mertsi Hagert

          Tämänkertaisessa Romano Mirits -ohjelmassa vieraana on 38-vuotias Mertsi Hagert, jonka elämäntarina kertoo rohkeudesta, muutoksesta ja uuden suunnan löytämisestä. Mertsi kertoo avoimesti päihdetaustastaan, joka alkoi jo nuoruudessa, sekä siitä hetkestä, jolloin hän ymmärsi, että elämälle oli tehtävä muutos.
          Haastattelussa kuullaan myös, kuinka hän peruskoulun jälkeen ajatteli, ettei enää koskaan lähtisi opiskelemaan. Elämä kuitenkin yllätti, ja vuosien jälkeen hän päätti tarttua uuteen mahdollisuuteen, lähti opiskelemaan ja valmistui kasvatus- ja ohjausalan ammattilaiseksi. Nykyään Mertsi tekee työtä nuorten parissa ja toimii myös vapaaehtoistyössä.
          Hänen tarinansa osoittaa, että ihminen voi muuttua, kasvaa ja löytää itsestään voimavaroja, joita ei ehkä aiemmin uskonut omaavansa. Luvassa on inspiroiva keskustelu siitä, kuinka vaikeistakin lähtökohdista voi rakentaa uuden suunnan elämälleen ja löytää oman paikkansa yhteiskunnassa. Toimittajana Dimitri Grönfors.
