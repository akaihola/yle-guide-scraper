          Beach: Chanson d'amour (Emma Kirkby, sopraano, James Lisney, piano, ja Charles Medlam, sello).

          Beethoven: Andante con moto alla marcia - Presto septetosta Es-duuri (The Chamber Music Society of Lincoln Center).

          C. Schumann: Liebst du um Schönheit (Jos rakastat kauneutta) (Miriam Alexandra, sopraano, ja Josef De Beenhouwer, piano).  

