      - title: 'Uutispodcast: Miten epäillyt koteihin tunkeutumiset ovat vaikuttaneet eduskunnan ilmapiiriin? '
        start_time: '2026-10-11T21:00:53+03:00'
        end_time: '2026-10-11T21:23:49+03:00'
        description: |-
          Kuinka puhua hybridiuhista? Poliisi on aloittanut esitutkinnan epäillyistä tunkeutumisista kansanedustajien asuntoihin. Tapauksia tutkitaan törkeänä varkauden yrityksinä. Kuinka hybridiuhista tulisi keskustella ja missä menee raja pelottelun ja tolkun varautumisen välillä? Millaista keskustelua eduskunnan käytävillä on asian tiimoilta käyty. Atte Uusinokan haasteteltavana kansanedustaja Jarno Limnell (kok.) .
