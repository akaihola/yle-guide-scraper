          Schubert: Die Nacht (Robert Shaw Chamber Singers/Robert Shaw). 

          Ravel: Menuet antique (Vanhanaikainen menuetti) (Steven Osborne, piano).

          Suk: Balladi jousikvartetille d-molli (Minguet Quartet).

          Bornelh: S'ie-us quier conseil, bel'amig'Alamanda (Jos pyydän neuvoanne, kaunis Alamanda) (Martin Best, maurilainen kitara).

          Stravinsky: Scherzo bal. Tulilintu (Anthony Marwood, viulu, ja Thomas Adès, piano).

          Konsertin on toimittanut Riikka Holopainen.
