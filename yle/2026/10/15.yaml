        description: |-
          Rameau: Entr'acte (Tuulet) oopp. Les Boreades (Le Concert des Nations/Jordi Savall).

          Parker: Arc-en ciel (Sateenkaari) (Jeanell Carrigan, piano).

          Rossini: Temporale (Myrskymusiikkia) oopp. Sevillan parturi (Milanon La Scala -oopperan ork./Riccardo Chailly).

          Mäntyjärvi: Full fathom five (Arielin laulu) teoks. Four Shakespeare songs (Kampin Laulu/Timo Lehtovaara).

          Mägi: Allegro assai teoks. Sinfonia (Viron valtion SO/Mihkel Kütson).

          Ruth: Andante molto tranquillo sonaatista n:o 2 h-molli (Bengt Forsberg, piano).

          Monteverdi: Hor che'l ciel e la terra e 'l vento tace (Nyt kun taivas, maa ja tuuli vaikenevat) (Concerto Italiano/Rinaldo Alessandrini).

          Tüür: Tormiloits (Myrskyloitsu) (Eesti Festivaliorkester/Paavo Järvi). 

          Paradis: Sicilienne (Jacqueline du Pré, sello, ja Gerald Moore, piano).

          Wagner: Kehruukuoro "Summ' und brumm'" oopp. Der Fliegende Holländer (Lentävä hollantilainen) (Leipzigin radiokuoro ja Dresdenin valtionork./Silvio Varviso).

          Bonds: Troubled water (Althea Waites, piano).

          Price: Juba sinfoniasta n:o 3 c-molli (Philadelphian ork./Yannick Nezet-Seguin).

          Konsertin on laatinut Noora Hirn.
