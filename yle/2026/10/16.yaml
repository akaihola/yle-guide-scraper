        start_time: '2026-10-16T17:05:00+03:00'
        end_time: '2026-10-16T17:30:00+03:00'
        description: |-
          Kittilän liiketoimilla menee niin hyvin, että yksityisiä yrittäjiä ärsyttää. Bisneksiään laajentanut kunta kauppaa yhtiönsä kautta muun muassa viinaa ja luksustuotteita turisteille. Samaan aikaan kymmenen vuotta jatkuneet oikeusjutut ovat tulossa vihdoin päätökseen. 
          Muuttiko Suomea ravisuttanut Kittilän korruptioskandaali lopulta mitään?
          MOT-podcast selvittää, mitä löytyy päättäjien rikossyytteiden takaa.
