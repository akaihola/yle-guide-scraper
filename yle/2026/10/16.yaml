          Grieg: Morgenstemning (Aamutunnelma) näyt. Peer Gynt (Bergenin FO/Ole Kristian Ruud).

          Sibelius: En slända (Karita Mattila, sopraano, ja Ilmo Ranta, piano).

          Puccini: Rodolfon aaria "Che gelida manina" oopp. La bohème (Jussi Björling, tenori, ja ork./Nils Grevillius).

          Satie: Gnossienne n:o 2 (Aale Lindgren, oboe, ja Anni Kuusimäki, harppu).

          Rahmaninov: Elegia es-molli (Laura Mikkola, piano).

          R. Strauss: Im Abendrot sarj. Vier letzte Lieder (Soile Isokoski, sopraano, ja Berliinin radion SO/Marek Janowski).

