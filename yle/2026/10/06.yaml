        start_time: '2026-10-06T11:00:00+03:00'
        end_time: '2026-10-06T11:57:00+03:00'
        description: |-
          Vanhasta autiotalosta Yhdysvalloissa löytyy vuonna 2009 kasoittain vanhoja nuotteja, päiväkirjamerkintöjä ja kirjeitä.
          Ne kuuluvat vuosikymmeniä sitten kuolleelle säveltäjälle, Florence Pricelle.
          Käy ilmi, että afroamerikkalainen Price oli uranuurtaja, joka sävelsi klassista musiikkia aikana, kun rotu ja sukupuoli olivat raskaita rasitteita uralla. 
          Eva Tigerstedt avaa polkuja musiikkiin.
