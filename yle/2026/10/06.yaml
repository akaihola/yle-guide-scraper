      - title: 'Kulttuuriykkönen: Venäjän vallanvaihdosten väkivaltainen historia'
        start_time: '2026-10-06T15:00:00+03:00'
        end_time: '2026-10-06T15:58:00+03:00'
        description: |
          Venäjän historiassa vallanvaihdot ovat harvoin olleet yksinkertaisia tai rauhallisia. Miksi vallasta luopuminen ja vallan siirtäminen seuraajalle on Venäjällä ollut niin vaikeaa – ja mitä tämä kertoo maan poliittisesta kulttuurista ja Venäjän käsityksestä itsestään?
          Keskustelun lähtökohtana on historiantutkija Arto Luukkasen uusi kirja, joka tarkastelee Venäjän vallanvaihtoja ja vallankäytön pitkää jatkumoa. Kuinka paljon nyky-Venäjän toimintaa voidaan ymmärtää historian kautta? Miksi vahvan johtajan ajatus toistuu vuosisadasta toiseen, ja miksi järjestelmä henkilöityy niin helposti yhteen vallankäyttäjään?
          Samalla kysytään, miten Venäjän käsitys omasta erityisyydestään, suuruudestaan ja historiallisesta tehtävästään on vaikuttanut siihen, millaiseksi valta maassa on rakentunut. Onko Venäjän historiassa nähtävissä todellisia katkoksia – vai vaihtuvatko hallitsijat ja järjestelmät samalla kun vallankäytön syvemmät rakenteet säilyvät?
          Keskustelemassa ovat historiantutkija Arto Luukkanen, Ulkopoliittisen instituutin tutkija Kristiina Silvan sekä Itä-Euroopan historian emeritusprofessori Jukka Korpela.
          Toimittajana Ville Talola.
