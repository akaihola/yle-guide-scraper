      - title: 'Uusiutuva tiede: Oikeushistoria – miehet mestattiin, naiset hukutettiin'
        start_time: '2026-10-06T12:05:00+03:00'
        end_time: '2026-10-06T12:35:00+03:00'
        description: |-
          Länsimainen oikeusperinne ponnistaa erittäin vahvasti roomalaisesta oikeudesta. Myös kanonisella oikeudella eli katolisella kirkolla oli suuri merkitys Suomen alueella keskiajalla. Millaisia rikoksia käräjätuvissa puitiin menneinä vuosisatoina, ja minkälaisia rangaistuksia jaettiin? Montako markkaa oli mustelman tai hengen hinta? Miksi naiset piti hukuttaa tai haudata elävältä hirttämisen tai mestauksen sijaan? Juridiikan historiasta kertoo oikeushistorioitsija, oikeustieteen tohtori Pia Letto-Vanamo. Toimittajana Samppa Korhonen
      - title: 'Aristoteleen kantapää: Aleksis Kiven Seitsemän veljeksen kieltä moitittiin jo ilmestyessään toisaalta kansanomaiseksi, toisaalta vanhahtavan raamatulliseksi '
