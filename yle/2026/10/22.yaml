        description: |
          Couperin (sov. Russell): Les baricades misterieuses (David Russell, kitara).

          Sermisy: Jouyssance vous donneray (Clare Wilkinson, sopraano, Jacob Heringman, luuttu, ja Kirsty Whatley, harppu). 

          Rameau: Entree de Polymnie oopp. Boreadit (Musiciens du Louvre/Marc Minkowski).

          Kreisler: Tambourin chinois (Kiinalainen tamburiini) (Leonidas Kavakos, viulu, ja Peter Nagy, piano).

          Kats-Chernin: Naïve waltz (The Smith Quartet).

          de Falla: Serenata andaluza (Andalusialainen serenadi) (Mirka Viitala, piano).

          Saariaho: Il pleut (Sataa) (Anu Komsi, sopraano, ja Reija Bister, harppu).

          Respighi: Gianicolo-kukkulan pinjat sinf. runosta Rooman pinjoja (Pittsburghin SO/Lorin Maazel).

          Ahvenainen: Syyslehtien tanssi sarj. Syksy (Veikko Ahvenainen, harmonikka, ja Kouvolan kaupunginork./Kalervo Kulmala).

          Esenvalds: Stars (The Pembroke College Chapel Choir/Anna Lapwood).

          Konsertin laati Eva Tigerstedt
