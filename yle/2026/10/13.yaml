          Aivot ovat muovautuvat. Voiko niitä ikään kuin opettaa pääsemään eroon pitkittyneistä fyysisistä oireista kuten kroonisesta väsymyksestä tai jatkuvista säryistä, joille ei löydy elimellistä syytä? Vieraina neurologian erikoislääkäri Susanna Melkas ja ylilääkäri Hélène Rotkirch-Virrantaus.
