      - title: 'Aitiovieras: Urheilu, sosiaalinen media ja kulttuurin rajat - Ylen Media-yksikön strategi  Silja Tenhunen median kulutuksen muutoksista'
        start_time: '2026-10-13T13:35:00+03:00'
        end_time: '2026-10-13T14:00:00+03:00'
        description: |-
          Miksi edelleen puhutaan kuilusta urheilun ja kulttuurin välillä, vaikka monet meistä seuraavat kiinnostuneena molempia? Entä miten sosiaalinen media ja sen seuraaminen vaikuttavat arkeemme ja kulttuurin kuluttamiseemme? Ylen Media-yksikön strategi Silja Tenhunen seuraa työssään sitä, mitä me mediassa kulutamme ja mikä on ajankäytössämme median parissa muuttunut. Tenhunen on  Miia Lahden vieraana.
