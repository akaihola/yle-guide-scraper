      - title: 'Uusiutuva tiede: Sotahistoria – musketeista tappajarobotteihin'
        start_time: '2026-10-27T12:05:00+02:00'
        end_time: '2026-10-27T12:35:00+02:00'
        description: |-
          Kiviaseista miekkojen kautta ruutiin ja sotavaunuista ratsuväen kautta tankkeihin. Mitkä ovat olleet sodankäynnin isoimpia murroskohtia? Kumpi on taistelussa tärkeämpää, tehokkaammat aseet vai parempi taktiikka? Kuka on historian taitavin sotapäällikkö? Millainen vaikutus tulee olemaan autonomisilla aseilla ja tekoälyllä, juoksevatko taistelukentille pian tappajarobottiarmeijat?

          Sotataidosta ja sodankäynnin historiallisesta kehityksestä kertoo eversti (evp.), sotahistorian professori Petteri Jouko Maanpuolustuskorkeakoulusta. Toimittajana Samppa Korhonen.
      - title: 'Aristoteleen kantapää: Elämän loppumetrit, deadline vai exitus – Muistisairaiden hoitokodissakaan ei ole helppoa puhua kuolemasta'
        start_time: '2026-10-27T12:35:00+02:00'
        end_time: '2026-10-27T13:00:00+02:00'
        description: |
          Pasi Heikura menee muistisairaiden hoitokotiin akatemiatutkija Jenny Paanasen kanssa selvittämään, miten siellä puhutaan kuolemasta. Ohjelmassa selviää myös, mitä tapahtuu, kun valmentaja saa monokkelia ja onko ahdistavaa olla 24 seinän sisällä.
          Ohjelman ovat toimittaneet Pasi Heikura ja Tina Cavén.
