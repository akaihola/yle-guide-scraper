      - title: 'Klasariparatiisi: B.H. Crusell - Suomen ensimmäinen kansainvälinen säveltäjä, osa 1'
        start_time: '2026-10-18T07:00:47+03:00'
        end_time: '2026-10-18T07:57:06+03:00'
        description: |+
          Hän tuli köyhästä perheestä Suomen Uudestakaupungista. Pikkupoikana hän sai klarinetin, ja se vei hänet maailmalle. Hänestä tuli virtuoosinen soittaja, ja hänen klarinettisävellyksensä kuuluvat nykyään klarinetistien persuohjelmistoon. Hän oli kielimies, hyväntekijä ja käsineiden ompelija.
          Hänen musiikkinsa on täynnä soiton- ja elämäniloa.
          Miksi emme tunne häntä paremmin?

          Nyt Bernhard Henrik Crusell viettää 250-vuotisjuhlavuottaan. Klasariparatiisissa Crusellin elämään meidät kuljettaa Janne Palkisto, joka on Crusell-viikon toiminnanjohtaja, Crusellista väitellyt tutkija ja elämäkerran kirjoittaja. 
          Eva Tigerstedt haastattelee, ja avaa polkuja musiikkiin.

          (uusinta vuodelta 2025, jolloin vietettiin Crusellin 250-vuotisjuhlavuotta)


          Ohjelman musiikit:

          Bernhard Henrik Crusell: 
          Allegro non tanto ja Finaali, Kvartetosta klarinetille ja jousille n:o 3 D-duuri op.7.  (Kari Kriikku, klarinetti, ja  Avanti!-trio). 

          Trio klarinetille, fagotille ja käyrätorvelle F-duuri, ote  (Emma Johnson, klarinetti, Philip Gibbon, fagotti, Michael Thompson, käyrätorvi).

          Wolfgang Amadeus Mozart: Adagio Serenadista B-duuri (Gran partita) (Harmonie l'Orchestre des Champs Elysees/Philippe Herreweghe).
           
          Christian Cannabich: Finaali Sinfoniasta n:o 67 G-duuri (Lukas Consort/ Viktor Lukas). 

          Bernhard Henrik Crusell: Duo kahdelle klarinetille n:o 1 F-duuri, ote (Christoffer Sundqvist ja Giuseppe Gentile, klarinetti).

          Christoph Willibald Gluck: Venez, secondez mes  desirs, oopperasta Armide (Patricia Petibon, sopraano, ja Concerto Köln/Daniel Harding).

          Bernhard Henrik Crusell: Romanssi, Kvartetosta klarinetille ja jousille n:o 1 Es-duuri op.2. (Kari Kriikku, klarinetti, ja  Avanti!-trio). 

