        start_time: '2026-10-18T16:07:00+03:00'
        end_time: '2026-10-18T16:59:59+03:00'
        description: |-
          Thériault: Transmutation (Angèle Dubeau, viulu, ja La Pietà).

          Dyens: Tango en skai (Milos Karadaglic, kitara).

          R. Schumann: Lebhaft teoks. Konzertstück neljälle käyrätorvelle ja orkesterille F-duuri (Markus Maskuniitty, Martin Schöpfer, Kristofer Öberg, Monica Berenguer Caro sekä Tukholman FO/Sakari Oramo).

          Stolz: Frag' nicht warum ich gehe elok. Das Lied ist aus (Jonas Kaufmann, tenori, ja Berliinin radion SO/Jochen Rieder).

          Mendelssohn: Lied ohne Worte (Sanaton laulu) n:o 25 G-duuri (Timo Mikkilä, piano).

          Aulin: Andante espressivo jousikvartetosta F-duuri (The Tale Quartet). 

          Beach: Pastorale (Ambache Chamber Ensemble).

          Dvorák: Polkka teoks. Tshekkiläinen sarja (Ceska suita) (Detroitin SO/Antal Dorati).

          Cockenpot: Automne (Patricia Petibon, sopraano, ja Susan Manoff, piano). 

          Gismonti: Infancia (Sergio Assad ja Odair Assad, kitara).

          Konsertin on toimittanut Tuomas Niemelä.
