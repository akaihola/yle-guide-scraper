      - title: 'Uutispodcast: Miksi kukaan ei tiedä, mistä Suomen Pisa-romahdus johtuu?'
        start_time: '2026-10-18T21:00:56+03:00'
        end_time: '2026-10-18T21:22:28+03:00'
        description: |
          Suomen Pisa-tulokset ovat romahtaneet poikkeuk­sellisen jyrkästi. Mutta mistä tämä johtuu? Lähes jokaisella on tästä mielipide, joka pohjaa usein omiin kokemuksiin kouluajasta. Suomen kouluista ei kuitenkaan kerätä riittävästi tietoa, jonka perusteella oppimistulosten muutoksia voisi analysoida. Millaista tietoa tarvittaisiin? 
          Leonard Wilhelmuksen haastateltavana on toimittaja Petteri Lindholm. 
      - title: 'Aitiovieras: Näyttelijä Riitta Havukainen: ”Kaikissa rooleissa on tärkeintä se, että siitä tulee uskottava"'
        start_time: '2026-10-18T21:23:10+03:00'
        end_time: '2026-10-18T21:48:00+03:00'
        description: |-
          Näyttelijä Riitta Havukainen on tänä syksynä mukana kahdessakin eri aikojen poliittisia käänteitä kuvaavassa teoksessa. Yle audiodraamassa Syntiseksi syntynyt -Päivi Räsänen, Havukaisella on päärooli Räsäsenä. Syyskuussa ensi-iltansa saaneessa elokuvassa Presidentin kyyditys hän näyttelee presidentin puoliso Ester Ståhlbergiä. Riitta Havukainen on Miia Lahden haastattelussa.
