      - title: 'Elävä historia tutkii: Pälkäneen kallot 2/5 - Oliko Gustav Retzius kallonryöstäjä?'
        start_time: '2026-10-18T12:05:00+03:00'
        end_time: '2026-10-18T12:55:00+03:00'
        description: |-
          Gustav Retziuksesta on maalattu kuvaa rasistisena kallonryöstäjänä. Toimittaja Kaisa Pulakka selvittää, mistä rotututkija Retziuksen kalloretkessä todella oli kyse. Tuoko Retziuksen kadonneeksi luultu päiväkirja vastauksia?  Toimittaja ja käsikirjoittaja: Kaisa Pulakka
          Äänisuunnittelu: Joonatan Kotila
          Dramaturgi: Are Nikkinen
          Tuottaja: Pertti Ylikojola



          Elävä historia vie matkalle menneisyyden ihmisten tarinoihin aina muinaisesta Egyptistä Suomen lähihistoriaan. Kuuntelemalla näet maailman toisin.
