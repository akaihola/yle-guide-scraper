        description: |-
          Kerschek: Harvest dance and too much wine teoks. Autumn (The new four seasons) (Niklas Liepe, viulu, ja Kölnin radio-ork./Patrick Lange, sekä Nils Liepe, piano). 

          J. Haydn: Divertimento G-duuri (Lontoolainen trio n:o 4) (Jean-Pierre Rampal, huilu, Isaac Stern, viulu, ja Mstislav Rostropovitsh, sello).

          C. Schumann: Walzer (Valssi) (Stephan Loges, baritoni, ja Eugene Asti, piano).

          Dale: There will come (Steven Isserlis, sello, ja Philharmonia Orchestra/Michael Collins).

          Jaëll: Pressentiments teoks. Ce qu'on entend dans le purgatoire (David Bismuth, piano).

          Ugalde Alvarez: Heartland (Singer Pur).

          Hahn: Vif et gai teoks. Serenade huilulle, klarinetille, oboelle ja fagotille (Ensemble Initium).

          Tshaikovski: Allegro con grazia sinfoniasta n:o 6 h-molli (Pateettinen) (Liverpoolin kuninkaallinen FO/Vasili Petrenko).

          Dvorák: Allegro pianotriosta n:o 4 e-molli (Dumky) (The Tempest Trio).

          Spektor: Take me home tonight (Maeve Höglund, sopraano, ja Jean-Paul Björlin, piano).

          Respighi: Fuuga D-duuri (BBC:n FO/Gianandrea Noseda).

          Konsertin on toimittanut Annina Aho.
