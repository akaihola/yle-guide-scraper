      - title: Klassisen musiikin iltakonsertti
        start_time: '2026-10-14T19:02:00+03:00'
        end_time: '2026-10-14T20:11:00+03:00'
        description: |
          Euroradiokonsertissa esiintyy lauluyhtye Ars Nova Copenhagen, joka tunnetaan kiehtovista ohjelmistaan ja vaikuttavista tulkinnoistaan. Musiikkia johtaa Sofi Jeannin, yksi nykyhetken arvostetuimmista kuoronjohtajista. 

          How to fold the Wind -konsertin ohjelmassa on musiikkia keskiajalta tähän päivään sekä säveltäjänaisilta että -miehiltä. Huhtikuussa 2026 Barcelonassa äänitetty konsertti päättyy sen nimiteokseen, Caroline Shaw’n How to fold the Wind -sävellykseen, joka on saanut inspiraationsa japanilaisesta origamista. 

          Barcelonassa huhtikuussa 2026 äänitetyn konsertin toimittaa Ainomaija Pennanen. 
