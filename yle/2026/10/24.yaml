      - title: 'Keinuva talo - Mika Kauhanen: Villi ja viileä maailmankitara'
        start_time: '2026-10-24T22:40:15+03:00'
        end_time: '2026-10-24T23:39:30+03:00'
        description: |-
          Keinuvan talon kitaramatka ei ole aivan matka maailman ympäri, mutta neljälle mantereelle ehditään. On pohjoisamerikkalaista rauhanbluesia ja ripeää ragtimea, espanjalaista rumbaa ja flamencoa tai kitarakokeiluja italialaisittain. Kuulemma myös, kuinka kitaraotteet määrittelevät afrikkalaisten lauluntekijöiden kokonaissoundia, tai kuinka perulaisen kansanmusiikin teemoja käsitellään jazzin kieliopilla. Valinnat toimittajalta, joka itsekin on kitaristi. 
