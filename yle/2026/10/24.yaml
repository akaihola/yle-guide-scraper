      - title: 'Maailmanpolitiikan arkipäivää: Rämpiikö mellakoihin ajatutunut Ranska hybridioperaatioiden hetteikössä?'
        start_time: '2026-10-24T10:00:00+03:00'
        end_time: '2026-10-24T10:25:00+03:00'
        description: |-
          Hybridivaikuttamisen päällimmäisenä tavoitteena on lietsoa epävarmuutta ja kylvää hämmennystä.
          Erityisesti Venäjä pyrkii luomaan jakolinjoja Euroopassa ja muualla myös valtioiden sisälle.
          Hybridivaikuttamisen roolia pohditaan juuri nyt Ranskassa, jossa mielenosoitukset kärjistyivät mellakoinniksi aiemmin tässä kuussa.
          Maailmanpolitiikan arkipäivää-ohjelman toimittavat  Teemu Juhola, Miina Väisänen ja Erja Tuomaala. Äänitarkkailijana on Marko Vierikko.
      - title: 'Uusiutuva tiede: Lääketiede 2/2 – Kallonporausta ja muita toimivia hoitoja'
        start_time: '2026-10-24T10:25:00+03:00'
        end_time: '2026-10-24T10:55:00+03:00'
        description: |-
          Lääketieteen historiaan mahtuu kamalia harhapolkuja, mutta myös loistavia läpimurtoja ja voittokulkuja. Onnistuneita kallonporauksia tehtiin tuhansia vuosia sitten ja silmäleikkauksiakin jo keskiajalla. Parantamisesta oli ymmärrystä, vaikka esimerkiksi taudinaiheuttajat olivat tuntemattomia. Lääketieteen kehityksestä ja edistyaskeleista kertoo Suomen Lääketieteen Historian Seuran puheenjohtaja Elina Maaniitty. Toimittajana Samppa Korhonen.
