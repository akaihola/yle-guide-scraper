      - title: 'Aitiovieras: Elokuvat, jotka halusimme nähdä - Täältä tullaan elämä! ja Pitkä, kuuma kesä'
        start_time: '2026-10-24T21:23:38+03:00'
        end_time: '2026-10-24T21:47:38+03:00'
        description: |-
          Ylen satavuotisjuhlan kunniaksi Yle Teema ja Yle Areena esittävät sata kotimaista elokuvaa sadan vuoden ajalta. Elokuvat on koottu yleisön toiveiden perusteella. Ne julkaistaan Areenassa ja esitetään televisiossa Yle Teemalla. Kerran kuukaudessa Yle Radio 1:n Aitiovieraassa keskustellaan valituista elokuvista ja ilmiöistä niiden ympäriltä. Tällä kertaa Suomen elokuvasäätiön kulttuuriviennin suunnittelija Otto Suuronen kertoo kahdesta elokuvasta, joita yhdistää vuosi 1980. Elokuvat ovat  Täältä tullaan elämä! sekä Pitkä kuuma kesä. Jarmo Laitaneva haastattelee.
