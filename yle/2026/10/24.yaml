      - title: 'Maailma tarinoina: Liv Strömquistin Peilisalissa ja kauneudentavoittelu uutena uskontona'
        start_time: '2026-10-24T12:05:00+03:00'
        end_time: '2026-10-24T13:00:00+03:00'
        description: |
          Kauneusoperaatioiden vakavat riskit ja klinikoiden epäkohdat ovat olleet viime aikoina otsikoissa nuoren somevaikuttaja Olivia Oraksen menehdyttyä helsinkiläisellä kauneusklinikalla tehdyn rasvaimun yhteydessä. Somessa esiintyvät normaalipainoiset julkkikset ovat laihtuneet huomattavasti Ozempicin avulla, ja trendiksi on viime vuosina noussut niin sanottu “baby botox” eli botox-hoidon aloittaminen ennaltaehkäisevästi jo melko nuorena. On otollinen aika kaivaa esiin Liv Strömquistin Peilisalissa-sarjakuvateos (2021), joka filosofisten ja sosiologisten teorioiden avulla pureutuu nykyihmisen pakkomielteiseen suhteeseen kauneuteen. Ovatko erilaiset ruumiintekniikat ja täydellistymisen käytännöt uskontoon verrattavia ilmiöitä? Millainen rooli sosiaalisen median vaikuttajilla on ulkonäkökeskeisessä ajassamme? Miten myöhäsikapitalistinen kulutusyhteiskunta hyödyntää halun mekanismeja? 

          Marja Vehkasen kanssa aiheeseen pureutuu ruumiillisuustutkimukseen erikoistunut kulttuuriantropologi Taina Kinnunen.
      - title: 'Näistä levyistä en luovu: Litku Klemetti'
        start_time: '2026-10-24T13:00:00+03:00'
        end_time: '2026-10-24T13:55:00+03:00'
        description: |-
          Kiinnostavat ihmiset  kertovat lempimusiikkiinsa liittyviä muistoja ja tarinoita. Uusi jakso joka perjantai.
          Olet varmasti joskus miettinyt, miltä jonkin ihmisen päässä kuulostaa, millainen äänimaailma siellä on. Litku Klemetti paljastaa Näistä levyistä en luovu -ohjelmassa oman sisäisen äänensä ja toki paljon muutakin, kuten sen, mikä on maailman paras biisi, sekä sen, onko hän swiftie.
