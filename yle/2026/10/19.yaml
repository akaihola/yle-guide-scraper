      - title: 'Väkivallan markkinat K3J1: Terrorismia vai vapaustaistelua?'
        start_time: '2026-10-19T19:02:00+03:00'
        end_time: '2026-10-19T19:50:00+03:00'
        description: |
          Kun puhutaan terrorismista, mieleen nousee ISIS tai Al-Qaida, mutta 1970- ja 80-luvuilla terrorismi liitettiin vahvasti Eurooppaan. Silloin muun muassa järjestö nimeltä ETA taisteli kovin keinoin Francon diktatuuria vastaan Espanjassa. Ryhmän alkutaipaleella mukaan liittyi myös 17-vuotias Josu Urrutikoetxea, joka pysyi mukana 40 vuotta. 


          ETA:n keinovalikoimaan kuului salamurhia, pommi-iskuja ja kidnappauksia. Milloin kyse on oikeutetusta vapaustaistelusta ja milloin terrorismista? Mikä sai teinipojan uhraamaan loistavan tulevaisuutensa vapaustaistelulle?


          Jakson haastateltavat: Teemu Tammikko, Ulkopoliittisen instituutin vanhempi tutkija, Leena Malkki, Helsingin yliopiston terrorismin tutkija.

          Lähteitä:
          Endgame for ETA – Elusive Peace in the Basque Country, Teresa Whitfield,
          Mitä tiedämme terrorismista, Leena Malkki. Rebelde, ohjannut Juan Luis Napal, Irati Irratia. Don’t call me Ternera, ohjaajina Jordi Évole, Marius Sánchez. 
      - title: 'Suuri juomapodi J2: Limsaa eli sokeroitua vettä'
        start_time: '2026-10-19T20:10:00+03:00'
        end_time: '2026-10-19T20:55:00+03:00'
        description: |
          Limonadi on lasten juoma, aikuisten pahe ja yksi maailman tunnistettavimmista kulutustuotteista. Mutta mikä tekee hyvästä limsasta hyvän, ja kuinka paljon mausta syntyy jo ennen ensimmäistä hörppyä? 

          Markkinoinnin asiantuntija ja kolajuoman suurkuluttaja Alex Nieminen purkaa limonadien brändäämisen sääntökirjaa. Miten meidät saadaan ostamaan täysin tarpeetonta nestettä, ja juuri tiettyä brändiä? Miten sokeroidut juomat yrittävät erottua toisistaan? Helsingin yliopiston väitöskirjatutkija Sulo Roukka laittaa Janin makutestiin, jossa havaitaan, kuinka monimutkainen konsepti “maku” on. Jos limu on punaista, miltä se voi maistua ja miksi?
