      - title: 'Kulttuuriykkönen: Kuka saa kirjallisuuden Nobelin – Mitä palkinto merkitsee nykymaailmassa?'
        start_time: '2026-10-08T15:00:00+03:00'
        end_time: '2026-10-08T15:58:00+03:00'
        description: |-
          Kirjallisuuden Nobel-palkinnon saaja ratkeaa torstaina 8. lokakuuta juuri ennen Kulttuuriykkösen lähetystä. Onko palkittu tuttu suomalaisille lukijoille vai yllättääkö Ruotsin akatemia valitsemalla tuntemattoman suuruuden, josta emme ole kuulleetkaan? 
          Lähetyksessä analysoimme voittajaa tuoreeltaan. Lisäksi pohdimme Nobel-palkinnon merkitystä nykymaailmassa ja suomennetun laatukirjallisuuden tilaa. Studiossa ovat kriitikko Vesa Rantama, suomentaja Lotta Toivanen sekä kustantaja Päivi Koivisto Teoksesta. Lähetyksen toimittaa Miia Gustafsson.
