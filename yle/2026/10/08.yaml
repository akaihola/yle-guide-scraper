      - title: 'Tuuli Saksalan keidas: Eliades Ochoa, Aynur ja Wardruna" – syksyn konserttivinkit Keitaalla'
        start_time: '2026-10-08T17:35:00+03:00'
        end_time: '2026-10-08T18:25:00+03:00'
        description: |-
          Tuuli Saksalan Keitaalla haarukoidaan syksyn kiinnostavaa konserttitarjontaa – luvassa on vieraita ympäri maailman, Turkista Kuubaan ja Kongosta Maliin.

          Ohjelmassa kuullaan kuubalaisen musiikin legenda Eliades Ochoa, joka juhlii 80-vuotissyntymäpäiviään livekiertueella ja saapuu Suomeen Fiesta de Cuba -tapahtumaan lokakuun lopulla. Ranskalainen Kolinga tuo mukanaan kongolaisjuurista popia ja rumbaa. Kuubalaisen musiikin uusi tähti Ana Carla Maza ja perinteitä uudistava Elio Revé y su Charangón täydentävät latinalaisamerikkalaista tarjontaa.

          Etnosoi!-festivaalin kunniaksi kuullaan kurdilaista laulua ja Turkin sensuroimaa hittiä esittävä Aynur sekä suomalais-latinalaista harmonikkamusiikkia tekevä Saarenkylä-yhtye, joka juhlistaa uutta Island Village -albumiaan. Norjalainen Wardruna vie kuulijat viikinkiaikaan muinaisilla soittimilla ja luonnon äänillä täydennettynä.

          Lopuksi vinkataan Yle Areenan Etnokonsertteihin, joista tällä viikolla kuultavana on puolalaisen WoWakinin livekonsertti.

          Eliades Ochoa – All Along the Watchtower
          Kolinga – Kongo
          Songhoy Blues – Soubour
          Ana Carla Maza – Cha cha cha
          Elio Revé – Rumba Caliente
          Aynur – Kece Kurdan
          Saarenkylä – Katastrofi
          Wardruna – Gra
          WoWakin – Rutka
