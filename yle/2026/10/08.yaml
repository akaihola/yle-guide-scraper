      - title: 'Marko Gustafsson: Käännekohdissa Liisa Keltikangas-Järvinen'
        start_time: '2026-10-08T10:00:00+03:00'
        end_time: '2026-10-08T10:53:00+03:00'
        description: |-
          Psykologian emeritaprofessori Keltikangas-Järvisen tietokirja Itsekkyyden aika julkaistiin tammikuussa 2026. Syksyllä 2026 siitä otettiin jo kymmenes painos. Kirjan suosio yllätti Keltikangas-Järvisen täysin. Hän  on suosiosta äärimmäisen iloinen. “Palautteen perusteella ihmiset tunnistavat tässä ajassa saman, mitä hän on kirjassaan yrittänyt kuvata ja sehän antaa toivoa”, sanoo tammikuussa 80 vuotta täyttänyt Liisa Keltikangas-Järvinen
