          Järnefelt: Vill du komma med mig? (Olle Persson, baritoni, ja Orphei Drängar/Robert Sund).

          Melartin: Poissons à voile (Purjekala) bal. Sininen helmi (RSO/Hannu Lintu). 

          Gershwin: Porgyn ja Bessin duetto "Bess, you is my woman now"  oopp. Porgy ja Bess (Anne-Sophie Mutter, viulu, ja André Previn, piano).

          Gounod: Vincentin resitatiivi ja aaria "Mon coeur est plein d'un noir souci - Anges du paradis" oopp. Mireille (Rolando Villazón, tenori, ja Ranskan radion FO/Evelino Pido).

          Holmström: Joyful jig sarj. Imaginary dances (Matilda Kärkkäinen, piano).

          Shaw: The beech tree sarj. Plan and elevation (Norjan kamariork./Pekka Kuusisto, viulu).

          Weill: Speak low (Anne Sofie von Otter, mezzosopraano, ja Pohjois-Saksan radion SO/John Eliot Gardiner).

          Konsertin on laatinut Ainomaija Pennanen. 
