      - title: 'Aitiovieras: Näyttelijä Marketta Tikkanen - Seilin naiset ja nykypäivän kaiut '
        start_time: '2026-10-07T13:35:00+03:00'
        end_time: '2026-10-07T14:00:00+03:00'
        description: |2-
           Näyttelijä Marketta Tikkanen esittää pääosaa Alli Haapasalon elokuvassa Kerro kaikille. Elokuva kertoo naisista, jotka suljettiin Seilin saarelle mielenterveysongelmien, köyhyyden tai asunnottomuuden takia. Miltä Tikkasesta tuntui sukeltaa rankkaan tarinaan? Löysikö näyttelijä yhteneväisyyttä nykyajan naisten elämästä sadan vuoden takaisiin kohtaloihin? Entä minkälaista Airiston saarella oli kuvata elokuvaa? Kati Turtola haastattelee.
