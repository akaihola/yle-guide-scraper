      - title: 'Kulttuuriykkönen: miten tiedämme sen, mitä tiedämme historiasta?'
        start_time: '2026-10-07T15:00:00+03:00'
        end_time: '2026-10-07T15:58:00+03:00'
        description: |-
          Mistä me oikein tiedämme, mitä ennen vanhaan tapahtui? Kukaan meistä ei ollut itse paikalla, kun historia tapahtui – niin mistä se tieto sitten tulee? Ja kuinka luotettavana historian tulkintaa voi ylipäätään pitää, kun erilaiset aatteet ja suuntaukset, kuten marxilainen historiankirjoitus tai feministinen historiantutkimus, ovat vuosien saatossa muuttaneet sitä, miten menneisyyttä tulkitaan?

          Aihetta pohtivat dosentti Pertti Grönholm (Turun yliopisto), professori Anu Lahtinen (Helsingin yliopisto) ja arkeologi Ilari Aalto (Turun yliopiston kirjasto).

          Ohjelman juontaa Nicklas Wancke.
