      - title: 'Uutispodcast: Brasilian vaalit – miksi Latinalainen Amerikka liikkuu kohti Trumpia?'
        start_time: '2026-10-25T21:00:15+02:00'
        end_time: '2026-10-25T21:22:29+02:00'
        description: |
          Brasiliassa vaalitaistoa käyvät istuva presidentti Luiz Inácio Lula da Silva ja entisen presidentin poika Flávio Bolsonaro. Viime aikoina oikeistolaiset ehdokkaat ovat voittaneet vaalit muun muassa Kolumbiassa, Hondurasissa ja Boliviassa. Miksi Etelä-Amerikassa puhaltavat oikeistotuulet? Leonard Wilhelmuksen haastateltavana on Helsingin yliopiston maailmanpolitiikan professori Teivo Teivainen.
      - title: 'Aitiovieras: Kirjailija Matti Rönkä "On ihmiselle lajityypillistä, että haluamme laulaa, tanssiä, leikkiä ja tehdä turhaa"'
        start_time: '2026-10-25T21:23:00+02:00'
        end_time: '2026-10-25T21:48:47+02:00'
        description: |2-
           Kirjat voivat viedä lapsen salaisiin puutarhoihin, hurjiin seikkkailuihin ja naurattaa niin, että vatsapohjaan sattuu. Lapsen ja aikuisen yhteiset lukuhetket taas luovat erityistä läheisyyttä. Tänä syksynä ilmestynyt Pentukuumetta Käpälämäessä on Matti Röngän toinen lastenkirja. Aikuisille lukijoille Rönkä on kirjoittanut kaikkiaan neljätoista romaania. Mitä eläköitynyt uutistoimittaja, isä, ja isoisä Rönkä ajattelee lasten lukemisesta ja miksi hän haluaa kirjoittaa myös lapsille?  Miia Lahti haastattelee.
