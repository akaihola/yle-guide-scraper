          Tormis: Üle taeva jooksevad pilved (Yllä taivaan kiitävät pilvet) sarj. Sügismaastikud (Syksyisiä maisemia) (Viron radion kuoro/Toomas Kapten).

          Melartin: Giocoso teoks. Divertimento n:o 1 (RSO/Anna-Maria Helsing).

          Kuula: Vanha syyslaulu (Jorma Hynninen, baritoni, ja Ralf Gothóni, piano).

          Chaminade: Automne (Syksy) (Michael Guttman, viulu, ja Lontoon kuninkaallinen FO/José Serebrier).

          Schmidt: Intermezzo oopp. Notre Dame (Göteborgin SO/Neeme Järvi).

          Reger: Winterahnung (Talven aavistus) (Christiane Karg, sopraano, ja Burkhard Kehring, piano). 

          Satie: Poudre d'or (Kultapölyä) (Lamoureux-ork./Yutaka Sado).

          J. Strauss, nuor.: Entweder oder (Joko tai) (Wienin filharmonikot/Mariss Jansons).

          Konsertin on laatinut Heikki Puskala.
