      - title: 'Uusiutuva tiede: Lääketiede 2/2 – Kallonporausta ja muita toimivia hoitoja'
        start_time: '2026-10-25T22:45:54+02:00'
        end_time: '2026-10-25T23:14:52+02:00'
        description: |-
          Lääketieteen historiaan mahtuu kamalia harhapolkuja, mutta myös loistavia läpimurtoja ja voittokulkuja. Onnistuneita kallonporauksia tehtiin tuhansia vuosia sitten ja silmäleikkauksiakin jo keskiajalla. Parantamisesta oli ymmärrystä, vaikka esimerkiksi taudinaiheuttajat olivat tuntemattomia. Lääketieteen kehityksestä ja edistyaskeleista kertoo Suomen Lääketieteen Historian Seuran puheenjohtaja Elina Maaniitty. Toimittajana Samppa Korhonen.
