      - title: 'Elävä historia tutkii: Pälkäneen kallot 3/5 - Kuka on muumioitunut Huolestunut Rouva?'
        start_time: '2026-10-25T12:05:00+02:00'
        end_time: '2026-10-25T12:55:00+02:00'
        description: |
          Kuka oli Suomeen palautettujen kallojen joukosta löytynyt muumioitunut nainen? Iäkkään naisen kallo saa toimittaja Kaisa Pulakan liikuttumaan. Miksi arvokkaaseen silkkihattuun puetun rouvan kohtalo koskettaa niin syvästi? Toimittaja Kaisa Pulakka. Äänisuunnittelu Joonatan Kotila.
