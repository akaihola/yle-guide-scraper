      - title: 'Romano mirits: Rohkeaa heittäytymistä ja yhteisöllisyyttä romanikielen leirillä'
        start_time: '2026-10-25T23:24:53+02:00'
        end_time: '2026-10-25T23:39:31+02:00'
        description: |-
          Lakeuden Romanit ry järjesti romanikielen opetusta vuosina 2025 ja 2026 Kulttuurirahaston apurahan voimin. Projektin päätepiste oli elokuussa järjestetty toinen kielileiri Kuortaneella. Leirille osallistuneet kiittelivät toiminnallista opetustapaa ja leirillä koettua yhteisöllisyyttä. Aarteenmetsästyksessä heittäydyttiin rohkeasti kilpailun tuoksinaan ja koetettiin ratkaista romanikielisten vihjeiden pohjalta, mistä palkinto löytyy. 

          Leiritunnelmassa mukana oli toimittaja Jaakko Laakso.
