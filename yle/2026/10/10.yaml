      - title: 'Maailma tarinoina: Yksin Marsissa henkii meliorismia'
        start_time: '2026-10-10T12:05:00+03:00'
        end_time: '2026-10-10T13:00:00+03:00'
        description: |-
          Andy Weirin romaaniin pohjautuvassa, Ridley Scottin ohjaamassa elokuvassa Yksin Marsissa (2015) astronautti ja kasvitieteilijä Mark Watney ratkoo ongelman kerrallaan tieteen ja neuvokkuutensa avulla, yltiöpäiseen optimismiin tai lamaannuttavaan pessimismiin vajoamatta. Hän operoi jossain niiden välimailla, melioristin elämänasenteella. Näin asian näkee ainakin filosofi Lauri Järvilehto, jonka kanssa Marja Vehkanen perkaa elokuvan kehystämänä meliorismin perusideaa, historiaa ja sitä, miksi se istuu ajattelun työkaluna kriisien aikakauteemme. Mikä merkitys on paitsi omalla toiminnalla myös toisilla ihmisillä? Miten meliorismi sotii aikamme optimointivimmaa ja täydellisyyden tavoittelua vastaan?
