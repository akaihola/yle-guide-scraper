      - title: 'Kirjani tarina: Virginia Woolf Orlando - suomentaja Kaisa Kattelus'
        start_time: '2026-10-10T07:30:42+03:00'
        end_time: '2026-10-10T07:54:17+03:00'
        description: |-
          Virginia Woolfin Orlando-klassikkoromaanin päähenkilö seikkailee eri vuosisadoilla pitkin Eurooppaa ja muuttuu nukkuessaan miehestä naiseksi. Herättyään naisena Orlando huomaakin yhteiskunnan kohtelevan häntä aivan toisin kuin aiemmin miehenä. Jo vuonna 1928 ilmestyessään romaani haastoi aikansa sukupuolirooleja ja samalla koko käsityksemme sukupuolesta.

          Orlandon suomentanut Kaisa Kattelus ja toimittaja Jukka Kuosmanen keskustelevat klassikkoromaanin merkityksestä ja modernin itsenäisen naisen synnystä.
