      - title: Minkä laulutekstin haluaisit kuulla?
        start_time: '2026-10-10T19:02:00+03:00'
        end_time: '2026-10-10T21:00:00+03:00'
        description: |-
          Laululyriikka on runoutta, joka on läsnä monenlaisissa hetkissä. Se kulkee mukanamme eri elämänvaiheissa ja luo taustaa kokemuksille ja tunteille.

          Tämän runon haluaisin kuulla -lähetyksessä 10.10.2026 toivotaan ja kuunnellaan laululyriikkaa. Lähetyksessä on vieraana sanoittamista opettava Matti Huhta, joka tunnetaan myös räppärikonkari Serenä (ent. Seremoniamestari).

          Lähetä runotoiveesi joko sähköpostilla toive.runot@yle.fi tai linkkinä olevalla lomakkeella. Jätäthän yhteystietosi, jotta voimme olla sinuun tarvittaessa yhteydessä. Toiveesi voi olla osa Tämän runon haluaisin kuulla -ohjelmaa.

          Lähetyspäivänä lauantaina 10.10. runotoiveita otetaan vastaan numerossa 09 144 800 klo 18-21.

          Toiveita toteuttavat näyttelijä Vuokko Hovatta ja lausuja Jarmo Heikkinen. Ohjelman toimittavat Pietari Kylmälä ja Kaisa Pulakka.
