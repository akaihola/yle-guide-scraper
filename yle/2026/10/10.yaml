        end_time: '2026-10-10T16:59:59+03:00'
        description: |+
          Dvorák: Poloneesi oopp. Rusalka (Minnesotan ork./Eiji Oue).

          Kauppi: Eskon monologi "Niin muuttuu mailma, sanoi pappa" oopp. Nummisuutarit (Veikko Tyrväinen, tenori, ja Meri Louhos, piano).

          Beamish: The wise maid (Robert Irvine, sello).

          Ravel: Les entretiens de la Belle et de la Bête (Kaunotar ja hirviö) sarj. Ma mère l'Oye (Hanhiemo) (Minnesotan ork./Charles Dutoit).

          Rautavaara: Sydämeni laulu sarj. Halavan himmeän alla (RKK/Timo Nuoranne).

          Tailleferre: Deux valses (Kaksi valssia) kahdelle pianolle (Eveliina Sumelius-Lindblom ja Maija Parko).

          Portman: Flight (Angèle Dubeau, viulu, ja La Pietà).

          Farrenc: Poco adagio sonaatista viululle ja pianolle n:o 1 (Gaetane Prouvost ja Laurent Cabasso).

          Belli: Grain moon (Anna Lapwood, urut). 

          Kilpinen: Metsämiehen laulu (Jorma Hynninen, baritoni, Maria Kalaniemi, harmonikka, ja Timo Alakotila, piano).

          Dring: Festival scherzo (Martin Roscoe, piano, ja Guildhall Strings/Robert Salter).

          Konsertin on toimittanut Annina Aho.

