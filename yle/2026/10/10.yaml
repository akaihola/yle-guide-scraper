      - title: 'Keinuva talo - Mika Kauhanen: Sadesään seuraksi'
        start_time: '2026-10-10T22:40:00+03:00'
        end_time: '2026-10-10T23:39:30+03:00'
        description: |-
          Kappaleita sadesään seuraksi kuulemme tällä kertaa Keinuvassa talossa. Kun aluksi tanssitaan kuivuus pois ja torjutaan rankkasateet, päästään lempeään ja seesteiseen vihmaan. 

          Sadeikkunassa vilahtaa moneen kertaan kantele, jonka kieliltä putoaa ääniä kuin soinnillisia pisaroita. Tangon ja flamencon rytmikkäät sateet rummuttavat myös. Toimittajana Mika Kauhanen.
