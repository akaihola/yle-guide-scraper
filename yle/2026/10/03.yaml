      - title: 'Oopperailta: György Ligetin Le Grand Macabre Helsingin juhlaviikoilla'
        start_time: '2026-10-03T19:02:00+03:00'
        end_time: '2026-10-03T21:35:00+03:00'
        description: |-
          Ligetin rajoja rikkova kulttiooppera sai viimeinkin Suomen ensiesityksensä Helsingin juhlaviikoilla elokuussa. Nicholas Collon johtaa Musiikkitalossa Radion sinfoniaorkesteria, Helsingin kamarikuoroa sekä kovatasoista kansainvälistä solistijoukkoa. Illan aikana haastateltavina ovat oopperan ohjaaja Frederic Wake-Walker, Venuksen ja Gepopon kaksoisroolin tekevä sopraano Sarah Aristidou sekä Suomen kansallisoopperan ja -baletin ylikapellimestari Dima Slobodeniouk. Oopperaillan toimittaa Ahti Paunu. 
