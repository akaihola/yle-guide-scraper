        start_time: '2026-10-03T16:07:00+03:00'
        end_time: '2026-10-03T16:59:59+03:00'
        description: |-
          Prieto: Allegro moderato teoks. Sinfonia breve (Orquesta de Córdoba/José Luis Temes).

          Grieg: Zur Rosenzeit (Ruusujen aikaan) (Johannes Weisser, baritoni, ja Sören Rastogi, piano).

          Tshaikovski: Waltz of the flowers (Sarah Willis, käyrätorvi, ja The Sarahbanda/Jose Antonio Mendez Padron).

          Belli: Telemachus teoks. Ithaca suite (Eldbjörg Hemsing, viulu, ja Olivia Belli, piano).

          Verdi: Mustalaisten ja härkätaistelijoiden kuorot "Noi siamo zingarelle - Di Madride noi siam mattadori" oopp. La Traviata (Marsha Waxman, mezzosopraano, David Huneryager, basso, Richard Cohn, basso, sekä Chicagon sinfoniakuoro ja SO/Georg Solti).

          Wunderer: Waldruhe (Metsänrauha) (Detmolder Hornquartett).

          Reich: Duet (Duetto) (Mari Samuelsen ja Soyoung Yoon, viulu, sekä Scoring Berlin/Jonathan Stockhammer).

          Renié: Angelus (Suvi-Anna Kärkönen, kantele).

          Rossini: Semiramisin aaria "Bel raggio lusinghier - Dolce pensiero" oopp. Semiramide (Renée Fleming, sopraano, Firenzen musiikkijuhlien kuoro sekä St. Luken ork./Patrick Summers). 

          Hensel: Oktober (Lokakuu) sarj. Das Jahr (Vuosi) (Lauma Skride, piano).

          Dudley: Medhel an gwyns (Esther Abrami, viulu, ja Itävallan radion SO/Irene Delgado-Jimenez).

          Konsertin on toimittanut Annina Aho.
