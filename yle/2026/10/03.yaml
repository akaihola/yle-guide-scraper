      - title: 'Maailma tarinoina: Saara Turusen Huonetrilogiassa ihmiset kamppailevat normien puristuksissa'
        start_time: '2026-10-03T12:05:00+03:00'
        end_time: '2026-10-03T13:00:00+03:00'
        description: |-
          Saara Turuselle teatteri taidemuotona on outoutta rakastavaa ja normeja hylkivää. Samalla Huonetrilogian näytelmät tekevät normit ja niiden kanssa kamppailun näkyväksi riipaisevalla ja koomisella tavalla, ratkaisuja tarjoamatta. Näytelmät asettuvat osaksi 2000-luvun kertomustodellisuutta, jossa moninaisuus on vahvemmin läsnä, mutta jossa perinteiset käsitykset elämänkulusta, ihmissuhteista ja sukupuolesta elävät edelleen vahvoina. Mitä mieskatseen läpileikkaavuus on saanut aikaan taiteessa ja elämässä? Miten normit ohjaavat toimintaa ja asenteita ja miten niitä ylläpidetään ympäröivässä tekstuaalisessa todellisuudessa? Keskusteluun Marja Vehkasen kanssa omakohtaisiakin kokemuksia tarjoten heittäytyvät kirjailija-ohjaaja Saara Turunen ja Suomen kirjallisuuden yliopistonlehtori, kotimaisen kirjallisuuden dosentti Hanna Samola.
      - title: 'Näistä levyistä en luovu: Risto Vuorimies'
        start_time: '2026-10-03T13:00:00+03:00'
        end_time: '2026-10-03T13:55:00+03:00'
        description: |
          Kiinnostavat ihmiset  kertovat lempimusiikkiinsa liittyviä muistoja ja tarinoita. Uusi jakso joka perjantai.
          Risto Vuorimies kuvasi 70-luvulla levyn kansia Love Recordsille. Joukosta löytyy mm. legendaarinen Hurriganesin Roadrunnerin kansi, joka on valittu parhaaksi suomalaiseksi levyn kanneksi. Mutta löytyykö Riston levyistä Hurriganesia? 
