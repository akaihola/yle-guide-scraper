      - title: Euroradion konsertti-ilta
        start_time: '2026-10-21T19:02:00+03:00'
        end_time: '2026-10-21T21:00:00+03:00'
        description: |
          Unkarilainen säveltäjä György Kurtág vietti viime helmikuussa 100-vuotispäiväänsä. Jo yli 50 vuoden ajan hän on myös "leikkinyt" pianolla: hänen Játékok-kappaleensa syntyivät estottomasta, lapsenomaisesta kokeilunhalusta. Ajan myötä niistä on kasvanut soiva päiväkirja, ja ne ovat syventyneet helliksi viesteiksi. 
          György Kurtág ja pianisti Pierre-Laurent Aimard ovat hekin tunteneet toisensa lähes puolen vuosisadan ajan. Jo ensitapaamisellaan Budapestissa vuonna 1978 he soittivat yhdessä Játékok-kappaleita. 
          Tässä euroradiokonsertissa aikamme arvostetuimpiin pianisteihin kuuluva Pierre-Laurent Aimard “leikittelee” myös soittamalla eri pianoja: konserttiflyygeliä, pianinoa, disklavieria ja celestaa. 

          Salzburgin musiikkijuhlien konsertissa Aimard vuorottelee Játékok-kappaleiden ja tanssien välillä. Ohjelmassa on ländlereitä, valsseja ja saksalaisia tansseja, joita Franz Schubert aikoinaan improvisoi kotitanssiaisissa ja illanvietoissa. Vasta myöhemmin hän kirjoitti ne nuoteiksi ja toi julkisuuteen. 
          Leikkien ja tanssien joukkoon Aimard sijoittaa myös Arnold Schönbergin Kuusi pientä pianokappaletta, op. 19, sekä Schönbergin oppilaan Anton Webernin Muunnelmat, op. 27. Mozart puolestaan kirjoitti vuonna 1791 Andanten F-duuri, KV 616, vahakabinetissa esillä olleille mekaanisille soittimille. Se on erikoisuus – ja silti taivaallista musiikkia.

          Salzburgin Mozarteumissa 31. heinäkuuta 2026 äänitetyn konsertin toimittaa Ainomaija Pennanen. 
