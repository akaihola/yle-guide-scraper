        description: |-
          Tubin: Setu tants (Tanssi Setumaalta) sarj. Süit Eesti tantsudest (Eestiläinen tanssisarja) (Göteborgin SO/Neeme Järvi).

          Ciani: Rain (Sade) (Vanessa Wagner, piano).

          Copland: Simple gifts bal. Appalachian spring (Empire Brass).

          Madetoja: Heinäväen polska sarj. Maalaiskuvia (Tampere Filharmonia/John Storgårds).

          Lefébure-Wély: Sortie Es-duuri (Christopher Herrick, urut).

          Shostakovitsh: Andante elok. Vstretshnyi (Vastavoima) (Nicola Benedetti, viulu, ja Bournemouthin SO/Kirill Karabits).

          Ernesaks: Petrovin aaria "Mu kodumaa, kaugele viis sinust ree" oopp. Tormide rand (Myrskyjen ranta) (Georg Ots, baritoni, ja Viron radion SO/Kirill Raudsepp).

          Dvorák: Finaali jousikvartetosta n:o 12 F-duuri (Amerikkalainen) (Guarneri Quartet).

          Godowsky: Alt Wien (Vanha Wien) (Marc-André Hamelin, piano).

          Ponce: Estrellita (Joshua Bell, viulu, ja St. Luken ork./Michael Stern).

          Rossini: Mustafan aaria "Gia d'insolito ardore nel petto" oopp. L'Italiana in Algeri (Italiatar Algeriassa) (Samuel Ramey, basso, ja Veneton solistit/Claudio Scimone).

          Rahmaninov: Moment musical n:o 4 e-molli (Ian Hobson, piano).

          Mendelssohn: Saltarello sinfoniasta n:o 4 A-duuri (Italialainen) (Atlantan SO/Yoel Levi).

          Konsertin on laatinut Ainomaija Pennanen. 
