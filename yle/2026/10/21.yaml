      - title: 'Konsertteja: Uuden Musiikin Lokakuu & Defun Ensemble'
        start_time: '2026-10-21T19:02:00+03:00'
        end_time: '2026-10-21T21:00:00+03:00'
        description: |+
          Suomen tunnetuin nykymusiikkiyhtye soittaa konsertin, jossa kohtaavat Matilda Seppälän yhteisöllisyyttä ja kehoa tutkiva musiikki, Øyvind Torvundin huumorilla höystetty ja yllätyksellinen äänimaailma sekä Perttu Haapasen leikkisä ja vinksahtanut suosikkiteos. Illan kruunaa Sami Klemolan uusi teos, jossa akustiset ja sähköiset kosketinsoittimet kohtaavat uudella tavalla.

          17.10.2026 Tulindbergin salissa Oulussa tallennetun konsertin toimittaa Ainomaija Pennanen.

          Esiintyjät:

          Defunensemble
            Hanna Kinnunen, huilu
            Mikko Raasakka, klarinetti
            Markus Hohti, sello
            Emil Holmström, piano
            Anders Pohjola, elektroniikka

          Tiina Karakorpi, piano
          Sami Klemola, syntetisaattorit

          Ohjelma:

          Matilda Seppälä: The Monstruous Bond of Togetherness (2024)
          Öivind Torvund: Yes or No (2025)
          Perttu Haapanen: Doll Garden (2013)
          Sami Klemola: Aspen Cape Melodies II (2026), Kahdelle pianolle ja kahdelle syntetisaattorille (Kantaesitys)

          Kuva ©www.alexbp.dk_web

