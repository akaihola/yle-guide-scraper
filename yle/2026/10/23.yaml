      - title: 'Konsertti: Uuden Musiikin Lokakuu & Oulu Sinfonia'
        start_time: '2026-10-23T19:02:00+03:00'
        end_time: '2026-10-23T21:00:00+03:00'
        description: |-
          Oulu Sinfonian konsertissa mannerlaatat murahtelevat ja peruskallio kuiskii. 
           
          The National -yhtyeen kitaristi, säveltäjä Bryce Dessner on räätälöinyt konserttoja maailman suurimmille solisteille. Dublinissa, Prahassa, Berliinissä ja Sydneyssä kuultu sellosinfonia Trembling Earth syntyi Anastasia Kobekinan poikkeuksellisen runolliselle ilmaisuvoimalle. 
           
          Yhdysvaltalaissäveltäjän Ellen Reidin tuore Earth Between Oceans kiitää Yhdysvaltain rannikolta toiselle. Kuoron ja orkesterin puhutteleva kokonaisuus rakentuu neljän peruselementin voimalla, ja ilmassa roikkuu väistämätön kysymys: kauanko näin voi vielä jatkua?
           
          Kroatialaisen Mirela Ivičevićin Neon Aeon on ylistys ystävyydelle: solistina soittaa Ensemble Recherche, jolla on takana yhteistä taivalta jo 40 vuotta. 

          Johanna Ruotsalaisen uusi teos asettaa puolestaan vastakkain hauraan arktisen luonnon sekä arktisen alueen taloudellisen hyödyntämisen. Konsertissa kuullaan The Failing Landscape -sävellyksen kantaesitys.  

          Oulu Sinfonian konsertti on osa Uuden musiikin lokakuu -festivaalia. 
           
          15.10.2026 Oulussa Madetojan salissa tallennetun konsertin toimittaa Ainomaija Pennanen.
           
          Ohjelma:
           
          Mirela Ivičević: Neon Aeon (2026) (Ensi kertaa Suomessa)
          Bryce Dessner: Trembling Earth (2025) (Ensi kertaa Suomessa)
          Johanna Ruotsalainen: The Failing Landscape (2026) for Symphonic Orchestra (k.e.)
          Ellen Reid: Earth Between Oceans (2025) (Ensi kertaa Suomessa)
           
          Esiintyjät:
           
          André de Ridder, kapellimestari
          Anastasia Kobekina, sello
          Soma Ensemble
          Cassiopeia
          Kuorojen valmennus Suvi Timm ja Elina Kärki. 
           
          Ensemble Recherche
            Adam Woodward, viulu
            Sofia von Atzingen, alttoviulu
            Åsa Åkerberg, sello
            Anja Clift, huilu
            Eduardo Olloqui, oboe
            Shizuyo Oka, klarinetti
            Klaus Steffes-Holländer, piano
            Christian Dierstein, lyömäsoittimet
            Lukas Nowok, äänisuunnittelu

           Oulu Sinfonia
           
          Kuvassa Anastasia Kobekina ©Nicolas Hudak / Sony Music Entertainment
