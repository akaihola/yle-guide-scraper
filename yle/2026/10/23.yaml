      - title: 'Konsertti: Uuden Musiikin Lokakuu & Oulu Sinfonia'
        start_time: '2026-10-23T19:02:00+03:00'
        end_time: '2026-10-23T21:00:00+03:00'
        description: |-
          Uuden Musiikin Lokakuun orkesterikonsertissa mannerlaatat murahtelevat ja peruskallio kuiskii. 
           
          The National -yhtyeen kitaristi, säveltäjä Bryce Dessner on räätälöinyt konserttoja maailman suurimmille solisteille. Lontoossa, Sydneyssä ja Berliinissä kuultu sellosinfonia Trembling Earth syntyi Anastasia Kobekinan poikkeuksellisen runolliselle ilmaisuvoimalle. Lyyrinen, paikoin aavemainen sellon ja orkesterin dialogi on koskettava ylistys luontoäidin äärettömälle kestokyvylle.
           
          Amerikkalaissäveltäjän Ellen Reidin tuore Earth Between Oceans kiitää Yhdysvaltain rannikolta toiselle. Kuoron, orkesterin ja kenttä-äänitysten puhutteleva kokonaisuus rakentuu neljän peruselementin voimalla, ja ilmassa roikkuu väistämätön kysymys: kauanko näin voi vielä jatkua?
           
          Kroatialainen Mirela Ivičević moukaroi musiikkikäsityksiämme taiteellaan: se ärjyy, kirkuu, kiroaa ja vaikeroi. 
           
          15.10.2026 Oulussa Madetojan salissa tallennetun konsertin toimittaa Ainomaija Pennanen.
           
          Ohjelma:
           
          Mirela Ivičević: Neon Aeon (2026) (Ensi kertaa Suomessa)
          Bryce Dessner: Trembling Earth (2025) (Ensi kertaa Suomessa)
          Johanna Ruotsalainen: The Failing Landscape (2026) for Symphonic Orchestra (k.e.)
          Ellen Reid: Earth Between Oceans (2025) (Ensi kertaa Suomessa)
           
          Esiintyjät:
           
          André de Ridder, kapellimestari
          Anastasia Kobekina, sello
          Soma Ensemble
          Cassiopeia
          Kuorojen valmennus Suvi Timm ja Elina Kärki. 
           
