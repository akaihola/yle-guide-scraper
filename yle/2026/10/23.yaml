            Shizuyo Oka, klarinetti
            Klaus Steffes-Holländer, piano
            Christian Dierstein, lyömäsoittimet
            Lukas Nowok, äänisuunnittelu
           
          Oulu Sinfonia
           
          Kuvassa Anastasia Kobekina ©Nicolas Hudak / Sony Music Entertainment
