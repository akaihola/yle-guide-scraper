          Sela: De cara a la pared (Lhasa De Sela).

          Gorney: Brother, can you spare a dime? (The Dave Brubeck Quartet).

          Cabrel: Octobre (Francis Cabrel).

          Tikka (Kuki Groupe). 

          Chydenius: Sen har jag ej frågat mera (Anna Järvinen).

          Warren: Sua ei tule toista (Timo Kiiskinen).

