      - title: 'Tuuli Saksalan keidas: Keitaan vieraana Aili Järvelä – Monitaituri, joka viihtyy valtavien orkesterien kokassa'
        start_time: '2026-10-01T17:35:00+03:00'
        end_time: '2026-10-01T18:25:00+03:00'
        description: |-
          "Musiikin tehtävä on herättää tunteet eloon, niin kauan me osataan tuntea asioita, maailmassa on toivoa", sanoo Aili Järvelä.

          Keitaan vieraaksi saapuu yksi 2020-luvun monipuolisimpia ja palkituimpia suomalaisia muusikoita – laulaja, säveltäjä ja viulisti Aili Järvelä.

          Kaustislainen monitaituri liikkuu itsevarmasti musiikin eri lajityyppien välillä, oli kyse sitten kansanmusiikista, popista, lastenmusiikista tai musikaaleista. Kuunnellaan hänen uutta massiivista projektiaan Folk All FIN Bandia, jossa valtava orkesteri ja kansanmusiikin energia pursuavat joka suunnasta.

          Tuuli Saksala keskustelee Järvelän kanssa siitä, miten kansanmusiikki elää ja hengittää juuri nyt, mikä merkitys kaustislaisella musiikkiperinnöllä on hänelle, ja miten hän jaksaa monien projektien keskellä. Puheeksi tulevat myös hengenheimolaiset ruotsalaiset kollegat Sara Parkman ja Eva Dahlgren, Teosto-palkittu Vuori-albumi sekä Roihuvuori – kappale, joka on koskettanut lukuisia suomalaisia.
