      - title: 'Aitiovieras: Petri Liski -  Näyttelijä, muusikko, ohjaaja ja Hessu Hopon ääni 36 vuotta'
        start_time: '2026-10-01T13:35:00+03:00'
        end_time: '2026-10-01T14:00:00+03:00'
        description: |2-
           Petri Liski on työteliäs mies. Hänen päätyönsä on Kansallisteatterissa, mutta sen lisäksi hän näyttelee ääninäyttelijänä, vierailee muiden teatteritalojen tuotannoissa, toimii muusikkona ja orkesterinjohtajana, ohjaa harrastajanäyttämöillä ja on mukana järjestöissä. Tuorein Liskin töistä on Kansallisteatterin Orvot-näytelmän Harold. Hän jatkaa tänä syksynä myös Toinen tasavalta -esityksessä. Miia Lahti haastattelee Petri Liskiä.
