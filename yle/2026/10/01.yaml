        end_time: '2026-10-01T16:59:00+03:00'
        description: |-
          Josef Strauss: Velocipede (Polkupyörä) nopea polkka (Wienin filharmonikot, joht. Lorin Maazel).

          Offenbach: Rêverie au bord de la mer (Unelmointia meren rannalla) (Raphaela Gromes, sello, ja Julian Riem, piano).

          Purcell: Kylmyyden hengen aaria "What power art thou" puolioopp. Kuningas Arthur (Andreas Scholl, kontratenori, ja Accademia Bizantina/Stefano Montanari).

          Mendelssohn: Presto konserttikappaleesta n:o 1 F-duuri (Daniel Ottensamer, klarinetti, ja Andreas Ottensamer, basettitorvi, sekä Wiener Virtuosen).

          Rameau: Chaconne oopperabal. Les Indes galantes (Jalot villit) (Les Ambassadeurs/Alexis Kossenko).  

          Tailleferre: Toccata kahdelle pianolle (Mark Clinton ja Nicole Narboni). 

          Melartin (sov.): Hulivilipoika (Sauli Tiilikainen, baritoni, ja Pentti Kotiranta, piano).

          d'Indy: Preludi orkesterisarjasta Karadec (Islannin SO/Rumon Gamba).

          Chaminade: Rondeau (Nils-Erik Sparf, viulu, ja Bengt Forsberg, piano).

          Piazzolla: Lokakuun laulu (Lapin kamariork./John Storgårds).

          Wagner: Dalandin aaria "Mögst du, mein Kind" oopp. Lentävä hollantilainen (Jaakko Ryhänen, basso, ja RSO/Jukka-Pekka Saraste).

          Boccherini: Los manolos kvintetosta jousille C-duuri (Madridin katujen yösoitto) (Quinteto Boccherini).

          Beethoven: Tempo di menuetto sinfoniasta n:o 8 F-duuri (Baijerin radion SO/Mariss Jansons).  


          Konsertin on laatinut Ainomaija Pennanen. 
