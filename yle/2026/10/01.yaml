      - title: 'Marko Gustafsson: Käännekohdissa Risto Isomäki'
        start_time: '2026-10-01T10:00:00+03:00'
        end_time: '2026-10-01T10:53:00+03:00'
        description: |-
          Kirjailija, ympäristöaktivisti Risto Isomäki arvelee, että jos hän olisi syntynyt myöhemmin niin olisi ehkä saanut kirjoilla diagnoosin. Hän nimittäin oivalsi vasta muutama vuosi sitten, että ei ole ymmärtänyt nuorena ihmisten sosiaalisista tavoista juuri mitään. Hän joutui opettelemaan ja kyselemään ihmisiltä miten kussakin tilanteessa tulisi toimia. Hän kokee että jotakin hyötyä sosiaalisten taitojen puutteesta on myös ollut, hän ei automaattisesti muodosta käsitystä maailmasta sen mukaan miten ympärillä olevat ihmiset ajattelee.
