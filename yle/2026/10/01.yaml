      - title: 'Marko Gustafsson: Käännekohdissa Risto Isomäki'
        start_time: '2026-10-01T10:00:00+03:00'
        end_time: '2026-10-01T10:53:00+03:00'
        description: |
          Risto Isomäki oivalsi vasta muutama vuosi sitten, että ei ole ymmärtänyt nuorena ihmisten sosiaalisista tavoista juuri mitään. ”Jouduin opettelemaan ja kyselemään ihmisiltä miten kussakin tilanteessa tulisi toimia. Minulla on sama ominaisuus edelleen, mutta nykyään sitä ei juuri huomaa”, Risto hymähtää. Hyötyäkin sosiaalisten taitojen puutteesta on.
          ”En automaattisesti muodosta käsitystä maailmasta sen mukaan miten ympärillä olevat ihmiset ajattelee”, Risto toteaa.  
