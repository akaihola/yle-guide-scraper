      - title: 'Konsertti: Aria Borealis -barokkilaulukilpailun finaali'
        start_time: '2026-10-09T19:02:00+03:00'
        end_time: '2026-10-09T21:00:00+03:00'
        description: |-
          Toista kertaa järjestettävä kansainvälinen barokkilaulukilpailu Aria Borealis käytiin lokakuun alussa Helsingissä. Finaaliin yltäneet kahdeksan nuorta laulajaa ovat kotoisin kahdeksasta eri maasta, ja he edustavat eri äänialoja koloratuurisopraanosta bassobaritoniin. Finaalikonsertissa kuullaan kohtauksia Gerog Friedrich Händelin aarioista.

          Musiikkitalossa 4.10. tallennetun konsertin toimittaa Ahti Paunu. Äänisuunnittelijana on Jari Rantakaulio ja äänitarkkailijana Anna-Kaisa Kemppi.
