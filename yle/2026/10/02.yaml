      - title: Narrin aamulaulu - Matti Hyökki, 60 vuotta täyttä törinää kuorokulttuurin kentällä
        start_time: '2026-10-02T11:00:00+03:00'
        end_time: '2026-10-02T11:55:00+03:00'
        description: |-
          Maamme kuoroelämä näyttäisi kovin toisenlaiselta ilman emeritusprofessori Matti Hyökin mittavaa panosta. Kunnianhimoinen työ kuorokulttuurin hyväksi on kuulunut hänen johtamissaan kuoroissa, kuten YL:ssä ja Laulu-Miehissä. Laajat levytyshankkeet ovat luoneet mieskuorolaulun kansallisgallerian, joka on täydentynyt parilla sadalla sävellystilauksilla. Hyökki sai myös ensimmäisenä Sibelius-Akatemian kuoronjohdon lehtorina organisoitavakseen kuoronjohtajien koulutuksen. 
          Matti Hyökkiä haastattelee Outi Paananen. 
