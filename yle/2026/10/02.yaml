        start_time: '2026-10-02T19:02:00+03:00'
        end_time: '2026-10-02T21:00:00+03:00'
        description: |-
          Punainen pappi - kunnianosoitus Antonio Vivaldille. Andrea Marcon, kapellimestari, Théo Imart, kontratenori, Kyeong Ham, oboe, Tomas Nuñez, sello, ja Tuomas Lehto, sello. - Antonio Vivaldi, ”Punainen pappi”, loi musiikkia jossa säkenöi Venetsian kulta-aja riehakkuus ja loisto. Barokkimusiikin erikoismies Andrea Marcon ja kontratenori Théo Imart ovat kehitelleet jännittävät juhlat paljastaakseen tämän suosituista suosituimman barokkisäveltäjän monet kasvot. Suoran lähetyksen Musiikkitalosta juontaa Riikka Holopainen. 
