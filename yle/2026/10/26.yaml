      - title: 'Väkivallan markkinat K3J2: Vasemmistolaisen terrorismin kulta-aika'
        start_time: '2026-10-26T19:02:00+02:00'
        end_time: '2026-10-26T19:57:00+02:00'
        description: |
          Francon diktatuuri kaatuu, mutta ETA:n terrorismi vain yltyy. Osa jäsenistä jättää yhä väkivaltaisemman järjestön, mutta Josu Urrutikoetxealle ETA on elämäntapa. Baskimaan itsenäisyyttä ajaneesta radikaalista liikkeestä muotoutuu mafiaa muistuttava, väkivaltainen ja holtiton ryhmä. Miten käsistä lähtenyt terroritoiminta lopetetaan? Mitä äärimmäisellä väkivallalla saavutettiin?

          Jakson haastateltavat: Teemu Tammikko, Ulkopoliittisen instituutin vanhempi tutkija, Leena Malkki, Helsingin yliopiston terrorismin tutkija.

          Lähteitä:
          Endgame for ETA – Elusive Peace in the Basque Country, Teresa Whitfield. Rebelde, ohjannut Juan Luis Napal. Don’t call me Ternera, ohjaajina Jordi Évole, Marius Sánchez. 
      - title: 'Suuri juomapodi J3: Minun takia tarvii keittää'
        start_time: '2026-10-26T20:10:00+02:00'
        end_time: '2026-10-26T20:45:00+02:00'
        description: |
          Suomalainen kahvikulttuuri tunnetaan vaaleasta paahdosta ja valtavista määristä, mutta New Yorkissa kahvi tarkoittaa usein juomasekoitusta, jossa on myös hieman kahvia. Miksi suomalaiset oppivat juomaan kahvinsa juuri niin oppivat? 

          Jaksossa matkataan New Yorkista Lappeenrantaan ja takaisin selvittämään kuinka sama pieni papu synnyttää niin erilaisia kahvikulttuureja. Kahvin saloja ja pienen paahtimon bisneslogiikkaa avaa Arttu Mukkonen. Kielitieteilijä Janne Saarikivi piirtää etymologian avulla kahvin leviämisen kartalle.
