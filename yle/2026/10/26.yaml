        end_time: '2026-10-26T19:00:00+02:00'
        description: |-
          "Matteuksen evankeliumi: Jeesuksen kuolema"
          Näyttelijä Krista Kosonen lukee Matteuksen evankeliumia (27:45 - 28:1-20) UT2020 käännöksen mukaan. Viimeisessä jaksossa Jeesus haudataan ja hän nousee kuolleista.
      - title: Yle Uutiset ja sää
