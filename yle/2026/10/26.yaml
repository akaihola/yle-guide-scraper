      - title: 'Aitiovieras: Palkittu ohjaaja A.J. Annila on nyt myös elokuvateatterin pyörittäjä'
        start_time: '2026-10-26T13:35:00+02:00'
        end_time: '2026-10-26T14:00:00+02:00'
        description: |2-
           Palkitun Ikitie-elokuvan ohjannut A.J. Annila on ottanut tänä vuonna vetovastuun puolisonsa, näyttelijä Emmi Parviaisen kanssa helsinkiläisen Kulttuurikeskus Korjaamon elokuvateatterista. "Ajatus siitä että ohjaaja ja näyttelijä pyörittävät elokuvateatteria oli liian romanttinen ohitettavaksi”, toteaa Annila tiedotteessa. Annilan nimi on yhdistetty viime aikoina myös Risto Isomäen romaaniin Sarasvatin hiekkaa filmaamiseen. Jarmo Laitaneva haastattelee.
