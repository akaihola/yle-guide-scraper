      - title: 'Kulttuuriykkönen: Ateneumin Arcana Borealis- näyttelyssä on esillä 50 pohjoista naistaiteilijaa, jotka maalasivat hengellä'
        start_time: '2026-10-26T15:00:00+02:00'
        end_time: '2026-10-26T15:58:00+02:00'
        description: |-
          Ateneumin Arcana Borealis- näyttely on ensimmäinen laaja näyttely pohjoismaisten esoteeristen taiteilijanaisten teoksista. Taiteilijoiden erilaisia yhteyksiä esoteerisuuteen ja okkultismiin avataan näyttelyssä. Aikaisemmin on nostettu esille tunnettujen taiteilijamiesten suhdetta esoteriaan. Arcana tarkoittaa mysteereitä tai vihkiytyneille tarkoitettua tietoa. Borealis tarkoittaa pohjoista. Näyttelyn nimi viittaa pohjoisen salattuun tietoon.

          Näyttelyssä on mukana taiteilijoita 1800-luvulta nykypäivään, muun muassa ensimmäistä kertaa esillä oleva Anna Cassel, Ilona Harima, Maja Fjaestad, Hilma af Klint, Iria Leino, Outi Pieski, Laila Pullinen, Ester Helenius ja Ellen Thesleff. Näyttely nostaa esille Laila Pullisen veistostaiteen, Mata Hari-teoksen kiillotettu pinta kuvastaa immateriaalista maailmaa. 
           
          Arcana Borealis nostaa esille yhteisöllisyyden, ihmisen suhteen luontoon ja taiteen elämäntapana. Millä tavalla nämä taiteilijat kokivat taiteen mediaalisena tai henkisenä rituaalina?  Miten aikalaiset suhtautuivat näiden taiteilijoiden henkisiin pyrkimyksiin ja miten se näkyi heidän teoksissaan? Millä tavalla näitä esoteerisia taiteilijanaisia katsotaan tänään feministisestä ja queer-näkökulmasta?
          Näyttelyn teemoja ovat hengen ja materian suhde, kuoleman jälkeinen elämä ja henkimaailman olemassaolo. 

          Ohjelman vieraina ovat näyttelyn kuratoineet taiteen- ja uskonnontutkija Nina Kokkinen ja Ateneumin intendentti Marja Lahelma.

          Ohjelman juontaa Pia-Maria Lehtola.


          Rentoa puhetta, kiinnostavimmat vieraat ja kulttuurin ajankohtaisaiheet debatoitavina. Suorana maanantaista perjantaihin.
