        description: |-
          Kiinnostavat ihmiset  kertovat lempimusiikkiinsa liittyviä muistoja ja tarinoita. Uusi jakso joka perjantai.
          Olet varmasti joskus miettinyt, miltä jonkin ihmisen päässä kuulostaa, millainen äänimaailma siellä on. Litku Klemetti paljastaa Näistä levyistä en luovu -ohjelmassa oman sisäisen äänensä ja toki paljon muutakin, kuten sen, mikä on maailman paras biisi, sekä sen, onko hän swiftie.
