      - title: 'Maisteri Lindgrenin musiikkiesitelmä: Kuinka kirjailija Mark Twainille kävi Bayreuthin Wagner-juhlilla'
        start_time: '2026-08-07T11:00:00+03:00'
        end_time: '2026-08-07T11:55:00+03:00'
        description: |-
          "Kun Mark Twain kuvasi laulajien näyttelemistä kärpästen tappamiseksi, hän viittasi siihen nyttemmin jo melko harvinaiseksi jääneeseen laulajien tapaan seistä ja laulaa ja vain toisinaan kohottaa toista kättään, vuoroin kumpaakin ja suurimmassa tunteiden myllerryksessä molempia. Se ei ole näyttelemistä, ja vaikutti Mark Twainin silmissä kärpästen tappamiselta. Hän meni jopa niin pitkälle, että totesi kuuluisasti Wagnerin musiikin olevan paljon parempaa, jos laulajia ei olisi." - Minna Lindgren esitelmöi.
