      - title: 'Pieleen mennyt historia: Nälkä on vallan puutetta, ei ruoan puutetta'
        start_time: '2026-08-07T21:27:00+03:00'
        end_time: '2026-08-07T22:09:27+03:00'
        description: |-
          Miksi nälästä ei vieläkään ole päästy eroon? Miten nälän syyt ovat muuttuneet eri aikoina? Näitä kysymyksiä pohtivat talous- ja sosiaalihistorian dosentti Antti Häkkinen, ympäristötutkija Ville Lähde, historianopettaja Lasse Hongisto ja toimittaja Jussi Nygren. (2024)
          Sarjan Pieleen mennyt historia kaikki jaksot ovat kuunneltavissa Yle Areenassa.
