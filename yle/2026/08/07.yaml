      - title: 'Radio 1:n iltapäivä: Kirjani tarina: kirjailija Ulla Rask kertoo romaanistaan Seitsemän tornin varjoissa'
        start_time: '2026-08-07T13:30:00+03:00'
        end_time: '2026-08-07T15:00:00+03:00'
        description: |
          Juontajana Miia Lahti.  N. klo 14 Kirjani tarina Seitsemän tornin varjoissa -romaanissa nuori Blanka Berger seikkailee Lyypekissä. 1600-luvun Hansa-kaupungeissa vaara väijyy joka kulmassa ja kun rutto leviää Blanka taistelee  kaoottisessa kaupungissa selviytymisestään.Toimittaja Jukka Kuosmasen vieraana kirjailija Ulla Rask. N. klo 14:30 Millaista häämusiikkia morsiusparit haluavat soitettavan nykyää?  Musiikkitoimittaja Ainomaija Pennanen haastattelee Keijo Piiraista, joka toimii Pudasjärven seurakunnan kanttorina.  
