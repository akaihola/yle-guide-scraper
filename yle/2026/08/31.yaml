        description: |+
          Gabrieli: Canzona n:o 16 (Empire Brass sekä Bostonin SO:n, New Yorkin FO:n ja Boston Pops Esplanden jäseniä/Robert Sullivan, trumpetti). 

          Benda: Presto huilukonsertosta e-molli (Patrick Gallois ja Carl Philipp Emanuel Bach -kamariork./Peter Schreier).

          Gibbons: The silver swanne (Hopeanhohtoinen joutsen) (The King's Singers).

          Fauré: Allegro vivo sonaatista n:o 1 A-duuri (Berl Senofsky, viulu, ja Gary Graffman, piano).

          Shostakovitsh: Lento konsertosta pianolle, trumpetille ja jousille n:o 1 c-molli (Martha Argerich, piano, Sergei Nakarjakov, trumpetti, ja Italiankielisen Sveitsin ork./Aleksandr Vedernikov).

          Chaminade: Ma première lettre (Ensimmäinen kirjeeni) (Anne Sofie von Otter, mezzosopraano, ja Bengt Forsberg, piano).

          Tailleferre: Intermede teoks. Jousikvartetto (Stenhammar Quartet).

          E. Lindström: Midland hawthorn kons. klarinetille ja orkesterille n:o 1 (At the hills of Hampstead Heath) (Emil Jonason ja Helsingborgin SO/Stefan Solyom).

          Dowland: Pipers galliard (David Russell, kitara).

          Purcell: Fantasia nro 13 F-duuri (Phantasm, sekä Joanna Levine, viola da gamba).

          Gipps: Scherzo konsertosta käyrätorvelle ja orkesterille (David Pyatt ja Lontoon FO/Nicholas Braithwaite).

          Grieg: Jeg elsker dig (Rakastan sinua) (Soile Isokoski, sopraano, ja Marita Viitasalo, piano).

