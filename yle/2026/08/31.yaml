      - title: 'Kulttuuriykkönen: Sibeliuksen natsiyhteydet olivat syvemmät ja kiusallisemmat kuin mitä aiemmin on haluttu myöntää'
        start_time: '2026-08-31T15:00:00+03:00'
        end_time: '2026-08-31T15:58:00+03:00'
        description: |-
          Säveltäjä Jean Sibeliuksen natsiyhteyksiä on Suomessa haluttu vähätellä vetoamalla säveltäjän epäpoliittisuuteen. Kirjailija ja filosofian tohtori Antti Vihisen uutuuskirja näyttää kuitenkin säveltäjän poliittisena opportunistina, joka janosi tunnustusta Saksassa, ja jonka uralle natsihallinnon suosio merkitsi huomattavaa taloudellista etua. Kulttuuriykkösessä keskustellaan siitä, mitä Sibeliuksen natsiyhteyksistä tiedetään, ja millaisia yhteyksiä muilla 1930- ja 40-lukujen kulttuurivaikuttajilla oli kansallisosialisteihin. Keskustelemassa ovat Antti Vihinen ja poliittisen historian professori Vesa Vares. Toimittajana on Jonni Roos.
