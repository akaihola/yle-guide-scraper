      - title: 'Keinuva talo - Mika Kauhanen: Aikamatka Euroopan etnovuoteen 1973'
        start_time: '2026-08-31T17:35:00+03:00'
        end_time: '2026-08-31T18:35:00+03:00'
        description: |
          Millaiselta kuulosti eurooppalainen etno 50 vuotta sitten? Tuoreelta ja raikkaalta, intiimiltä ja isolta. Etnovuotena 1973 ei soittajissa säästelty, vaan studioon marssitettiin tarvittaessa suuriakin kokoonpanoja mahtavine sovituksineen. Elettiin kansanmusiikkiherätystä ja toisaalta progressiivisen musiikin kulta-aikaa. Listalla kelttimusiikkia, pelimanneja, lauluntekijöitä, folkrockia, Balkanin eksotiikkaa. Toimittajana Mika Kauhanen. Uusinta kesäkuulta 2023.
