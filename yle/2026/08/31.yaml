      - title: 'Tiedeykkönen: Lennämme yhä enemmän samalla kun päästöt pitää painaa nollaan – ratkaisu riippuu polttoaineesta, jota ei vielä ole'
        start_time: '2026-08-31T21:30:30+03:00'
        end_time: '2026-08-31T22:19:19+03:00'
        description: |-
          EU haluaa lentokoneisiin kestävää polttoainetta fossiilisen tilalle. Se on metsien ja puhtaan sähkön Suomelle iso taloudellinen mahdollisuus. Haastateltavana liikenne- ja kuljetusjärjestelmien professori Heikki Liimatainen Tampereen yliopistosta ja tutkimusjohtaja Petteri Laaksonen LUT-yliopistosta. Toimittaja: Jaro Asikainen.
