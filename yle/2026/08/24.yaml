        description: |-
          Debussy: Golliwogg's cake-walk (Paavali Jumppanen, piano).

          Mascagni: Turiddun aaria "Mamma, quel vino e generoso" oopp. Cavalleria rusticana (Pekka Nuotio, tenori, ja RSO/Kari Tikka). 

          Cahuzac: Cantilene (Jonathan Cohler, klarinetti, ja Rasa Vitkauskaite, piano).

          Tailleferre: Perpetuum mobile (Ikiliikkuja) (Maria Graf, harppu).

          Esmail: Charukeshi bandish (Reena Esmail, laulu, ja Chicago Sinfonietta/Mei-Ann Chen). 

          Böhme: Andante cantabile sekstetosta trumpeteille Es-duuri (brass partout/Hermann Bäumer).

          Lalo: Allegro - Presto Norjalaisesta fantasiasta (Philippe Graffin, viulu, ja Ulsterin ork./Thierry Fischer).

          Palmgren: Preludi F-duuri (Henri Sigfridsson, piano).

          Massenet: Wertherin aaria oopp. Werther (José Carreras, tenori, ja Covent Garden -oopp. ork./Colin Davis).

          Mendelssohn: Allegretto non troppo - Allegro molto vivace konsertosta viululle ja orkesterille e-molli (Sarah Chang ja Berliinin filharmonikot/Mariss Jansons).

          Hahn: Matinée parisienne (Aamu Pariisissa) sarj. Le rossignol eperdu (Hämmentynyt satakieli) (Earl Wild, piano).

          Järnefelt: Allegretto teoks. Serenadi orkesterille (Sinfonia Lahti/Jaakko Kuusisto).

          Schumann: Träumerei (Unelmointia) (Joshua Bell, viulu, ja Academy of St. Martin-in-the-Fields/Michael Stern).


          Konsertin on laatinut Ainomaija Pennanen.
