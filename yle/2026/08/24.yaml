        start_time: '2026-08-24T17:05:00+03:00'
        end_time: '2026-08-24T17:30:00+03:00'
        description: |-
          SDP:n avaus tiukentuvasta maahanmuuttopolitiikasta on nostanut puolueen tukkanuottasille perussuomalaisten kanssa. Samaan aikaan kokoomuksen kannatus matelee. Millaisia jännitteitä kolmen suurimman puolueen välillä nyt on? Entä millaisista asetelmista politiikan syksy lähtee liikkeelle? Atte Uusinokan haastattelussa Ilta-Sanomien politiikan toimittaja Anni Keski-Heikkilä.
