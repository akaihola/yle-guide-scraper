      - title: 'Uutispodcast: Kannattaako Mount Everestin kuuluisin vainaja tuoda alas, Lotta Hintsa?'
        start_time: '2026-08-22T21:01:30+03:00'
        end_time: '2026-08-22T21:27:12+03:00'
        description: |-
