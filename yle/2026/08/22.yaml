      - title: 'Marko Gustafsson: Käännekohdissa Sofia Ruija'
        start_time: '2026-08-22T17:05:00+03:00'
        end_time: '2026-08-22T17:58:00+03:00'
        description: |
          Kuopiolainen Sofia  Ruija oli 14-vuotias ja tanssinut vasta kaksi vuotta balettia, kun hänet kutsuttiin Suomen Kansallisoopperan balettioppilaitokseen. Hän ilmoitti vanhemmilleen, että muuttaa Helsinkiin. ”En tuntenut Helsingistä ainuttakaan ihmistä, mutta en myöskään epäröinyt lähteä.”  Balettikoululla Sofia nähtiin joka päivä useilla eri tanssitunneilla, mutta siviilielämä oli muihin tanssijoihin verrattuna totaalisen erilainen. ”Minulla oli omaisuus repussa ja perhe toisessa kaupungissa”, Sofia toteaa. Ohjelma on uusinta ajalta 16.4.2026. 
