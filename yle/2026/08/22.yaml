      - title: Katja Kettu kertoo kirjastaan Brita-Kajsa
        start_time: '2026-08-22T07:30:40+03:00'
        end_time: '2026-08-22T07:53:48+03:00'
        description: |-
          Brita-Kajsa-romaani kuvaa herätysliikkeen johtaja Lars Levi Laestadiuksen vaimoa. Brita-Kajsan itsensä kertoman koskettavan tarinan lisäksi romaani on elävä tutkimusmatka 1800-luvun Ruotsin Lappiin, sen luontoon ja pohjoisen saamelaisväestön ahdingon kuvaamiseen kun etelästä saapuvat Tukholman lait ja sorto.

          Kielellisesti rikkaan tarinan teemat kietoutuvat naisen ja alkuperäisväestön aseman lisäksi seksuaalisuuden ja luonnon voiman kuvauksen sekä anteeksiannon lohdullisen mahdollisuuden ympärille.

          Kirjailija Katja Kettua haastattelee toimittaja Jukka Kuosmanen.
