      - title: Etnokonsertti Totó la Momposina
        start_time: '2026-08-30T17:06:00+03:00'
        end_time: '2026-08-30T18:00:00+03:00'
        description: |
          Kolumbialainen laulaja Totó la Momposina menehtyi toukokuussa 2026. Totó la Momposina oli sukujuuriltaan sekä Kolumbian alkuperäiskansaa että afro-kolumbialainen. Hän nosti afrokolumbialaisen perinnemusiikin ja rytmit kansainväliseen tietoisuuteen. Kuulemme Totó la Momposina konsertin WOMAD-festivaalilta 31.7.2015. Toimittajana on Miika Lauriala. Ohjelman ensilähetys oli 31.5.2026. 
      - title: Jumalanpalvelus Hämeenlinnan adventtiseurakunnasta
        start_time: '2026-08-30T20:00:00+03:00'
        end_time: '2026-08-30T21:00:00+03:00'
        description: |-
          Tilaisuuden johtajana Leila Sormunen. Saarnaajana pastori Joel Saarinen. Yhteislaulujen esilaulajana Wilhelmiina Laakso ja pianistina Sinikka Kava. Yhteislaulut: Seurakunta laulaa -kirjasta numerot 277, Silloin kun en yksin jaksa rukoilla ja 522, Näen maallisten usvain takaa.
      - title: 'Romanitarinoita: Kyösti Roth – Elämäntyö, joka jätti jäljen osa 2'
        start_time: '2026-08-30T23:12:00+03:00'
        end_time: '2026-08-30T23:37:00+03:00'
        description: |
          Kyösti Roth on nimi, jonka vaikutus kuuluu ja näkyy edelleen suomalaisessa romanigospelissa. Hän oli mukana jo silloin, kun hengellinen romanimusiikki löysi oman äänensä 1970-luvulla – ja hän oli sen tyylin luoja. Roth aloitti musiikkiuransa ravintolamuusikkona, mutta hänen tiensä vei gospelmusiikin pariin, jossa hän teki elämänmittaisen työn.
          Hän on säveltänyt, sanoittanut tai sovittanut yli 2000 levytettyä kappaletta, ollut mukana yli 80 eri artistin levyillä ja esiintynyt jopa yli 1500 tilaisuudessa vuodessa.
          Hänen lahjakkuutensa on ainutlaatuista, mutta ehkä vieläkin puhuttelevampaa on hänen syvä kiitollisuutensa siitä lahjasta, jonka on saanut. Tämä ei ollut hänelle vain ura – se oli kutsumus, elämäntyö. Hän ei tehnyt musiikkia vain itseään varten, vaan ihmisille.
          Kyösti Roth on ollut tienraivaaja, näkijä ja esikuva – eikä häntä voi korvata. Hän on yksi ja ainoa.
