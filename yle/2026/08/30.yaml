      - title: Etnokonsertti Totó la Momposina
        start_time: '2026-08-30T17:06:00+03:00'
        end_time: '2026-08-30T17:59:22+03:00'
        description: |
          Kolumbialainen laulaja Totó la Momposina menehtyi toukokuussa 2026. Totó la Momposina oli sukujuuriltaan sekä Kolumbian alkuperäiskansaa että afro-kolumbialainen. Hän nosti afrokolumbialaisen perinnemusiikin ja rytmit kansainväliseen tietoisuuteen. Kuulemme Totó la Momposina konsertin WOMAD-festivaalilta 31.7.2015. Toimittajana on Miika Lauriala. Ohjelman ensilähetys oli 31.5.2026. 
      - title: 'Jazzklubi: "Turha stressata asioista, joita et voi hallita" – Mamba Assefan resepti elämään ja musiikkiin'
        start_time: '2026-08-30T18:00:07+03:00'
        end_time: '2026-08-30T19:00:00+03:00'
        description: |-
          Lyömäsoittaja, rumpali ja tuottaja Abdissa "Mamba" Assefa kertoo Jazzklubin studiossa, miten improvisaatio yhdistää sekä musiikkia että ruoanlaittoa - ja miksi elämässä kannattaa olla joustava. "Mä oon keittiössä hyvin luova. Mä katson kaapit läpi ja improvisoin. Se maustaminen on yhtä kuin lyömäsoittajan taito, ne pienet detaljit." Kuuntelukerho on poikkeuksellisesti katselukerho. Keskustelemme Yle Areenasta löytyvästä Quincy Jones -dokumentista. Toimittajat ovat Laura Korhonen ja Eero Koski. Ohjelma on uusinta keväältä 2026. Ensi viikolla Jazzklubi palaa uusin jaksoin.
