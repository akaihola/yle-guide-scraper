      - title: 'Elävä historia: Amerikkalaisten ristiretket - miten sota ja uskonto ovat Yhdysvalloissa kietoutuneet toisiinsa '
        start_time: '2026-08-30T12:05:00+03:00'
        end_time: '2026-08-30T13:00:00+03:00'
        description: |+
          Yhdysvallat on hyvin uskonnollinen kansakunta ja uskonnolla on ollut merkittävä rooli sen käymissä sodissa ja diplomatiassa. Yhdysvaltain sotaretkissä on usein ollut moraalisen ristiretken sävy.
          Mistä uskonnon suuri merkitys Yhdysvalloissa oikein lopulta johtuu? Miten uskonto on kietoutunut Yhdysvaltain ulkopolitiikkaan? Mikä rooli tässä on Amerikan mantereelle 1600-luvulla saapuneilla puritaaneilla?
          Haastateltavina Yhdysvaltain tutkimuksen emeritusprofessori Markku Henriksson ja teologian tohtori Olli Saukko.
          Toimittaja: Harri Alanne 
          Äänisuunnittelija: Katri Koivula
          Lukija: Pasi Toiviainen


