      - title: 'Radio 1:n iltapäivä: Kuvataiteilija, arkkitehti Ulla-Maija Alanen: "Minulla on monta ateljeeta ja ne ovat kaikki veden alla"'
        start_time: '2026-08-05T13:30:00+03:00'
        end_time: '2026-08-05T15:00:00+03:00'
        description: |-
          Juontajana Miia Lahti. 
          N. klo 14 vedellä ja järvillä on arkkitehti, kuvataitelilija Ulla-Maija Alaselle aivan erityinen merkitys. Uppoutujaksi itseään kuvaava Alanen valokuvaa metsäjärvien pinnanalaista näkymää, kuten vesikasveja ja niiden elämää. Kati Turtola haastattelee.
          N. klo 14.30 tanssitaiteilija Alpo Aaltokoski kertoo Marko Gustafssonille, mikä mikä on Alpon ihan ensimmäinen tanssiin liittyvä muisto? Ensilähetys oli 23.10.25.
      - title: 'Kulttuuriykkönen: Ovatko suomalaiset vihdoin viisastumassa alkoholin suhteen?'
        start_time: '2026-08-05T15:00:00+03:00'
        end_time: '2026-08-05T15:58:00+03:00'
        description: |
          Alkoholilainsäädäntö on viime vuosina muuttunut saatavuutta ja tarjontaa vapauttavaan suuntaan. Tänä kesänä Alkon aukioloaikoja väljennettiin, ja eduskunta hyväksyi alkoholin kotiinkuljetuksen sallivan lain. Samaan aikaan alkoholin kulutus on laskenut, erityisen selvästi nuoremmissa sukupolvissa.
          Ovatko suomalaiset siis oppineet juomatavoille ja kypsyneet vastuullisiksi alkoholinkäyttäjiksi? Mitä tilastojen taakse kätkeytyy, kuinka suuri ongelma alkoholi Suomessa yhä on – ja ovatko järki ja kohtuus vähitellen voittamassa haitat ja uhkakuvat?

          Aiheesta keskustelevat yhteiskuntatieteilijä Antti Maunu, päihdelääkäri Kaarlo Simojoki, tulevaisuustutkija Ilkka Halava sekä viininviljelijä ja viiniharrastaja Kari Latvus. Ville Talola toimittaa.
