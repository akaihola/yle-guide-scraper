        description: |-
          Kalastuslupa on maksettu ja maastopyöräily sallittu, mutta kalaretkessä Finnmarkin ytimeen on aavistus jotain luvatonta. Hiljalleen virinnyt tietoisuus saamelaisten historiasta saa musiikkitoimittaja Kare Eskolan miettimään, miten olla vieraalla maalla. Elokuun kolmet Välilevyt on tehty kesän aikana retkillä.
