        description: |-
          Juontajana Tatu Tamminen. N. klo 14 Kati Turtola haastattelee alkamassa olevien Forssan mykkäelokuvafestivaalien festivaalijohtaja Ville Koivistoa. Pienessä, hämäläisessä Forssan kaupungissa on järjestetty mykkiin elokuviin keskittynyttä festivaalia jo vuodesta 2000.Tänä vuonna festivaalien teema on "Maailman ympäri". 
