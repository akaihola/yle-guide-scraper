        start_time: '2026-08-17T17:35:00+03:00'
        end_time: '2026-08-17T18:35:00+03:00'
        description: |-
          Kuratoitu valikoima tuoreita etnolevyjä suo meille brittifolkin laulutarinoita, eurooppalaista tradia ja globalismia sekä tropiikin rytmien kutsun. Kuuntele, kuinka 200-vuotias palmettopalmu sai kuninkaallisen tilausteoksen, miksi 18-vuotias Adrian ikuistettiin lauluun, ja mitä eroa on käsitteillä populaarimusiikki ja música popular. Toimittajana Mika Kauhanen.
