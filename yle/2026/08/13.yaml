      - title: 'Radio 1:n iltapäivä: ohjaaja, tuottaja Marko Talli: "Arja Saijonmaa on esikuva monelle suomalaiselle nuorelle naiselle"'
        start_time: '2026-08-13T13:30:00+03:00'
        end_time: '2026-08-13T15:00:00+03:00'
        description: |+
          Juontajana Miia Lahti. Kohta saa ensi-iltansa laulaja, näyttelijä, ihmisoikeusaktivisti Arja Saijonmaasta kertova dokumenttielokuva ”Laula minulle, Arja”. Selvisikö tuottaja-ohjaaja Marko Tallille elokuvan tekoprosessin aikana, mistä Saijonmaan karisma kumpuaa? Ohjaaja, tuottaja Marko Talli on Kati Turtolan haastattelussa n. klo 14.

