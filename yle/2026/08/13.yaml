      - title: 'Maailma tarinoina: Shakespearen Kesäyön unelmassa rakkaus ja mielikuvitus ovat liittolaiset'
        start_time: '2026-08-13T12:05:00+03:00'
        end_time: '2026-08-13T13:00:00+03:00'
        description: |-
          Kesäyön unelma on noin 31-vuotiaan Shakespearen käsialaa. Komediassa punoutuu yhteen useampikin juonikuvio ja lopussa koittaa näytelmä näytelmässä -rakenne, jossa kiteytyy kirjailijalle tyypillinen kyky tehdä nopeita leikkauksia koomisesta traagiseen. Nuori Shakespeare tarttuu unen värittämässä näytelmässä rakkauden eri sävyhin ja lajeihin sekä vallan ja sukupuolen kysymyksiin. Miten näytelmän kautta voidaan tarkastella vastasyttynyttä ja kauan pitkässä liitossa kytenyttä rakkautta? Miten se johdattelee pohtimaan rakkautta laajempana, mullistavana kokonaisuutena? 

          Shakespearen luomassa kehikossa rakkauden ulottuvuuksia hahmottavat Marja Vehkasen kanssa filosofi, kirjailija ja käsikirjoittaja Pärttyli Rinne ja vanhempi yliopistonlehtori, Shakespeare-tutkija ja kääntäjä Nely Keinänen.
      - title: 'Politiikkaradio: Onko työn verotusta pakko kiristää?'
        start_time: '2026-08-13T13:00:00+03:00'
        end_time: '2026-08-13T13:30:00+03:00'
        description: |-
          Ovatko veronkorotukset haitallisempia julkisen talouden vahvistamisessa kuin leikkaukset?
          Joutuuko seuraava hallitus kiristämään työn verotusta, kuten valtiovarainministeriön ylin verokarhu ennakoi?
          Politiikkaradiossa ovat aiheena verot. Keskustelemassa ovat valtiovarainministeriön vero-osaston päällikkö Terhi Järvikare, Kalevi Sorsa -säätiön toiminnanjohtaja, verotutkija Lauri Finér sekä johtaja ja pääekonomisti Päivi Puonti Suomen Yrittäjistä. Toimittajana on Antti Pilke.
      - title: 'Radio 1:n iltapäivä: ohjaaja, tuottaja Marko Talli: "Arja Saijonmaa on esikuva monelle suomalaiselle nuorelle naiselle"'
        start_time: '2026-08-13T13:30:00+03:00'
        end_time: '2026-08-13T15:00:00+03:00'
        description: |
          Juontajana Miia Lahti. Kohta saa ensi-iltansa laulaja, näyttelijä, ihmisoikeusaktivisti Arja Saijonmaasta kertova dokumenttielokuva ”Laula minulle, Arja”. Selvisikö tuottaja-ohjaaja Marko Tallille elokuvan tekoprosessin aikana, mistä Saijonmaan karisma kumpuaa? Ohjaaja, tuottaja Marko Talli on Kati Turtolan haastattelussa n. klo 14.

          N. klo 14:30 freelance-näyttelijä Anna-Sofia Tuominen on nähty erityisesti Q-teatterin lavalla sekä monissa elokuvissa sekä tv-sarjoissa. Viime kesän hän esitti Harmony Sisters -sisarussarjan Maire Valtosta Pyynikin kesäteatterissa Tampereella. Hän kertoo nyt kulttuurisista kokemuksistaan. Toimittajana Sari Valto.
      - title: 'Kulttuuriykkönen: Voiko tekoäly syrjäyttää kirjailijan?'
        start_time: '2026-08-13T15:00:00+03:00'
        end_time: '2026-08-13T15:58:00+03:00'
        description: |
          Tekoäly on nopeasti muuttamassa myös kirjallisuuden ja kustannusalan toimintatapoja.
          Se voi olla kirjailijalle oiva apuri esimerkiksi ideoinnissa, taustatiedon etsimisessä, tekstin muokkaamisessa ja kääntämisessä. Mutta missä menee raja? Miten paljon tekoäly saa auttaa luovassa työssä ja kirjoitusprosessissa?
          Kustantamoille tekoäly avaa uusia mahdollisuuksia. Tekoäly pystyy suoltamaan kevyttä viihdelukemista nopeasti ja vaivatta.Samalla nousee vaikeita kysymyksiä. Kuka omistaa tekoälyn avulla syntyneen tekstin? Miten varmistetaan kirjailijan oma ääni ja tekijänoikeudet, kun kone on oppinut valtavasta määrästä ihmisten kirjoittamia teoksia? Entä mitä tapahtuu kirjallisuudelle, jos markkinoille tulvii nopeasti ja halvalla tuotettua tekoälytekstiä?
          Millaisen roolin haluamme antaa tekoälylle kirjallisuudessa? Kulttuuriykkösessä näitä kiperiä kysymyksiä pohtivat kirjailija Virpi Hämeen-Anttila, Gummeruksen toimitusjohtaja Anna Baijars ja esikoiskirjailija, tekoälykonsultti Antti Ukkonen.
          Ohjelman toimittaa Miia Gustafsson.
