      - title: 'Klasariparatiisi: Ystävyyden ääniä'
        start_time: '2026-08-09T07:00:47+03:00'
        end_time: '2026-08-09T07:52:37+03:00'
        description: |
          Ystävyys on elämän suolaa. Ystävyys on vapaaehtoista ja tasavertaista vuorovaikutusta, peilautumista ja peilaamista. Eri elämäntilanteissa ja eri kulttuureissa ystävyys voi olla varsin erilaista ja joskus ystävyys voi ajautua kriisiin, tai loppua. Minkälainen on hyvä tai huono ystävä? 
          Musiikissa ystävyys voi kantaa kulttuurierojen yli.
          Haastateltavana viestinnän ja vuorovaikutuksen tutkijatohtori Ira Virtanen.
          Haastattelu on tehty kevään 2020 koronaeristyksen aikana etähaastatteluna.
          Eva Tigerstedt tieteen, taiteen ja musiikin risteyksessä, äänisunnittelijana Anders Wiksten. Uusinta vuodelta 2020.

          Ohjelmassa kuullaan otteita seuraavista teoksista:

          W.F.Bach: Sonaatti nro 3 Es-duuri huilulle ja oboelle (Kaisa Kortelainen, huilu, Kyeong Ham, oboe).
          Erik Satie: J'avais un ami (Juliette, laulu, ja Alexandre Tharaud, piano)
          Claude Debussy: Sonaatti viululle ja pianolle, osa Intermede (Janine Jansen, viulu, ja Itamar Golan, piano).
          Fanny Mendelssohn-Hensel: Pianotrio d-molli, osa Allegro molto vivace (Rödberg Trio).
          Ravi Shankar: Sitar and violin duet (Ravi Shankar, sitar, Yehudi Menuhin, viulu, Alla Rakha, tabla, Kamala Chakravarty, tanpura).
          Leos Janacek: Sonaatti viululle ja pianolle (Gidon Kremer, viulu, ja Martha Argerich, piano).
          Tom Jobin: Aguas de Marco (Elis Regina ja Tom Jobim, laulu, sekä yhtye).
