        description: |-
          Keittiömestari-ravintoloitsija Henri Alen on Porsche-ihminen. Hänellä on ollut Porsche yhtä kauan kuin ajokorttikin. Jo lapsuudenkodissa oman huoneen seinällä oli punaista Porschea esittävä juliste. Siitä se lähti, Alen sanoo. 

          Tällä hetkellä tallissa kaksi sen merkkistä autoa, joita käytetään lähinnä huviajeluihin. 

          Henri Alen esittelee Maija Salmiselle  autotallin aarteita:
