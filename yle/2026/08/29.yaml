      - title: 'Hanna Tikanderin toiset todellisuudet: “Tiedän luissa ja ytimissä, että kuolemaa ei ole”'
        start_time: '2026-08-29T10:25:00+03:00'
        end_time: '2026-08-29T10:51:00+03:00'
        description: |
          Netta joutui autokolariin parikymppisenä ja oli hetken kuolleena. Hän sanoo kokeneensa rakkautta, armollisuutta ja hyväksyntää eikä paluu kehoon silloin tuntunut houkuttelevalta. 
          Henkimaailma on ollut Netalle läsnä lapsuudesta asti, ja aikuisiällä kokemukset yhteydestä edesmenneeseen sisareen ovat vahvistaneet hänen näkemystään: kuolemaa ei ole, se on vain toinen värähtelytaajuus. ‘Kun ei pelkää kuolla, ei myöskään pelkää elää’, toteaa Netta.
