      - title: 'Keinuva talo - Mika Kauhanen: Harmonia ei ole aina harmonista'
        start_time: '2026-08-29T22:39:56+03:00'
        end_time: '2026-08-29T23:39:00+03:00'
        description: |-
          Pidätkö enemmän sopusoinnuista vai ristiriitaisista äänistä? Musiikissa molemmat ovat turvallisia, esteettisiä valintoja. 

          Jakson musiikkivalinnat soivat erilaisissa harmonioissa päästä päähän. Kuulemme bluegrass-laulajien terssipinoissa taivaallisen hunajaista harmoniaa ja sevdah-jousikvartetin satsissa kiehtovaa Balkanin klangia. Kuulemme myös, kuinka sievää harmoniaa karttava ja pikemminkin äänten törmäyskursseja etsivä Kimmo Pohjonen on tehnyt uuden albumin.

          Toimittajana Mika Kauhanen.
