          Anonyymi: Kun on turva Jumalassa (virsi 397) (Kirkkokuoro Haukiputaan Laulu/Hannu Niemelä, Päivi Meriläinen ja Sauli Saarela, laulu, ja Lauri-Kalle Kallunki, urut).

          Dvorak: Herra on mun paimenein (Jorma Hynninen, baritoni, ja Kari Jerkku, urut).

