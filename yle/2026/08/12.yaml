      - title: 'Radio 1:n iltapäivä: Elokuvat, jotka halusimme nähdä - Täällä Pohjantähden alla'
        start_time: '2026-08-12T13:30:00+03:00'
        end_time: '2026-08-12T15:00:00+03:00'
        description: |-
          Radio 1:n iltapäivän juontajana Miia Lahti. N. klo 14. suomalaisten toive-elokuvien sarjassa ‘Elokuvat, jotka halusimme nähdä’ on aiheena tänään varsinainen järkäle: Täällä Pohjantähden alla. Me keskitymme romaanitrilogiaa enemmän elokuvaan ja sen ensimmäiseen filmatisointiin, Edvin Laineen ohjaukseen vuodelta 1968. Elokuvasta ja sen tekemisestä kertoo Suomen Elokuvasäätiön Otto Suuronen, toimittaja on Jarmo Laitaneva. (Ensilähetys oli 23.6.26.)

          N. klo 14:30 muusikko, näyttelijä, kirjailija Olavi Uusivirta muistelee keikkaa joka on tehnyt häneen lähtemättömän vaikutuksen.
      - title: 'Kulttuuriykkönen: Koulut alkavat - onko koulushoppailu kasvava ongelma?'
        start_time: '2026-08-12T15:00:00+03:00'
        end_time: '2026-08-12T15:58:00+03:00'
        description: |-
          Koulushoppailulla tarkoitetaan ilmiötä, jossa vanhemmat pyrkivät hakemaan lapselleen muuta kuin lähikoulua ja valitsevat koulun sen maineen, oppimistulosten, painotetun opetuksen tai oppilaspohjan perusteella. Se lisää koulujen välistä kilpailua ja voi johtaa siihen, että oppilaat ja perheet eriytyvät sosioekonomisen taustan, kielitaidon tai muiden tekijöiden mukaan.

          Koulushoppailu voi myös vahvistaa koulujen maine-eroja itseään ruokkivalla tavalla: suosituimmat koulut vetävät puoleensa yhä enemmän hakijoita, kun taas vähemmän halutut koulut menettävät vetovoimaansa. Ilmiö herättää keskustelua siitä, miten vanhempien valinnanvapaus ja koulutuksellinen tasa-arvo voidaan sovittaa yhteen.

          Kysymykset koulusta kytkeytyvät laajemmin yhteiskuntaan, sen rakenteisiin ja demografiaan. Minkälaisista kokonaistekijöistä ilmiö nousee ja miten siihen voidaan puuttua? Keskustelemassa ovat OAJ:n erityisasiantuntija Päivi Lyhykäinen, THL:n erikoistutkija Timo Kauppinen sekä tietokirjailija ja tilastotieteilijä Osmo Soininvaara. 

          Ville Talola toimittaa.
