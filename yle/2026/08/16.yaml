        end_time: '2026-08-16T08:58:29+03:00'
        description: |+
          ”Mutta pian Mahlerin kuoltua kuultiin myös yhdeksäs sinfonia, joka oli aivan toisenlainen. Alma selitti sen riitasointisuuden ja päättymisen hitaaseen häipymiseen johtuvan kuolemanpelosta, ja Arnold Schönberg keksi myytin yhdeksännen sinfonian kohtalokkuudesta. Kaikki uskoivat.” - Minna Lindgren esitelmöi


