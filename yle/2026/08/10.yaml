        end_time: '2026-08-10T15:00:00+03:00'
        description: |-
          Juontajana Miia Lahti. N. klo 14: toimittaja ja kulttuurinrakastaja Jesse Raatikainen on hurahtanut sekä kulttuuriin että myös harrastukseensa liittyvään oheistoimintaan, keräilyyn. Raatikaisen intohimo on kerätä kirjoja ja muita teoksia omistuskirjoituksilla - tai ainakin tekijän nimellä varustettuna. Ohjelman toimittaa Jarmo Laitaneva. Ensilähetys oli kesäkuussa 2025.
