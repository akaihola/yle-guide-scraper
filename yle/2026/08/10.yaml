      - title: 'Keinuva talo - Mika Kauhanen: Aika aloittaa uutta?'
        start_time: '2026-08-10T17:35:00+03:00'
        end_time: '2026-08-10T18:35:00+03:00'
        description: |-
          Kaikkea voi kokeilla kerran, varsinkin kesäloman jälkeen. Alkamassa on nimittäin uusi harrastuskausi kerhoissa, joukkueissa ja opistoissa. On liikuntaa, kulttuuria, kieliä ja kädentaitoja. Joko ilmoittauduit jonnekin? Harrastuksia pyörittelee ja niihin sopivaa musiikkia valitsee toimittaja Mika Kauhanen. Miten olisi vaikka kalpamiekkailu tai korealainen kalligrafia?
