      - title: 'Radio 1:n iltapäivä: Musiikkikustantajat 50 vuotta - miksi tekijät tarvitsevat kustantajaa suoratoiston aikakaudella?'
        start_time: '2026-08-18T13:30:00+03:00'
        end_time: '2026-08-18T15:00:00+03:00'
        description: |-
          Miia Lahti haastattelee. Musiikkikustantajat ry täyttää tänä vuonna 50 vuotta. Mitä musiikin kustantaja tekee ja mikä on kustantajan merkitys suoratoiston aikakaudella?  Radio 1:n iltapäivän vieraana on n. klo 14 Musiikkikustantajien toiminnanjohtaja Jari Muikku, joka on tehnyt pitkän uran musiikkiviennin ja tekijänoikeusasioiden parissa.

          N. klo 14:30 kirjailija, näyttelijä Eppu Nuotio nostaa esille kulttuurikentän merkityksen ihmisen hyvinvoinnille. Hänelle teatterit ja kirjat olivat henkireikä ajoittain ahdistavissa nuoruusvuosissa. Sari Valto haastattelee. (Ensilähetys oli 14.8.25.)
