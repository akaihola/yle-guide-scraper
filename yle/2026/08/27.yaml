        description: |
          Ay Amor! Teatterimusiikkia ja lauluja 1600-luvun Espanjasta, säv. Hidalgo, Falconieri ja Selma y Salaverde (The Newberry Consort/Mary Springfels).

          01:10 Smyth: Kvintetto jousille E-duuri (Mannheimin jousikvartetti ja Joachim Griesheimer, sello).

