        end_time: '2026-08-27T08:00:00+03:00'
        description: |+
          Balakirev: Kalastajan laulu (Alexander Paley, piano).

          Dussek: Allegretto ma espressivo e moderato kvintetosta pianolle ja jousille f-molli (Olga Pashtshenko, fortepiano, Sirkka-Liisa Kaakinen-Pilch, viulu, Riitta-Liisa Ristiluoma, alttoviulu, Jukka Rautasalo, sello, ja Anna Rinta-Rahko, kontrabasso).

          Gaubert: Nokturni ja Allegro scherzando (Susan Milan, huilu, ja Ian Brown, piano).

          Brahms: Unkarilainen tanssi n:o 1 g-molli (RSO/Jukka-Pekka Saraste).

          Lalo: Souvenir (Muisto) kok. Trois melodies (Tassis Christoyannis, baritoni, ja Jeff Cohen, piano).

          Martini: Lemmen onni (Jouko Harjanne, trumpetti, ja Kari Hänninen, piano).

          Thomas: Välisoitto oopp. Mignon (BBC:n FO/Yan Pascal Tortelier).

          Sibelius (sov. Siirala): Menuetto C-duuri op.40/4 (Ismo Eskelinen, kitara).

          Clarke: Chinese puzzle (Duo Runya).

          Mana-Zucca: Fugato-humoresque Daniel Emmetin sävelmästä Dixie (Nanette Kaplan Solomon, piano).

          Jones: Finaali kansanmusiikkikonsertosta saksofoneille ja jousille (Daniel Reid, tenorisaksofoni, Jeanette Eriksson ja Sergio Crisostomo, viulu, Adrian Jones, alttoviulu, sekä Anna Wallgren, sello).

