        description: |-
          "Minä olen Kleopas"
          Kouluttaja, rovasti Mika Aspinen Vantaalta kutsuu loppukesän torstaiaamuissa eläytymään Raamatun henkilöiden sisäiseen matkaan. Viimeisessä jaksossa puhuu Emmauksen tiellä kulkeva Kleopas (Luuk. 24). Sarja päättyy (6/6).
