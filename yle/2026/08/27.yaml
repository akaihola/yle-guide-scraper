          03:18 Brahms: Sonaatti kahdelle pianolle f-molli (Emanuel Ax, piano, ja Yefim Bronfman, piano).

          04:00 Nielsen: Sinfonia n:o 1 g-molli (RSO/Jukka-Pekka Saraste).

          04:32 Rimski-Korsakov: Orkesterisarja oopp. Voivodi (Bolshoi-teatterin ork./Jevgeni Svetlanov).

          04:57 Debussy: 12 etydiä pianolle (Paul Jacobs).

          05:47 Gounod: Julian uni oopp. Romeo ja Julia (Minnesotan ork./Eiji Oue).

          05:51 Aguado: Adagio ja poloneesi kitaralle (Julian Bream).

          06:03 Purcell: Sonaatti n:o 8 kahdelle viululle, viola da gamballe ja continuolle (London Baroque).

