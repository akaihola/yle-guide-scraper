      - title: Faunin iltapäivä
        start_time: '2026-08-27T16:07:00+03:00'
        end_time: '2026-08-27T16:59:00+03:00'
        description: |-
          Respighi: Balletto detto Il Conte Orlando (Baletti nimeltä Kreivi Orlando) sarj. Antiche arie e danze per liuto n:o 1 (Vanhoja aarioita ja tansseja luutulle) (Los Angelesin kamariork./Neville Marriner).

          Händel: Süsse stille, sanfte Quelle (Suloinen hiljainen, lempeä lähde) (Julianne Baird, sopraano, ja Tempesta di Mare).

          J.S. Bach (ork. Stokowski): Fuuga uruille g-molli (Pieni fuuga) (Los Angelesin FO/Esa-Pekka Salonen).

          Gluck - Kreisler: Autuaitten sielujen karkelo oopp. Orfeo ed Euridice (Vilde Frang, viulu, ja Jose Gallardo, piano).

          Sarasate: Playera (Brodsky-kvartetti).

          Dvorak: Slaavilainen tanssi n:o 5 (Skocna, tshekkiläinen hyppytanssi) (Empire Brass ja Steve Wilkes, lyömäsoittimet). 

          Offenbach: Dapertutton peiliaaria "Allez! pour te livrer combat - Scintille diamant" oopp. Hoffmannin kertomukset (Bryn Terfel, bassobaritoni, ja Metropolitan-oopperan ork./James Levine).

          Dring: Allegro con brio triosta huilulle, oboelle ja pianolle (Juliette Bausor, Daniel Bates ja Simon Lepper).

          Elgar: Serenade mauresque (Maurilainen serenadi) (Uuden-Seelannin SO/James Judd).

          Viardot: Les filles de Cadiz (Cadizin tytöt) (Cristina Bayon, sopraano, ja Jesús Pineda, kitara).

          Bizet: Salakuljettajien marssi oopp. Carmen (New Yorkin FO/Leonard Bernstein).

          Schubert: Moment musical n:o 3 f-molli (John O'Conor, piano).

          Ibert: Restaurant au Bois de Boulogne (Ravintola Bois de Boulognessa) teoks. Donogoo-tonka (Ranskankielisen Sveitsin ork./Neeme Järvi).

          Konsertin on laatinut Ainomaija Pennanen. 
