      - title: Rehtorin tyttäret 4/5.
        start_time: '2026-08-27T22:31:00+03:00'
        end_time: '2026-08-27T22:59:00+03:00'
        description: |-
          Osa 4/5 Sodassa menehtyneen rehtori Sipolan perhe kohtaa uuden elämänvaiheen. Jokaisen olisi nyt huolehdittava itsestään. Vanhimmat tyttäret Raija, Pirkko, Sirkka ja Satu alkavat huushollaamaan ja äiti hakeutuu opettajan töihin. Pienimmät Kaarina sekä kuopus Jorma saavat vielä temmeltää vapaasti. Sarja vuodelta 1959.
      - title: Epäilyttävän uutta - Aki Yli-Salomäki
        start_time: '2026-08-27T23:01:00+03:00'
        end_time: '2026-08-27T23:57:00+03:00'
        description: |-
          Digitaaliseen musiikkiavaruuteen virtaa jatkuvasti uutta kuunneltavaa. Aki Yli-Salomäki poimii virrasta musiikkia, joka heijastelee tätä aikaa ja ympäristöä, on helposti lähestyttävää, mutta silti kunnianhimoista ja uteliasta.
