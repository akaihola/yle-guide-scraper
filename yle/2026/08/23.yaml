          Ogives no 1 (Olof Höjer, piano)

          Claude Debussy: Ote teoksesta Faunin iltapäivä (Berliinin filharmonikot, joht. Claudio Abbado)

          Erik Satie: 

          Vexations (Alan Marks, piano)

          Je te veux (Juliette, laulu, ja Alexandre Tharaud, piano)

          Kolme päärynänmuotoista kappaletta, osa Vähän lisää (Alexandre Tharaud ja Eric Le Sage, piano)

          Urheilua ja huvituksia, osat: Mauton koraali, Keinu, Metsästys, Morsiamen herääminen, Kalastus, Huvipurjehdus, Merikylpy, Karnevaali, Kilpajuoksut, Nelinurkka, Taukoamaton tango, Ilotulitus (Anne Queffélec, piano)

