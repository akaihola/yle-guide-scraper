      - title: 'Klasariparatiisi - Eva Tigerstedt:  Herra Köyhän elämästä'
        start_time: '2026-08-23T07:00:47+03:00'
        end_time: '2026-08-23T07:55:37+03:00'
        description: |
          Erik Satien elämä oli surullinen ja yksinäinen. Samalla hän oli aikansa omaleimaisimpia taiteilijoita. Hän sävelsi riisuttua musiikkia, kirjoitti hapokkaita tekstejä ja oli myös visuaalisesti lahjakas. Hänellä oli ajatuksia kokonaistaideteoksista, mutta eri tyylisiä kuin suurella Herra Wagnerilla. Satien elämä kuvastaa 1900-luvun taitteen pariisilaista taide-elämää. 

          Eva Tigerstedt avaa polkuja musiikkiin.
          Lukijat: Pietari Kylmälä ja Pentti Männikkö. 


          Ohjelman musiikit: 

          Erik Satie:

          Musiikkia elokuvaan Entr'acte

          Musiikkia baletista Relache (Nancyn sinfoniaorkesteri, joht. Jérome Kaltenbach)

