      - title: 'Maisteri Lindgrenin musiikkiesitelmä: Salaliittoteorioita Pjotr Tšaikovskin vaikean elämän vaikeasta lopusta'
        start_time: '2026-08-23T08:05:37+03:00'
        end_time: '2026-08-23T08:58:58+03:00'
        description: |-
          "Tšaikovski oli hyvin tietoinen kaupungin koleraepidemiasta ja siihen liittyvistä tiukoista säännöistä, joita tunnetusti noudatti. Kuinka hän sitten olisi yhtäkkiä ajatellut, että hanavesi on juomakelpoista eikä millään ole mitään väliä? Koska hän halusi tehdä itsemurhan, sanovat salaliittoteoreetikot, joita toden totta on aina ollut keskuudessamme. Tämäkään ilmiö ei siis ole tylsämielisten yhdysvaltalaisten netissä roikkujien keksimä ajanviete, vaan yksi sitkeä muoto ihmiselle tyypillisestä parvityhmyydestä." - Minna Lindgren esitelmöi.
