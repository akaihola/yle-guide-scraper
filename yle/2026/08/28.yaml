        description: |
          Kirjeenvaihtaja Jenny Matikaisen minisarjan toisessa osassa pohditaan ruotsalaisten suhdetta sotaan. Venäjän suurhyökkäys Ukrainaan muutti kaiken, myös Ruotsissa. Liittoutumattomuus lensi käden käänteessä romukoppaan ja rauhan turmelemille ruotsalaisille hoetaan, että sota voi syttyä. Jenny yrittää päästä Kiirunaan Ruotsin avaruusasemalle, missä autetaan Eurooppaa irtautumaan Donald Trumpin ja Elon Muskin otteesta.
