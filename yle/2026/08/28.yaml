      - title: 'Maisteri Lindgrenin musiikkiesitelmä: Naisnäkökulmasta sopraano on aina tähti eikä koskaan uhri'
        start_time: '2026-08-28T11:00:00+03:00'
        end_time: '2026-08-28T11:55:00+03:00'
        description: |-
          "Tulkinta oopperasta misogyynisena taidemuotona, anteeksi kaikkein misogyynisimpana taidemuotona, provosoi minua väittämään, että ooppera on feministinen taide, anteeksi feministisin taide, kun otetaan siis aikakaudet ja historia huomioon. Väite misogyniasta on historiaton näkemys oopperasta ja perustuu siihen, että analyytikko ei pysty lukemaan taiteen syntyhetkellä oopperan tarinoiden merkitystä eikä lue symboleja." - Minna Lindgren esitelmöi.
