      - title: 'Pieleen mennyt historia: Hometaloja ja tonnikaupalla jätettä – miksi rakentaminen meni mönkään?'
        start_time: '2026-08-28T21:31:00+03:00'
        end_time: '2026-08-28T22:25:00+03:00'
        description: |
          Rakennettiinko ennen parempia taloja? Oliko sata vuotta sitten sisäilmaongelmia? Näitä kysymyksiä pohtivat arkkitehtuurin historian apulaisprofessori Panu Savolainen, tekniikan tohtori ja arkkitehti Petri Neuvonen, arkkitehti ja puuseppä Lars-Erik Mattila, historianopettaja Lasse Hongisto ja toimittaja Jussi Nygren. (2024)
          Sarjan Pieleen mennyt historia kaikki jaksot ovat kuunneltavissa Yle Areenassa.
