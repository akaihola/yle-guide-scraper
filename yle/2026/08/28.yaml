      - title: 'Pieleen mennyt historia: Hometaloja ja tonnikaupalla jätettä – miksi rakentaminen meni mönkään?'
        start_time: '2026-08-28T21:51:00+03:00'
        end_time: '2026-08-28T22:35:24+03:00'
        description: |
          Rakennettiinko ennen parempia taloja? Oliko sata vuotta sitten sisäilmaongelmia? Näitä kysymyksiä pohtivat arkkitehtuurin historian apulaisprofessori Panu Savolainen, tekniikan tohtori ja arkkitehti Petri Neuvonen, arkkitehti ja puuseppä Lars-Erik Mattila, historianopettaja Lasse Hongisto ja toimittaja Jussi Nygren. (2024)
          Sarjan Pieleen mennyt historia kaikki jaksot ovat kuunneltavissa Yle Areenassa.
      - title: Tuuli Saksalan keidas
        start_time: '2026-08-28T22:36:00+03:00'
        end_time: '2026-08-28T23:25:37+03:00'
        description: |-
          Elokuu tuoksuu kirpeiltä omenoilta, mullalta ja uusilta aluilta. Tuuli Saksalan keitaalla kuullaan elokuun parasta maailmanmusiikkia vieraanvaraisuuden ja sadonkorjuun teemojen äärellä.

          Matkalla kuullaan tarinoita nälänhädästä ja uudesta alusta Quebecissä, sardinialaisten paimenien yhteisöllisyydestä ja unkarilaisen romanilaulajan kohtaamisesta serbialaisten muusikoiden kanssa. Ghanalainen muusikko muistelee ensimmäistä päiväänsä Brysselissä, kurdilaulaja saa laulaa omalla kielellään Wienissä, ja itäeurooppalaisten muusikoiden yhteistyö todistaa, että rajat on tarkoitettu ylitettäviksi. Mukana myös bosnialaisten sevdalinkojen uudelleentulkinta ja korsikalaisen polyfonian elävä perinne.
