        description: |
          Voiko kaupunki olla yksi kirjan päähenkilöistä? Kirjailija Max Mannerin jännitystarinoiden hahmot seikkailevat usein Mannerin kotikaupungissa  Turussa ja pitkään Luxemburgissa asuneen kirjailijan teoksissa liikutaan tottuneesti myös Benelux-maissa. Melkein kaksikymmentä vuotta jännityskirjoja kirjoittanut Manner julkaisi tänä kesänä murhalorutrilogiansa toisen kirjan Viiltävä kuin paperi. Max  Manner on Kati Turtolan studiovieraana n. klo 14.
          N. klo 14:30 yrittäjä, tietokirjailija Saku Tuominen kertoo häneen erityisesti vaikuttaneesta kulttuurielämyksestään Maija Salmiselle.
