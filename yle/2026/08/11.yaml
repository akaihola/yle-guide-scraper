      - title: Maailmanpolitiikan arkipäivää
        start_time: '2026-08-11T20:35:00+03:00'
        end_time: '2026-08-11T21:00:00+03:00'
        description: |
          Useassa EU-maassa medianvapaus on heikentynyt viime vuosien aikana. Näin siitä huolimatta, että EU:ssa astui kaksi vuotta sitten voimaan medianvapaussäädös. 

          Toimittajat ilman rajoja -järjestön selvityksen mukaan EU-maista vain Suomi, Ruotsi ja Tanska ovat toteuttaneet säädöksen täysimääräisesti. Järjestön EU-edustaja sanoo ohjelmassa, että EU-komission tulisi ryhtyä toimiin, jotta EU-maat saataisiin noudattamaan medianvapaussäädöstä.

          Huonoin medianvapaustilanne on Kreikassa. Se sijoittuu kansainvälisessä medianvapaustilastossa EU-maista heikoimmalle sijalle. Ohjelmassa kuullaan raportti Kreikasta ja selviää, miksi medianvapaus Kreikassa mataa.

          Unkarissa mediakenttä on myllerryksessä huhtikuisten vaalien jälkeen. Victor Orbánin vaalitappion myötä myös mediaan luotu Orbánin propagandakoneisto on murenemassa. Unkarilaisprofessori avaa ohjelmassa, mitä Unkarissa nyt tehdään, jotta maahan saataisiin aidosti vapaa, poliittisesta johdosta riippumaton media. Unkarin televisio- ja radiouutiset on keskeytetty elokuun puoliväliin asti toimitusten uudistamisen ajaksi.

          Ohjelman lopuksi suomalaisasiantuntija arvioi Suomen medianvapauden tilaa ja potentiaalisia uhkia.

          Maailmanpolitiikan arkipäivää -ohjelman ovat toimittaneet Sara Saure ja Paula Vilén. Äänitarkkailijana on Marko Vierikko. Tunnusmusiikki: Petri Alanko, kuva: Tuuli Laukkanen/Yle.
