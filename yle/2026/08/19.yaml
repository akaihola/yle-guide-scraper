      - title: 'Havaintoja muutoksesta: Sukupolvien välisestä kuilusta kohti empatiaa ja ymmärrystä'
        start_time: '2026-08-19T10:00:00+03:00'
        end_time: '2026-08-19T10:50:00+03:00'
        description: |
          Yhteiskunta on muuttunut yksilön vastuuta korostavaksi ja kilpailullisuus läpäisee yhteiskunnan ja kulttuurin. Miksi kriittinen katse ajassamme kohdistetaan usein nuoriin ja nuoriin aikuisiin?  Miten sukupolvien välinen empatiakuilu ylitetään? 
          Toimittaja Satu Kivelä ja etsii vastauksia yhdessä psykoterapeutti, tietokirjailija Emilia Kujalan ja muusikko Antti Aution kanssa.  
