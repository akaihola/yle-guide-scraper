      - title: 'Radio 1:n iltapäivä: Lauri Ahokkaalla on kolme vaativaa ammattia - hän on konsertoiva pianisti, kapellimestari ja silmälääkäri'
        start_time: '2026-08-19T13:30:00+03:00'
        end_time: '2026-08-19T15:00:00+03:00'
        description: |
          Lauri Ahokas on silmätautien erikoisläääkäri ja konsertoiva kapellimestari sekä pianisti. Miten multitalentti Ahokas jakaa aikansa ja ajatuksensa taiteellisen ja tieteellisen tekemisen välillä? Mitä yhteistä musiikilla ja silmäsairauksien tutkimuksella on? Entä mitä lääketieteellinen työ antaa muusikon työhön? Tatu Tamminen haastattelee.

          Tämän illan konsertissa Radio 1:ssä tutustutaan kolmen sadan vuoden takaiseen häämusiikkiin. Millainen musiikki soi Bachin aikaan häissä Leipzigissa? Konsertin esiintyjät sopraano Tuuli Lindeberg ja cembalisti Matias Häkkinen kertovat illan konsertista n. klo 14:30. Haastattelun on tehnyt musiikkitoimittaja Noora Hirn.
