        end_time: '2026-08-19T18:35:00+03:00'
        description: |-
          Miten UMO Helsinki Jazz Orchestran uusi kolmihenkinen taiteellinen johto muuttaa suomalaisen jazzin kenttää? Pääkapellimestari Ville Vannemaa ja residenssisäveltäjä Bianca Rantala kertovat yhteistyöstään, luovuudesta ja jazzin tulevaisuudesta. Toimittajina Laura Korhonen ja Eero Koski. Ohjelma on uusinta keväältä 2026.
