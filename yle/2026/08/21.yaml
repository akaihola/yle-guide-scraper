      - title: 'Radio 1:n iltapäivä: Kirjani tarina - Katja Kettu'
        start_time: '2026-08-21T13:30:00+03:00'
        end_time: '2026-08-21T15:00:00+03:00'
        description: |+
          Juontajana Miia Lahti.
          N. klo 14 Kirjani tarina: Brita-Kajsa-romaani on elävä tutkimusmatka 1800-luvun Ruotsin Lappiin, sen luontoon ja pohjoisen saamelaisväestön ahdingon kuvaamiseen kun etelästä saapuvat Tukholman lait ja sorto. Tarinan päähenkilö ja kertoja on herätysliikkeen johtaja Lars Levi Laestadiuksen vaimo Brita-Kajsa. Kielellisesti rikkaan tarinan teemat kietoutuvat naisen ja alkuperäisväestön aseman lisäksi seksuaalisuuden ja luonnon voiman kuvauksen sekä anteeksiannon lohdullisen mahdollisuuden ympärille. Vieraana on kirjailija Katja Kettu. Toimittaja Jukka Kuosmanen. 
          N. klo 14:30 Illan kynttiläkonsertissa kuullaan intiimiä kotimusiikkia. Sopraano Tuuli Lindeberg ja cembalisti Matias Häkkinen ovat penkoneet Johann Sebastian Bachin toisen vaimon, Anna Magdalenan nuottikirjaa. Konsertin esiintyjät Tuuli Lindeberg ja Matias Häkkinen kertovat nyt illan konsertin ohjelmasta. Haastattelijana on musiikkitoimittaja Noora Hirn.

