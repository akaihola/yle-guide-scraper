      - title: 'Havaintoja muutoksesta: Kestävän työelämän malli'
        start_time: '2026-08-26T10:00:00+03:00'
        end_time: '2026-08-26T10:50:00+03:00'
        description: |
          Digitalisaatio ja monipaikkainen työ ovat muuttaneet työelämää, mutta arjen käytänteet voivat laahata perässä. Monitieteisen WorkWell-tutkimushankeen tavoitteena on uudistaa työn tekemisen käytäntöjä kohti kestävää työelämän mallia. Millaiset käytänteet ja rakenteet mahdollistavat työhyvinvoinnin ja tuottavuuden? 
          Toimittaja Satu Kivelä keskustelee WorkWell-tutkimushankkeessa työskentelevien professoreiden Anne Mäkikankaan ja Teemu Laineen kanssa. 
