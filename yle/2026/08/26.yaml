      - title: 'Radio 1:n iltapäivä: Säveltäjä, muusikko Tarmo Anttila haluaa levittää iloa taiteellaan -  nyt hän on säveltänyt Bilepassion'
        start_time: '2026-08-26T13:30:00+03:00'
        end_time: '2026-08-26T15:00:00+03:00'
        description: |-
          Juontajana Miia Lahti. N. klo 14 studiovieraana on säveltäjä, muusikko Tarmo Anttila. Hän sanoo haluavansa levittää taiteellaan ja töillään iloa. Anttila on säveltänyt Bilepassion, jonka yksi keskeisistä teemoista on ystävyys. Bilepassiossa esiintyvät Lohjan kaupunginorkesteri, solisteina mm. Waltteri Torikka ja kuorona Grex Musicus. N. klo 14:30 Kansanmuusikko Antti Paalanen tuli tunnetuksi suuren yleisön keskuudessa viime kevään UMK-kilpailun myötä. Minkälaiseksi laulaja, harmonikansoittaja Antti Paalanen kuvailee omaa soundiaan ja miten kansanmusiikki on solahtanut pop-musiikin maailmaan? Toimittajana Salla Matusiak.
