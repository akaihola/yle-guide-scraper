      - title: 'Konsertteja: Sibelius-kilpailun voittaja Sueye Park BBC:n Proms-festivaalilla'
        start_time: '2026-08-26T19:02:00+03:00'
        end_time: '2026-08-26T20:40:00+03:00'
        description: |-
          Vuoden 2025 Sibelius-kilpailun voittaja Sueye Park tekee BBC Proms-debyyttinsä kapellimestari John Storgårdsin ja BBC:n filharmonisen orkesterin solistina soittamalla minkäpä muun kuin Sibeliuksen viulukonserton. Konsertti päättyy Richard Straussin sinfoniseen runoon "Also sprach Zarathustra", jonka loistava orkestraalinen auringonnousu tuli kuuluisaksi Stanley Kubrickin elokuvassa "2001: Avaruusseikkailu". Konsertin toimittaa Ainomaija Pennanen. 
