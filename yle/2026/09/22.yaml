          Zhak: Soittajapoika (Laila Kinnunen).
          Roberts: Hey Joe (Johnny Hallyday).
          Sartori/Quarantotto: Con te partirò (Andrea Bocelli).

          Konsertin on toimittanut Riikka Holopainen.
