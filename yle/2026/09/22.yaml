        end_time: '2026-09-22T15:00:00+03:00'
        description: |+
          Lähde mukaan musiikin maailmankiertueelle! Lähetyksessä mukana myös kulttuurikokemuksia ja kurkistuksia konserttien kulisseihin.


          Söderström: Kasvoton kaupunki (Syskofrenia).

          La La Lars: Pour qui pourquoi. 

          Beija Flor e Passarinho: Segura o tombo da canoa (Thais Morell).

          A. Shankar, Kale, Jones: Easy (Anoushka Shankar, Karsh Kale, Norah Jones ja Gaurav Raina).

          Richard Bona: Couscous.

          Kivilehto: Piiri (Mirkka ja Madrugada).

          Gargalo: Swinga sambaby (Trio Mocoto).

          M. Maja: Etelän yössä (Uusikuu).

          Timonen: Polska in red (Vilma Timonen).

          NES: Ahlam.

          McHugh, Adamson: I just found out about love (The Wade Mikkola Quintet).

          Melingo: Garrapatea (Daniel Melingo).

          Julien Clerc ja Stephan Gaubert: Ma preference.

