      - title: Faunin iltapäivä
        start_time: '2026-09-22T16:07:00+03:00'
        end_time: '2026-09-22T16:59:00+03:00'
        description: |-
          Hummel: Rondo kons. trumpetille ja orkesterille Es-duuri (Wynton Marsalis ja Lontoon kansallinen FO/Raymond Leppard).

          Francaix: Andante oktetosta klarinetille, käyrätorvelle, fagotille, kahdelle viululle, alttoviululle, sellolle ja kontrabassolle (Ensemble Wien-Berlin).

          Puccini: Cavaradossin aaria E lucevan le stelle oopp. Tosca (Franco Corelli, tenori, ja Philharmonia-ork./Franco Ferraris).

          Mustonen: Finaali konsertosta kolmelle viululle ja orkesterille (Pekka Kuusisto, Jaakko Kuusisto, Elisabeth Batiashvili sekä Tapiola Sinfonietta/Olli Mustonen).

          J. S. Bach: Allegro cembalokonsertosta 4 A-duuri (Angela Hewitt, piano, ja Australian kamariork./Richard Tognetti).

          Mozart: Servilian aaria oopp. La Clemenza di Tito (Kathleen Battle, sopraano, ja Metropolitan-oopperan ork./James Levine). 

          C. Stamitz: Rondeau sellokonsertosta n:o 4 C-duuri (Werner Matzke ja Concerto Köln).

          Giuliani: Rondo serenadista huilulle ja kitaralle (Mikael Helasvuo, huilu, ja Jukka Savijoki, kitara).

          Massenet: Pensée d'automne (Syksyinen miete) (Cyrille Dubois, tenori, ja Pariisin kamariork./Hervé Niquet).

          Leclair: Andante (Dolce) alkusoitosta D-duuri kahdelle viululle ja continuolle (Irmgard Schaller, viulu, Richard Gwilt, viulu, ja London Baroque).

          Chaminade: La lisonjera (I Salonisti).

          Montero: Improvisaatio pianolle tangon tapaan (Gabriela Montero).

          Lehár: Octavion laulu "Freunde, das Leben ist lebenswert" oper. Giuditta (Nicolai Gedda, tenori, sekä Münchenin Gärtnerplatzin valtionteatterin kuoro ja Graunke-SO/Willy Mattes).


          Konsertin on laatinut Ainomaija Pennanen.
