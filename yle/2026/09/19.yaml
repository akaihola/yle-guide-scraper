      - title: 'Viihdekuunnelma: Knalli ja sateenvarjo'
        start_time: '2026-09-19T15:00:00+03:00'
        end_time: '2026-09-19T15:25:00+03:00'
        description: |
          Penkkiurheilua
          Tervetuloa jälleen ministeriön erikoisosastolle, jossa sattuu ja tapahtuu!
          Yle100 -vuoden kunniaksi iki-ihana ja rakastettu Knalli ja sateenvarjo -kuunnelmasarja saa kolme upouutta jaksoa.
          Tämä Ylen kaikkien aikojen kuunnelluimmista ja toivotuimmista sarjoista pilailee valtion virkamiesten ja virastojen kustannuksella, ja tälläkin kertaa ystävämme Mr. Lennox-Brown, Mr. Lamm sekä sihteeri Mildred Murfin saapuvat töihin byrokratian rattaisiin knallit päässä ja äly ämpärissä.

          Käsikirjoitus (vuosilta 1979-80): Crawford Campbell
          Suomennos: Kersti Juva
          Ohjaus: Aila Svedberg ja Soila Valkama
          Musiikki: Jani Uhlenius
          Äänisuunnittelu: Anders Wiksten
          Apulaistuottaja: Jori Pessala
          Tuotanto: Laura Jaakkola, Yle Draama 2026. 

          Rooleissa:
          Lennox-Brown - Heikki Nousiainen
          Lamm - Pekka Autiovuori
          Mildred - Aila Svedberg
          Sir Gregory Pitkin - Jarmo Koski
          Cornelius Crook - Tuomas Uusitalo
          Lollita Crook - Anna-Leena Sipilä
          Strong - Markus Riuttu
          Työmies - Ylermi Rajamaa
          Konstaapeli - Jarkko Pajunen
          Ministeri - Santeri Kinnunen
          Oldman, hovimestari - Jori Pessala
          Kertoja ja uutistenlukija - Asko Sarkola.
