        description: |
          Penkkiurheilua
          Tervetuloa jälleen ministeriön erikoisosastolle, jossa sattuu ja tapahtuu!
          Yle100 -vuoden kunniaksi iki-ihana ja rakastettu Knalli ja sateenvarjo -kuunnelmasarja saa kolme upouutta jaksoa.
          Tämä Ylen kaikkien aikojen kuunnelluimmista ja toivotuimmista sarjoista pilailee valtion virkamiesten ja virastojen kustannuksella, ja tälläkin kertaa ystävämme Mr. Lennox-Brown, Mr. Lamm sekä sihteeri Mildred Murfin saapuvat töihin byrokratian rattaisiin knallit päässä ja äly ämpärissä.

          Käsikirjoitus (vuosilta 1979-80): Crawford Campbell
          Suomennos: Kersti Juva
          Ohjaus: Aila Svedberg ja Soila Valkama
