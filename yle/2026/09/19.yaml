          Rakkaudessa pettyneen Niskavuoren ylpeän tyttären ainoana tavoitteena on tehdä sulhasensa Akustin talosta Niskavuoren veroinen kartano. Kirjoittanut Hella Wuolijoki. Teos on vuodelta 1955.
