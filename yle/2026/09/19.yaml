        description: |-
          L. Anderson: Sarabande (Kölnin radio-ork./Pinchas Steinberg).

          Price: The deserted garden (Hylätty puutarha) (Boyd Meets Girl).

          Catalani: Wallyn aaria "Ebben?...Ne andrò lontana" oopp. La Wally (Maria Callas, sopraano, ja Philharmonia-ork./Tullio Serafin).

          N. Boulanger: Vite et nerveusement rythmé teoks. Trois pièces (Antonio Meneses, sello, ja Celina Szrvinsk, piano).

          MacLean: Caledonia (Voces8).

          O'Connell - Eilish: No time to die (Raphaela Gromes, sello, ja Julian Riem, piano).

          Tabakova: Light falls the rain sinfonisesta runosta On the south downs (Natalie Clein, sello, sekä Truron katedraalikuoro ja BBC:n konserttiork./Christopher Gray).

          Backer-Gröndahl: Humoresque g-molli (Hiroko Ishimoto, piano). 

          A.M. Smith: Allegretto amorevole sinf. c-molli (Lontoon Mozart-soittajat/Howard Shelley).

          Mendelssohn: Scherzo jousikvartetille a-molli (Emerson-jousikvartetti).

          Löfgren: Frozen in time (Reetamaria Rajala, piano). 

          Puccini: Scarpian, Spolettan ja kuoron kohtaus "Mene Tosca! - Te Deum" oopp. Tosca (Usko Viitanen, baritoni, Kauko Väyrynen, tenori, sekä Suomen Kansallisoopperan kuoro ja RSO/Okko Kamu).

          Konsertin on toimittanut Annina Aho.
