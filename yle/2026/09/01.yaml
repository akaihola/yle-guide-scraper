      - title: 'Kulttuuriykkönen: Diagnoosien vyöry - mistä kyse?'
        start_time: '2026-09-01T15:00:00+03:00'
        end_time: '2026-09-01T15:58:00+03:00'
        description: |
          ADHD, ADD, ASD, OCD, PTSD, C-PTSD… 

          Psykiatristen ja neuropsykiatristen diagnoosien määrä on kasvanut viime vuosina voimakkaasti, ja diagnooseista on tullut yhä näkyvämpi osa myös arkista puhetta ja ihmisten tapaa ymmärtää itseään. Kulttuuriykkösessä tarkastellaan diagnoosien yleistymistä ja kysytään, mitä kehityksen taustalla oikeastaan on. Onko kyseessä jopa jonkinlainen kulttuuri-ilmiö?
          Kimmokkeen keskustelulle antaa juuri julkaistu Diagnoosivyöry – Kuinka adhd, masennus ja trauma valloittivat maailman -teos. Miksi diagnoosit ovat lisääntyneet? Kertooko kasvu ennen kaikkea siitä, että tunnistamme aiemmin huomaamatta jääneitä ongelmia entistä paremmin, vai ovatko myös normaalin ja sairauden rajat muuttuneet? Mitä diagnoosi ihmiselle antaa ja mitä se todella selittää oireilusta ja sen syistä? Entä voiko diagnoosikeskeisellä ajattelulla olla myös ongelmallisia seurauksia?
          Keskustelemassa ovat psykiatri Jani Kajanoja, psykologian tohtori Tomi Bergström sekä Diagnoosivyöry-teoksen kirjoittajiin kuuluva filosofian tohtori Mia Pohtola.

          Toimittajana on Ville Talola.
