      - title: 'Keinuva talo - Mika Kauhanen: Soivat puut'
        start_time: '2026-09-14T17:35:00+03:00'
        end_time: '2026-09-14T18:35:00+03:00'
        description: |-
          Kun matkailee musiikissa yli mantereiden, puupuhaltimien erilaisuus ja samanlaisuus voi yllättää. Puhumattakaan siitä, kuinka mestarisoittajat osaavat puhaltaa instrumenttinsa henkiin. Kuulemme esimerkiksi kaval-huilun akrobatiaa kaikissa bulgarialaisissa tahtilajeissa, aprikoosipuusta valmistetun dudukin vuorille nousevia henkäisyjä, hienostuneen shakuhachin erottelukykyä ja panhuilun nykytähden tulkinnan ohikiitävästä kotkasta. Toimittajana Mika Kauhanen.
