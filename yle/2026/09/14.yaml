        description: |-
          Chopin: Valssi n:o 6 (Minuuttivalssi) Des-duuri (Maria Joao Pires, piano).

          Donizetti: Herttuan aaria oopp. Alban herttua (Dmitri Hvorostovski, baritoni, ja Lontoon Philharmonia-ork./Ion Marin).

          Tailleferre: Arabeski (Deborah Marshall, klarinetti, ja Angela Gassenhuber, piano).

          Sibelius: Impromptu jousiorkesterille (Keski-Pohjanmaan Kamariork./Juha Kangas).

          Artôt: Allegro neljälle käyrätorvelle (Detmoldin käyrätorvikvartetti).

          J.D. Berlin: Allegro sinfoniasta a 8 D-duuri (Norjalainen barokkiork.).

          Rimski-Korsakov - Kreisler: Hindulaulu oopperasta Sadko (Christian Ferras, viulu ja Jean-Claude Ambrosini, piano).

          Chaminade: Attente (Anne Sofie von Otter, mezzosopraano, ja Bengt Forsberg, piano).

          Poulenc: Finaali konsertosta kahdelle pianolle ja orkesterille d-molli(Sylviane Deferne ja Pascal Roge sekä Lontoon Philharmonia-orkesteri/Charles Dutoit).

          Rameau: Villit "Suuren rauhanpiipun tanssi" oopperabaletista Les Indes galantes (Alankomaiden radion kamariorkesteri, joht. Ton Koopman).

          Händel: Aaria 'Lascia ch'io pianga' oopperasta Rinaldo (Anthony Roth Costanzo, kontratenori, ja Les Violons du Roy/Jonathan Cohen).

          Debussy: Jardins sous la pluie (Puutarhoja sateessa) sarj. Estampes (Vaskipiirroksia) (Anna Kuvaja, piano). 

          Griffes: The lake at evening (Iltainen järvi) (Buffalon FO/JoAnn Falletta).


          Konsertin on laatinut Ainomaija Pennanen.
