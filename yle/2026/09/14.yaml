      - title: Maailmanpolitiikan arkipäivää
        start_time: '2026-09-14T22:20:04+03:00'
        end_time: '2026-09-14T22:43:48+03:00'
        description: |+
          Ruotsalaiset äänestävät valtiopäivävaaleissa, joissa valta voi vaihtua. 

          Mielipidekyselyt ennakoivat vaalivoittoa Magdalena Anderssonin sosiaalidemokraateille. Ruotsidemokraatit voivat nousta jopa Ruotsin toiseksi suurimmaksi puolueeksi, ohi pääministeri Ulf Kristerssonin maltillisen kokoomuksen.
          Ohjelmassa kuullaan ruotsalaisten tuntoja vaalien alla. Terveydenhuolto, koulutus ja talous ovat äänestäjille tärkeimpiä teemoja.

          Ruotsin politiikan asiantuntijat arvioivat lähetyksessä, millaiseksi Ruotsin ulkopolitiikka muotoutuu vaalien jälkeen. Suuria muutoksia ei odoteta.
           
          Maailmanpolitiikan arkipäivää -ohjelman ovat toimittaneet Erja Tuomaala ja Paula Vilén. Äänitarkkailijana on Pasi Ilkka. Tunnusmusiikki: Petri Alanko, kuva: Tuuli Laukkanen/Yle.

