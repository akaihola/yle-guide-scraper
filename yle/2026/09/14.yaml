      - title: 'Kulttuuriykkönen: Kirjoista tutut tarinat ovat suosiossa teattereissa – Miten käy näytelmäkirjallisuuden?'
        start_time: '2026-09-14T15:00:00+03:00'
        end_time: '2026-09-14T15:58:00+03:00'
        description: |
          Teattereissa nähdään tänä syksynä paljon tuttuja tarinoita: Suliko, Elolliset, Passio, Käräjät, Aino A. .… Nämä kaikki ovat sovituksia kirjoista, vieläpä varsin tuoreista romaaneista. Yleisöä on helpompi houkutella teattereihin, kun jo etukäteen tietää vähän, mitä on luvassa.
          Miten tässä romaanisovitusten vyöryssä käy näytelmäkirjallisuuden? Kiinnostavatko näytelmätekstit enää ketään, ja kannattaako niitä kirjoittaa? 
          Näitä asioita pohditaan Kulttuuriykkösessä. Lähetyksessä ovat mukana Helsingin kaupunginteatterin dramaturgi Henna Piirto, kirjailija, ohjaaja Saara Turunen ja näytelmäkoordinaattori Mika Vainio Suomen näytelmäkirjailijoiden yhdistyksestä. Lähetyksen toimittaa Miia Gustafsson.
