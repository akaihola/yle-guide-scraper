      - title: Musiikkiaitio
        start_time: '2026-09-14T14:00:00+03:00'
        end_time: '2026-09-14T15:00:00+03:00'
        description: |+
          Lähde mukaan musiikin maailmankiertueelle! Lähetyksessä mukana myös kulttuurikokemuksia ja kurkistuksia konserttien kulisseihin.


          Mårtenson (sov. Kiiski): Stormkärs Maja - Myrskyluodon Maija (Waltteri Torikka, baritoni, Maria Ylipää, sopraano, ja Jyväskylä Sinfonia/Ville Matvejeff).

          Philemon: Grazing in the grass (Hugh Masekela).

          Kansanlaulu, Viro: Kiik tahab kindaid (Karmen Roivassepp).

          Juhola: Pieni täydellinen hetki (Johanna Juhola Trio).

          Lionel Loueke: Gbe.

          Kansanlaulu, Makedonia: Usti baba (Dikanda).

          de Brito: Acordem as guitarras (Camané).

          Traore: Ile (Rokia Traore ja yhtye). 

          Na linha do arco-iris (Dona Onete).

          Joey Burns, John Burns, Convertino: Miles from the sea (Gaby Moreno ja Calexico).

          Donaldson: My blue heaven (Harry Connick Jr.).

          Hilliard: Our day will come (The Wade Mikkola Quintet).

