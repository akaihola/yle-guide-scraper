        description: |-
          Chopin: Valssi n:o 6 (Minuuttivalssi) Des-duuri (Maria Joao Pires, piano).

          Donizetti: Herttuan aaria "Nei miei superbi gaudi" oopp. Il duca d'Alba (Alban herttua) (Dmitri Hvorostovski, baritoni, ja Lontoon Philharmonia-ork./Ion Marin).

          Tailleferre: Arabeski (Deborah Marshall, klarinetti, ja Angela Gassenhuber, piano).

          Sibelius: Impromptu jousiorkesterille (Keski-Pohjanmaan Kamariork./Juha Kangas).

          Artôt: Allegro neljälle käyrätorvelle (Detmolder Hornquartett).

          J.D. Berlin: Allegro teoks. Sinfonia a 8 D-duuri (Norjalainen barokkiork.).

          Rimski-Korsakov - Kreisler: Hindulaulu oopp. Sadko (Christian Ferras, viulu, ja Jean-Claude Ambrosini, piano).

          Chaminade: Attente (Odotus) (Anne Sofie von Otter, mezzosopraano, ja Bengt Forsberg, piano).

          Poulenc: Finaali konsertosta kahdelle pianolle ja orkesterille d-molli (Sylviane Deferne ja Pascal Rogé sekä Lontoon Philharmonia-ork./Charles Dutoit).

          Rameau: Les Sauvages, ou Danse du Grand Calumet de la Paix (Villit eli Suuren rauhanpiipun tanssi)  oopperabal. Les Indes galantes (Alankomaiden radion kamariork./Ton Koopman).

          Händel: Almirenan aaria "Lascia ch'io pianga" oopp. Rinaldo (Anthony Roth Costanzo, kontratenori, ja Les Violons du Roy/Jonathan Cohen).

          Debussy: Jardins sous la pluie (Puutarhoja sateessa) sarj. Estampes (Vaskipiirroksia) (Anna Kuvaja, piano). 

          Griffes: The lake at evening (Iltainen järvi) (Buffalon FO/JoAnn Falletta).

          Konsertin on laatinut Ainomaija Pennanen.
