          Respighi: La colomba (Kyyhkynen) sarj. Gli uccelli (Orpheus-kamariork.).

          Glazunov: Pieni adagio (Marc-André Hamelin, piano).

          Wolf-Ferrari: Strimpellata teoks. Suite-concertino F-duuri (Karen Geoghegan, fagotti, ja BBC:n FO/Gianandrea Noseda).

          Rossini: Kreivi Almavivan aaria "Ecco, ridente in cielo" oopp. Sevillan parturi (Tuomas Katajala, tenori, ja RSO/Alberto Hold-Garrido).

          Dvorak: Slaavilainen tanssi nro 11 F-duuri (Atlantan SO/Yoel Levi). 

          Kajanus-Blenner: Largo (Katri Tikka, harppu).

          Nielsen: Andante amoroso jousikvartetosta n:o 1 g-molli (Kamus-kvartetti). 

          W.A. Mozart: Yön kuningattaren aaria "Der Hölle Rache kocht in meinem Herzen" oopp. Taikahuilu (Diana Damrau, sopraano, ja Le Cercle de l'Harmonie/Jeremie Rhorer). 

          Loder: Voyage joyeux (Ian Hobson, piano).

          Lumbye: Konserttipolkka kahdelle viululle ja orkesterille (Harald Aadland ja Atle Sponberg sekä Norjan radio-ork//Ari Rasilainen).

          Jongen: Nostalgique (Nostalginen) kok. 13 preludia (Ivan Ilic, piano).

          Liszt: Consolation Des-duuri (James Galway, huilu, ja Lontoon kansallinen FO/David Measham).

          Konsertin on laatinut Ainomaija Pennanen. 
