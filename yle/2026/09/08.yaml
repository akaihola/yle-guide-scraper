      - title: 'Kulttuuriykkönen: Suomen Presidentin sieppaus ja kyyditys'
        start_time: '2026-09-08T15:00:00+03:00'
        end_time: '2026-09-08T15:58:00+03:00'
        description: |
          Miten reagoisit, jos kuulisit, että joukko äärioikeistolaisia nuoria olisi siepannut presidentti Sauli Niinistön ja hänen puolisonsa?

          Vastaavaa on tapahtunut Suomen historiassa: vuonna 1930 Suomen ensimmäisen presidentti – jo eläkkeellä oleva K. J. Ståhlberg – muilutettiin. Hänen vaimonsa Ester Ståhlberg ei suostunut jättämään miestään van änkesi mukaan muiluttajien autoon. Vieläkään ei tiedetä, mikä presidentin kyydityksessä oli totta ja mikä tarua. 

          Ohjaaja / käsikirjoittaja Samuli Valkama on tarttunut aiheeseen Presidentin kyyditys – elokuvassaan. Elokuva herättää monia kysymyksiä, mm. kuinka lähellä oli vallankaappaus vuonna 1930, mihin muiluttajat pyrkivät ja kuinka merkittävä hetki kyyditys oli suomalaisen demokratian kannalta?

          Haastateltavina ovat elokuvan ohjaaja/käsikirjoittaja Samuli Valkama, talous- ja sosiaalihistorian dosentti Marjaliisa Hentilä (joka on yhdessä miehensä Seppo Hentilän kanssa kirjoittanut Ståhlbergien elämäkerran) ja elokuva- ja televisiotutkimuksen dosentti Jari Sedergren.

          Ohjelman juontaa Nicklas Wancke.
