        start_time: '2026-09-08T20:35:00+03:00'
        end_time: '2026-09-08T20:55:00+03:00'
        description: |-
          Siirtolapuutarhatoiminnalla on Suomessa pitkät perinteet. Alkuaikoina oli tärkeää kasvattaa ruokapöytään syötävää, nykyään korostuvat mm. puutarhan esteettiset arvot.   

          Helena Honka-Hallila on ollut siirtolapuutarhaihminen jo lähes 40 vuotta. Oma palsta Peltolan siirtolapuutarhassa Turussa on tärkeä paikka. Hyvin tärkeää on myös siirtolapuutarhaharrastukseen liittyvä yhteisöllisyys.

          Siirtolapuutarhalla kävi Maija Salminen. 
