      - title: 'Uutispodcast: Terapiakulttuurin aika – milloin omien tunteiden tarkkailu menee yli?'
        start_time: '2026-09-13T21:00:35+03:00'
        end_time: '2026-09-13T21:24:34+03:00'
        description: |-
          Tässä ajassa ihmisiä usein kannustetaan keskittymään omaan hyvinvointiin ja tuntemuksiin. Mutta milloin omien tuntemusten tarkkailu menee liian pitkälle ja alkaa aiheuttaa pahoinvointia? Sosiaalipsykologi ja psykoterapeutti Emilia Kujala on Leonard Wilhelmuksen haastateltavana. Uutispodcast syventyy suuskuussa mielenterveysteemaan kolmen jakson verran, eri näkökulmista.
