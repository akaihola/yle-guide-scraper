          Ginastera: Danza (Tanssi) teoks. Impresiones de la puna (Tunnelmakuvia ylänköarolta) (Sharon Bezaly, huilu, ja Australian kamariork./Richard Tognetti).

          Canal: Adagio espressivo sonaatista viululle ja pianolle (Guillaume Chilemme ja Nathanaël Gouin).

          Fougstedt: Höstsång (Jubilate/Astrid Riska).

          Raitio: Serenata (Reijo Tunkkari, viulu, ja Keski-Pohjanmaan Kamariork./Juha Kangas). 

          Fariñas: En silencio (Ricardo Gallén, kitara).

          Hoffstetter: Scherzando (Suomalainen harppukvartetti).

          Ireland: If there were dreams to sell (Benjamin Appl, baritoni, ja James Baillieu, piano).

          Konsertin on laatinut Tuomas Niemelä. 

