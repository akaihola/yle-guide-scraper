        description: |-
          Yle tv 1:llä nähtävä Puoli seitsemän on yksi maan suosituimmista televisio-ohjelmista. Sitä katsoo parhaimmillaan yli puoli miljoonaa ihmistä. Mikko Kekäläinen on ollut ohjelman yhtenä juontajana alusta saakka, vuodesta 2009. Mikko Kekäläinen kohtaa vieraansa lämpimästi ja hyväntuulisesti yhdessä kollegansa Ella Kannisen kanssa. Miten kuuluisan pinkin sohvan hyvä tunnelma syntyy? Mikko Kekäläinen on Miia Lahden haastattelussa.
