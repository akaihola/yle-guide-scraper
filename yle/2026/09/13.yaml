      - title: Suomen suurin seurakunta - Radiojumalanpalvelukset sata vuotta
        start_time: '2026-09-13T12:05:00+03:00'
        end_time: '2026-09-13T13:00:00+03:00'
        description: |-
          Radiojumalanpalvelus juhlii satavuotista olemassaoloaan. Mikä sen merkitys on voinut olla yksittäiselle kuulijalle ja koko kansakunnalle?
           
          Radiojumalanpalveluksen aikaan on koolla Suomen suurin seurakunta. Maantieteellisiä rajoja ei ole, ja asu ja kuunteluympäristökin on varsin vapaa. 
           
          Millainen yhteys kuuntelijoiden välille voi ehkä syntyä, ja miten se synnytetään? Miten musiikki on siinä yhtenä tärkeänä tekijänä ja miten ehkä  radiojumalanpalvelussaarnan tekeminen poikkeaa  vain kirkossa istuville tehtävästä saarnasta?
           
          Yksi keskustelijoista on dosentti, kielitieteilijä Janne Saarikivi. Hänellä on kokemusta saarnan pitämisestä radiossa, ja myös siitä, miten valtavasti siitä voi saada kuulijapalautetta. Musiikin tohtori, kanttori Sirkku Rintamäki, kuvailee mm. radiohartauden musiikki rakentuu osaksi kokonaisuutta. Keskustelemassa on myös vahvan radiotaustan omaava Mikkelin piispa Mari Parkkinen. 
           
          Ohjelman toimittavat Kristiina Hyppölä ja Hilkka Nevala.
