        start_time: '2026-09-24T13:35:00+03:00'
        end_time: '2026-09-24T14:00:00+03:00'
        description: |2-
            Käsityöt ovat aineetonta kulttuuriperintöämme. Käsityöharrastus kasvoi huimasti koronan aikana ja edelleen noin puolet suomalaisista kertoo harrastavansa käsitöitä tai nikkarointia kerran kuukaudessa. Käsitöiden tekemiseen liittyy usein paitsi halu nähdä omien kätten töiden tuloksia, se kertoo nykyään usein myös ihmisen arvovalinnoista. Taito ry:n toiminnanjohtaja Milla Satola on Miia Lahden haastattelussa.
