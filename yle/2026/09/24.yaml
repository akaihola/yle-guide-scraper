      - title: 'Maailma tarinoina: Konklaavi - Pyhän hengen johdatusta vai poliittista peliä?'
        start_time: '2026-09-24T12:05:00+03:00'
        end_time: '2026-09-24T13:00:00+03:00'
        description: |
          Edward Bergerin ohjaama Konklaavi-elokuva avaa omanlaisensa ikkunan katolisen kirkon nykytilaan ja kardinaalien salaiseen kokoukseen uuden paavin valitsemiseks. Missä määrin elokuvan kuvaus kardinaalien juonittelusta, valtakamppailuista ja yllätyspaavin valinnasta vastaa todellisuutta? Mikä on nykyisen paavin rooli 2020-luvun maailmassa, jossa roomalaiskatolisen kirkon 1,4 miljardin jäsenen ylimmän hengellisen johtajan on otettava kantaa muun muassa tekoälyyn, katolisen kirkon hyväksikäyttökriisiin, ilmastokriisiin ja geopoliittisiin konflikteihin ja osoittaa toiminnallaan oma linjansa? Konklaavin draamallisesti puhuttelevaa asetelmaa ja sen suhdetta todellisuuteen ruotivat Marja Vehkasen kanssa kirkkohistorian vanhempi yliopistonlehtori Mikko Ketola ja keskiajan historian dosentti Reima Välimäki.
