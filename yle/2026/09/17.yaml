      - title: Aitiovieras
        start_time: '2026-09-17T13:35:00+03:00'
        end_time: '2026-09-17T14:00:00+03:00'
        description: |2-
           Anna-Mari Raaskan esikoisromaani Aamukampa käsittelee keski-ikää, työelämän muutosta ja selviytymistä, kun kokenut mediapersoona korvataan nuoremmalla sometähdellä. Raaska kuvaa itseään viihdeihmiseksi, jolle hauskuuttaminen on tärkeää. Kirja käsitteleekin vakavia teemoja huumorin keinoin. Raaska itse on opiskelllut kielenkääntäjäksi  irtisanouduttuaan radiojuontajan työstä. Anna-Mari Raaskan omaan tarinaan kuuluu työ- ja asumisjaksoja useissa maissa. Hänen kotinsa on ollut muassa Belizessä, Espanjassa, Jamaikalla ja Saksassa. Miia Lahti haastattelee.
