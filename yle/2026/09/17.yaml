      - title: 'Kulttuuriykkönen: Mikä tekee Suomesta houkuttelevan?'
        start_time: '2026-09-17T15:00:00+03:00'
        end_time: '2026-09-17T15:58:00+03:00'
        description: |
          Viime viikolla uutisoitiin Googlen mittavasta, jopa 13 miljardin euron investoinnista Suomeen. Olemmeko vihdoin tulleet näkyviksi ja huomatuiksi maailmalla – ja mistä ansioista? Suomi tunnetaan maailman onnellisimpana maana, mutta investointeja, matkailijoita ja kansainvälistä kiinnostusta houkuttelevat myös turvallisuus, koulutus, osaaminen, kulttuuri ja yhteiskunnan toimivuus.
          Miten Suomen maakuvaa rakennetaan ja kuka siitä oikeastaan vastaa? Mikä merkitys on poliitikkojen puheilla ja teoilla, entä yrityksillä, kulttuurilla ja suomalaisilla itsellään? Millainen tarina Suomesta pitäisi kertoa maailmalle – ja mitkä asiat meissä ovat sellaisia, joita ulkopuolelta katsottuna kannattaa korostaa?
          Kulttuuriykkösen keskustelijoista Risto E.J. Penttilä on kirjoittanut englanniksi kirjan The History of Finland in a Nutshell, jonka tavoitteena on auttaa ulkomaalaisia ymmärtämään Suomea ja suomalaisia. Ulkoministeriön Meira Pappi työskentelee Suomen maakuvan rakentamisen parissa. Hanna Lämsä on Suomen kulttuuri- ja tiedeinstituutit ry:n toiminnanjohtaja. Kulttuuriykkönen kysyy, mikä tekee Suomesta houkuttelevan – ja miten maailman katseet saadaan kääntymään tänne. Ville Talola toimittaa.
