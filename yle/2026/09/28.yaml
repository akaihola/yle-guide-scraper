        description: |-
          Grieg: Peikkojen kulkue (Hallé-orkesteri/John Barbirolli).

          Mertz: Keijukaisten karkelo (Richard Savino, kitara).

          Sibelius: Skogsrået (Metsänhaltija) (Camilla Tilling, sopraano, ja Paul Rivinius, piano).  

          Kansansäv. (sov. Palmgren): Näcken (Candomino-kuoro/Tauno Satomaa).

          Purcell: Sonata while the sun rises (Sonaatti auringon noustessa) puolioopp. The Fairy Queen (Keijukaiskuningatar) (Le Concert des Nations/Jordi Savall).

          Liszt (sov. Kujala): Konserttietydi n:o 5 (Maahisten karkelo) (Susanne Kujala, urut).

          Schumann: Träumerei sarj. Kinderszenen (Jian Wang, sello, ja Göran Söllscher, kitara).

          Sundblad-Halme: Fragment av en stämning (Marika Kivinen, lausunta, ja Jenna Ristilä, piano).

          Prokofjev: Taikuri Tshelion ja velho Fata Morganan korttipeli orkesterisarjasta Rakkaus kolmeen appelsiiniin (Pietarin FO/Juri Temirkanov).

          Kuula: Satu illasta (Jäniksen sävellys) (Eriikka Nylund, alttoviulu, ja Niina Uggeldahl, piano).

          Rechberger: Magic story (Kaari Ensemble/Saara Aittakumpu).

          Aaltio: Spring wonder elok. Metsän tarina (Ork./Panu Aaltio).
