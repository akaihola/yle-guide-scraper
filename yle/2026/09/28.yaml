      - title: 'Näistä levyistä en luovu: Musiikki on intohimon laji – Wille Rydman'
        start_time: '2026-09-28T22:45:00+03:00'
        end_time: '2026-09-28T23:39:30+03:00'
        description: |
          Näistä levyistä en luovu -ohjelmassa keskitytään musiikin ja taiteen voimaan. Ministeri Wille Rydman kertoo nauttivansa työstään poliitikkona, mutta ei halua sotkea siihen liikaa henkilökohtaista tunteiden paloa. Sen sijaan hän sanoo olevansa hyvin sensitiivinen ja intohimoinen musiikin suhteen, joka on ollut hänen elämässään mukana jo paljon aikaisemmasta vaiheesta kuin politiikka. Musiikki on ollut keskeisessä roolissa jo lapsuuskodissa. Lopullinen musiikillinen kipinä lähti kuorolaisena Cantores Minores -kuoron riveissä. Musiikinopintoja kertyi myös Sibelius-Akatemiasta.
          Wille Rydmanin tapasi levyjen äärellä Inari Tilli.
