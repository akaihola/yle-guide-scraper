        description: |
          Todellinen kansansoitin, huuliharppu, pystyy vaikka mihin. Jaksossa tarjoillaan kappaleita ja taustoitusta ristiin rastiin maailmalta kuin Nuuskamuikkusen matkoilta: bluesia, bossaa, ja brittifolkia. Tai jazzia, klassista ja ragtimea. Taskuun menevä jokamiehen soittopeli osoittautuukin melkoisen monipuoliseksi pakkaukseksi! Toimittajana Mika Kauhanen. Uusinta marraskuulta 2025.
