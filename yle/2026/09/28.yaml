      - title: Kulttuuriykkönen
        start_time: '2026-09-28T15:00:00+03:00'
        end_time: '2026-09-28T15:58:00+03:00'
        description: |-
          Apple TV:n Widow’s Bay on huippusuosioon noussut kauhukomedia, joka yhdistelee yliluonnollista kauhua, mysteeriä ja omalaatuista huumoria. Sarja sijoittuu syrjäiselle saarelle Uuden-Englannin rannikolla, missä pormestari yrittää tehdä uinuvaan pikkukaupunkiin uutta matkailukohdetta. Paikalliset kuitenkin uskovat saaren olevan kirottu – ja vähitellen käy ilmi, etteivät vanhat kauhutarinat ehkä olekaan pelkkää taikauskoa.

          Widow’s Bay tekee kauhusta aidosti pelottavaa mutta rakentaa komiikkansa henkilöhahmoista ja pikkukaupungin arkisista ristiriidoista. Mihin sarjan suosio perustuu, ja miksi juuri nyt näyttää olevan otollinen aika kauhun ja komedian yhdistelmälle? Mitä Widow’s Bay kertoo tämän hetken televisiosta ja siitä, millaiset tarinat yleisöä kiinnostavat?

          Keskustelemassa ovat tutkija Noora Vaakanainen sekä elokuvakriitikot ja toimittajat Ira Hurskainen sekä Jussi Huhtala. Toimittajana on Ville Talola.
