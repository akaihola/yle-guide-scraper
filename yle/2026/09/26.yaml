        start_time: '2026-09-26T17:05:00+03:00'
        end_time: '2026-09-26T17:58:00+03:00'
        description: |
          Ala-asteen ensimmäisestä luokasta lähtien erilaisissa rooleissa esiintynyt Elias Salonen on pohtinut paljon miksi näytteleminen on hänelle niin valtavan tärkeää.
          Salonen löysi vastauksen, kun tajusi että näytellessään hän pääsee parhaimmillaan sellaiseen flow-tilaan, jossa ei ajattele enää itseään lainkaan. Silloin hän on läsnä ja elää hetkessä.
