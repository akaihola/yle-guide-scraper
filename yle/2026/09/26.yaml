      - title: 'Maailman tärkein pieni asia: Jari Karppinen on viettänyt jalkapallokatsomossa ison osan elämästään'
        start_time: '2026-09-26T08:40:00+03:00'
        end_time: '2026-09-26T09:00:00+03:00'
        description: |-
          Lahtelainen Jari Karppinen on aina ollut innokas jalkapallon seuraaja. Hän käy katsomassa lähes kaikki "oman" seuransa FC Lahden ottelut. Intohimoa riittää myös jalkapallomaajoukkueelle.. Hän on nähnyt viimeisten 30 vuoden aikana kaikki miesten joukkueen MM- ja EM-karsintaottelut. Lisäksi Karppinen on käynyt vuoden -90 jälkeen kaikissa jalkapallon MM- ja EM-kisoissa. Korona tietysti keskeytti harrastuksen toviksi, mutta sitten taas jatkettiin. 

          Jari Karppisen tapasi Maija Salminen. 
