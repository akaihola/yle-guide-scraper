      - title: Kuunnelman vuosisata
        start_time: '2026-09-26T21:01:00+03:00'
        end_time: '2026-09-26T22:40:00+03:00'
        description: |
          Kuunnelma on radion kehittämä draaman laji ja se on yhtä vanha kuin Yleisradion koko ohjelmatoiminta. Ylen aloittaessa syksyllä 1926, lähetettiin myös näytelmä suorana teatterin lavalta. Siitä asti kuunnelma on tehnyt matkaa ”teatterin sokeasta sisaresta” itsenäiseksi ääni-ilmaisun muodoksi. Mitä kaikkea tässä sadassa vuodessa on muuttunut?
          Pekka Kyrön (Radioteatterin päällikkö vuosina 1990-2009) toimittama ohjelma suuntaa huomion kuunnelman monipuoliseen maailmaan ennen ja nyt. Lyhyiden näytteiden kautta kuullaan lajin kehittyminen vuosien varrella aina kuulonäytelmästä nykyiseen audiodraamaan.

          Toimittaja: Pekka Kyrö
          Lukija: Eva Tigerstedt
          Äänisuunnittelu: Anders Wiksten
          Tuotanto: Matti Kajander ja Laura Jaakkola, Yle Draama 2026.
      - title: Klassikkokuunnelmia
        start_time: '2026-09-26T21:51:00+03:00'
        end_time: '2026-09-26T22:30:00+03:00'
      - title: Keinuva talo - Mika Kauhanen
        start_time: '2026-09-26T22:41:00+03:00'
        end_time: '2026-09-26T23:39:30+03:00'
        description: |
          Maailmassa julkaistaan niin paljon musiikkia, että tarvitsemme suodattimia. Keinuvan talon tuntosarvina, ukkosenjohdattimena ja kalaverkkona toimii korttelin oma etnomusikologi Mika Kauhanen. Balkanin rytmeistä Välimeren tunnelmiin, kaihoisista lauluista huimimpaan pelimannisvengiin. Transglobal World Music Chartin jäsen lupaa tuoreita musiikkivalintoja ja kiinnostavia haastatteluvieraita nykykansanmusiikin ja maailmanmusiikin vaiheilta.
