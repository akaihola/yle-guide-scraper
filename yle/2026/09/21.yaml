          Sibelius: Allegretto D-duuri (Tempera-kvartetti).

          Massenet: L'Ensoleilladin aaria "Vive amour qui rêve" oopp. Chérubin (Angela Gheorghiu, sopraano, sekä Torinon Teatro Region kuoro ja ork./John Mauceri).

          R. Schumann: Etydi n:o 2 (Mit innigem Ausdruck) (Leif Ove Andsnes, piano, Christian Tetzlaff, viulu, ja Tanja Tetzlaff, sello).

          W.A. Mozart: Kontratansseja orkesterille (Symphony Nova Scotia/Georg Tintner).

          Palmgren: En sällsam fågel (Harvinainen lintu) (Camilla Nylund, sopraano, ja Münchenin radio-ork./Ulf Schirmer).

          Kuhlau: Divertimento n:o 5 G-duuri (Karl Lewkovitch, huilu, ja Erling Mölderup, kitara).

          Esenvalds: Stars (The Pembroke College Chapel Choir/Anna Lapwood).

          Łopuska: Chanson sans paroles (Sanaton laulu) (Magdalena Lisak, piano).

          Poldowski: L'heure exquise (Ihana hetki) (Philippe Jaroussky, kontratenori, ja Jérôme Ducros, piano).

          Kreisler: La chasse (Metsästys) (Robert McDuffie, viulu, ja Cincinnati Pops -ork./Erich Kunzel).

          Konsertin on laatinut Riikka Holopainen.
