        end_time: '2026-09-21T22:18:07+03:00'
        description: |-
          Avaruuden kenties kummallisimpia vipeltäjiä ovat neutriinot. Lävitsesi kulkee joka sekunti miljardia neutriinoita. Neutriinon massaa ei tiedetä tarkasti, mutta se on äärimmäisen pieni. Mitä nämä mystiset alkeishiukkaset oikein ovat? Toimittaja Jari Mäkinen.
