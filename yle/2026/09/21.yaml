        start_time: '2026-09-21T17:35:00+03:00'
        end_time: '2026-09-21T18:35:00+03:00'
        description: |-
          Yhtä juhlavuosilevyjen juhlaa keitämme kokoon tässä jaksossa. Brittifolkin ykköslauluntekijä Martin Simpson saavutti 50 vuotta urallaan, Itä-Euroopan naisten perinnettä jatkava lauluyhtye Kitka päätti juhlia jo 45 vuoden merkkipaalua, Unkarin merkittävin etnolevymerkki Fonó täytti 30.

          Kuulemme myös reelin Kaustisen Folkkareilta sekä reel-sikermän Irish Festival of Oulun pääesiintyjältä Altanilta.

          Toimittajana Mika Kauhanen.
