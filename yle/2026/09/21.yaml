        end_time: '2026-09-21T15:00:00+03:00'
        description: |+
          Lähde mukaan musiikin maailmankiertueelle! Lähetyksessä mukana myös kulttuurikokemuksia ja kurkistuksia konserttien kulisseihin.


          Osei, Tontoh, Amarfio: Sunshine day (Osibisa).

          Kansanlaulu, Kanada: La Fille et les dragons (Le Vent Du Nord).

          Koivu: Katrilli (Matti Johannes koivu ja Aili Järvelä).

          Sanchez & Torres: Ritmo Remo (Poncho Sanchez).

          Korkman, Ruusumetsä, Vallden: Tietäisit vaan (Touko).

          Jobim: Samba de uma nota so (Joyce).

          Henderson: Mamacita (Milo ja Moses).

          Menescal-Boscoli: Errinho a toa (Leila Pinheiro).

          Widenius: Arktik traktor (Joonas Widenius Trio ja Iiro Rantala).

          Robertson: Where do we go from here (Severi Pyysalo).

          Parra: Elämälle kiitos (Johanna Försti Quintet).

