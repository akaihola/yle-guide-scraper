        description: |2-
           Helsingissä päättyivät juuri 41. Helsingin sarjakuvafestivaalit. Mitä ajatuksia tämän vuoden sarjakuvafestivaali antoi taitelliselle johtajalle  Athanasia Aarniosuolle? Miten voimakkaana sarjakuvataide Suomessa tällä hetkellä elää? Sarjakuvataiteilija Aino Sutinen on Aitiovieraan toinen studiovieras. Hän on viime aikoina perehtynyt ukrainalaiseen sarjakuvataiteeseen ja siihen, miten sodan keskellä elää. Jarmo Laitaneva haastattelee.
