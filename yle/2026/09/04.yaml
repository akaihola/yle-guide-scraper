      - title: 'Konsertti: Radalla-festivaali – Unelmia'
        start_time: '2026-09-04T19:02:00+03:00'
        end_time: '2026-09-04T21:00:00+03:00'
        description: |+
          Onko unelmien toteutuminen onnellisuutta?

          Klassikkoteosten tähdittämä Radalla-festivaalin päätöskonsertti on heijastus ihmiselle ominaisista tarpeista tuntea, kokea, elää ja olla. Mitä on elämä ilman menetystä ja rakkautta? Ei ole toivoa ilman epäoikeudenmukaisuutta, ei juhlaa ilman arkea, ei rakkautta ilman riskiä. Kauklahden kappelissa, Espoossa 30.8.2026  tallennetun konsertin toimittaa Noora Hirn

          Clara Schumann (1819–1896): Kolme romanssia viululle ja pianolle Op. 22 (1853)

