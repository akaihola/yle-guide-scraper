      - title: 'Aitiovieras:  Vastaava päätoimittaja Johanna Törn-Mangs -  mikä on kulttuuria ja mitä se meille merkitsee?'
        start_time: '2026-09-04T21:30:18+03:00'
        end_time: '2026-09-04T21:55:09+03:00'
        description: |-
          Johanna Törn-Mangs on Ylen Kulttuuri ja asia -yksikön vastaava päätoimittaja. Mitä Ylen johtoryhmän jäsen ajattelee sata vuotta täyttävän Ylen merkityksestä nykyajan yhteiskunnassa? Työssään Ylen kulttuurisisällöistä vastaava Törn-Mangs seuraa kulttuurielämää tiiviisti myös vapaa-ajallaan. Minkälainen kulttuuri on hänen sydäntään lähellä? Kaipaako palkittu journalisti milloinkaan takaisin uutistyöhön?  Miia Lahti haastattelee.
