      - title: 'Narrin aamulaulu - Ralf Gothóni, puhetta musiikista, sienisadosta ja vähän muustakin '
        start_time: '2026-09-04T11:00:00+03:00'
        end_time: '2026-09-04T11:55:00+03:00'
        description: |
          "Kamarimusiikki on minulle musiikin korkein muoto. Siinä yhdistyvät henkilökohtainen osaaminen, kyky reagoida toisiin ihmisiin ja kyky reagoida yhdessä heidän kanssaan. Kamarimusiikki onkin yhtäaikaa musiikillista ja sosiaalista kehittymistä", sanoo Ralf Gothóni. 

          Taiteilijan tapasi 80-vuotispäivien jälkimainingeissa hänen kesämaisemissaan Outi Paananen. 
