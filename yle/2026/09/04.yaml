      - title: 'Narrin aamulaulu - Ralf Gothóni: "Kamarimusiikki on väylä ymmärtää ja tulla ymmärretyksi"'
        start_time: '2026-09-04T11:00:00+03:00'
        end_time: '2026-09-04T11:55:00+03:00'
        description: |
          "Nämä on tämmösiä hullutuksia, mutta kyllä niistä energiaakin saa", naurahtaa Ralf Gothóni mittavista koulutushankkeista, joita hän on pannut alulle mm. Kiinassa ja viimeisimpänä Egyptin uudessa pääkaupungissa New Cairossa. Mistään päähänpistosta ei ole kysymys, sillä Gothóni on rakentanut sävelsiltoja jo kolme vuosikymmentä. Savonlinnan musiikkiakatemian kanssa yhteistyössä järjestettävä toiminta pyrkii antamaan nuorille lahjakkuuksille eväitä nimenomaan kokonaisvaltaiseen muusikkouteen ja ihmisenä kasvuun. Tässä kasvussa kamarimusiikilla on keskeinen tehtävä: se avaa kanavat yhdessä tekemiseen ja kokemiseen, ja luo mahdollisuudet ymmärtää ja tulla ymmärretyksi.
            
          Taiteilijan tapasi 80-vuotispäivien jälkimainingeissa hänen kesämaisemissaan Outi Paananen.
