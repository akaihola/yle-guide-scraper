      - title: 'Kun Ruotsi muuttui 3/5: Miksi Ruotsissa ei puhuta köyhistä?'
        start_time: '2026-09-04T17:05:00+03:00'
        end_time: '2026-09-04T17:35:00+03:00'
        description: |
          Kirjeenvaihtaja Jenny Matikaisen minisarjan kolmas jakso käsittelee tuloeroja. Kaikki tietävät, että Ruotsissa on rikkaita, mutta Ruotsissa on myös köyhyyttä, ihan yhtä paljon kuin Suomessa. Lisäksi maa on naapureitaan selvästi taloudellisesti epätasa-arvoisempi, mutta sitä ei haluta myöntää. Jenny on huomannut, että Ruotsin mediassa pienituloisten ääni ei juuri kuulu. Tarvitaan tukholmalainen suomalaisprofessori selittämään, miksi näin on.
