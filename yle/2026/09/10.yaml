        start_time: '2026-09-10T16:07:00+03:00'
        end_time: '2026-09-10T16:59:00+03:00'
        description: |+
          Bolzoni: Menuetti jousiorkesterille (Detroitin SO/Neeme Järvi).

          P. J. Hannikainen: Annin laulu (Ylioppilaskunnan Laulajat/Matti Hyökki).

          Tschetschulin: Berceuse (Annemarie Åström, viulu, ja Sonja Fräki, piano). 

          Musorgski: Scherzo B-duuri (Berliinin filharmonikot/Claudio Abbado). 

          A. Scarlatti: Toivon aaria "Mentre io godo in dolce oblio" orat. Il giardino di rose (Cecilia Bartoli, mezzosopraano, ja Les Musiciens du Louvre/Marc Minkowski).

          Schubert: Moment musical n:o 3 f-molli kok. Moments musicaux (Mitsuko Uchida, piano).

          Nielsen: Kineserdans (Kiinalainen tanssi) sarj. Aladdin (Ruotsin radion SO/Esa-Pekka Salonen).

          Farrenc: Andante sostenuto sekstetosta puhallinkvintetille ja pianolle (Les Vents Francais ja Eric Le Sage, piano).

          Verdi: Riccardon aaria "Di' tu se fedele" oopp. Naamiohuvit (Placido Domingo, tenori, Sumi Jo, sopraano, Kurt Rydl, basso, Goran Simic, basso, sekä Wienin valtionoopperan kuoro ja Wienin filharmonikot/Herbert von Karajan). 

          Pujol: Tango (David Russell, kitara).

          Milhaud: Brazileira sarj. Scaramouche (Philippe Corre ja Edouard Exerjean, piano).

          Tosti: Marechiare (Giuseppe Di Stefano, tenori, ja ork./Dino Olivieri).

          Mendelssohn: Andante con moto sinf. n:o 4 A-duuri (Italialainen) (Atlantan SO/Yoel Levi).

          Konsertin on laatinut Ainomaija Pennanen.

