      - title: 'Kulttuuriykkönen: Howard Smith EMMAssa - afrikkalaisamerikkalainen taiteellinen uudistaja'
        start_time: '2026-09-10T15:00:00+03:00'
        end_time: '2026-09-10T15:58:00+03:00'
        description: |-
          Värikkäästä ilmeestään tunnettu Howard Smith keräsi suomalaisia talonpoikaisesineitä kuten puisia lapioita. Hän teki taidetta löytämistään hylätyistä tekstiileistä ja esineistä. Hän on esimerkki luovasta kierrättäjästä.

          Howard Smithin (1928–2021) retrospektiivinäyttely esittelee taiteilijan uraa monesta kulmasta. Smith oli tunnettu ennakkoluulottomasta tyylistään ja visuaalisesta ilmaisustaan. Hän on vaikuttanut uudistavalla otteellaan Suomen taide- ja muotoilukentällä. Taiteilija vaikutti myös yhteiskuntaamme ja avaa edelleen silmämme.

          Smith suunnitteli kankaita Vallilalle ja keramiikkaa Arabialle. Mitkä ovat hänen designklassikkonsa ja miten ne ovat edelleen osa suomalaisten koteja ja arkea?
           
          Howard Smithin yksityisnäyttely on osa modernismin klassikoita ja sen uudistajia esille tuovia näyttelyitä EMMAssa. Tämä näyttely nostaa esille myös monikulttuurisuuden merkitystä osana Suomen taidehistoriaa: Smith on esimerkki afrikkalaisamerikkalaisesta taiteilijasta.

          Ohjelman vieraina ovat EMMAn amanuenssi ja näyttelyn kuraattori Tuomas Laulainen, Howardin leski Erna Aaltonen sekä muotisuunnittelija Ervin Latimer, joka on kirjoittanut Smithin vaikutuksesta hänen omaan suunnitteluunsa.  

          Ohjelman juontaa Pia-Maria Lehtola.




          Rentoa puhetta, kiinnostavimmat vieraat ja kulttuurin ajankohtaisaiheet debatoitavina. Suorana maanantaista perjantaihin.
