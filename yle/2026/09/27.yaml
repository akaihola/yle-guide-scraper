      - title: 'Kaustinen 2026: Maria Kalaniemi & Pekko Käppi - Tåreportens pärla'
        start_time: '2026-09-27T17:06:00+03:00'
        end_time: '2026-09-27T17:59:44+03:00'
        description: |-
          Menneen kesän maagisin musiikkimatka: runolaulua ruotsiksi Kalevalan tarinasta, joka kuvaa musiikin selittämätöntä, tunteita liikuttavaa voimaa. Lars Huldénin loisteliaasta käännöksestä innoittunut Tåreportens pärla -albumi on saanut loistoarvioita, mutta livetaltioinnissa Kaustisen kansanmusiikkijuhlilla 15.7.2026 Maria Kalaniemi ja Pekko Käppi kuljettavat yleisön vielä vahvemmin siihen hetkeen, jossa luomakunta pysähtyy ja kuuntelee. Toimittajana Kare Eskola.
