        description: |-
          Sweelinck: Onder een linde groen (Vihreän lehmuksen alla) (Zvi Meniker, cembalo). 

          Fordell: Koivut (Keski-Pohjanmaan Kamariork./Juha Kangas).

          Melartin: Ainon koivuaaria "Tuli kevät, tuli toivo" oopp. Aino (Aulikki Eerola, sopraano, ja RSO/Kari Tikka).

          Fougstedt: Björkarnas valv (Koivujen holvisto) (Dominante/Seppo Murto).

          Backer-Gröndahl: Björken berättar (Koivu kertoo) (Karl-Magnus Fredriksson, baritoni, ja Gustav Djupsjöbacka, piano). 

          Sibelius: Granen (Kuusi) (Izumi Tateno). 

          Kansanlaulu: Tuomen juurella (Lilli Paasikivi, mezzosopraano, ja Ilmo Ranta, piano).

          Eller: Männid (Mäntyjä) (Ulrika Kristian, viulu, ja Marje Lohuaru, piano).

          Deutscher: The lonely pine-tree (Yksinäinen mänty) (Alma Deutscher, piano). 

          R. Schumann: Der Nussbaum (Pähkinäpuu) (Elisabeth Schwarzkopf, sopraano, ja Gerald Moore, piano).

          Massenet: Sous les tilleuls (Lehmusten alla) sarj. Scenes alsaciennes (Elsassilaisia kuvia) (Uuden-Seelannin SO/Jean-Yves Ossonce).

          Konsertin on laatinut Inari Tilli.
