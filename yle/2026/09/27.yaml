      - title: 'Elävä historia: Tampereen Robin Hood - Miljoonakavaltaja Nils Idmanin tarina'
        start_time: '2026-09-27T12:05:00+03:00'
        end_time: '2026-09-27T12:49:00+03:00'
        description: |
          Kun Nils Idman pidätettiin vuonna 1912, koko Tampere pysähtyi ja mummot itkivät kauppahallissa. Rakastettu pankinjohtaja jäi kiinni tehtyään Suomen suurimman talousrikoksen, mutta silti Nils Idmania kutsutaan Tampereen Robin Hoodiksi. Miksi?  
          Toimittaja: Kaisa Pulakka
          Haastateltavat: Ari Järvelä, Petra Käppi
          Lukijat: Harri Alanne, Sampo Mäkelä, Anna Sirén.
          Äänisuunittelu: Laura Koso.
