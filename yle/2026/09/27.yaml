      - title: 'Aitiovieras: Puolet suomalaisista harrastaa käsitöitä - mitä se kertoo meistä? - haastattelussa Taito ry:n Milla Satola'
        start_time: '2026-09-27T21:25:07+03:00'
        end_time: '2026-09-27T21:51:19+03:00'
        description: |-
          Käsityö on aineetonta kulttuuriperintöämme. Käsityöharrastus kasvoi huimasti koronan aikana ja edelleen noin puolet suomalaisista kertoo harrastavansa käsitöitä tai nikkarointia kerran kuukaudessa. Käsitöiden tekemiseen liittyy usein halu nähdä omien kätten töiden tuloksia. Harrastus kertoo nykyään usein myös ihmisen arvovalinnoista. Toiminnanjohtaja Milla Satola Taito Etelä-Suomi ry:stä on Miia Lahden haastattelussa.
