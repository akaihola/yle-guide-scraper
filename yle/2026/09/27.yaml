      - title: 'Romano mirits: Mitä kaajeet ajattelevat kaaleista? '
        start_time: '2026-09-27T23:26:00+03:00'
        end_time: '2026-09-27T23:39:30+03:00'
        description: |-
          Mitä kaajeet ajattelevat kaaleista? Minkälaisia kohtaamisia on ollut ja minkälaisia voisi olla? Romaneilta pyydetään anteeksi – mistä on kysymys? Haastateltavana on hotelli Valon toimitusjohtaja Hannu Holma. Toimittajana Mertsi Lindgren.
