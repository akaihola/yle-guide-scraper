      - title: 'Klasariparatiisi - Eva Tigerstedt: Tapiola hengittää valtavaa tilaa'
        start_time: '2026-09-27T07:00:47+03:00'
        end_time: '2026-09-27T07:54:45+03:00'
        description: |+
          Kuin luonto hengittäisi syvään, välittämättä ihmisestä, joka vain voi ihmetellä…jotain sellaista Jean Sibeliuksen viimeinen orkesteriteos Tapiola huokuu. Samalla se on ällistyttävän moderni teos.
          Lopuksi soi Bach, mutta epätavallisella tavalla resonoivasti.

          Eva Tigerstedt avaa polkuja musiikkiin.




