      - title: 'Kulttuuriykkönen: Mitä evakko ja moderni kuvataiteilija Elga Sesemann käsitteli psykologisissa omakuvissaan?'
        start_time: '2026-09-16T15:00:00+03:00'
        end_time: '2026-09-16T15:58:00+03:00'
        description: |-
          Elga Sesemannin näyttely aloittaa Ateneumin uuden Modernit klassikot -näyttelysarjan. Sesemannin koko uraa tarkasteleva näyttely on ensimmäinen katselmus taiteilijan tuotantoon. Sesemannia kuvataan Itsenäiseksi ja omaehtoiseksi, miten nämä luonteenpiirteet näkyvät hänen taiteessaan? 

          Näyttelyssä on lukuisia päiväkirjamaisia omakuvia. Mitä nämä psykologisesti käsittelivät? Millä tavalla Viipurissa syntynyt taiteilija koki evakkouden?  Sesemann oli modernin ajan taiteen uudistaja. Mitkä olivat hänen uudet otteensa ja tyylikeinonsa? Sesemann kiinnitti kriitikoiden ja taideyleisön huomion jo ensimmäisillä näyttelyillään. Miten hänen uransa lähti nousuun näiden näyttelyiden jälkeen? Miten haluttuja Elga Sesemannin taideteokset ovat tänään taidemarkkinoilla?

          Ohjelman vieraina ovat taidehistorioitsijat Anu Utriainen ja Marja Lahelma sekä evakkotutkija Ulla Savolainen.

          Ohjelman juontaa Pia-Maria Lehtola.


          Rentoa puhetta, kiinnostavimmat vieraat ja kulttuurin ajankohtaisaiheet debatoitavina. Suorana maanantaista perjantaihin.
