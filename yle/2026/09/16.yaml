      - title: 'Konsertti: Kaivosfestivaali – Aaltojen aiheuttajat, rajojen rikkojat'
        start_time: '2026-09-16T19:02:00+03:00'
        end_time: '2026-09-16T21:00:00+03:00'
        description: |-
          Aaltojen inspiroimaa musikkia klassista musiikkia uudistaneilta säveltäjiltä. Esiintymässä Tami Pohjola, viulu; Mari Viluksela, alttoviulu; Sirja Nironen, sello; Aleksei Zaitsev, piano. Katariina Vähäkallion tanssiteos Missy Mazzolin ja Henry Cowellin musiikkiin. Esiintymässä Riveria Outokummun tanssinkoulutuksen opiskelijat; Aleksei Zaitsev, piano. Outokummun Teatteri Kiisussa 6.9.2026 tallennetun konsertin toimitaa Ainomaija Pennanen.

          Ohjelma:

          Missy Mazzoli (*1980): Orizzonte pianolle ja elektroniikalle

          Henry Cowell (1897-1965): The Banshee pianolle

          Cecilia Damström (*1988): Celestial Beings viululle ja alttoviululle

          Kaija Saariaho (1952-2023): Light and Matter pianotriolle

          Sebastian Fagerlund (*1972): Oceano jousitriolle
