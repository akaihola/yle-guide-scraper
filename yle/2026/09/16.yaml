          Outokummun Vanhan Kaivoksen ympäristössä järjestettävä Kaivosfestivaali juhli tänä syksynä 10-vuotista matkaansa teemalla aaltoja. 
          Konsertissa “Aaltojen aiheuttajat, rajojen rikkojat” soi erilaisten aaltojen inspiroima musiikki klassista musiikkia uudistaneilta säveltäjiltä. Sitä esittävät viulisti Tami Pohjola, alttoviulisti Mari Viluksela, sellisti Sirja Nironen ja pianisti Aleksei Zaitsev. 
          Outokummun Teatteri Kiisussa 6.9.2026 tallennetun konsertin toimittaa Ainomaija Pennanen.
