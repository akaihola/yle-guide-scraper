        description: |2-
           Ohjaaja Karin Pennanen tutkii Päivien lumo -dokumenttielokuvassaan edesmenneen setänsä taiteilija Markku Pennasen elämää ja piiloon jääneitä taideteoksia. Miksi lahjakas taiteilija teki taidetta vain itselleen eikä halunnut osallistua näyttelyihin? Dokumentti kysyy, onko taide olemassa ilman yleisöä. Ensimmäisestä elokuvastaan Pennanen on saanut useita festivaalipalkintoja. Karin Pennanen on Jarmo Laitanevan haastattelussa.
