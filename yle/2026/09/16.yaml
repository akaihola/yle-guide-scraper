        description: |-
          Useita Neuvostoliittoon kohdistuneen tiedustelumme johtohahmoja on kuollut epäilyttävästi. Olisiko mahdollista, että itänaapurimme on järjestelmällisesti salamurhannut tiedustelu-upseereitamme yksi toisensa jälkeen?
          Sarjan kaikki neljä tuotantokautta ovat kuunneltavissa Yle Areenassa.
