        start_time: '2026-09-05T22:10:00+03:00'
        end_time: '2026-09-05T22:47:00+03:00'
        description: |-
          Kraatarin matalaan majaan saapuu morsianehdokas, ja naimakauppaa ryhdytäänkin suunnittelemaan suin päin. Herrojen taloudenhoitajana ollut morsian tulee kuitenkin katumapäälle. Vaan voiko lupausta perua?
          Aleksis Kiven komedian kuunnelmaversio on äänitetty Tampereella 1952, radiossa teos lähetettiin ensimmäisen kerran vuonna 1998.
      - title: Keinuva talo - Mika Kauhanen
        start_time: '2026-09-05T22:40:00+03:00'
        end_time: '2026-09-05T23:39:30+03:00'
        description: |
          Maailmassa julkaistaan niin paljon musiikkia, että tarvitsemme suodattimia. Keinuvan talon tuntosarvina, ukkosenjohdattimena ja kalaverkkona toimii korttelin oma etnomusikologi Mika Kauhanen. Balkanin rytmeistä Välimeren tunnelmiin, kaihoisista lauluista huimimpaan pelimannisvengiin. Transglobal World Music Chartin jäsen lupaa tuoreita musiikkivalintoja ja kiinnostavia haastatteluvieraita nykykansanmusiikin ja maailmanmusiikin vaiheilta.
