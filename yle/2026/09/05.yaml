      - title: 'Maailma tarinoina: Odysseia: ihminen jumalten ja koodistojen ohjaamana'
        start_time: '2026-09-05T12:05:00+03:00'
        end_time: '2026-09-05T13:00:00+03:00'
        description: |-
          Homeroksen Odysseia on aineksiltaan kirjavampi, ristiriitaisempi ja monitulkintaisempi kuin Christopher Nolanin tuore elokuvatulkinta Odysseiasta, joka on sovitettu nykykatsojan silmille ja eetokselle. Hollywood-muotti karsii liiat jumaluudet ja tekee päähenkilöstä lähinnä traumatisoituneen, syyllisyydessä riutuvan miehen. Millaisia piirteitä myyttisestä Odysseuksesta on korostettu antiikissa? Voimmeko tästä päivästä käsin edes yrittää ymmärtää Homeroksen eepoksen kautta muinaisantiikin maailmaa, sen lainalaisuuksia ja uskomuksia?

          Homeerisen eepoksen ja antiikin maailmaa raottavat Marja Vehkasen vieraina filosofian tohtori, kreikkalaisen kirjallisuuden dosentti Tua Korhonen sekä filosofian tohtori, antiikin historian dosentti Marja-Leena Hänninen.
