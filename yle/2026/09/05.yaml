        description: |-
          Tshaikovski: Valssi bal. Prinsessa Ruusunen (New Yorkin FO/Kurt Masur).

          Barns: Idylli (Alexandra Mackenzie, sello, ja Ingrid Sawers, piano).

          Bizet: Kuorokohtaus "Les voici, voici la quadrille" oopp. Carmen (Robert Shaw -kuoro ja RCA Victor -ork./Robert Shaw).

          Nava d'Adda: Scherzo pianotriosta Es-duuri (La Gaia Scienza).

          Dudley: Poldark prelude tv-sarj. Poldark (Lang Lang, piano).

          Verdi: Violettan aaria "Addio del passato" oopp. La Traviata (Edita Gruberová, sopraano, ja Lontoon SO/Carlo Rizzi).

          Chaminade: Sommeil d'enfant (Michael Gross, sello, ja Johann Blanchard, piano).

          Richter: Whispers tv-sarj. Loistava ystäväni (Ork./Max Richter).

          Price: Dance of the cotton blossoms (Puuvillankukkien tanssi) (Althea Waites, piano).

          Mendelssohn: Sanaton laulu n:o 25 G-duuri (Joshua Bell, viulu, ja St. Luken ork./Michael Stern).

          Kansanlaul: My love is like a red, red rose (The Choral Scholars of University College Dublin/Desmond Earley, ja Mikie Smyth, tinapilli).

          Williams: Hedwig's theme elok. Harry Potter ja viisasten kivi (Anne-Sophie Mutter, viulu, ja Recording Arts Orchestra of Los Angeles/John Williams).

          Konsertin on toimittanut Annina Aho.
