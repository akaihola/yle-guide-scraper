      - title: 'Maailma tarinoina: Tom of Finland – yhden miehen vapautusliike'
        start_time: '2026-09-12T12:05:00+03:00'
        end_time: '2026-09-12T13:00:00+03:00'
        description: |-
          Tom of Finland -musikaalin uusi versio saa ensi-iltansa Hämeenlinnan Verkatehtaalla tänä syksynä. Kaarinassa vuonna 1920 syntynyt Touko Laaksonen loi homoeroottisen kuvaston, joka perustui hänen yksityisiin seksuaalisiin fantasioihinsa aikana, jolloin homoseksuaalisuus oli Suomessa sekä rikos että sairaus. Miksi Tom of Finlandin kaltainen ilmiö on edelleen ajankohtainen ja tarpeen nostaa näyttämölle? Millainen ikkuna suomalaisen homoseksuaalisuuden historiaan aukeaa Touko Laaksosen elämäntarinan kautta?
          Touko Laaksosen alias Tom of Finlandin maailmankuvaa, kädenjälkeä ja merkitystä perkaavat Marja Vehkasen vieraina musikaalin kirjoittanut ja ohjannut Tuomas Parkkinen ja homo- ja lesbotutkimuksen pioneeri, tietokirjailija ja sosiologi Kati Mustola.
