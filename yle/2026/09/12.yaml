      - title: 'Oopperailta: Mika Kares Bayreuthissa, Giuseppe Verdin Stiffelio Wienissä sekä Dima Slobodenioukin haastattelu'
        start_time: '2026-09-12T19:02:00+03:00'
        end_time: '2026-09-12T21:15:00+03:00'
        description: |-
          Syyskuun Oopperaillassa päästään kuulemaan Suomen Kansallisoopperan ja -baletin uuden ylikapellimestarin Dima Slobodenioukin ajatuksia uudesta pestistään. Lisäksi käydään mm. Bayreuthissa kuuntelemassa Mika Kareksen jylhää bassoa ja Tallinnassa barokkioopperaa. Illan päätteeksi tutustutaan Giuseppe Verdin syyttä unhoon jääneeseen oopperaan Stiffelio, jonka uusi tuleminen valloitti Wienin viime keväänä. Toimittajana Ahti Paunu.
      - title: 'Konsertti: BBC Proms -festivaalin viimeinen ilta'
        start_time: '2026-09-12T21:15:00+03:00'
        end_time: '2026-09-13T00:30:00+03:00'
        description: |
          Maailman suurin klassisen musiikin festivaali huipentuu suoraan lähetykseen Lontoon Royal Albert Hallista. Luvassa on muun muassa Bernsteinin, Barberin ja Gershwinin musiikkia perinteisiä viimeisen illan numeroita unohtamatta.
          Illan supertähdet ovat pianisti Yuja Wang sekä karismaattinen skottitenori Nicky Spence. BBC:n sinfoniaorkesteria ja -kuoroa johtaa Sakari Oramo, jolle tämä Last Night of the Proms on jo seitsemäs. 
          Pasilan studiossa suoran lähetyksen toimittaa Ainomaija Pennanen. 
