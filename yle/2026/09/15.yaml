        start_time: '2026-09-15T19:02:00+03:00'
        end_time: '2026-09-15T19:45:00+03:00'
        description: |-
          Osa 5/8.
          Tositapahtumiin pohjaava, fiktiivinen sarja kuvaa populismin nousua Suomessa, Perussuomalaisten murrosta ja Jussi Halla-ahon ja Timo Soinin kamppailua puolueen suunnasta ja johtajuudesta.  Jussi Halla-ahoa esittää Jussi Vatanen.
          (ensies. v. 2025)
      - title: 'Romano mirits: ”Laulaminen on tuonut itsevarmuutta ja luottamusta omaan tekemiseen”'
        start_time: '2026-09-15T20:00:00+03:00'
        end_time: '2026-09-15T20:15:00+03:00'
        description: |
          Tangokuningatar Raija Mäntyniemi kuvaa itseään perusluonteeltaan melko ujoksi ihmiseksi, enempi sivustaseuraaja, kuten hän kuvailee. ”Tätä ei välttämättä uskoisi”, hän jatkaa. Mäntyniemi kertoo, että viime vuosina tavoitteellinen laulaminen ja laulajana kehittyminen ovat tuoneet uskoa ja luottamusta omaan tekemiseen. Arjessaan Mäntyniemi arvostaa tavallisia asioita. Tärkeintä hänelle ovat omat lapset ja läheiset ystävät. 
           
          Raija Mäntyniemen tapasi Kauhajoella toimittaja Jaakko Laakso.
      - title: 'Ulkolinja-podcast: Trumpin uhkailu herätti Kanadassa kansallistunteen'
