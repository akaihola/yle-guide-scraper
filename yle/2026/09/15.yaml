        end_time: '2026-09-15T14:00:00+03:00'
        description: |2-
           Arkiset esineet ja ilmiöt ovat kuvataiteilija Hannu Väisäsen taiteen lähtökohta. Kohta avautuvan näyttelynsä töissä taiteilija on tarttunut nyt oviin ja portteihin. Helsinkiläisessä Galerie Forsblomissa nähtävä taidenäyttely on samalla kirjailija, taiteilija Hannu Väisäsen 75-vuotisnäyttely. Kuluva vuosi on Ranskassa asuvalla Väisäsellä tuottelias, sillä syyskuun alussa häneltä on ilmestynyt myös uusi lyhytproosateos nimeltä Ohukaisia. Eroaako kuvataiteilija Hannu Väisäsen lähestyminen aiheisiin kirjailija Hannu Väisäsen tapaan tarttua ideoihin? Miia Lahti haastattelee.
