      - title: 'Klasariparatiisi - Eva Tigerstedt: Miksi klassinen musiikki ei ole yksi genre'
        start_time: '2026-09-15T11:00:00+03:00'
        end_time: '2026-09-15T11:57:00+03:00'
        description: |-
          Onko klassinen musiikki sama kuin sinfoniaorkesterimusiikki? No eipä ole!
          Toisin kuin joku voisi luulla, klassinen musiikki sisältää itsessään kymmeniä, ellei satoja genrejä. Mistä on kyse? Tätä pohditaan Klasariparatiisissa, jossa taas soi muutamia siruja klassisen musiikin loputtomasta historiasta ja moninaisuudesta.

          Eva Tigerstedt avaa polkuja musiikkiin.
