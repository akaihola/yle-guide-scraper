      - title: 'Havaintoja muutoksesta: Elämänkaarijohtaminen'
        start_time: '2026-09-30T10:00:00+03:00'
        end_time: '2026-09-30T10:50:00+03:00'
        description: |
          Työuran aikana on oman paikan etsimistä, ruuhkavuosia, sairastumista, ja ikääntymistä. Miksi työelämässä tarvitaan elämänkaariajattelua? Millainen merkitys inhimillisellä pääomalla ja resilienssillä on muuttuvassa työelämässä?                                                                                           
          Toimittaja Satu Kivelä etsii vastauksia yhdessä työhyvinvoinnin johtamisen dosentti Marja-Liisa Mankan ja työhyvinvoinnin tutkimus - ja koulutustehtävissä toimivan Marjut Mankan kanssa. 
