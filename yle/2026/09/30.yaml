      - title: 'Konsertti: Helsingin kaupunginorkesteri – Sibelius 5'
        start_time: '2026-09-30T19:02:00+03:00'
        end_time: '2026-09-30T21:00:00+03:00'
        description: |-
          Helsingin kaupunginorkesteri kantaesitti Jean Sibeliuksen viidennen sinfonian säveltäjän 50-vuotissyntymäpäivän juhlakonsertissa joulukuussa 1915 Helsingin yliopiston juhlasalissa. Päivänsankari itse johti konsertin, ja menestys oli myrskyisä. Onnittelupuheista, kukkalähetyksistä ja adresseista ei ollut tulla loppua. 

          Japanilainen pianisti-ilmiö Hayato Sumino soittaa loppuunmyydyille katsomoille Tokiosta Lontooseen ja Berliinistä New Yorkiin. Sumino on soittanut itsensä Guinessin ennätystenkirjaan saavutuksenaan ‘eniten pianoresitaaliin (sisätiloissa) myytyjä lippuja’. Marraskuussa 2025 Sumino soitti Japanissa Yokohama K-Arenassa konsertin, johon myytiin 18 564 pääsylippua.

          Suoran lähetyksen Helsingin Musiikkitalosta toimittaa Noora Hirn.

          Helsingin kaupunginorkesteri
          Jukka-Pekka Saraste, kapellimestari
          Hayato Sumino, piano

          Ohjelma:

          Jean Sibelius: Musiikkia sarjasta Pelléas ja Mélisande op. 46
          Sergei Prokofjev: Pianokonsertto nro 3
          Jean Sibelius: Sinfonia nro 5

          Kuvassa Hayato Sumino © Ryuya Amao
