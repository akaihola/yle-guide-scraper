      - title: 'Aitiovieras: Rajojen rikkoja Jukka Perko vie nyt klassikot jazzin kielelle'
        start_time: '2026-09-30T13:35:00+03:00'
        end_time: '2026-09-30T14:00:00+03:00'
        description: |-
          Saksofonisti Jukka Perko on koko uransa ajan rikkonut rajoja. Perko on jazzmuusikko, joka soittaa sinfoniaorkesterien kanssa, on tuttu tango- ja virsilevytyksistään ja on yhdistää musiikkiaan Suomen rakastetuimpien runoilioiden teksteihin. Nyt Perkon ja laulaja Aili Ikosen yhteinen kokoonpano tulkitsee klassisen musiikin helmiä uusin sanoituksin ja jazzin kielellä. Perkon kansainvälinen ura on kestänyt vuosikymmeniä, se alkoi jo teini-iässä. Mistä jazzmuusikko ammentaa intonsa jatkuvaan uudistumiseen? Joni Timonen haastattelee.
