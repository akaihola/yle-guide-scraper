      - title: Kulttuuriykkönen
        start_time: '2026-09-30T15:00:00+03:00'
        end_time: '2026-09-30T15:58:00+03:00'
        description: |-
          Entinen BMG Finlandin toimitusjohtaja Kimmo Valtanen muistelee tuoreessa kirjassa Perjantai 13.päivä uraansa musiikkiteollisuudessa. Valtanen auttoi muun muassa Lordin kansainväliselle uralle, mutta rap-tähti Cheekille hän antoi pakit.

          Valtasen uralle mahtuu monia värikkäitä käänteitä alalla, jossa äärimmäisen kova bisnes sekä taiteelliset intohimot muodostavat erikoisen yhdistelmän. Kirjassa Valtanen kuljettaa lukijaa läpi musiikkiteollisuuden murroksen. 

          Tänä päivänä verkon suoratoisopalveluihin ladataan päivittäin satoja tuhansia kappaleita, joiden tekijänä yhä useimmin on kone. Mihin ala on tekoälyn ja ylenpalttisen suoratoistotarjonnan myötä matkalla? 

          Kimmo Valtasen kanssa aiheesta keskustelee Spinefarm-levy-yhtiön perustaja ja indiemusiikin pioneeri Riku Pääkkönen. Ville Talola toimittaa.
