      - title: 'Kirjani tarina: Elisa Savolainen - Kerro heille oliivipuista'
        start_time: '2026-09-11T13:35:00+03:00'
        end_time: '2026-09-11T14:00:00+03:00'
        description: |-
          Kirjailija Elisa Savolaisen Kerro heille oliivipuista -romaani kuvaa suomalaisen antropologi Hilma Granqvistin elämää Lähi-idän maisemissa. Uraauurtavaa tieteellistä tutkimusta tehnyt Granqvist näki jo 100 vuotta sitten myös alueen nykyisten ongelmien ja sotien syitä. Kuinka itsenäisestä tiedenaisesta tuli sitten kaunokirjan päähenkilö ja mitä kaikkea taiteen avulla oikean ihmisen elämästä voi kertoa?

          Kirjani tarinan vieraana kirjailija Elisa Savolainen. 

          Toimittaja Jukka Kuosmanen. 
