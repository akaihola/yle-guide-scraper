      - title: 'Politiikkaradio: Orpon kujanjuoksu'
        start_time: '2026-09-11T20:55:00+03:00'
        end_time: '2026-09-11T21:30:00+03:00'
        description: |-
          Pääministeri Petteri Orpo on joutunut tällä viikolla selittämään avoimuusrekisteriin merkittyjä tapaamisia ja kieltää va­leh­del­leen­sa Garden Hel­singin tukisotkusta. 
          Miten vaikea tie Orpolla on edessä, kun oikeuskansleri tutkii myös hänen mahdollista esteellisyyttään Uudenkaupungin autotehtaan pelastamisessa? Onko avoimuusrekisteri osoittanut voimansa vai pulmansa?
          Aiheesta keskustelevat Antti Pilkkeen kanssa johtava asiantuntija Ines Gullichsen Valtiontalouden tarkastusvirastosta ja tutkiva toimittaja Jarno Liski Helsingin Sanomista. Suora lähetys.
      - title: 'Aitiovieras: Elokuvaohjaaja Klaus Härö antaa äänen väsyneille hoitajille'
        start_time: '2026-09-11T21:31:00+03:00'
        end_time: '2026-09-11T21:54:00+03:00'
        description: |-
          Elokuvaohjaaja Klaus Härön tuore elokuva Hetki ennen valoa kertoo hoitoalan tiukasta tilanteesta. Siitä, mitä tapahtuu, kun hoitaja ei enää jaksa. Useaan otteeseen palkittu elokuvaohjaaja Härö on sanonut, että hän pyrkii antamaan äänen niille, joiden oma ääni ei kuulu. Härö pitää itseään ennen kaikkea tarinan kertojana. Miia Lahti haastattelee.
      - title: 'Sari Valto: Kirkko ajaa kaksilla rattailla samaa sukupuolta olevien vihkimisen suhteen'
