      - title: 'Konsertti: Kaivosfestivaali – Aallot viikkokausia oikealla puolellani'
        start_time: '2026-09-11T19:02:00+03:00'
        end_time: '2026-09-11T21:00:00+03:00'
        description: |-
          Konsertissa kuultava musiikki vie yleisön mukanaan alttoviulistin pitkälle yksinvaellukselle Lounais-Englannin auringonpaahteisilla ja myrskyisillä rannoilla. Puhetta, musiikkia ja kuvia yhdistelevä konsertti välittää tunnelmia, ajatuksia, haasteita ja onnistumisia vaellukselta ja pohtii osaltaan ihmisen paikkaa loputtomalta tuntuvan Atlantin valtameren äärellä. Esiintymässä Tami Pohjola, viulu; Mari Viluksela, alttoviulu; Sirja Nironen, sello; Aleksei Zaitsev, piano. Outokummun Vanhan kaivoksen Teatteri Kiisussa 4.9.2026 tallennetun konsertin toimittaa Pia Antikainen.

          Ohjelma:

          Sally Beamish(*1956): Stone, Salt and Sky viululle ja sellolle
          II Horizon
          III Harbour Blues

          Caroline Shaw (*1982): Limestone and Felt alttoviululle ja sellolle

          Henry Cowell (1897-1965): The Tides of Manaunaun pianolle

          Ingibjörg Ýr (*1990): Undiralda – Undercurrent viululle ja alttoviululle

          Maleena Linjama (*1992): Zirkoni ZrSiO4 alttoviululle ja pianolle

          Rebecca Clarke (1886-1979): I’ll bid my heart be still alttoviululle ja pianolle
