        description: |
          Jenny Matikaisen Ruotsia käsittelevässä sarjassa pureudutaan tällä kertaa rikollisjengeihin. 17-vuotias Elias istuu lukkojen takana Pohjois-Ruotsissa, koska hän on sekaantunut jengiin ja tehnyt vakavan rikoksen. Jenny matkustaa tapaamaan Eliasta ymmärtääkseen, miksi rikollisjengit ovat saaneet otteen juuri ruotsalaisnuorista. Ruotsin piti olla maailman turvallisin maa. Missä kohtaa asiat alkoivat mennä pieleen? Voivatko lapsivankilat pelastaa Ruotsin?
