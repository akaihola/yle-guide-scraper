        start_time: '2026-09-11T19:02:00+03:00'
        end_time: '2026-09-11T19:55:00+03:00'
        description: |
          Kaivosfestivaalin konsertti “Aallot viikkokausia oikealla puolellani” yhdistää puhetta, musiikkia ja kuvia ja välittää siten tunnelmia, ajatuksia, haasteita ja onnistumisia vaellukselta Lounais-Englannin rannoilla. 
          Konsertissa esiintyvät Tami Pohjola, viulu, Mari Viluksela, alttoviulu, Sirja Nironen, sello, ja Aleksei Zaitsev, piano. Outokummun Vanhan kaivoksen Teatteri Kiisussa 4.9.2026 tallennetun konsertin toimittaa Ainomaija Pennanen.
