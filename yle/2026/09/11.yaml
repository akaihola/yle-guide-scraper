      - title: 'Narrin aamulaulu - Unohtumaton Ileana Cotrubas (1939-2026), tinkimätön taiteilija '
        start_time: '2026-09-11T11:00:00+03:00'
        end_time: '2026-09-11T11:55:00+03:00'
        description: |
          ”Me laulajat emme ole marionetteja. Kysyin kerran eräältä hyvin maineikkaalta ohjaajalta: tekö laulatte vai minä? Joidenkin ohjaajien kannattaisi pysyä teatterissa, jossa ei tarvitse laulaa.” Ileana Cotrubas piti viimeiseen saakka kiinni periaatteesta, jonka mukaan oopperataiteen tuli pysyä uskollisena säveltäjän intentioille ja teoksen hengelle. Hänelle Regietheater oli kirosana. Näkemyksiään puolustaessaan romanialaislaulaja oli valmis uhmaamaan niin New Yorkin Metropolitania kuin kotitaloaan Wienin valtionoopperaa. 

          Ileana Cotrubasin riman korkeutta tarkastelee Outi Paananen. 
