      - title: Uutispodcast
        start_time: '2026-09-25T17:05:00+03:00'
        end_time: '2026-09-25T17:30:00+03:00'
        description: |
          Uusi minisarja alkaa! Entinen turvetyömies ryhtyy pandakaupungin sheriffiksi ja yrittää pelastaa kaupungin. Hän näkee ennalta, miten epäonniselle pandahankkeelle tulisi käymään. Sheriffiä ei uskota.
          Kaupungin asukkaat ovat innoissaan jättiläispandojen saamisesta Ähtäriin. Lopulta niiden elämää rahoitetaan salaisilla pandalainoilla, jotka vievät kaupunkilaisten rahat, kunnan itsenäisyyden ja poliitikot käräjille.
          MOT-podcast selvittää, mitä löytyy päättäjien rikossyytteiden takaa. Esiin nousee kuva suomalaisesta korruptiosta, jossa lahjuksia tyypillisempää on kulissien takainen päätöksenteko, avoimuuden puute ja hyväveli- ja siskoverkostot.
