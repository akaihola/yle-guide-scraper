          Weill: September song (George London, bassobaritoni, ja ork./Roland Shaw).

          Debussy: Clair de lune (Kuutamo) (Samson Francois, piano).

          Purcell: Didon resitatiivi ja aaria "Thy hand, Belinda - When I am laid in earth" oopp. Dido ja Aeneas (Elly Ameling, sopraano, ja Leipzigin Gewandhaus-ork./Kurt Masur).

          Albéniz: Granada teoks. Suite espanola (Espanjalainen sarja) (Alicia de Larrocha, piano).

          J.S. Bach: Rondeau sarj. orkesterille h-molli (Wilbert Hazelzet, flauto traverso, ja Amsterdamin barokkiork./Ton Koopman).

          Chopin: Valssi n:o 4 F-duuri (Stephen Hough, piano).

