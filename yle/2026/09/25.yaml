        start_time: '2026-09-25T19:02:00+03:00'
        end_time: '2026-09-25T20:43:00+03:00'
        description: |-
          Kuningatar Kristiina luopui kruunustaan, vaihtoi uskontoa ja muutti Roomaan. Tiedettä ja taidetta intohimoisesti tukenut kuningatar nosti pohjoismaisen kulttuurin eurooppalaiselle kartalle ja toimi mesenaattina aikansa suurille säveltäjille kuten Corellille, Scarlattille ja Stradellalle. Nyt, 400 vuotta kuningatar Kristiinan syntymän jälkeen, heidän musiikkiaan tulkitsevat Helsingin Barokkiorkesteri, sopraano Kateryna Kasper ja viulisti Cecilia Bernardini.

          20.9.2026 Helsingin Musiikkitalossa taltioidun konsertin toimittaa Ainomaija Pennanen. Konserttilähetyksen äänisuunnittelusta ja -toteutuksesta vastaavat Antti Pohjola ja Jari Rantakaulio.
