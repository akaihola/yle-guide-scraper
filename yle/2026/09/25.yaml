          Albéniz: Granada (Alicia de Larrocha, piano).

          J.S. Bach: Rondeau (Wilbert Hazelzet, huilu, ja Amsterdamin barokkiork./Ton Koopman).

          Chopin: Valssi n:o 4 F-duuri (Stephen Hough, piano).

