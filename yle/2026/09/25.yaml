      - title: 'Narrin aamulaulu - Nuoren neuvostovaltion näkökulma emigrantti Rahmaninoviin '
        start_time: '2026-09-25T11:00:00+03:00'
        end_time: '2026-09-25T11:55:00+03:00'
        description: |-
          Tammikuussa 1917 Sergei Rahmaninov perheineen matkasi hevosten vetämässä reessä halki talvisen Suomen, Tornion kautta Haaparantaan ja vapauteen. Lännessä on toisinaan toisteltu virheellisesti Rahmaninovin musiikin olleen neuvostoaikana paitsiossa. Vaikka useimmat emigrantit nimettiin vallankumouksen ja neuvostokansan vihollisiksi, Rahmaninov säilyi kansallisaarteena lukuun ottamatta lyhyttä notkahdusta 1930-luvulla. 

          Outi Paananen penkoo levyhyllyjä ja tutkailee taiteilijaelämää.
          (Ohjelma on uusinta vuodelta 2025)
