      - title: 'Konsertteja: Kuningatar Kristiina 400 vuotta – Helsingin Barokkiorkesteri'
        start_time: '2026-09-25T19:02:00+03:00'
        end_time: '2026-09-25T21:00:00+03:00'
        description: |-
          Kuningatar Kristiina luopui kruunustaan, vaihtoi uskontoa ja muutti Roomaan. Tiedettä ja taidetta intohimoisesti tukenut kuningatar nosti pohjoismaisen kulttuurin eurooppalaiselle kartalle ja toimi mesenaattina aikansa suurille säveltäjille, Corellille, Scarlattille ja Stradellalle. Nyt, 400 vuoden kuluttua hänen syntymästään, heidän musiikkiaan tulkitsevat Helsingin Barokkiorkesteri, sopraano Kateryna Kasper ja viulisti Cecilia Bernardini.

          20.9.2026 Helsingin Musiikkitalossa taltioidun konsertin toimittaa Ainomaija Pennanen. Äänisuunnittelija: Antti Pohjola, äänitarkkailija: Jari Rantakaulio.
