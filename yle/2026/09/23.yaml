      - title: 'Kulttuuriykkönen: Uusi näyttely kouluruuasta - millainen on kouluruokailun historia ja nykytila?'
        start_time: '2026-09-23T15:00:00+03:00'
        end_time: '2026-09-23T15:58:00+03:00'
        description: |-
          Hotelli- ja ravintolamuseon uusi näyttely kertoo kouluruoan historiasta ja nykytilasta. On ainutlaatuista että koulu tarjoaa oppilaille lounaan, näin ei ole kaikissa maissa. Miksi kouluruokailu ei kuitenkaan aina ole niin suosittu? 

          Keskustelemassa ovat näyttelyn yhtenä asiantuntijatahona toiminut ruokakasvatusyhdistys Ruukun asiantuntija Saila Paavola. Vieraina ovat myös museonjohtaja Päivi Balomenos ja amanuenssi Tiina Kiiskinen.

          Ohjelman juontaa Pia-Maria Lehtola.

          Rentoa puhetta, kiinnostavimmat vieraat ja kulttuurin ajankohtaisaiheet debatoitavina. Suorana maanantaista perjantaihin.
