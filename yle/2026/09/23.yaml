      - title: 'Politiikkaradio: Kymmenen päivää Kabulin kentällä'
        start_time: '2026-09-23T13:00:00+03:00'
        end_time: '2026-09-23T13:30:00+03:00'
        description: |-
          Elokuussa 2021 Kabuliin lentokenttä muuttui piiritetyksi linnakkeeksi Talebanin vyöryessä Agfanistanin pääkaupunkiin. Uutiskuvissa sadat afganistanilaiset juoksivat kuljetuskoneiden ympärillä, jotkut koneista roikkuen. Samalla alkoi myös kymmenen päivää kaoottisella lentokentällä kestänyt suomalaisoperaatio. Suojelun piiriin kuuluvat ihmiset ja perheet oli saatava läpi Kabulin porteista. Vieraana on Kabulin dramaattisesta evakuointioperaatiosta kirjan kirjoittanut ulkoministeriön konsulipäällikkö Jussi Tanner. Toimittajana on Tapio Pajunen.
