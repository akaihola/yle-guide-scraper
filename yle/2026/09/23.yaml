      - title: 'Havaintoja muutoksesta: Terveys ja sairaus eivät ole vain yksilön harteilla'
        start_time: '2026-09-23T10:00:00+03:00'
        end_time: '2026-09-23T10:50:00+03:00'
        description: |
          Tiesitkö, että myönteiset sosiaaliset suhteet vahvistavat jopa immuunijärjestelmän toimintaa? Eriarvoisuus ja lapsiperheköyhyys voivat heikentää ihmisen terveyttä jopa vuosikymmenien päähän. Miksi terveyttä ja sairautta tulee tarkastella yhteiskunnallisesta näkökulmasta yksilön sijaan? Miten stressin vaikutukset voivat periytyä seuraaville sukupolville?
          Toimittaja Satu Kivelä etsii vastauksia yhdessä tutkijoiden Heidi Kesanto-Jokipolven ja Emma Vitikaisen kanssa. 
