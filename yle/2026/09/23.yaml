      - title: 'Aitiovieras: Sopraano Emma Kajander on yksi suomalaisen oopperamaailman nousevista laulajista'
        start_time: '2026-09-23T13:35:00+03:00'
        end_time: '2026-09-23T14:00:00+03:00'
        description: |-
          Sopraano Emma Kajanderia kuvaillaan sanoilla uljasääninen ja hurja. Hän voitti loppiaisena 2025 Lappeenrannan laulukilpailun ja teki debyyttinsä Suomen Kansallisoopperassa syksyllä 2024 Andrew Lloyd Webberin Oopperan kummituksessa. Nyt Kajander on nouseva, suomalaisen oopperataivaan tähti.Minkälaista nuoren laulajan arki on, kun ura on rakentumassa? Kajanderilla on nuoresta iästä huolimatta takana uramuutos, sillä hän on valmistunut aiemmin lähihoitajaksi ja nyt siis tekee taidetta oopperalaulajana. Jarmo Laitaneva haastattelee.
