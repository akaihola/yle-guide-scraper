      - title: Narrin aamulaulu - Säveltäjän teosluettelo ei ole päätepiste, vaan alkupiste
        start_time: '2026-09-18T11:00:00+03:00'
        end_time: '2026-09-18T11:55:00+03:00'
        description: |2-
           "Jos Suomi olisi aito sivistysmaa, opetus- ja kulttuuriministeriö perustaisi teosluetteloprojektin ja palkkaisi siihen tutkijat. Säveltäjien tuotannon perusteellinen kartoitus on perustutkimusta, johon meillä ei vain tunnu olevan kiinnostusta", sanoo Heikki Poroila. Poroila on  tiedonjärjestämisen ammattilainen, jonka työn tuloksena mm. Oskar Merikannon laaja tuotanto on yksissä kansissa. Heikki Poroilan tapasi Outi Paananen.
