      - title: 'Kun Ruotsi muuttui 5/5: Ihan tavallinen Ruotsi'
        start_time: '2026-09-18T17:05:00+03:00'
        end_time: '2026-09-18T17:30:00+03:00'
        description: |
          Kirjeenvaihtaja Jenny Matikaisen podcastin viimeisessä jaksossa pohditaan Ruotsin tulevaisuutta. Hugo ja Adde juhlivat lukion pihassa. Koulu on ohi ja edessä on bileet. Mutta mitä sen jälkeen? Töitä ja asuntoa on yhä vaikeampi löytää ja naapuritaajamasta uutisoidaan ampumisista. Synkkyteen ei ole syytä vaipua, mutta sama ei päde kaikkiin ruotsalaisnuoriin: apatia leviää myös naapurimaassa. Onko Ruotsi enää hyvinvoiva kansankoti, joka voi näyttää muille mallia? 
