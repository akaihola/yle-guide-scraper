      - title: 'Havaintoja muutoksesta: Kouluttautuminen käynnistää muodonmuutoksen'
        start_time: '2026-09-02T10:00:00+03:00'
        end_time: '2026-09-02T10:50:00+03:00'
        description: |
          Koulutusmahdollisuuksissa ei ole kyse vain yksilön henkilökohtaisista valinnoista. Sukupuoli, luokka ja alue vaikuttavat siihen millaiset koulutuspolut näyttäytyvät edes mahdollisina. Millaisen muodonmuutoksen kouluttautuminen voi käynnistää? Miten se vaikuttaa sosiaalisiin suhteisiin? 
          Toimittaja Satu Kivelä keskustelee aiheesta sosiologian lehtori Mari Käyhkön ja kirjailija ja sarjakuvataiteilija Riina Tanskasen kanssa. 
