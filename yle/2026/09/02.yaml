        start_time: '2026-09-02T16:07:00+03:00'
        end_time: '2026-09-02T16:59:00+03:00'
        description: |-
          Janácek: Pilky (Sahatanssi) sarj. Laskke tance (Tansseja Lasskon alueelta) (Varsovan kansallinen filharmoninen SO/Antoni Wit).

          Poulenc: Allegro malinconico sonaatista huilulle ja pianolle (Jean-Pierre Rampal ja Francis Poulenc). 

          Arutjunjan: Allegro moderato kons. tuuballe ja orkesterille (Harri Lidsle ja Oulu Sinfonia/Atso Almila). 

          Schubert: Scherzando - Trio pianotriosta n:o 2 Es-duuri (Jos van Immerseel, fortepiano, Vera Beths, viulu, ja Anner Bylsma, sello).

          W.A. Mozart: Cherubinon aaria "Non so piu cosa son, cosa faccio" oopp. Figaron häät (Kathleen Battle, sopraano, ja Metropolitan-oopperan ork./James Levine). 

          Sirmen: Adagio kons. viululle ja orkesterille n:o 3 A-duuri (Stefano Montanari ja Arion Orchestre Baroque).

          G. Fröst: Klezmer dances (Klezmer-tansseja) (Martin Fröst, klarinetti, ja Australian kamariork./Richard Tognetti).

          Suk: Andante con moto teoks. Serenadi jousille Es-duuri (Tshekkiläinen FO/Jiri Belohlávek).

          Moreno Torroba: Rafaelin aaria "Adios dijiste - Amor, vida de mi vida" zarzuelasta Maravilla (Rolando Villazon, tenori, ja Orquesta de la Comunidad de Madrid/Placido Domingo).

          Satie: Gymnopedie n:o 3 (Jean-Yves Thibaudet, piano).

          Devienne: Rondo kons. huilulle ja orkesterille n:o 7 e-molli (Emmanuel Pahud ja Baselin kamariork./Giovanni Antonini).

          Konsertin on laatinut Ainomaija Pennanen.
