      - title: 'Konsertti: Radalla-festivaali – Juhlat ihanat'
        start_time: '2026-09-02T19:02:00+03:00'
        end_time: '2026-09-02T21:00:00+03:00'
        description: |-
          Radalla-festivaalin 2026 avajaiskonsertti Juhlat ihanat on tapahtuma, jossa saa hymyillä, sillä kyseessä on festivaalin viidennen edition alkupamaus! 27.8.2026 Kauklahden kappelissa Espoossa tallennetun konsertin toimittaa Noora Hirn.

          Ohjelma:

          Otto Nuoranne (1991-): Radalle (2026), kantaesitys
          Artturi Aalto, sello, Iivari Aalto, piano

          George Gershwin (1898–1937): Rhapsody in Blue
          Klaara Vasara, klarinetti
          Anton Mejias, piano

          Francis Poulenc (1899–1963): Sonaatti neljälle kädelle
          Iivari Aalto ja Anton Mejias, piano

          Boris Pigovat (1953–):
          Jewish Wedding
          Klaara Vasara, klarinetti
          Rebecca Roozeman, viulu
          Otto Antikainen, viulu
          Charlotta Westerback, alttoviulu
          Artturi Aalto, sello

          Igor Stravinsky (1882–1971):
          Petrushka-sarja (osia), neljälle kädelle
          Anton Mejias ja Iivari Aalto, piano
          (Soiva kesto: 53min)
