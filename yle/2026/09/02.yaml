      - title: 'Kulttuuriykkönen: Teatterivinkit syksyksi '
        start_time: '2026-09-02T15:00:00+03:00'
        end_time: '2026-09-02T15:58:00+03:00'
        description: |-
          Kolme teatterin suurkuluttajaa tutkii syksyn tarjontaa. Näyttelijä Juha-Pekka Mikkola on kaikkiruokainen ahmatti, joka on nähnyt tänä vuonna jo yli 100 esitystä.Tanjalotta Räikkä on  varannut junamatkoja eri puolelle Suomea. Hän hän on jo 8 vuoden ajan etsinyt esityksiä Tampereen teatterikesään. Maija Alander havainnoi tarjontaa teatterikorkeakoulusta kohta valmistuvan näytelmäkirjailijan ja dramaturgin silmin. Ohjelman toimittaa Minna Joenniemi.
