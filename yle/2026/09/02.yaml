        start_time: '2026-09-02T12:05:00+03:00'
        end_time: '2026-09-02T12:50:00+03:00'
        description: |-
          Miten vanhat ihmiset ovat eläneet eri aikoina? Milloin vanhusten hoiva kriisiytyi? Näitä kysymyksiä pohtivat historiantutkija Johanna Annola, sosiaalityön professori emerita Marja Vaarama, historianopettaja Lasse Hongisto ja toimittaja Jussi Nygren. (2024)
