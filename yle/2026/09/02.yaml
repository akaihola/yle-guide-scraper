      - title: Aitiovieras
        start_time: '2026-09-02T13:35:00+03:00'
        end_time: '2026-09-02T14:00:00+03:00'
        description: |-
          Yle uutisten ulkomaantoimittaja Antti Kuronen vierailee säännöllisesti suomalaisten kuvavirrassa. Rauhallisesti kiovalaisen kadun reunalla seisova Kuronen raportoi sotaa käyvästä maasta. Kurosesta on tullut tärkeä linkki suomalaisille sotatilanteisiin ulkomailla, viime vuosina erityiesesti Ukrainen tilanteeseen. Miltä tuntuu matkustaa työkseen kohteeseen, jossa arki on särkynyt? Pelottaako ulkomaantoimittajaa? Työnsä takia Kurosen kasvot tunnistetaan kaikkialla. Miltä se on tuntunut? Jarmo Laitaneva haastattelee.
