        start_time: '2026-09-07T19:02:00+03:00'
        end_time: '2026-09-07T19:50:00+03:00'
        description: |
          Lapsena pommituksia kotona Bagdadissa pelännyt Rand päätyi perheineen kiintiöpakolaisena outoon ja lumiseen Suomeen. Hänestä kasvoi sisukas nainen, kolmen lapsen yksinhuoltaja ja yrittäjä, joka ei vähästä lannistu, vaikka haasteita ja vastoinkäymisiä riittää. Nyt hän toteuttaa unelmaansa omasta leipomosta ja rohkaisee sisukkuudellaan muita maahanmuuttajataustaisia naisia. Toimittaja Päivi Leino.
      - title: 'Hyviä aikeita 1: Koiratarhan todellisuus '
        start_time: '2026-09-07T20:10:00+03:00'
        end_time: '2026-09-07T20:38:00+03:00'
        description: |
          Liettualaiselta koiratarhalta tuodaan vuosittain satoja rescuekoiria Suomeen. Paikalliset viranomaiset syyttävät koiratarhaa eläinrääkkäyksestä. Ovatko suomalaiset koiranomistajat osa ratkaisua, vai ongelmaa? Toimittaja Ronja Salmi aloittaa selvityksen rescuekoirailmiön monista puolista. 
