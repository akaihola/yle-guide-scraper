        description: |-
          Ylen satavuotisjuhlan kunniaksi Yle Teema ja Yle Areena esittävät sata kotimaista elokuvaa sadan vuoden ajalta. Kerran kuussa olemme Radio:ssä keskustelleet yhdestä katsojien toive-elokuvasta tai sen genrestä laajemmin. Ensi sunnuntaina (13.9. klo 16:01) Yle Teemalla esitetään Mikko Niskasen ohjaama Käpy selän alla. Suomen elokuvasäätiön kulttuuriviennin suunnittelija Otto Suuronen on Aitiovieraana keskustelemassa elokuvasta Jarmo Laitanevan kanssa.
