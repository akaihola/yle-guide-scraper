        description: |+
          Carissimi (sov. Parisotti): Vittoria, mio core (Voiton oot saava) (Cecilia Bartoli, mezzosopraano, ja György Fischer, piano).

          Bizet: Pieni sarja orkesterille (Ranskankielisen Sveitsin ork./Ernest Ansermet).

          Arriaga: Jousikvartetto n:o 2 A-duuri (Guarneri-kvartetti). 

          Kuula: Syystunnelma (Matti Lehtinen, baritoni, ja Pentti Koskimies, piano).

