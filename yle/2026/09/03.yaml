      - title: Tuuli Saksalan keidas
        start_time: '2026-09-03T17:35:00+03:00'
        end_time: '2026-09-03T18:25:00+03:00'
        description: |-
          Romantiikkaa rinta rottingilla, latinalaisen Amerikan rytmejä ja suuren salsaorkesterin mahtavaa sointia! Syyskuun alun viileisiin iltoihin tuodaan lämpöä ja intohimoa, kun Tuuli Saksalan vieraaksi saapuu suomenkielisen latinopopin lähettiläs, laulaja-lauluntekijä Vili Mustalampi.

          Kuunnellaan Mustalammen tuore Pala Havannaa -albumi ja kuullaan, miten lattarimusiikilla menee Suomessa vuonna 2026. Maailmalla Bad Bunny ja Bruno Mars ovat tuoneet latinorytmit popin ytimeen – Vili tekee samaa Suomessa, mutta suomeksi.

          Uudella levyllä Vilin bändi kasvaa täydeksi salsa-orkesteriksi, mukana soittaa joukko huippumuusikoita. Albumin teemoissa kuuluu elämän rehellinen tarkastelu: intohimo ja romantiikka, kaipuu ja toivo, kysymykset joihin ei aina ole vastausta.

          Vili on viettänyt talvia Kuubassa ja opiskellut paikallisten mestareiden johdolla. Ohjelmassa hän kertoo, miten nämä kokemukset näkyvät hänen musiikissaan ja millainen on hänen laulujensa Havanna.

          Musiikkituliaisina kuullaan Alain Perezin Tu No Sabes Nada ja dominikaanisen supertähden Juan Luis Guerran Vale la pena.
