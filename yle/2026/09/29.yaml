      - title: 'Aitiovieras: Markus Lehmusruusun elokuvassa oikeat oravat vievät aikamatkalle tulevaisuuteen'
        start_time: '2026-09-29T13:35:00+03:00'
        end_time: '2026-09-29T14:00:00+03:00'
        description: |-
          Käsikirjoittaja-ohjaaja Markus Lehmusruusun käsikirjoittama ja ohjaama elokuva, Orava valittiin Suomen ehdokkaaksi parhaan kansainvälisen elokuvan Oscar-palkinnon saajaksi. Huhtikuun alussa ensi-iltansa saanut suomalais-eurooppalainen elokuva vie katsojansa maailmaan, jossa luonto on hävinnyt miltei kokonaan. Mikä inspiroi Lehmusruusua kirjoittamaan maailman viimeisestä oravasta? Haastattelijana Miia Lahti. Ohjelman ensilähetys oli 31.3.2026.
