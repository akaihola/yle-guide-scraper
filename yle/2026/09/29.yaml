      - title: 'Kulttuuriykkönen: Antiikin myyttiset naiset ja miten he elävät nykykirjallisuudessa'
        start_time: '2026-09-29T15:00:00+03:00'
        end_time: '2026-09-29T15:58:00+03:00'
        description: |-
          Sari Kivistön uusi teos Antiikin myyttiset naiset : Sankareiden uusi elämä nykykirjallisuudessa sukeltaa syvälle antiikin naisten, raivottarien ja amatsonien maailmaan. Kivistö on tutkinut ja analysoinut kahdeksan antiikin kirjallisuuden myyttistä hahmoa. Uuden tulkinnan kohteena ovat Helena, Penelope, Dido, Kassandra, Medeia, Antigone, Lysistrate ja Medusa.

          Kirjassa kysytään millainen äiti Medeia oli? Miksi Medusan katse muuttaa kiveksi? Kuka on Sofokleen Antigone-tragedian todellinen sankari? Uudet tulkinnat antiikin myyttisistä naishahmoista ovat myös kansainvälinen ilmiö.

          Sari Kivistö tutkii sankarinaisten uutta elämää modernissa kirjallisuudessa ja filosofiassa. Millainen on raivotar ja amatsoni ja mitä he omalla voimallaan tavoittelevat? Hiljaisilla hahmoilla on myös oma merkityksensä.

          Nyt puhutuin antiikin mytologisten naisten representaatio on Nolanin elokuva Odysseus. Kirken, Penelopen ja Calypson roolit ovat olleet koko kesän kiistelyn kohteena. Antiikin tutkijat ovat myös osallistuneet keskusteluun.

          Ohjelmassa keskustellaan sisaruudesta, nuorista sankarittarista, kutomisesta feminiinisenä metaforana ja tulkitaan näitä myyttien naisia feministisestä näkökulmasta.

          Ohjelman vieraina ovat professori Sari Kivistö ja FT Marja-Leena Hänninen,  antiikin historian dosentti Tampereen yliopistosta.

          Ohjelman juontaa Pia-Maria Lehtola. 




          Rentoa puhetta, kiinnostavimmat vieraat ja kulttuurin ajankohtaisaiheet debatoitavina. Suorana maanantaista perjantaihin.
