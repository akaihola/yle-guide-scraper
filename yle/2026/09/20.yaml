      - title: 'Elävä historia: Ahvenanmaan pienet ihmis- ja eläinhahmoiset veistokset  herättävät kysymyksiä kivikautisesta kulttuurista'
        start_time: '2026-09-20T12:05:00+03:00'
        end_time: '2026-09-20T12:55:00+03:00'
        description: |
          Ensimmäiset seikkailijat uskaltautuivat kivikautisen Ahvenanmaan saarille noin 7000 vuotta sitten Lounais-Suomesta, ja myöhemmin asukkaita tuli myös Ruotsista sekä kaukaa etelästä. Miten näiden ihmisten kohtaamiset sujuivat? Entä mitä kertovat pienet ja ilmeikkäät saviveistokset?
          haastateltava: arkeologi Jan Fast
          toimittaja: Riikka Suikkari
      - title: Uudet levyt
        start_time: '2026-09-20T13:00:00+03:00'
        end_time: '2026-09-20T13:55:00+03:00'
        description: |-
          Matada: Hiona mbilo (Chico Matada) levyltä Kuya Kaya. 
          Konsta Jylhä: Laulu (Hot Heros) levyltä Tähtisilmä. 
          Hynninen: Tuliketun jäljillä (Laura Hynninen) levyltä Botaurus stellaris.  
          Hynninen: Lyhty (Laura Hynninen).    
          Kansanlaulu (Ahvenanmaa): Skön Anna (Cienna) levyltä Muinainen armas. 
          Kansansäv. Pollonizer -sikermä (Nordik Tree) levyltä Ratas. 
          Keskitalo/Hanikka: Kuinka kauan siinä kestää (Inariveljet). 
          Verdi/IkonenPerko: La donna e mobile (Mun oma miekkonen suuttui taas vähäsen (Aili Ikonen ja Jukka Perko) levyltä Klasstet. 
          Pohjonen/Gustafsson: Two balls are enough (Kimmo Pohjonen ja Mats Gustafsson). 
          Pajakkala: Rauha (Utopianisti, Tampereen Ihankaikkinen Kuninkaallinen Tuomiokuoro/Petra Poutanen). 
