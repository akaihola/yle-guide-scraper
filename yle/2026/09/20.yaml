      - title: Uutispodcast
        start_time: '2026-09-20T21:00:33+03:00'
        end_time: '2026-09-20T21:22:14+03:00'
        description: |-
          Psykiatriset diagnoosit, kuten ADHD, masennus, autismi ja ahdistuneisuushäiriö ovat yleistyneet valtavasti. Näitä diagnooseja yhdistää se, että niiden kriteerit on laveat. Psykologian tutkijatohtori ja tiedetoimittaja Anssi Bwalya ajattelee, että näitä diagnooseja ei välttämättä tarvita. Haastattelijana Leonard Wilhelmus. Uutispodcast syventyy syyskuussa mielenterveysteemaan kolmen jakson verran, eri näkökulmista.

          Voit lähettää palautetta ja juttuvinkkejä uutispodcast@yle.fi.
