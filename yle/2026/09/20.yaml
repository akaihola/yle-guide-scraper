      - title: 'Romano mirits:  Mitä kaaleet ajattelevat kaajeista?'
        start_time: '2026-09-20T23:26:00+03:00'
        end_time: '2026-09-20T23:39:30+03:00'
        description: |
          Tulevatko romanit nähdyiksi, ja miksi heidän pitää jatkuvasti todistaa olemassaoloaan sekä ansaita luottamus? Minkälaisia kohtaamisia romanit ovat kokeneet – ja minkälaisia he toivovat? 

          Haastateltavana on sairaanhoitaja-diakonissaopiskelija Anette Blomerus. Toimittajana Mertsi Lindgren. 
