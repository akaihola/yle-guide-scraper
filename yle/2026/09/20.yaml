      - title: Faunin iltapäivä
        start_time: '2026-09-20T16:07:00+03:00'
        end_time: '2026-09-20T16:59:59+03:00'
        description: |+
          Wolf-Ferrari: Alkusoitto oopp. Il segreto di Susanna (Susannan salaisuus) (Academy of St. Martin-in-the-Fields/Neville Marriner).

          Lehár: Sou-Chongin laulu "Von Apfelblüten einen Kranz" oper. Das Land des Lächelns (Hymyn maa)  (Nicolai Gedda, tenori, ja Graunke-SO/Willy Mattes).

          Hubay: Der Zephir (Länsituulonen) sarj. Blumenleben (Mirijam Contzen, viulu, ja Valery Rogatchev, piano).

          Kaski: Syyspäivä (Helena Juntunen, sopraano, ja Ilmo Ranta, piano).

          Addinsell: Warsaw concerto (Varsova-konsertto) (Misha Dichter, piano, ja Philharmonia-ork./Neville Marriner).

          Dell'Acqua: Villanelle (Rita Streich, sopraano, ja Berliinin radion SO/Kurt Gaebel).

          Béarn: Les Genies sarj. L'Empire de l'Amour (Chatham Baroque sekä Danny Mallon, lyömäsoittimet).

          J. Strauss, nuor.: Wiener Blut (Wieniläisverta) (New Yorkin FO/Leonard Bernstein).

          R. Schumann: Mein schöner Stern, ich bitte dich (Kaunis tähtösein) (Martin Fröst, klarinetti, ja Roland Pöntinen, piano).

          Verdi: Kuorokohtaus ja juhlamarssi "Gloria all'Egitto - Vieni, o guerriero vindice" oopp. Aida (Milanon La Scala -oopperan kuoro ja ork./Claudio Abbado).

          Konsertin on laatinut Heikki Puskala.

