      - title: 'Havaintoja muutoksesta: Kaunokirjallisuus kuljettaa kohti kokemuksellista ymmärrystä'
        start_time: '2026-09-09T10:00:00+03:00'
        end_time: '2026-09-09T10:50:00+03:00'
        description: |
          Kaunokirjallisuus voi tehdä näkyväksi jaettua ihmisyyttä ja siihen liittyvää monimutkaisuutta, tilanteisuutta ja suhteisuutta. Millainen pedagoginen työkalu kirjallisuus on ja voisi olla? Miten kirjallisuus voi rakentaa tulevaisuutta?
          Toimittaja Satu Kivelä keskustelee aiheesta kirjailija ja dokumenttielokuvien ohjaaja Elina Hirvosen ja Diakonia-ammattikorkeakoulun Helsingin kampuksen lehtori Tiina Lintusen kanssa. 
