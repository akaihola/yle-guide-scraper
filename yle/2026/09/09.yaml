        end_time: '2026-09-09T12:50:00+03:00'
        description: |-
          Millainen vaikutus sokerikaupalla on ollut globalisaation ja kolonialismin historiaan? Miten sokerista tuli terveysongelma? Näitä kysymyksiä pohtivat kolonialismin historian yliopistonlehtori Timo Särkkä, ruokahistorioitsija Ritva Kylli, historianopettaja Lasse Hongisto ja toimittaja Jussi Nygren. (2024)
