      - title: 'Kulttuuriykkönen: Yle 100 – kulttuuritehtävän jännitteet'
        start_time: '2026-09-09T15:00:00+03:00'
        end_time: '2026-09-09T15:58:00+03:00'
        description: |-
          Yleisradion syntymäpäivänä Kulttuuriykkösessä puhutaan jännitteistä, joita liittyy Ylen kulttuuritehtävään. Studiossa kohtaavat mediatutkija Anu Koivunen, toimittajat Pekka Torvinen ja Ina Mikkola sekä Ylen Kulttuuri ja asia - yksikön vastaava päätoimittaja Johanna Törn-Mangs.  
          Sadassa vuodessa Ylen kulttuuritehtävä on laajentunut ja kulttuurin käsite laventunut. Onnistuuko Yle palvelemaan kaikkia suomalaisia, kun nuoriso ei enää katso televisiota, kuuntele radiota ja sukupolvien ero repeää? Miten Yle pärjää kilpailussa Tiktokin ja Youtuben kanssa? Löytääkö yleisö kulttuurisisällöt, klikkaako sormi? Onko Yle yhä kansakunnan muisti? Toimittajana on Minna Joenniemi.
