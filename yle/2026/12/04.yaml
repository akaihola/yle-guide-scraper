      - title: 'Konsertti: Wayne Marshall & Lahden Gospelkuoro'
        start_time: '2026-12-04T19:02:00+02:00'
        end_time: '2026-12-04T21:00:00+02:00'
        description: |-
          Rajoja rikkovasta improvisaatiostaan tunnettu urkuri Wayne Marshall ja legendaarinen Lahden Gospelkuoro valtaavat Musiikkitalon lavan.

          Onko mikään hänelle mahdotonta? Brittiläinen Wayne Marshall on urkuri, säveltäjä ja kapellimestari, jolta sujuvat niin kirkkomusiikki ja jazz kuin Broadway-musikaalit ja klassinen kantaohjelmisto. Urkurina Marshall tunnetaan rajoja rikkovista improvisaatioistaan, jotka saavat yleisön haukkomaan henkeään ihastuksesta ympäri maailman.

          Väliajan jälkeen lavalle saapuu myös legendaarinen Marjaana Turusen johtama Lahden Gospelkuoro, joka irrottelee nyt ensimmäistä kertaa yhdessä Marshallin kanssa. 15.11.2026 Helsingin Musiikkitalossa tallennetun konsertin toimittaa Eero Koski.

          Wayne Marshall: Improvisaatio

          George C. Baker: The Wild Ouest Toccata

          Camille Saint-Saëns: Fantaisie nro 3

          Charles-Marie Widor: Sinfonia nro 6
          Allegro
          Adagio
          Final

          Wayne Marshall: Improvisaatio

          Väliaika

          Sikermä amerikkalaisen gospelin, kotimaisen hengellisen musiikin ja popmusiikin helmiä

          Lahden Gospelkuoro
          Rayssa Monroy, solisti
          Marjaana Turunen, johtaja

          Wayne Marshall, urut
          Lari Hermanni Lius, lyömäsoittimet
          Esa Parikka, rummut
          Antti Akkanen, basso
          Tiina Knihtilä, piano
