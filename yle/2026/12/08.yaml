      - title: Muistojen bulevardi
        start_time: '2026-12-08T09:04:00+02:00'
        end_time: '2026-12-08T09:59:00+02:00'
        description: |
          Jauhiainen (sov. Valkama): Kotiseutuni (Veikko Tuomi, laulu, Ramblers-ork./Klaus Salmi).
          Lindström: Kuu peilissä (Seija Järvinen).
          Kaapo/Saile: Haltin häät (Taiska). 
          Käyhkö: Laulu meripojille (Harmony Sisters).
          Kemppi: Vanhan merirosvon kapakassa (Four Cats).
          Linna: Kultainen nuoruus (Vantaan Viihdeorkesteri).
          Chydenius: Sinua, sinua rakastan (Kaj Chydenius).
          Vuori: Tuhat laulua lemmestä (Lasse Liemola, Seija Lampila, Wiola Talvikki ja Helena Siltala).
          Kiiskinen: Tuulen viemää (Eero Raittinen, laulu).
          Siitonen: Katson sineen taivaan (Katri Helena).
          Kärki: Köyhä laulaja (Henry Theel).
          Runne: Tahdon (Laila Kinnunen).
          Mårtenson: Varjoon suojaan (Fredi).
          Murto: Meren laulu (Carola).
          Kuuva: Pidä huolta rakkaastani (Virve 'Vicky' Rosti).
          Sibelius: Maailman valtiaille (Mikko Perkoila). 

          Konsertin on toimittanut Riikka Holopainen.
      - title: Sari Valto
        start_time: '2026-12-08T10:00:00+02:00'
        end_time: '2026-12-08T10:55:00+02:00'
        description: |-
