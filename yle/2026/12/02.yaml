        end_time: '2026-12-02T22:50:00+02:00'
        description: |-
          Marinin viiden naisen hallituksesta tulee kansainvälisen median suosikki. Se joutuu kuitenkin keskelle kriisiä, kun Al-Hol -tapaus ravistelee maata. Maailmalla leviävä koronavirus aiheuttaa uhan myös Suomessa. Mitä tekee Sanna Marin, kun monet valtaapitävät miehet kyseenalaistavat nuoren pääministerin johtajuuden?
          (ensies. v. 2024)
