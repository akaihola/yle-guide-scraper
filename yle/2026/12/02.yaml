      - title: Tarmo Peltokoski ja Hong Kongin filharmonikot Musiikkitalossa
        start_time: '2026-12-02T19:02:00+02:00'
        end_time: '2026-12-02T21:00:00+02:00'
        description: |+
          Hong Kongin filharmoninen orkesteri
          Tarmo Peltokoski, kapellimestari & piano
          Martin Helmchen, piano


          Tarmo Peltokosken johtama Hong Kong Philharmonic Orchestra tekivät marraskuun lopussa Helsingin debyyttinsä Musiikkitalossa solistinaan saksalaispianisti Martin Helmchen. Ohjelmassa kuullaan Saint-Saënsin Eläinten karnevaali ja Wagnerin Ring-oopperasarjasta sovitettu orkesteriversio The Ring – An Orchestral Adventure. 28.11.2026 Musiikkitalossa tallennetun konsertin toimittaa Kare Eskola.

          Ohjelma:
          Yao Chen: Waltz of the Rolling Giants
          Camille Saint-Saëns: Eläinten karnevaali (kahdelle pianolle ja orkesterille)
          Richard Wagner: The Ring – An Orchestral Adventure (sov. Henk de Vlieger, 1991)

          Kuva: © Peter Rigaud





