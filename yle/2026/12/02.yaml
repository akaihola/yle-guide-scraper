        end_time: '2026-12-02T16:59:00+02:00'
        description: |-
          Liszt: Carillon sarj. Weihnachtsbaum (Joulupuu) (Roland Pöntinen, piano).

          Bizet: Finaali sinf. C-duuri (Cincinnatin SO/Jesús López-Cobos).

          Stanford: The blue bird (Sinilintu) (Lumen Valo).

          Locatelli: Introduttione n:o 4 G-duuri (Amsterdamin barokkiork./Ton Koopman, cembalo).

          C.Ph.E. Bach: Adagio triosonaatista h-molli (Lisa Batiashvili, viulu, Emmanuel Pahud, huilu, Sebastian Klinger, sello, ja Peter Kofler, cembalo).

          Purcell: Duetto "Hark how the songsters" näyt. Timon of Athens (Timon Ateenalainen) (Wim van Hasselt, trumpetti, Jörgen van Rijen, pasuuna, Iris d'Avena ja Reine-Marie Verhagen, nokkahuilu, Benedikt Enzler, sello, Mike Fentross, teorbi, sekä Jorge López-Escribano, urut).

          Tabakova: Longing konsertosta sellolle ja jousille (Kristina Blaumane ja Liettuan kamariork./Maxim Rysanov).

          Rossini: Don Basilion juoruaaria "La calunnia è un venticello" oopp. Il barbiere di Siviglia (Sevillan parturi) (Matti Salminen, basso, ja Sinfonia Lahti/Eri Klas).

          Pejacevic: Impromptu (Oliver Triendl, piano, ja Quatuor Sine Nomine).

          Crawford: In roguish humor teoks. Music for small orchestra (Musiikkia pienelle orkesterille) (Schönberg Ensemble/Oliver Knussen).

          R. Clarke: Epilogue (Raphaela Gromes, sello, ja Julian Riem, piano).

          Konsertin on laatinut Eva Tigerstedt.
