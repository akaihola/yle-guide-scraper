      - title: '12 diktaattoria: Kunniatohtori Samuel Doe'
        start_time: '2026-12-02T12:05:00+02:00'
        end_time: '2026-12-02T12:50:00+02:00'
        description: |-
          Ylivääpeli Samuel Doen sekä parinkymmenen muun kersantin ja maltillisen sotilasarvon omaavan henkilön tekemä onnistunut sotilasvallankaappaus Liberiassa vuonna 1980 yllätti kaikki, eikä vähiten kaappareita itseään. Yhdysvallat antoi operaatiolle nimen ”onnistunut vahinko”. Toimittaja Raimo Tyykiluodon vieraana kirjailija ja filosofi Leif Sundström. 
