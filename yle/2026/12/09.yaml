      - title: Klassisen musiikin iltakonsertti
        start_time: '2026-12-09T19:02:00+02:00'
        end_time: '2026-12-09T20:29:00+02:00'
        description: |
          Leipzig tunnetaan Johann Sebastian Bachin kaupunkina, mutta mitä tiedämme Bachin musiikillisista yhteyksistä Habsburgien hoviin Wienissä? 
          Martin Haselböckin johtama Orchester Wiener Akademie sekä solistit jäljittävät näitä yhteyksiä konsertissa, joka on äänitetty Leipzigin Bach-festivaalilla kesällä 2026. 
          Euroradiokonsertin toimittaa Ainomaija Pennanen. 
