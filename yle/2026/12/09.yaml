      - title: 'Sanna Marin - miljoonat seuraa: Koronanyrkkiä pöytään'
        start_time: '2026-12-09T22:21:00+02:00'
        end_time: '2026-12-09T22:50:00+02:00'
        description: |
          Pääministeri Marinin ja presidentti Niinistön välit kiristyvät, kun koronakriisi vaatii yhä tiukempaa päätöksentekoa. Mitä maskiskandaalissa tapahtui kulissien takana? Koronaeristys pakottaa kultaiseen häkkiin, ja tunnelma alkaa kiristyä myös kotona. Häät saadaan kuitenkin vihdoin pidettyä, ja Sanna Marin saa hengähdystauon.

          Sarjan on ohjannut Miira Karhula ja Sanna Marinia näyttelee Anna-Maija Tuokko. 
          (ensies. v. 2024)
