      - title: 'Väkivallan markkinat K3J7: Teinin karkumatka utopiaan'
        start_time: '2026-12-07T19:02:00+02:00'
        end_time: '2026-12-07T19:50:00+02:00'
        description: |
          15-vuotias Shamima Begum karkaa kavereidensa kanssa kotoa Lontoosta. Heille on luvattu koti ja yhteisö utopistisesta paikasta, Isisin kalifaatista, keskellä Syyrian veristä sisällissotaa. Isisin markkinointibudjetti oli valtava, ja propagandakoneisto edellä aikaansa ja paljon somejättien sensuuria vikkelämpi. Mikä kalifaatissa houkutti teinityttöjä? 

          Jakson haastateltavat: Tiina Hyyppä, Helsingin yliopiston väitöskirjatutkija, Harry Lehtolaakso, Helsingin yliopiston väitöskirjatutkija, Karla Malm, Helsingin yliopiston väitöskirjatutkija.

          Lähteitä: The Shamima Begum Story, toim. Josh Baker, BBC (dokumentti ja podcast, sarjassa I’m not a monster), Gendering global conflict, Laura Sjoberg.
      - title: 'Suuri juomapodi J9: Energiajuomat, juomahyllyn uusi seriffi'
        start_time: '2026-12-07T20:10:00+02:00'
        end_time: '2026-12-07T20:55:00+02:00'
        description: |-
          Energiajuoma ei yritä näyttää terveelliseltä mehulta tai tavalliselta limsalta. Tölkeissä on petoja, salamoita, räikeitä värejä ja lupauksia maksimaalisesta suorituskyvystä. Aalto-yliopiston visuaalisen viestinnän muotoilun yliopistonlehtori Markus Joutsela tulkkaa etikettejä ja selittää, millaisia viestejä pakkauksilla välitetään juomahyllyllä haahuilevalle kuluttajalle ja miten brändit kilpailevat keskenään. Lisäksi viiniasiantuntija Henriikka Ström joutuu sokkotestiin: mitä harjaantunut viininmaistaja sanoo energiajuomista, kun etiketit on riisuttu? 
