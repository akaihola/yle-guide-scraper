        end_time: '2026-12-10T16:59:00+02:00'
        description: |-
          Marais: Le Tourbillon sarjasta vieraitten makujen tyyliin (Hille Perl,viola da gamba, ja Lee Santana, teorbi).

          Melartin: Talvitie (Tapani Valsta, piano).

          Palmgren: Menuetti kansantyyliin sarj. Kuvia Suomesta (Turun FO/Jacques Mercier).

          Tubin: Kanteleensoittaja sarj. Virolaisia kansantansseja (Arvo Leibur, viulu, ja Vardo Rumessen, piano).

          Kreek: Talvine öhtu (Talvi-ilta) (Viron radion kuoro/Toomas Kapten).

          Gjerström: Sagn (Satu) (Islannin SO/Bjarte Engeset).

          Neruda: Allegro konsertosta corno da caccialle, jousille ja continuolle Es-duuri (Alison Balsom, trumpetti, ja Deutsche Kammerphilharmonie).

          Haydn: Corradinon aaria bassolle ja orkesterille (Thomas Quasthoff ja Freiburgin barokkiork./Gottfried von der Goltz).

          Rameau: Kaksi menuettia bal. Paladiinit (Les Talens Lyriques/Christophe Rousset).

          Andrée: Andante cantabile sonaatista B-duuri (Annette-Barbara Vogel, viulu, ja Durval Cesetti, piano).

          Massenet: Des Grieux'n uni "Instant charmant - En fermant les yeux je voix" oopp. Manon (Joseph Calleja, tenori, Tatiana Lisnic, sopraano, ja St. Martin-in-the-Fields -kamariork./Carlo Rizzi). 

          Boccherini: Menuetti (Steven Isserlis, sello, ja Stephen Hough, piano).

          R. Strauss: Walzer der Baron Ochs (Paroni Ochsin valssi) sarj. Der Rosenkavalier (Ruusuritari) (Hollywood Bowl -ork./John Mauceri).


          Konsertin on laatinut Ainomaija Pennanen. 
