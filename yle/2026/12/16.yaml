      - title: Faunin iltapäivä
        start_time: '2026-12-16T16:07:00+02:00'
        end_time: '2026-12-16T16:59:00+02:00'
        description: |-
          Tshaikovski: Joulukuu pianosarjasta Vuodenajat (Antonin Kubalek, piano).

          B. Hummel: Scherzando teoks. Weihnachtliche Suite (Jouluinen sarja) (Lapin kamariork./John Storgårds).

          Manfredini (sov. Aoshima): Pastorale joulukonsertosta (Ayako Shinozaki, harppu). 

          Nin: Baskilainen joululaulu sarj. Kymmenen espanjalaista joululaulua (Anne Sofie von Otter, mezzosopraano, ja Bengt Forsberg, piano).

          Irizar: Maurilainen joululaulu (Capilla Jerónimo de Carrión -vanhan musiikin yhtye/Alicia Lázaro).

          Prokofjev: Isä Lorenzo balettisaj. Romeo ja Julia (Cincinnatin SO/Paavo Järvi).

          Puccini: Magdan aaria "Chi il bel sogno di Doretta" oopp. La Rondine (Kiri Te Kanawa, sopraano, Lontoon filharmoninen orkesteri, joht. John Pritchard). 

          Brahms: Andantino grazioso - Trio triosta klarinetille, sellolle ja pianolle (Richard Stoltzman, Yo-Yo Ma, Emanuel Ax).

          Hanson: Lasten tanssi oopp. Merry Mount (Cincinnati Pops/Erich Kunzel).

          Gabrielli: Presto sonaatista sellolle ja continuolle G-duuri (Mime Yamahiro Brinkmann, sello ja Björn Gäfvert, cembalo)

          Granados: Espanjalainen tanssi n:o 2 (Oriental) (John Williams ja Julian Bream, kitara).

          Larsson: Epilogi näyt. Talvinen tarina (Helsingborgin SO/Okko Kamu). 

          Melartin: Weihnachtsglocken (Joulun kellot) sarj. Per speculum in enigmatae (Niklas Pokki, piano).


          Konsertin on laatinut Ainomaija Pennanen.
