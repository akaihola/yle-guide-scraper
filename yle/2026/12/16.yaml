      - title: '12 diktaattoria: Kehityksen isä Haji Muhammed Suharto'
        start_time: '2026-12-16T12:05:00+02:00'
        end_time: '2026-12-16T12:50:00+02:00'
        description: |-
          Indonesian diktaattori Haji Muhammed Suharto on yksi maailman parhaiten ansainneita diktaattoreita kautta aikain. Tilinsä hän teki vuosina 1967-1998. Transparency International -järjestön raportin mukaan Suharton perhe kartutti tilejään valtion varoilla jopa yli 30 miljardilla dollarilla. Kirjailija ja filosofi Leif Sundström on toimittaja Raimo Tyykiluodon vieraana. (v. 2021)
