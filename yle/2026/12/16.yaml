        description: |-
          Matkustusrajoitukset hiertävät viisikon välejä. Aamupalakohun keskelle joutuu Sanna Marinin lisäksi myös hänen perheensä. Miten rentoutua nyt, kun kovakaan juoksulenkki ei enää auta? Rankkaan arkeen tulee hetkeksi vastapainoa, kun Sanna järjestää Kesärannassa kulttuurikutsut.
