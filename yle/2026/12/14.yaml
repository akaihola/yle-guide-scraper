        end_time: '2026-12-14T19:00:00+02:00'
        description: |-
          "Kuningas ryhtyy etsimään uutta kuningatarta"
          Näyttelijä Krista Kosonen lukee Esterin kirjasta Raamattu 2028-käännöksen mukaan. Tässä hartaudessa kuullaan Esterin kirjan luvusta 2:1-3:11.

          Loppusyksyn raamatunluennassa kuullaan uusia Vanhan Testamentin käännöksiä Joonan, Ruutin ja Esterin kirjoista. 
