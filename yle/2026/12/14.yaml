      - title: 'Väkivallan markkinat K3J8: Uhrista Isisin kansikuvatytöksi'
        start_time: '2026-12-14T19:02:00+02:00'
        end_time: '2026-12-14T19:50:00+02:00'
        description: |
          Al-Holin vankileirillä kokeneen brittitoimittajan eteen tupsahtaa sen aikainen ykkösuutinen, Shamima Begum. Kotoaan Lontoosta karanneesta tytöstä on tullut väkivaltaa ja kuolemaa todistanut teiniäiti. Isisin groomauksen uhrina pidetystä tytöstä voi yhdessä yössä tulla median näkökulmasta kalifaatin kansikuvatyttö. Voidaanko häntä pitää henkilökohtaisesti vastuussa Isisin hirmuteoista?


          Jakson haastateltavat: Tiina Hyyppä, Helsingin yliopiston väitöskirjatutkija, Harry Lehtolaakso, Helsingin yliopiston väitöskirjatutkija, Karla Malm, Helsingin yliopiston väitöskirjatutkija, Leena Malkki, Helsingin yliopiston terrorismin tutkija.

          Lähteitä: The Monstrous and the Vulnerable – Framing British Jihadi Brides, Leonie B. Jackson, The Shamima Begum Story, toim. Josh Baker, BBC (dokumentti ja podcast, sarjassa I’m not a monster).
      - title: 'Suuri juomapodi J10: Juomien ABC-kiria '
        start_time: '2026-12-14T20:10:00+02:00'
        end_time: '2026-12-14T20:55:00+02:00'
        description: |
          A niin kuin alkoholi, L niin kuin lonkero ja P niin kuin punssi. Suuren Juomapodin viimeisessä jaksossa käydään vielä juomattomien juomien kimppuun kirjain kerrallaan ja selvitetään, millaisia juomia, tapoja ja tarinoita niiden taakse kätkeytyy. 

          Matkan varrella vastaan tulee tuttuja klassikoita, unohdettuja juomia ja asioita, joiden yhteyttä juomiseen ei heti arvaisi. Miksi sherrytynnyrit ovat arvokkaampia kuin niiden sisältö? Miksi keskieurooppalaiset juovat kaameita yrttiviinoja? Mitä oikeastaan on punssi? Juomakulttuurin historiaa avaa tislaajamestari Kai Kilpinen.
