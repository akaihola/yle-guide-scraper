      - title: Euroradion konsertti-ilta
        start_time: '2026-12-18T19:02:00+02:00'
        end_time: '2026-12-18T20:53:00+02:00'
        description: |
          Justin Doylen johtamat Berliinin RIAS-kamarikuoro ja Akademie für Alte Musik -yhtye kutsuvat meidät juhlavaan joulunajan konserttiin. 
           
          Ohjelmassa on loistokasta venetsialaista kirkkomusiikkia 1600-luvulta: kaikki konsertin säveltäjät toimivat aikanaan Pyhän Markuksen kirkossa laulajina, soittajina tai kapellimestareina.

          Berliinin filharmoniassa 1.1.2026 äänitetyn konsertin toimittaa Ainomaija Pennanen. 
