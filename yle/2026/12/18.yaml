          Sundgren: Joulupolkka (Ragni Malmsten).
          Berlin: Noel blanc (Dalida).
          Lightfoot: Song for a winter's night (Gordon Lightfoot).
          Kansanlaulu: We wish you a merry Christmas (Ars Nova).
          Martin: Have yourself a merry little Christmas (Diana Krall).

          Konsertin on toimittanut Jenna Bågeberg.
