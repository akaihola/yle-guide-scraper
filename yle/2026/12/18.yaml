        end_time: '2026-12-18T16:59:00+02:00'
        description: |+
          Anonyymi 1400-luvulta: Es ist ein Ros entsprungen (Arturo Delmoni ja Alexander Romanul, viulu, Katherine Murdock, alttoviulu, sekä Nathaniel Rosen, sello).

          W. Siukonen: Joulun odotuksessa (Jorma Hynninen, baritoni, ja Kalevi Kiviniemi, urut).

          Ebel: Leise rieselt der Schnee (Edita Gruberova, sopraano, ja ork.).

          J.S. Bach: Sinfonia teoks. Weihnachts-Oratorium (Jouluoratorio) (Lontoon kuninkaallinen FO/James Galway, huilu).

          Häggkvist: Taivas sylissäni (Aarne Pelkonen, baritoni, ja Juho Alakärppä, piano).

          Tegnér: Betlehems stjärna (Camilla Nylund, sopraano, sekä Florakören, Brahe Djäknar ja Akademiska Orkestern vid Åbo Akademi/Sauli Huhtala).

          I. Aaltonen:Maailma jääkukkien takana (Kauppakorkeakoulun Ylioppilaskunnan Laulajat/Matti Apajalahti).

          Torelli: Concerto grosso n:o 6 g-molli (Enrico Onofri ja Marco Bianchi, viulu, Paolo Beschi, sello, ja Luca Pianca, teorbi, sekä Il Giardino Armonico/Giovanni Antonini).

          Pentti: Lintujen joululaulu (Oulaisten Nuorisokuoro/Tapani Tirilä, sekä Ryyppymäki String Band).

          Kaski: Mökit nukkuu lumiset (Soile Isokoski, sopraano, ja YL/Matti Hyökki).

          Kansansäv. (sov. Andresen): Gloria in excelsis deo (Tanskan kuninkaallisen orkesterin vaskiyhtye sekä Bjarne Nielsen ja Niels-Jörn Jessen, trumpetti).

          Rutter: Angels' carol (Polyphony-kuoro ja City of London Sinfonia/Stephen Layton).

