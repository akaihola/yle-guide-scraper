      - title: 'Näistä levyistä en luovu: Ville Ahosen musiikillinen matka'
        start_time: '2026-12-12T13:00:00+02:00'
        end_time: '2026-12-12T13:55:00+02:00'
        description: |-
          Ville Ahonen avaa musiikillisen sielunmaisemansa Yle Areenassa

          Mistä levyistä muusikko Ville Ahonen ei koskaan luopuisi? Uudessa “Näistä levyistä en luovu” -ohjelmassa Ville Ahonen vie kuulijat matkalle elämänsä tärkeimpien kappaleiden ja levyjen äärelle. Ohjelmassa kuullaan musiikkia klassikoista moderneihin helmiin – Bachista Radioheadiin ja Leonard Cohenista Kae Tempestiin. Jokaisen kappaleen taustalla on henkilökohtainen tarina, hetki tai muisto, joka on jättänyt pysyvän jäljen artistin elämään.

          Ville Ahonen kertoo avoimesti, miten musiikki on lohduttanut, pysäyttänyt ja antanut uusia näkökulmia elämään eri vaiheissa. Ohjelma tarjoaa kuulijalle intiimin ja koskettavan kokemuksen sekä mahdollisuuden löytää musiikin kautta uusia puolia myös omasta elämästä.

          “Monet näistä kappaleista ovat kulkeneet mukana vuosien varrella – osa lohduttaa, osa muistuttaa siitä miten pienillä asioilla on suuri merkitys,” Ahonen kuvailee.
